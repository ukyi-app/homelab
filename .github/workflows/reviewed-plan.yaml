name: "AIOps authority environment canary"
run-name: "AIOPS-CI-AUTHORITY-20260915 environment ${{ github.event_name }}"
on:
  workflow_dispatch:
    inputs:
      reviewed_pr:
        description: "고정 기존 진입점과 같은 입력 계약; canary에서는 사용하지 않음"
        type: string
        required: true
      reviewed_head_sha:
        description: "고정 기존 진입점과 같은 입력 계약; canary에서는 사용하지 않음"
        type: string
        required: true
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  origin:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: 실행 출처 기록
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          keys = ('GITHUB_REPOSITORY_ID', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_EVENT_NAME')
          print(json.dumps({'canary': 'AIOPS-CI-AUTHORITY-20260915', 'origin': {k: os.environ[k] for k in keys}}))
          PY
  protected-environment:
    environment: homelab-main
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: 보호 환경 도달 여부 기록
        shell: bash
        env:
          PUBLIC_CANARY: ${{ secrets.AIOPS_CI_PUBLIC_CANARY_0915 }}
        run: |
          python3 - <<'PY'
          import json, os
          reached = os.environ['PUBLIC_CANARY'] == 'AIOPS-CI-AUTHORITY-20260915-public-marker'
          print(json.dumps({'protectedEnvironmentReached': True, 'markerMatched': reached}))
          # 이 파일은 음성 branch/PR/tag에서만 실행한다. job이 실행되면 정책 거부가 아니다.
          raise SystemExit(1)
          PY
  empty-environment:
    environment: aiops-authority-empty-0915
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - name: 새 환경의 표식 부재 기록
        shell: bash
        env:
          PUBLIC_CANARY: ${{ secrets.AIOPS_CI_PUBLIC_CANARY_0915 }}
        run: |
          python3 - <<'PY'
          import json, os
          absent = os.environ['PUBLIC_CANARY'] == ''
          print(json.dumps({'newEnvironmentReached': True, 'markerAbsent': absent}))
          raise SystemExit(0 if absent else 1)
          PY
