# audit reconciler — 레포 정적 드리프트 워치독(registry↔매니페스트↔바인딩↔원장, 읽기 전용).
# 차단성(orphan-dns·dangling-binding)은 ci.yaml의 audit-orphans --ci가 PR 게이트로 잡는다.
# 이 워크플로는 정보성 드리프트(incomplete-purge·unreferenced-resource 등)를 주기적으로 잡아 알린다.
name: "🔁 audit — 드리프트 감사"
run-name: "🔁 audit — ${{ github.event_name == 'schedule' && '스케줄' || format('수동({0})', github.actor) }}"
on:
  schedule:
    - cron: "17 18 * * *" # 매일 1회(UTC 18:17 = KST 03:17). 정적 드리프트라 저빈도. GHA cron=UTC.
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: audit
  cancel-in-progress: false

# 기본 셸(bash -e {0})은 pipefail 부재 — 명시 bash로 전 run 스텝에 -eo pipefail 강제
# (가드: tests/gates/test_workflow-pipefail.bats)
defaults:
  run:
    shell: bash

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with: { ref: main }
      - uses: ./.github/actions/setup-bun
      - id: audit
        run: |
          bun tools/audit-orphans.ts --repo-root . | tee /tmp/audit.json
          # 도메인별 열거 건수(페이로드 .scan) — 이 도구는 stdout이 기계 판독 JSON이라 `SCAN:` 마커를
          # 낼 수 없다(tools/audit-orphans.ts 「방출 규약」). 같은 정보가 페이로드에 실리므로 런 로그에서
          # 열거 붕괴를 읽을 수 있게 여기서 편다. 바닥값 위반은 도구가 비-0으로 죽어 이 줄에 닿지 않는다.
          # ⚠️ 아래 규율은 이 줄에도 적용된다 — 대입으로 분리해야 jq 실패가 echo exit 0에 안 삼켜진다.
          scan=$(jq -c .scan /tmp/audit.json)
          echo "::notice::열거 건수 $scan"
          # 명령치환을 echo 인자에 인라인하면 jq 실패가 echo exit 0에 삼켜진다 → 대입 분리(-e가 잡음)
          count=$(jq -r .count /tmp/audit.json)
          # alerting = 페이지 대상(report-only 제외 — activation-surface-drift는 이미지 bump마다 재발하는
          # 정보성 노이즈라 텔레그램에서 뺀다). count는 body에 그대로 표시(페이지 시 전 finding 가시).
          alerting=$(jq -r .alerting /tmp/audit.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "alerting=$alerting" >> "$GITHUB_OUTPUT"
      - name: build audit summary
        id: report
        if: always() && (steps.audit.outcome == 'failure' || steps.audit.outputs.alerting != '0')
        env:
          OUTCOME: ${{ steps.audit.outcome }}
          COUNT: ${{ steps.audit.outputs.count }}
        run: |
          # 실패 시 audit.json이 없거나 깨졌을 수 있다 → 폴백 body (drift 오표기·빈 body 방지 — C-F2/obs-6)
          if [ "$OUTCOME" = "failure" ]; then
            body="감사 실행 실패 — 런 로그 확인 필요"
          else
            summary="$(jq -r '.findings[] | "- \(.type): \(.subject)"' /tmp/audit.json)"
            body="드리프트 건수: ${COUNT}"$'\n'"${summary}"
          fi
          { echo "body<<EOF"; printf '%s\n' "$body"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - name: telegram report (드리프트/실패 시에만)
        if: always() && (steps.audit.outcome == 'failure' || steps.audit.outputs.alerting != '0')
        uses: ./.github/actions/telegram-notify
        with:
          # status는 outcome 우선 — 실패를 drift로 오표기하지 않는다(C-F2)
          status: ${{ steps.audit.outcome == 'failure' && 'failure' || (steps.audit.outputs.alerting != '0' && 'drift' || 'success') }}
          source: 감사
          title: 드리프트 감사
          ident: ${{ steps.audit.outcome == 'failure' && '실행 실패' || format('{0}건', steps.audit.outputs.count) }}
          body: ${{ steps.report.outputs.body }}
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 알림 대상 0건 — skip 알림
        if: success() && steps.audit.outputs.alerting == '0'
        # count>0·alerting=0(report-only 드리프트만, 예: activation-surface-drift)도 여기 — 감사 JSON엔 남지만 페이지 안 함.
        run: echo "::notice::알림 대상 0건(전체 ${{ steps.audit.outputs.count }}건 중 report-only 제외) — 알림 skip"
