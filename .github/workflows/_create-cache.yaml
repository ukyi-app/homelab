# create-cache reusable — dispatcher(action=create-cache)가 호출한다.
# spec(JSON)은 validate-mutation.ts를 통과한 입력이지만 비신뢰로 취급해 여기서도
# env 경유 + 화이트리스트 재검증한다(fail-closed, 인라인 보간 금지).
# 산출은 PR-first: provision-cache.ts가 만든 매니페스트/원장 변경을 브랜치로 push하고
# auto-merge(required check 통과 시) 또는 즉시 squash 머지를 시도한다.
# Telegram 통지는 핸들 이름만 — conn URL/자격은 어떤 경로로도 출력하지 않는다.
name: "🧰 _create-cache"
on:
  workflow_call:
    # 호출자의 명시 이름 연결이 있어야 보호 Environment 자격이 이 재사용 job에 도달한다.
    secrets:
      HOMELAB_WRITER_APP_ID:
        required: false
      HOMELAB_WRITER_APP_PRIVATE_KEY:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
    inputs:
      spec:
        required: true
        type: string

# 기본 셸(bash -e {0})은 pipefail 부재 — 명시 bash로 전 run 스텝에 -eo pipefail 강제
# (가드: tests/gates/test_workflow-pipefail.bats)
defaults:
  run:
    shell: bash

jobs:
  create:
    environment: homelab-main
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 디스패처의 route 잡(`uses:`)에는 걸 수 없어(actionlint 거부) 변이 본체의 상한이
    # 여기 있다. homelab-mutation 그룹 천장의 근거 전문은 bump-poll.yaml preflight 잡 주석 —
    # 이 잡의 gh/git 호출도 실행기 하위 상한이 없다(tools/lib/exec.ts `timeoutMs: 0`).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: main 운영 자격 경계 (실제 job마다 검사)
        id: authority
        env:
          REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        shell: bash
        run: |
          # GitHub login은 대소문자를 구별하지 않는다. 모든 actor 가드가 같은 정규화를 쓴다.
          OWNER="${OWNER,,}"
          ACTOR="${ACTOR,,}"
          TRIGGERING="${TRIGGERING,,}"
          # Environment의 서버 branch 정책이 권위다. 이 검사는 trusted main의 대리 실행·부분 재실행도 닫는다.
          [ "$REF" = "refs/heads/main" ] && [ "$REPOSITORY_ID" = "1265054638" ] || { echo "::error::homelab main 실행만 허용"; exit 1; }
          [ -n "$OWNER" ] || { echo "::error::HOMELAB_OWNER 미설정"; exit 1; }
          case "$ATTEMPT" in ''|*[!0-9]*|0) echo "::error::run_attempt 불량"; exit 1;; esac
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행은 owner만 허용"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              [ "$ACTOR" = "$OWNER" ] || { echo "::error::dispatch actor 거부"; exit 1; }
              [ "$TRIGGERING" = "$ACTOR" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::dispatch 개시자 거부"; exit 1; } ;;
            push|schedule|workflow_run) ;;
            *) echo "::error::운영 이벤트 거부"; exit 1 ;;
          esac
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: writer
        with:
          app-id: ${{ secrets.HOMELAB_WRITER_APP_ID }}
          private-key: ${{ secrets.HOMELAB_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          token: ${{ steps.writer.outputs.token }}
      # ★ 검사 코드 출처 — checkout 직후·HEAD 변이(pr-first-commit) 앞에서 고정한다.
      - name: 검사 코드 출처 캡처 (checkout 직후 — HEAD 변이 앞)
        id: aiops_source
        uses: ./.github/actions/aiops-provenance
      - uses: ./.github/actions/setup-bun
      - name: spec 재검증 + name/maxmemory 추출 (defense-in-depth — 디스패처 외 호출 대비)
        id: spec
        env:
          SPEC: ${{ inputs.spec }} # 비신뢰 입력 — env 경유만, run 안 인라인 보간 금지
        run: |
          jq -n --arg action create-cache --arg spec "$SPEC" \
            '{action: $action, spec: $spec}' > /tmp/payload.json
          bun tools/validate-mutation.ts --action create-cache --payload-file /tmp/payload.json
          name=$(printf '%s' "$SPEC" | jq -r '.name')
          mm=$(printf '%s' "$SPEC" | jq -r '.maxmemory_mi // 64')
          { echo "name=$name"; echo "maxmemory=$mm"; } >> "$GITHUB_OUTPUT"
      - name: kubeseal + conftest 설치
        uses: ./.github/actions/setup-toolchain
        with:
          kubeseal: 'true'
          conftest: 'true'
      - name: provision + 원장 게이트
        env:
          NAME: ${{ steps.spec.outputs.name }}
          MAXMEMORY: ${{ steps.spec.outputs.maxmemory }}
        run: |
          # 봉인 cert는 레포 커밋본을 쓴다 — 없으면 즉시 실패(평문 fallback 금지)
          [ -f tools/sealed-secrets-cert.pem ] || { echo "::error::tools/sealed-secrets-cert.pem 없음 — kubeseal --fetch-cert로 갱신/커밋 필요"; exit 1; }
          bun tools/provision-cache.ts --name "$NAME" --maxmemory-mi "$MAXMEMORY" | tee /tmp/plan.json
          # 원장 게이트(PR required check와 동일 검증 선행 — 초과 시 PR 자체를 만들지 않는다)
          bun run verify:ledger
      - name: PR 본문 작성 (plan.json + 체크리스트)
        run: |
          {
            echo "create-cache 자동 생성 PR입니다. 머지 = ArgoCD 싱크(cache-prod) — conn 핸들은 data-conn 등록 후 prod에 나타납니다."
            echo
            echo '```json'; cat /tmp/plan.json; echo '```'
            echo; echo "### ⚠️ 머지 전 체크리스트"
            jq -r '.checklist[] | "- [ ] " + .' /tmp/plan.json
          } > /tmp/pr-body.md
      - name: PR-first 커밋 + auto-merge
        id: aiops_check
        uses: ./.github/actions/pr-first-commit
        with:
          branch: create-cache/${{ steps.spec.outputs.name }}-${{ github.run_id }}
          add-paths: platform/cache platform/data-conn docs/memory-ledger.md
          commit-message: "feat: ${{ steps.spec.outputs.name }} 캐시 생성 (create-cache — Valkey maxmemory ${{ steps.spec.outputs.maxmemory }}Mi)"
          pr-title: "feat: ${{ steps.spec.outputs.name }} 캐시 생성 (create-cache)"
          pr-body-file: /tmp/pr-body.md
          auto-merge: 'true'
          gh-token: ${{ steps.writer.outputs.token }}
      # 제안 커밋 SHA — 출처(revision)와 별개 축이다(noop이면 만들지 않는다).
      - name: 변경 제안 revision 기록 (출처와 분리 — 실패해도 관측은 계속)
        id: proposal
        if: ${{ always() && steps.aiops_check.outputs.result == 'pr' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: AIOps 검사 결과 기록
        if: always()
        continue-on-error: true
        uses: ./.github/actions/aiops-observation
        with:
          producer: _create-cache.yaml/create
          target: ${{ steps.spec.outputs.name || 'unresolved-cache' }}
          job-result: ${{ job.status }}
          steps: ${{ toJSON(steps) }}
          primary-step: aiops_check
          source-revision: ${{ steps.aiops_source.outputs.source-revision }}
          proposal-revision: ${{ steps.proposal.outputs.revision }}
      - name: telegram notify (핸들 이름만 — URL/자격 금지)
        if: ${{ (always()) && steps.authority.outcome == 'success' }}
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: 캐시생성
          title: "${{ job.status == 'success' && '캐시 생성 PR' || '캐시 생성' }}"
          ident: ${{ steps.spec.outputs.name }}
          body: "${{ job.status == 'success' && format('PR 생성됨(머지 대기) · conn 핸들 cache-{0}-conn (prod)', steps.spec.outputs.name) || '' }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
