# create-database reusable — dispatcher(action=create-database)가 호출한다.
# spec(JSON)은 비신뢰 입력: env 경유로만 다루고 인라인 `${{ }}` 보간은 금지(검증 산출물 제외).
# 비밀번호는 provision-db.ts가 내부 생성해 kubeseal로 즉시 봉인 — raw URL/비밀번호는
# 로그·PR·Telegram 어디에도 나타나지 않는다(핸들 이름만 통지).
# 머지 후 반영은 ArgoCD automated sync: cnpg-data(database NS) + data-conn-prod(prod NS).
name: "🧰 _create-database"
on:
  workflow_call:
    # 호출자의 명시 이름 연결이 있어야 보호 Environment 자격이 이 재사용 job에 도달한다.
    secrets:
      HOMELAB_WRITER_APP_ID:
        required: false
      HOMELAB_WRITER_APP_PRIVATE_KEY:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false
    inputs:
      spec:
        description: 'JSON 스펙 — {"name": "<db>", "extensions": ["..."]} (owner는 받지 않음 — name 고정)'
        required: true
        type: string

# 기본 셸(bash -e {0})은 pipefail 부재 — 명시 bash로 전 run 스텝에 -eo pipefail 강제
# (가드: tests/gates/test_workflow-pipefail.bats)
defaults:
  run:
    shell: bash

jobs:
  provision:
    environment: homelab-main
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 디스패처의 route 잡(`uses:`)에는 걸 수 없어(actionlint 거부) 변이 본체의 상한이
    # 여기 있다. homelab-mutation 그룹 천장의 근거 전문은 bump-poll.yaml preflight 잡 주석 —
    # 이 잡의 gh/git 호출도 실행기 하위 상한이 없다(tools/lib/exec.ts `timeoutMs: 0`).
    timeout-minutes: 20
    # main 쓰기는 writer App 토큰의 PR-first 경로 — workflow 자체 권한은 읽기만
    permissions:
      contents: read
    steps:
      - name: main 운영 자격 경계 (실제 job마다 검사)
        id: authority
        env:
          REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        shell: bash
        run: |
          # GitHub login은 대소문자를 구별하지 않는다. 모든 actor 가드가 같은 정규화를 쓴다.
          OWNER="${OWNER,,}"
          ACTOR="${ACTOR,,}"
          TRIGGERING="${TRIGGERING,,}"
          # Environment의 서버 branch 정책이 권위다. 이 검사는 trusted main의 대리 실행·부분 재실행도 닫는다.
          [ "$REF" = "refs/heads/main" ] && [ "$REPOSITORY_ID" = "1265054638" ] || { echo "::error::homelab main 실행만 허용"; exit 1; }
          [ -n "$OWNER" ] || { echo "::error::HOMELAB_OWNER 미설정"; exit 1; }
          case "$ATTEMPT" in ''|*[!0-9]*|0) echo "::error::run_attempt 불량"; exit 1;; esac
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행은 owner만 허용"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              [ "$ACTOR" = "$OWNER" ] || { echo "::error::dispatch actor 거부"; exit 1; }
              [ "$TRIGGERING" = "$ACTOR" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::dispatch 개시자 거부"; exit 1; } ;;
            push|schedule|workflow_run) ;;
            *) echo "::error::운영 이벤트 거부"; exit 1 ;;
          esac
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: writer
        with:
          app-id: ${{ secrets.HOMELAB_WRITER_APP_ID }}
          private-key: ${{ secrets.HOMELAB_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          token: ${{ steps.writer.outputs.token }}
      # ★ 검사 코드 출처 — checkout 직후·HEAD 변이(pr-first-commit) 앞에서 고정한다.
      - name: 검사 코드 출처 캡처 (checkout 직후 — HEAD 변이 앞)
        id: aiops_source
        uses: ./.github/actions/aiops-provenance
      - uses: ./.github/actions/setup-bun
      - name: spec 재검증 + name/extensions 추출 (defense-in-depth — dispatcher 외 호출 경로 대비)
        id: spec
        env:
          SPEC: ${{ inputs.spec }} # 비신뢰 입력 — env 경유만, run 안 인라인 보간 금지
        run: |
          jq -n --arg action create-database --arg spec "$SPEC" \
            '{action: $action, spec: $spec}' > /tmp/payload.json
          bun tools/validate-mutation.ts --action create-database --payload-file /tmp/payload.json
          name=$(printf '%s' "$SPEC" | jq -r '.name')  # validate-mutation이 형식을 이미 SSOT 검증(인라인 regex 사본 제거)
          exts=$(printf '%s' "$SPEC" | jq -r '(.extensions // []) | join(",")')
          { echo "name=$name"; echo "extensions=$exts"; } >> "$GITHUB_OUTPUT"
      - name: 봉인 cert 확인 (없으면 산출 0)
        run: |
          # cert가 아직 없으면(컨트롤러 미가동/미수확) 어떤 산출도 만들지 않고 중단
          [ -f tools/sealed-secrets-cert.pem ] || { echo "::error::tools/sealed-secrets-cert.pem 없음 — sealed-secrets 컨트롤러 가동 후 'kubeseal --fetch-cert'로 받아 커밋해야 한다"; exit 1; }
      - name: kubeseal 설치 (버전 SSOT — 컨트롤러 appVersion v0.39.1)
        uses: ./.github/actions/setup-toolchain
        with:
          kubeseal: 'true'
      - name: 프로비저닝 (비밀번호 내부 생성 — 어떤 출력에도 비노출)
        env:
          NAME: ${{ steps.spec.outputs.name }} # 검증 통과 산출물(regex 강제)만 사용
          EXTS: ${{ steps.spec.outputs.extensions }}
        run: |
          if [ -n "$EXTS" ]; then
            bun tools/provision-db.ts --name "$NAME" --extensions "$EXTS" | tee /tmp/plan.json
          else
            bun tools/provision-db.ts --name "$NAME" | tee /tmp/plan.json
          fi
      - name: PR 본문 작성 (plan.json + 체크리스트)
        run: |
          {
            echo "create-database 자동 생성 PR — 머지되면 ArgoCD가 cnpg-data(database NS)와 data-conn-prod(prod NS)를 싱크한다."
            echo
            echo '```json'; cat /tmp/plan.json; echo '```'
            echo; echo "### 머지 후 체크리스트"
            jq -r '.checklist[] | "- [ ] " + .' /tmp/plan.json
          } > /tmp/pr-body.md
      - name: PR-first 커밋 + auto-merge
        id: aiops_check
        uses: ./.github/actions/pr-first-commit
        with:
          branch: create-database/${{ steps.spec.outputs.name }}-${{ github.run_id }}
          add-paths: platform/cnpg/prod platform/data-conn/prod
          commit-message: "feat: ${{ steps.spec.outputs.name }} 논리 DB 프로비저닝 (create-database)"
          pr-title: "feat: ${{ steps.spec.outputs.name }} DB 생성 (create-database)"
          pr-body-file: /tmp/pr-body.md
          auto-merge: 'true'
          gh-token: ${{ steps.writer.outputs.token }}
      # 제안 커밋 SHA — 출처(revision)와 별개 축이다(noop이면 만들지 않는다).
      - name: 변경 제안 revision 기록 (출처와 분리 — 실패해도 관측은 계속)
        id: proposal
        if: ${{ always() && steps.aiops_check.outputs.result == 'pr' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: AIOps 검사 결과 기록
        if: always()
        continue-on-error: true
        uses: ./.github/actions/aiops-observation
        with:
          producer: _create-database.yaml/provision
          target: ${{ steps.spec.outputs.name || 'unresolved-database' }}
          job-result: ${{ job.status }}
          steps: ${{ toJSON(steps) }}
          primary-step: aiops_check
          source-revision: ${{ steps.aiops_source.outputs.source-revision }}
          proposal-revision: ${{ steps.proposal.outputs.revision }}
      - name: telegram notify (핸들 이름만 — URL/비밀번호 금지)
        if: ${{ (always()) && steps.authority.outcome == 'success' }}
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: DB생성
          title: "${{ job.status == 'success' && 'DB 생성 PR' || 'DB 생성' }}"
          ident: ${{ steps.spec.outputs.name }}
          body: "${{ job.status == 'success' && format('PR 생성됨(머지 대기) · 핸들 db-{0}-conn / db-{0}-ro-conn (prod)', steps.spec.outputs.name) || '' }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
