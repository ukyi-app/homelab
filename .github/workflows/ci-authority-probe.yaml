name: "AIOps native token authority fixture"
run-name: "AIOPS-NATIVE-0915 ${{ inputs.reviewed_revision }}"
on:
  workflow_dispatch:
    inputs:
      reviewed_revision:
        type: string
        required: true
# 고정 시험 branch 전용. 이 파일은 main에 병합하지 않는다.
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: write
  statuses: write
jobs:
  native-authority:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - name: 고정 공개 검증 코드 준비
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='1e5da2f34547ba7c4b5f691b145aa7600d4f386fbb5c38dee5344df817ccccf0'
          (root/'native-core.py').write_bytes(data)
          data=base64.b64decode('')
          assert hashlib.sha256(data).hexdigest()=='0e3d1b091e07b0c6754f72dc1310c5a08f13a3c10f6517976dc1d95a930619f6'
          (root/'native-entry.py').write_bytes(data)
          PY
      - name: Native token 직접 권한과 무변이 재실행 검사
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
          TRIGGERING: ${{ github.triggering_actor }}
          REVIEWED: ${{ inputs.reviewed_revision }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 "$RUNNER_TEMP/native-entry.py"
      - name: 공개 판정 증거 보관
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aiops-native-authority-0915
          path: ${{ runner.temp }}/native-proof.json
          if-no-files-found: error
          retention-days: 7
