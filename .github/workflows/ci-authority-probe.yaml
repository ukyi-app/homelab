name: Reusable public marker diagnostic
run-name: AIOPS-REUSABLE-PUBLIC-0915
on:
  workflow_dispatch:
    inputs:
      reviewed_revision:
        required: true
        type: string
permissions: {}
jobs:
  origin:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - env:
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
          ATTEMPT: ${{ github.run_attempt }}
          REPO: ${{ github.repository_id }}
          REVIEWED: ${{ inputs.reviewed_revision }}
          SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          python3 - <<'PYORIGIN'
          import os,re
          e=os.environ
          assert e['ACTOR'].lower()==e['TRIGGERING'].lower()=='ukkiee'
          assert e['REF']=='refs/heads/aiops/reusable-secret-probe-0915' and e['ATTEMPT']=='1' and e['REPO']=='1265054638'
          assert re.fullmatch('[0-9a-f]{40}',e['REVIEWED']) and e['REVIEWED']==e['SHA']==e['WORKFLOW_SHA']
          PYORIGIN
  no-declaration:
    needs: origin
    uses: ./.github/workflows/_public-no-decl.yaml
  declared-no-pass:
    needs: origin
    uses: ./.github/workflows/_public-decl.yaml
  declared-empty-pass:
    needs: origin
    uses: ./.github/workflows/_public-decl.yaml
    secrets:
      AIOPS_REUSABLE_PUBLIC_CANARY_0915: ""
  declared-expression-pass:
    needs: origin
    uses: ./.github/workflows/_public-decl.yaml
    secrets:
      AIOPS_REUSABLE_PUBLIC_CANARY_0915: ${{ secrets.AIOPS_REUSABLE_PUBLIC_CANARY_0915 }}
  declared-placeholder-pass:
    needs: origin
    uses: ./.github/workflows/_public-decl.yaml
    secrets:
      AIOPS_REUSABLE_PUBLIC_CANARY_0915: environment-only-public-placeholder
  declared-inherit:
    needs: origin
    uses: ./.github/workflows/_public-decl.yaml
    secrets: inherit
  direct:
    environment: aiops-reusable-public-0915
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    outputs:
      matched: ${{ steps.marker.outputs.matched }}
    steps:
      - id: marker
        env:
          PUBLIC: ${{ secrets.AIOPS_REUSABLE_PUBLIC_CANARY_0915 }}
        shell: bash
        run: |
          python3 - <<'PYMARKER'
          import os,json
          matched=os.environ['PUBLIC']=='AIOPS-REUSABLE-PUBLIC-0915'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matched='+str(matched).lower()+'\n')
          print(json.dumps({'matched':matched}))
          PYMARKER
    needs: origin
  report:
    needs:
      - no-declaration
      - declared-no-pass
      - declared-empty-pass
      - declared-expression-pass
      - declared-placeholder-pass
      - declared-inherit
      - direct
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import os,json
          value=json.loads(os.environ['RESULT'])
          print(json.dumps(value))
          assert all(x['result']=='success' for x in value.values())
          PYREPORT
