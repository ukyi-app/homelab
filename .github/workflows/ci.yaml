name: "🧪 ci"
# 권위 게이트: 이 워크플로의 job 'gate'가 유일한 required check(infra/github/repo.tf contexts=["gate"]).
# 메모리 원장(bun run verify:ledger)·테스트 수집(run-bats.sh)·chart·shellcheck·e2e를 권위 게이트한다.
# verify.yaml(job 'verify')은 non-required 보조(skeleton·sops 왕복 ephemeral·pre-commit) — ledger 중복은 W7에서 제거.
on:
  pull_request:
  push:
    branches: [main]

# 최소권한 — 이 게이트는 읽기/테스트만 한다. top-level 부재 시 fork PR의 비신뢰 코드
# (bun install postinstall 등)가 레포 기본 토큰 권한으로 실행된다. write 필요 스텝 없음.
permissions:
  contents: read

# PR엔 같은 PR의 이전 run을 취소(러너 절약 + gate에 stale 잔류 방지), main push는 sha 고유라 보존.
# queue:max는 안 쓰므로 cancel-in-progress 병용 함정(AGENTS.md)과 무관.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/setup-bun
      - name: typecheck (tsc --noEmit — erasableSyntaxOnly 게이트, make ci 패리티)
        run: bun run typecheck
      - name: install chart toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          yq: 'true'
          kubeconform: 'true'
          helm: 'true'
          kustomize: 'true'
          conftest: 'true'
          bats: 'true'
          shellcheck: 'true'
          actionlint: 'true'
      - name: secret-guard — gitleaks(누출) + sops-guard(평문 enc.yaml) 강제
        # verify.yaml의 gitleaks/sops-guard는 required가 아니라(분기보호 contexts=["gate"]),
        # 누출 PR이 gate만 통과하면 머지된다 → required `gate` 잡에 폴딩(코드 전용, 머지 즉시 발효).
        # gitleaks는 pre-commit rev와 동일 버전을 핀(SSOT 드리프트 방지). 러너=arm64.
        run: |
          ver=$(yq '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' .pre-commit-config.yaml | sed 's/^v//')
          [ -n "$ver" ] || { echo "::error::gitleaks rev를 .pre-commit-config.yaml에서 못 찾음"; exit 1; }   # fail-loud(빈 버전 차단)
          # ⚠️ codex pass5 F3 + restale F1: curl|tar 직접 추출은 체크섬 없는 실행체 공급망 표면(supplychain-5 동일).
          # 하드코딩 SHA256 placeholder 금지(게이트 깨짐) — 릴리스 **공식 checksums.txt**를 받아 그 라인으로 검증 후
          # 추출한다(버전 핀 v${ver}만 Renovate가 갱신; 해시는 매니페스트에서 자동 일치, stale 위험 0).
          ( cd /tmp
            curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_arm64.tar.gz"
            curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt"
            grep "  gitleaks_${ver}_linux_arm64.tar.gz$" "gitleaks_${ver}_checksums.txt" | sha256sum -c -
            sudo tar -xz -C /usr/local/bin -f "gitleaks_${ver}_linux_arm64.tar.gz" gitleaks )
          # git 히스토리 전체 스캔(pre-commit 훅과 동등). --redact: 발견 시 시크릿 평문 미출력.
          # ⚠️ codex pass4 F2: bare 'gitleaks detect'는 git 히스토리 전체 스캔 → 과거 false-positive/회전된
          # 옛 시크릿 하나가 모든 PR을 영구 머지불가(게이트 red)로 만든다. pre-commit 훅처럼 작업트리만 스캔.
          gitleaks detect --no-git --source . --redact --no-banner --exit-code 1
      - name: sops-guard — 추적된 모든 *.enc.yaml 구조 검증
        # 평문 *.enc.yaml(또는 부분 암호화)을 차단. gate는 setup-toolchain에서 yq를 이미 설치했다.
        # 무인자 = 가드가 자기 도메인을 열거하고 바닥값을 건다. 예전의 `git ls-files … | xargs -r`는
        # 글롭이 깨지면 스크립트를 **아예 호출하지 않아** 이 스텝이 조용히 초록이었다.
        run: bash scripts/sops-guard.sh
      - name: chart render + validate (all kinds)
        run: make chart-test
      - name: memory ledger onboarding gate (M0-owned)
        run: bun run verify:ledger
      - name: registry/binding 정합 게이트 (배포 깨는 드리프트 차단)
        # 차단(--ci)은 배포/노출을 깨는 유형만: orphan-dns(active 행 매니페스트 부재 → 빈 백엔드 DNS),
        # activation-exposure-drift(노출 행 변경 → 재승인 필요).
        # 그 외(원장 행·미등록·incomplete-purge 등)는 비차단(정보/경고). 연결=SealedSecret이라 db/redis 바인딩 검사는 없다.
        run: bun tools/audit-orphans.ts --ci
      - name: skeleton + 네이밍/CJK/dirmap 가드 (required — 기존 verify.yaml non-required서 승격)
        run: bash scripts/check-skeleton.sh
      - name: 가드 권위 경로 회계 (G1 — 가드가 CI에서 한 번도 안 도는 상태 차단)
        # ⚠️ 명시 스텝으로 둔다. 이 회계의 권위가 자기 bats 하나뿐이면 tests/.ci-exclude에 한 줄
        # 추가하는 것만으로 **회계 전체가 초록인 채 꺼진다** — 다른 가드는 이 도구가 지키는데
        # 이 도구를 지키는 것이 없어지는 자기 사각지대다(적대적 리뷰가 실측으로 지목).
        run: bun tools/check-guard-authority.ts
      - name: 이미지 소유권 회계 (G2 — 아티팩트가 권위 있는 핀 소유자를 갖는지)
        # 핀 게이트(check-image-pins)와 **다른 질문**이다: 저건 'digest로 핀됐는가', 여긴 '그 digest를
        # 누가 갱신하는가'. 명시 스텝인 이유는 check-guard-authority와 같다 — 권위가 자기 bats 하나뿐이면
        # tests/.ci-exclude 한 줄로 회계 전체가 초록인 채 꺼진다.
        run: bun tools/check-image-ownership.ts
      - name: 워크플로 준비상태 회계 (G-09 — 자격 부재로 job이 조용히 skip되는 것 차단)
        # ⚠️ check-guard-authority와 같은 이유로 **명시 스텝**이다. 이 회계의 권위가 자기 bats
        # 하나뿐이면 tests/.ci-exclude에 한 줄 추가하는 것만으로 회계 전체가 초록인 채 꺼진다.
        # 여긴 정적 방향(원장 ↔ 워크플로 양방향 대조)만 본다 — 런타임 판정은 각 워크플로의
        # accounting job이 `--workflow <file>`로 수행한다.
        run: bun tools/check-workflow-readiness.ts
      - name: gate bats suite (run-bats.sh — 단일 수집 SSOT)
        # 수집은 scripts/run-bats.sh 단일 진입점: git-tracked test_*.bats − platform/charts(chart-test 별도) −
        # tests/.ci-exclude(라이브/docker/age/terraform). make ci 와 동일 호출 → 이중 SSOT 제거.
        # 하드코딩/글롭 누락 클래스를 구조적으로 차단(미접두는 check-skeleton 네이밍 가드가 별도 차단).
        # CI-safe infra 정적 가드(k3s-bootstrap·argocd lint)도 이제 required gate가 보호(죽은 커버리지 해소).
        run: ./scripts/run-bats.sh
      - name: shell script lint (전 추적 .sh)
        # 전 추적 *.sh를 shellcheck — scripts/(DR/파괴적)뿐 아니라 notify.sh(알림 경로)·
        # restore-drill-script.sh·infra/k3s-bootstrap·e2e까지. 벤더 charts/는 untracked라 git ls-files에 안 잡힘.
        run: git ls-files '*.sh' | xargs shellcheck
      - name: actionlint — 워크플로 정적 검사(run 셸인젝션·표현식·문법)
        # required gate 잡 안 스텝(별도 잡이면 비-required라 무성 회귀). setup-toolchain이 설치.
        # .github/actionlint.yaml로 queue:max(2026-05 GA) schema-lag 오탐만 좁게 무시(직렬화 계약 유지).
        run: actionlint
      - name: telegram 메시지 렌더 e2e (containerized AM v0.27)
        # amtool/grep이 못 잡는 inline message Go-template의 실제 컴파일·렌더를 사전 증명한다
        # (한국어 제목·글리프·자동 escape·링크). required gate 잡 스텝 → branch protection이 강제.
        # docker/python3는 ubuntu 러너 기본 제공, yq는 위 install 스텝에서 설치됨.
        run: bash tests/gates/alertmanager-render-e2e.sh
      - name: vector config validate (containerized — render 미차단 vector 의미오류)
        # alertmanager-render-e2e 선례 — kustomize render는 vector config 의미오류를 못 잡는다. docker는 러너 기본.
        run: bash tests/gates/vector-validate.sh
      - name: vmalert rule validate (containerized — render/grep 미차단 룰 expr 오류)
        # grep만으론 오류 PromQL/MetricsQL이 통과(test_vmalert-config는 존재 grep) → vmalert -dryRun으로 파싱 검증.
        run: bash tests/gates/vmalert-rules-validate.sh
      # ── vmalert 발화 e2e (전량 **병렬**) ────────────────────────────────────────────────────────
      # 이 하네스들은 "룰이 파싱된다"가 아니라 "실제로 발화한다"를 증명한다 — `-dryRun`이 통과시킨
      # 죽은 알림이 이 레포에 두 번 있었다(ImageDigestDrift·FilesBulkSSDLow: push 주기 > 룩백으로
      # 시리즈에 구멍 → `for:` pending이 매 주기 리셋 → 영구 무발화).
      #
      # ⚠️ **왜 병렬인가**: 실측(run 30332565823) gate 총 1048초 중 이 셋이 805초(77%)였다. 네 번째가
      # 들어오면 순차로는 ~1250초가 된다. 하네스는 서로 완전히 독립이고(각자 자기 docker 네트워크·
      # 컨테이너를 `$$` 접미로 만든다) 시간의 대부분이 CPU가 아니라 replay 대기라 병렬 효과가 크다.
      # 총합이 아니라 **최댓값**으로 수렴한다.
      #
      # ⚠️ 목록은 **리터럴 경로로 적는다**(글롭 파생이 아니라). 언뜻 "하드코딩 목록"으로 보이지만
      # 이 자리에선 반대다 — `tools/check-guard-authority.ts`가 모든 `tests/gates/*.sh`에 **권위 실행
      # 경로 ≥1**을 요구하므로, 하네스를 추가하고 여기 안 적으면 그 가드가 즉시 red를 낸다(실측:
      # 글롭 변수로 바꿨더니 네 하네스 전부 "권위 0"으로 잡혔다). 즉 이 목록은 **대조되는** 목록이고,
      # 리터럴이어야 그 대조가 성립한다. pg-tools 소비처 목록과의 차이가 정확히 이것이다.
      #
      # ⚠️ **rc는 PID별로 걷는다.** `a & b & wait`는 마지막 잡의 상태만 돌려줘 앞 하네스의 실패가
      # 조용히 삼켜진다 — 이 레포가 프로세스 치환에서 이미 겪은 클래스다(vacuous green).
      - name: vmalert 발화 e2e (전량 병렬 — 순차 실행이 gate 시간의 77%였다)
        run: |
          # 이미지는 먼저 한 번만 당긴다(넷이 동시에 같은 이미지를 당기는 변동 제거).
          # 버전은 **매니페스트에서 파생** — 하드코딩하면 배포와 갈린다.
          vm="$(grep -oE 'victoriametrics/victoria-metrics:v[0-9.]+' platform/victoria-stack/prod/vmsingle.yaml | head -1)"
          va="$(grep -oE 'victoriametrics/vmalert:v[0-9.]+' platform/victoria-stack/prod/vmalert.yaml | head -1)"
          [ -n "$vm" ] && [ -n "$va" ] || { echo "::error::e2e 이미지 버전 파생 실패(vmsingle/vmalert 매니페스트)"; exit 1; }
          docker pull -q "$vm" >/dev/null
          docker pull -q "$va" >/dev/null

          # ⚠️ 첫 경로를 대입문과 **같은 줄에 두지 않는다** — check-guard-authority는 `NAME=…` 줄을
          #    할당으로 보고 건너뛰므로 그 하네스만 "권위 0"으로 잡힌다(실측: drift 하나만 빠졌다).
          harnesses="
          tests/gates/vmalert-drift-firing-e2e.sh
          tests/gates/vmalert-bulkssd-firing-e2e.sh
          tests/gates/vmalert-digest-stale-firing-e2e.sh
          tests/gates/vmalert-gha-liveness-firing-e2e.sh
          "
          harnesses="$(printf '%s\n' "$harnesses" | tr -d ' ' | grep -v '^$' || true)"
          # 추적 글롭과 **교차 대조** — 목록에 없는 하네스가 생기면 여기서 먼저 드러난다(가드보다 이른 신호).
          want="$(git ls-files 'tests/gates/vmalert-*-firing-e2e.sh' | sort)"
          got="$(printf '%s\n' "$harnesses" | sort)"
          [ "$want" = "$got" ] || { echo "::error::발화 e2e 목록이 레포와 불일치"; diff <(echo "$want") <(echo "$got") || true; exit 1; }
          n="$(printf '%s\n' "$harnesses" | grep -c . || true)"
          [ "${n:-0}" -ge 3 ] || { echo "::error::발화 e2e 하네스 ${n:-0}건 < 3 — 열거 붕괴(무측정 초록)"; exit 1; }
          echo "발화 e2e ${n}건 병렬 실행"

          pids=""
          for h in $harnesses; do
            bash "$h" > "/tmp/$(basename "$h").log" 2>&1 &
            pids="$pids $!:$h"
          done
          fail=0
          for p in $pids; do
            pid="${p%%:*}"; h="${p#*:}"
            if wait "$pid"; then echo "PASS $h"; else echo "::error::FAIL $h"; fail=1; fi
          done
          # 로그는 하네스별로 접어서 낸다(병렬 인터리브 방지 — 진단 가능성이 곧 이 게이트의 값이다).
          for h in $harnesses; do
            echo "::group::$(basename "$h")"
            cat "/tmp/$(basename "$h").log"
            echo "::endgroup::"
          done
          exit "$fail"
      - name: skopeo 실물 타임아웃 스모크 (핀된 이미지 + 제어된 블랙홀)
        # PATH stub은 진짜 타임아웃을 증명할 수 없다(stub이 skopeo를 대체하므로 stub 자신을 테스트할 뿐).
        # digest-exporter의 인-데드라인 예산(POD_START + N×SKOPEO_TIMEOUT + CURL_MAX_TIME + EXEC_SLACK <
        # activeDeadlineSeconds) 전체가 "skopeo가 실제로 t에 끊긴다"는 전제 위에 서 있으므로, 그 전제를
        # 핀된 이미지에 대해 직접 증명한다(응답 없는 TCP sink → 경과가 --command-timeout 값을 따라감).
        run: bash tests/gates/skopeo-timeout-smoke.sh
      # app-shared .mts가 node strip-types(앱 레포 secret:seal 경로)에서도 실행됨을 required gate가 보장 (A.5 F1·pass3) —
      # 별도 잡이면 비-required라 무성 회귀라 gate 잡 안 스텝으로. node는 strip-types 실행용 의식적 예외(setup-bun ban 유일 예외).
      # CI는 현 LTS node 24로 실행(strip-types는 node 23.6+ 무플래그 기본). .mts 계약 하한은 여전히 node 22.18(앱 레포 secret:seal 경로).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — node strip-types 실행용
        # package-manager-cache:false — 이 스텝은 strip-types 스모크 전용(deps 캐시 불요). setup-node v5+는
        # package.json packageManager 필드 감지 시 자동 캐시를 켜는데, bun은 setup-node 캐시 미지원이라 lockfile 부재로
        # 깨질 수 있다(v6은 npm으로 한정해 bun이면 트립 안 되지만 의도를 명시해 못박는다).
        with: { node-version: "24.14.0", package-manager-cache: false }
      - run: tests/gates/app-shared-node-smoke.sh
