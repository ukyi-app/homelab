# 필수 검사 ci(ruleset A, 설계 C.4.6·C.4.7). 검사 내용은 tools/ci/main.ts에 있고, 여기서는 도구를 깔고
# 로컬과 같은 명령 bun run ci 하나를 부른다(L42). 검사를 더할 때는 이 파일이 아니라 tools/ci/를 고친다.
# 필수 검사 이름은 job id ci에서 나온다. job id를 바꾸거나 job에 name을 붙이면
# ruleset이 오지 않는 검사를 영원히 기다려 모든 PR이 멈춘다(설계 B.8 E5).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 최소 권한. fork PR의 코드도 이 토큰으로 돈다.
permissions:
  contents: read

# 같은 PR의 이전 실행은 취소한다. main push는 커밋마다 남긴다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 정렬·문자 분류를 러너 로케일에 맡기지 않는다. 옛 저장소에서 en_US sort -u가 -1과 1을 같게 봤다(설계 B.8).
  LC_ALL: C

defaults:
  run:
    # shell: bash를 적어야 -eo pipefail로 돈다. 적지 않은 기본 셸에는 pipefail이 없다(설계 B.8 E5).
    shell: bash

jobs:
  ci:
    # NUC와 같은 amd64라 로컬 mise와 같은 linux x64 바이너리를 쓴다.
    runs-on: ubuntu-24.04
    # 기본 상한은 6시간이다. 멈춘 job이 필수 검사를 그만큼 붙잡지 않게 한다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 토큰을 .git/config에 남기지 않는다. 뒤 단계는 쓰기도 인증도 필요 없다.
          persist-credentials: false

      - name: Install pinned tools
        # 버전은 .tool-versions에서 읽고, 받은 파일은 아래 sha256과 대조한다. TLS만 믿지 않는다(옛 R29).
        # .tool-versions에서 버전을 바꾸면 아래 sha256도 같은 커밋에서 바꾼다. 안 바꾸면 여기서 실패한다.
        # GITHUB_PATH는 PATH 앞에 붙으므로 러너 이미지에 깔린 같은 이름의 도구보다 이것이 먼저 잡힌다.
        env:
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8" # 1.7.12 linux_amd64
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # 8.30.1 linux_x64
          KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d" # 5.8.1 linux_amd64
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198" # 0.11.0 linux.x86_64
          BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c" # 1.4.4 linux-x64
          HELM_SHA256: "479dca836e5b45e8bd222400c5591b0e3a647378f03ff96597180db97c17fdae" # 4.2.1 linux-amd64
          KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883" # 0.8.0 linux-amd64
          TERRAFORM_SHA256: "38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7" # 1.16.6 linux_amd64
          ALERTMANAGER_SHA256: "265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8" # 0.34.1 linux-amd64
          VMUTILS_SHA256: "989c8f73edc5d131eb169bb689d7b77bb1d31b14314159c7f6bbae38ba655938" # 1.154.1 linux-amd64(enterprise 아님)
        run: |
          bin="$RUNNER_TEMP/bin"
          dl="$RUNNER_TEMP/dl"
          mkdir -p "$bin" "$dl"

          # 결과는 전역 v에 둔다. $(...)로 받으면 아래 ::error:: 줄까지 삼켜 로그에 안 남는다.
          ver() {
            v=$(awk -v t="$1" '$1 == t { print $2 }' .tool-versions)
            if [[ -z $v ]]; then
              echo "::error::.tool-versions에 $1 버전이 없다"
              return 1
            fi
          }

          fetch() {
            local url=$1 sum=$2 out=$3
            curl -fsSL --retry 3 -o "$out" "$url"
            if ! echo "$sum  $out" | sha256sum -c --quiet -; then
              echo "::error::sha256 불일치: $url (.tool-versions 버전을 바꿨다면 ci.yaml의 sha256도 바꾼다)"
              return 1
            fi
          }

          ver actionlint
          fetch "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" "$dl/actionlint.tar.gz"
          tar -xzf "$dl/actionlint.tar.gz" -C "$bin" actionlint

          ver gitleaks
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" "$GITLEAKS_SHA256" "$dl/gitleaks.tar.gz"
          tar -xzf "$dl/gitleaks.tar.gz" -C "$bin" gitleaks

          ver kustomize
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${v}/kustomize_v${v}_linux_amd64.tar.gz" "$KUSTOMIZE_SHA256" "$dl/kustomize.tar.gz"
          tar -xzf "$dl/kustomize.tar.gz" -C "$bin" kustomize

          # actionlint가 run: 블록을 검사할 때 PATH의 shellcheck를 쓴다. 러너 이미지 버전에 맡기면 결과가 바뀐다.
          ver shellcheck
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${v}/shellcheck-v${v}.linux.x86_64.tar.xz" "$SHELLCHECK_SHA256" "$dl/shellcheck.tar.xz"
          tar -xJf "$dl/shellcheck.tar.xz" -C "$bin" --strip-components=1 "shellcheck-v${v}/shellcheck"

          ver bun
          fetch "https://github.com/oven-sh/bun/releases/download/bun-v${v}/bun-linux-x64.zip" "$BUN_SHA256" "$dl/bun.zip"
          unzip -q -j "$dl/bun.zip" bun-linux-x64/bun -d "$bin"

          ver helm
          fetch "https://get.helm.sh/helm-v${v}-linux-amd64.tar.gz" "$HELM_SHA256" "$dl/helm.tar.gz"
          tar -xzf "$dl/helm.tar.gz" -C "$bin" --strip-components=1 linux-amd64/helm

          ver kubeconform
          fetch "https://github.com/yannh/kubeconform/releases/download/v${v}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256" "$dl/kubeconform.tar.gz"
          tar -xzf "$dl/kubeconform.tar.gz" -C "$bin" kubeconform

          ver terraform
          fetch "https://releases.hashicorp.com/terraform/${v}/terraform_${v}_linux_amd64.zip" "$TERRAFORM_SHA256" "$dl/terraform.zip"
          unzip -q "$dl/terraform.zip" terraform -d "$bin"

          # amtool만 쓴다(tools/ci/alerting.ts). .tool-versions의 이름은 mise backend 접두가 붙은 aqua:prometheus/alertmanager다.
          ver aqua:prometheus/alertmanager
          fetch "https://github.com/prometheus/alertmanager/releases/download/v${v}/alertmanager-${v}.linux-amd64.tar.gz" "$ALERTMANAGER_SHA256" "$dl/alertmanager.tar.gz"
          tar -xzf "$dl/alertmanager.tar.gz" -C "$bin" --strip-components=1 "alertmanager-${v}.linux-amd64/amtool"

          # vmalert-tool-prod만 쓴다. .tool-versions의 이름에 mise 옵션 괄호가 붙어 ver의 정확한 일치 대신 접두로 찾는다.
          v=$(awk '$1 ~ /^github:VictoriaMetrics\/VictoriaMetrics\[/ { print $2 }' .tool-versions)
          if [[ -z $v ]]; then
            echo "::error::.tool-versions에 vmutils(github:VictoriaMetrics/VictoriaMetrics) 버전이 없다"
            exit 1
          fi
          fetch "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v${v}/vmutils-linux-amd64-v${v}.tar.gz" "$VMUTILS_SHA256" "$dl/vmutils.tar.gz"
          tar -xzf "$dl/vmutils.tar.gz" -C "$bin" vmalert-tool-prod

          "$bin/actionlint" -version
          "$bin/gitleaks" version
          "$bin/kustomize" version
          "$bin/shellcheck" --version
          "$bin/bun" --version
          "$bin/helm" version --short
          "$bin/kubeconform" -v
          "$bin/terraform" version
          "$bin/amtool" --version
          "$bin/vmalert-tool-prod" --version
          echo "$bin" >> "$GITHUB_PATH"

      - name: bun run ci
        # npm 패키지(typescript·@types/bun, devDependencies)는 bun run ci의 cli typecheck 단계가 받는다(로컬과 같은 명령, L42).
        # bun install --frozen-lockfile --ignore-scripts라 bun.lock의 무결성 해시와 다른 내용이나 설치 스크립트는 돌지 않는다.
        # 캐시는 두지 않는다(매 실행 registry에서 받고 해시로 확인).
        # provider는 Terraform registry에서 받고 .terraform.lock.hcl 해시로 확인한다(-lockfile=readonly).
        run: bun run ci
