name: "🧪 ci"
# 권위 게이트: 이 워크플로의 job 'gate'가 유일한 required check(infra/github/repo.tf contexts=["gate"]).
# 메모리 원장(bun run verify:ledger)·테스트 수집(run-bats.sh)·chart·shellcheck·e2e를 권위 게이트한다.
# verify.yaml(job 'verify')은 non-required 보조(skeleton·sops 왕복 ephemeral·pre-commit) — ledger 중복은 W7에서 제거.
on:
  pull_request:
  push:
    branches: [main]

# 최소권한 — 이 게이트는 읽기/테스트만 한다. top-level 부재 시 fork PR의 비신뢰 코드
# (bun install postinstall 등)가 레포 기본 토큰 권한으로 실행된다. write 필요 스텝 없음.
permissions:
  contents: read

# 콜레이션 고정 — 러너 이미지 기본값에 의존하지 않는다(이 워크플로에 로케일 설정이 0건이었다).
# 오너 셸(en_US.UTF-8)과 러너가 다른 콜레이션이면 두 venue가 **다른 술어**를 평가한다
# (실측 2026-08-20: sync-wave 원장 가드가 en_US에서 fail-open이었다). bats 밖 스텝
# (check-*.sh · TS 가드 · e2e 하네스)까지 덮으려면 job이 아니라 여기여야 한다.
# ⚠️ 이 고정은 `scripts/check-locale-collation.sh`의 **대체가 아니라 짝**이다 — 고정만 하면
#    개별 결함의 뮤테이션 감도가 죽는다. cf. `docs/traps-detail.md` 「로케일 콜레이션이 …」
env:
  LC_ALL: C.UTF-8

# PR엔 같은 PR의 이전 run을 취소(러너 절약 + gate에 stale 잔류 방지), main push는 sha 고유라 보존.
# queue:max는 안 쓰므로 cancel-in-progress 병용 함정(AGENTS.md)과 무관.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04-arm
    # ── timeout-minutes: 그룹 **밖** 워크플로의 천장(근거 전문) ────────────────────────────
    # homelab-mutation 그룹 쪽 근거는 bump-poll.yaml preflight 잡 주석이 갖는다. 그룹 밖에도 같은
    # 노출이 있다 — 잡 timeout의 기본값은 platform max(6시간)라, hang한 잡은 러너를 6시간 잡고도
    # 아무 말을 하지 않는다(실사고: reusable-app-build 2026-08-24 6h0m46s ·
    # docs/traps-detail.md 「QEMU amd64 leg의 bun 1.4는 …」).
    # 그룹 밖이라 FIFO 교착 비용은 없지만 각자의 비용이 있다 — gate는 이 레포의 **유일한 required
    # check**(infra/github/repo.tf contexts=["gate"])라 여기서 멈추면 PR 머지가 통째로 선다.
    # bump-poll/Renovate의 auto-merge도 `gate` 통과를 기다리므로 자동 배포·의존성 갱신이 함께 멈춘다.
    # ⚠️ 상한은 원인을 고치지 않는다 — 6시간을 분 단위로 바꿔 **드러나게** 할 뿐이다.
    # ⚠️ 값을 잴 때 두 축을 섞지 마라. `timeout-minutes`가 재는 것은 **잡 실행구간**
    #    (started_at→completed_at)이고, `gh run list`의 createdAt→updatedAt은 큐 대기를 포함한다.
    #    이 워크플로에서 그 차이가 3배였다(아래 실측) — run 구간만 보고 값을 잡으면 과다 산정된다.
    # 값 근거 — 2026-09-03 라이브 실측(최근 100 run 중 완료 99건): 잡 실행구간 p50 483s / p90 514s / max 532s,
    # run 구간(큐 포함) max 1687s. 45분은 큐 포함 최댓값(28분)마저 넘겨 잡아 어느 축으로 읽어도
    # 오탐이 없고, 잡 실측 max의 5배라 발화 e2e 하네스가 더 붙어도 여유가 남는다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/setup-bun
      - name: typecheck (tsc --noEmit — erasableSyntaxOnly 게이트, make ci 패리티)
        run: bun run typecheck
      - name: install chart toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          yq: 'true'
          kubeconform: 'true'
          helm: 'true'
          kustomize: 'true'
          conftest: 'true'
          bats: 'true'
          shellcheck: 'true'
          actionlint: 'true'
          sops: 'true'
          age: 'true'
      - name: secret-guard — gitleaks(누출) + sops-guard(평문 enc.yaml) 강제
        # verify.yaml의 gitleaks/sops-guard는 required가 아니라(분기보호 contexts=["gate"]),
        # 누출 PR이 gate만 통과하면 머지된다 → required `gate` 잡에 폴딩(코드 전용, 머지 즉시 발효).
        # gitleaks는 pre-commit rev와 동일 버전을 핀(SSOT 드리프트 방지). 러너=arm64.
        run: |
          ver=$(yq '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' .pre-commit-config.yaml | sed 's/^v//')
          [ -n "$ver" ] || { echo "::error::gitleaks rev를 .pre-commit-config.yaml에서 못 찾음"; exit 1; }   # fail-loud(빈 버전 차단)
          # ⚠️ 해시는 릴리스 **공식 checksums.txt**로 검증한다 — SHA256 하드코딩 금지(버전 bump마다
          #    stale이 되어 게이트가 깨진다). 핀은 v${ver}(= .pre-commit-config.yaml rev) 하나뿐이다.
          #    freshness 소유자: renovate.json의 `pre-commit` manager(opt-in — 이 레포는 명시 활성).
          #    이 층은 3차 방어다 — 1차는 서버측 secret scanning + push protection(infra/github/repo.tf:7-14),
          #    2차는 SOPS/SealedSecrets 규약(CONTRIBUTING.md '시크릿 공급')이다.
          ( cd /tmp
            curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_arm64.tar.gz"
            curl -fsSL -O "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt"
            grep "  gitleaks_${ver}_linux_arm64.tar.gz$" "gitleaks_${ver}_checksums.txt" | sha256sum -c -
            sudo tar -xz -C /usr/local/bin -f "gitleaks_${ver}_linux_arm64.tar.gz" gitleaks )
          # ⚠️ `--no-git` 필수(작업트리만 스캔) — 히스토리 전체를 스캔하면 과거 false-positive나 이미
          #    회전된 옛 시크릿 하나가 모든 PR을 영구 red로 만든다. --redact: 발견 시 평문 미출력.
          gitleaks detect --no-git --source . --redact --no-banner --exit-code 1
      - name: SOPS 왕복 (ephemeral CI 키)
        # verify.yaml에서 이식(그 잡의 유일한 고유 책임이었다). 실 age 키 없이 자기완결로 왕복을 증명한다 —
        # 암호화 후 평문이 남지 않는지 + 복호가 원문을 되돌리는지. 로컬 대응은 `make verify`의
        # tests/test_sops-roundtrip.bats(실 키 사용)라 policy/ci-parity.json에 covered로 계상한다.
        run: |
          age-keygen -o /tmp/ci.agekey
          export SOPS_AGE_KEY_FILE=/tmp/ci.agekey
          CIKEY=$(age-keygen -y /tmp/ci.agekey)
          cat > /tmp/sops-ci.yaml <<EOF
          creation_rules:
            - path_regex: \.enc\.yaml\$
              encrypted_regex: "^(data|stringData)\$"
              age: "$CIKEY"
          EOF
          cp tests/fixtures/sample-secret.yaml /tmp/ci.enc.yaml
          sops --config /tmp/sops-ci.yaml --encrypt --in-place /tmp/ci.enc.yaml
          if grep -q 'super-secret-value-123' /tmp/ci.enc.yaml; then echo "::error::암호화 후 평문 잔존"; exit 1; fi
          sops --config /tmp/sops-ci.yaml --decrypt /tmp/ci.enc.yaml | grep -q 'super-secret-value-123'
      - name: pre-commit 배선 확인 (훅 정의가 실제로 도는가)
        # ⚠️ gate가 gitleaks·sops-guard를 직접 부르는 것과 **다른 질문**이다: 저건 "검사가 도는가",
        #    여긴 "`.pre-commit-config.yaml`의 훅 배선이 유효한가"(files 정규식·entry 경로·language).
        #    ci.yaml:45가 이 파일에서 gitleaks rev를 파생하므로 배선이 깨지면 그 파생도 조용히 죽는다.
        #    전체 훅 실행은 하지 않는다 — gitleaks 훅은 `--staged` 대상이라 CI(staged 0)에서 vacuous다.
        #    핀 이유: 이 스텝은 required `gate` 안에서 도는 유일한 무검증 다운로드 경로였다 —
        #    무핀이면 PyPI 신규 릴리스/yank 하나가 전 PR gate를 red로 만들고(재현성 0), 판정을
        #    바꾸는 배포본이 required check 안에서 실행된다. freshness 소유자는 renovate.json의
        #    customManager(pypi `pre-commit`)이고, 재발은 tests/gates/test_toolchain-checksums.bats가
        #    막는다. `--require-hashes`는 도입하지 않는다 — 전이 의존 해시 유지 비용이 이 스텝의
        #    가치를 넘고, Renovate가 그 해시를 재생성하지 못해 매 갱신이 red가 된다.
        run: |
          pip install --quiet 'pre-commit==4.6.2'
          pre-commit validate-config .pre-commit-config.yaml
          pre-commit run sops-guard --all-files
      - name: sops-guard — 추적된 모든 *.enc.yaml 구조 검증
        # 평문 *.enc.yaml(또는 부분 암호화)을 차단. gate는 setup-toolchain에서 yq를 이미 설치했다.
        # 무인자 = 가드가 자기 도메인을 열거하고 바닥값을 건다. 예전의 `git ls-files … | xargs -r`는
        # 글롭이 깨지면 스크립트를 **아예 호출하지 않아** 이 스텝이 조용히 초록이었다.
        run: bash scripts/sops-guard.sh
      - name: chart render + validate (all kinds)
        run: make chart-test
      - name: memory ledger onboarding gate (M0-owned)
        run: bun run verify:ledger
      - name: registry/binding 정합 게이트 (배포 깨는 드리프트 차단)
        # 차단(--ci)은 배포/노출을 깨는 유형만: orphan-dns(active 행 매니페스트 부재 → 빈 백엔드 DNS),
        # activation-exposure-drift(노출 행 변경 → 재승인 필요).
        # 그 외(원장 행·미등록·incomplete-purge 등)는 비차단(정보/경고). 연결=SealedSecret이라 db/redis 바인딩 검사는 없다.
        run: bun tools/audit-orphans.ts --ci
      - name: skeleton + 네이밍/CJK/dirmap 가드 (required — 기존 verify.yaml non-required서 승격)
        run: bash scripts/check-skeleton.sh
      # ── 회계 3종 ─────────────────────────────────────────────────────────────────────────
      # ⚠️ 셋 다 bats가 아니라 **명시 스텝**이다. 회계의 권위가 자기 bats 하나뿐이면 tests/.ci-exclude에
      #    한 줄 추가하는 것만으로 **회계 전체가 초록인 채 꺼진다** — 다른 가드는 이들이 지키는데
      #    이들을 지키는 것이 없어지는 자기 사각지대다.
      - name: 가드 권위 경로 회계 (G1 — 가드가 CI에서 한 번도 안 도는 상태 차단)
        run: bun tools/check-guard-authority.ts
      - name: 이미지 소유권 회계 (G2 — 아티팩트가 권위 있는 핀 소유자를 갖는지)
        # 핀 게이트(check-image-pins)와 **다른 질문**이다: 저건 'digest로 핀됐는가', 여긴 '그 digest를
        # 누가 갱신하는가'.
        run: bun tools/check-image-ownership.ts
      - name: 워크플로 준비상태 회계 (G-09 — 자격 부재로 job이 조용히 skip되는 것 차단)
        # 정적 방향(원장 ↔ 워크플로 양방향 대조)만 본다 — 런타임 판정은 각 워크플로의
        # accounting job이 `--workflow <file>`로 수행한다.
        run: bun tools/check-workflow-readiness.ts
      - name: 실 도메인 가드 (레포 자신에 대해 돌린다 — bats 픽스처가 아니라)
        # ⚠️ 아래 목록을 **여기서 직접** 부르는 이유: bats로만 돌면 같은 파일의 픽스처 @test 20여 개가
        #    venue를 살려, 실 트리를 검사하는 @test 한 줄이 지워져도 G1이 초록을 유지한다(실측:
        #    check-image-pins의 실 트리 강제는 단 한 줄이 CI의 유일한 권위였다). ci.yaml이 직접 부르면
        #    정의상 실 도메인에 닿으므로 fixture↔real 질문 자체가 사라진다 — G1·G2·G-09와 같은 해법.
        # ⚠️ bats에서도 계속 돈다(픽스처 @test와 같은 파일이라 뗄 수 없다). 중복 1.6초는 의도된 대가다.
        run: |
          bash scripts/check-doc-index.sh
          bash scripts/check-bats-accounting.sh
          bash scripts/check-bats-style.sh
          bash scripts/check-app-deploy.sh
          bash scripts/check-app-netpol.sh
          bash scripts/check-image-pins.sh
          bash scripts/check-locale-collation.sh
          bash scripts/check-gh-secret-coverage.sh
          bash scripts/check-host-ports.sh
          bash scripts/check-bats-fd0.sh
          bash scripts/check-sigpipe-writers.sh
          # ⚠️ 아래 셋은 이 처방(6c0194e)보다 **뒤에** 생겨 목록에 합류하지 못했다 — 실 트리 강제가
          #    각자 bats 한 줄뿐이라 그 @test가 지워지면 픽스처만 살아남는 상태였다(같은 결함의 형제).
          bash scripts/check-floor-vocab.sh
          bash scripts/check-scan-producers.sh
          bash scripts/check-skip-signalling.sh
          bun tools/check-resource-limits.ts
          bun tools/check-alert-rules.ts
          bun tools/check-disk-caps.ts
      - name: ArgoCD 자기레포 리비전 핀 정합 (main 진입 시 main 고정)
        # 두 검사가 한 스크립트에 있고 **분리 실행**된다:
        #   (A) 정합 — 자기레포 참조 전건이 같은 값. 인자 없이 항상. 어느 브랜치에서든 green.
        #   (B) 고정 — 그 값이 EXPECT_REVISION. **main으로 들어갈 때만** 채운다.
        # (B)를 무조건 켜면 NUC 마이그레이션 브랜치의 gate가 영구 red가 되어 그 브랜치에서 G4(ArgoCD
        # 수렴 증명)를 못 한다. 게다가 tests/gates/test_scan-floor.bats가 scripts/*.sh를 **무인자로**
        # 돌려 rc=0을 요구하므로, 기본 모드가 red면 scan-floor 게이트까지 같이 죽는다.
        # base_ref = PR의 대상 브랜치 · ref = push 대상. 둘 다 봐서 두 진입 경로를 덮는다.
        env:
          EXPECT_REVISION: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'main' || '' }}
        run: bash scripts/check-argocd-revision.sh
      - name: CNPG 아카이브 serverName 분리 (main 진입 시 값 고정)
        # (A) 쓰기 serverName ≠ 복구 원본 serverName — 인자 없이 항상. 두 브랜치 형태 모두 green.
        # (B) 그 값이 EXPECT_PG_SERVERNAME. **main으로 들어갈 때만** 채운다.
        # ✅ **컷오버 완료 (2026-08-17)** — 기대값을 `pg` → `pg-nuc`로 바꿨다. 이 PR이 리비전 핀
        #     15곳을 main으로 넘기는 바로 그 PR이고, 계약대로 **같은 PR**에서 함께 바뀐다.
        #     되돌림 금지: 라이브 NUC의 쓰기 serverName이 `pg-nuc`이므로 `pg`로 되돌리면 (B)가 red다.
        #     (컷오버 이전의 근거: 라이브 Mac이 살아 있는 동안 `pg-nuc`가 main에 들어가면 Mac의
        #      ArgoCD가 selfHeal로 아카이브를 갈아탄다 — 그 위험은 Mac k3s 파괴로 소멸했다.)
        env:
          EXPECT_PG_SERVERNAME: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && 'pg-nuc' || '' }}
        run: bash scripts/check-pg-servername.sh
      - name: make ci ↔ gate 패리티 회계 (이 job의 모든 스텝이 로컬에서 어떻게 도는지)
        # 스텝 목록을 이 파일에서 **파생**해 원장(policy/ci-parity.json)과 대조한다 — 스텝을 추가하는
        # 사람은 "이건 로컬에서 어떻게 도는가"를 반드시 답해야 한다. 하드코딩 토큰 대조였을 땐 19스텝 중
        # 8건이 make ci에 없는데도 전 검사가 초록이었다(대조하던 5개가 하필 전부 미러된 것들이었다).
        run: bun tools/check-ci-parity.ts
      - name: shell script lint (전 추적 .sh)
        # 전 추적 *.sh를 shellcheck — scripts/(DR/파괴적)뿐 아니라 notify.sh(알림 경로)·
        # restore-drill-script.sh·infra/k3s-bootstrap·e2e까지. 벤더 charts/는 untracked라 git ls-files에 안 잡힘.
        run: git ls-files '*.sh' | xargs shellcheck
      - name: actionlint — 워크플로 정적 검사(run 셸인젝션·표현식·문법)
        # required gate 잡 안 스텝(별도 잡이면 비-required라 무성 회귀). setup-toolchain이 설치.
        # .github/actionlint.yaml로 queue:max(2026-05 GA) schema-lag 오탐만 좁게 무시(직렬화 계약 유지).
        run: actionlint
      - name: telegram 메시지 렌더 e2e (containerized — 버전은 배포 매니페스트에서 파생)
        # ⚠️ 스텝 이름에 **버전을 적지 않는다** — 예전엔 "AM v0.27"이라 적혀 있었는데 배포는 이미
        #    v0.33.0이었다(아무도 대조하지 않는 손 관리 수치는 반드시 드리프트한다). 하네스가
        #    platform/victoria-stack/prod/alertmanager.yaml에서 태그를 파생하므로 여기 적을 값이 없다.
        # amtool/grep이 못 잡는 inline message Go-template의 실제 컴파일·렌더를 사전 증명한다
        # (한국어 제목·글리프·자동 escape·링크). required gate 잡 스텝 → branch protection이 강제.
        # docker/python3는 ubuntu 러너 기본 제공, yq는 위 install 스텝에서 설치됨.
        run: bash tests/gates/alertmanager-render-e2e.sh
      - name: vector config validate (containerized — render 미차단 vector 의미오류)
        # alertmanager-render-e2e 선례 — kustomize render는 vector config 의미오류를 못 잡는다. docker는 러너 기본.
        run: bash tests/gates/vector-validate.sh
      - name: vmalert rule validate (containerized — render/grep 미차단 룰 expr 오류)
        # grep만으론 오류 PromQL/MetricsQL이 통과(test_vmalert-config는 존재 grep) → vmalert -dryRun으로 파싱 검증.
        run: bash tests/gates/vmalert-rules-validate.sh
      - name: image pin liveness — 핀한 digest가 레지스트리에 아직 있는가
        # 2026-08-18: quay.io/skopeo/stable의 핀 digest가 **사라졌다**(태그 200, digest 404 — 상류가
        # 릴리스 태그를 재푸시해 옛 매니페스트가 GC). 모든 PR이 red였는데 신호가 skopeo **타임아웃
        # 스모크**의 HARNESS FAULT라 원인 역추적이 필요했다. 여기서 전 핀을 이름으로 짚고 재핀 후보
        # digest까지 알려 준다. digest-exporter/ImageDigestDrift는 이 축을 못 본다 —
        # 그쪽은 "우리 빌드가 파드에 반영됐나"(R6)이고 대상도 ghcr.io/ukyi-app/* 자체 앱뿐이다.
        run: bash tests/gates/image-pin-liveness.sh
      # ── vmalert 발화 e2e (전량 **병렬**) ────────────────────────────────────────────────────────
      # "룰이 파싱된다"가 아니라 "실제로 발화한다"를 증명한다 — `-dryRun`이 통과시킨 죽은 알림이 이
      # 레포에 두 번 있었다(push 주기 > 룩백 → 시리즈 구멍 → `for:` 매 주기 리셋 → 영구 무발화).
      #
      # ⚠️ **병렬이 안전한 전제**: 하네스는 서로 완전히 독립이다 — 각자 자기 docker 네트워크·컨테이너를
      # `$$` 접미로 만든다. 시간의 대부분이 CPU가 아니라 replay **대기**라 벽시계가 총합이 아니라
      # **최댓값**으로 수렴한다(실측 시점 gate 1048초 중 이 스위트가 805초였다).
      #
      # ⚠️ 목록은 **리터럴 경로로 적는다**(글롭 파생이 아니라). `tools/check-guard-authority.ts`가 모든
      # `tests/gates/*.sh`에 권위 실행 경로 ≥1을 요구하므로 하네스를 추가하고 여기 안 적으면 즉시 red다
      # (실측: 글롭 변수로 바꿨더니 네 하네스 전부 "권위 0"으로 잡혔다). 이건 **대조되는** 목록이라
      # 리터럴이어야 대조가 성립한다 — 하드코딩 소비처 목록과 정반대의 자리다.
      #
      # ⚠️ **rc는 PID별로 걷는다.** `a & b & wait`는 마지막 잡의 상태만 돌려줘 앞 하네스의 실패를
      # 조용히 삼킨다(이 레포가 프로세스 치환에서 이미 겪은 vacuous green 클래스).
      - name: 무거운 스위트 동시 실행 (bats CPU-bound ∥ 발화 e2e 대기-bound)
        # ⚠️ 한 스텝에 합친 이유: GHA 스텝은 각자 별도 셸이라 **스텝 간 background job을 wait할 수 없다**.
        #    동시 실행하려면 한 스텝 안이어야 한다.
        run: |
          # 이미지는 먼저 한 번만 당긴다(넷이 동시에 같은 이미지를 당기는 변동 제거).
          # 버전은 **매니페스트에서 파생** — 하드코딩하면 배포와 갈린다.
          vm="$(grep -oE 'victoriametrics/victoria-metrics:v[0-9.]+' platform/victoria-stack/prod/vmsingle.yaml | head -1)"
          va="$(grep -oE 'victoriametrics/vmalert:v[0-9.]+' platform/victoria-stack/prod/vmalert.yaml | head -1)"
          [ -n "$vm" ] && [ -n "$va" ] || { echo "::error::e2e 이미지 버전 파생 실패(vmsingle/vmalert 매니페스트)"; exit 1; }
          docker pull -q "$vm" >/dev/null
          docker pull -q "$va" >/dev/null

          # ⚠️ 첫 경로를 대입문과 **같은 줄에 두지 않는다** — check-guard-authority는 `NAME=…` 줄을
          #    할당으로 보고 건너뛰므로 그 하네스만 "권위 0"으로 잡힌다(실측: drift 하나만 빠졌다).
          harnesses="
          tests/gates/vmalert-drift-firing-e2e.sh
          tests/gates/vmalert-bulkssd-firing-e2e.sh
          tests/gates/vmalert-digest-stale-firing-e2e.sh
          tests/gates/vmalert-gha-liveness-firing-e2e.sh
          tests/gates/vmalert-adguard-rewrite-firing-e2e.sh
          tests/gates/vmalert-jobfailed-firing-e2e.sh
          tests/gates/vmalert-meta-firing-e2e.sh
          tests/gates/vmalert-memory-nearlimit-firing-e2e.sh
          "
          harnesses="$(printf '%s\n' "$harnesses" | tr -d ' ' | grep -v '^$' || true)"
          # 추적 글롭과 **교차 대조** — 목록에 없는 하네스가 생기면 여기서 먼저 드러난다(가드보다 이른 신호).
          want="$(git ls-files 'tests/gates/vmalert-*-firing-e2e.sh' | LC_ALL=C sort)"
          got="$(printf '%s\n' "$harnesses" | LC_ALL=C sort)"
          [ "$want" = "$got" ] || { echo "::error::발화 e2e 목록이 레포와 불일치"; diff <(echo "$want") <(echo "$got") || true; exit 1; }
          n="$(printf '%s\n' "$harnesses" | grep -c . || true)"
          [ "${n:-0}" -ge 3 ] || { echo "::error::발화 e2e 하네스 ${n:-0}건 < 3 — 열거 붕괴(무측정 초록)"; exit 1; }
          echo "발화 e2e ${n}건 병렬 실행"

          pids=""
          # bats 스위트를 **같이** 띄운다. 수집은 scripts/run-bats.sh 단일 SSOT 그대로다(make ci와 동일 호출).
          # 왜 같이 도는가: bats는 CPU-bound(~165s), 발화 e2e는 거의 전부 replay **대기**(~195s)라 자원이
          # 겹치지 않는다 → 합계(~360s)가 아니라 최댓값(~195s)으로 수렴한다.
          ./scripts/run-bats.sh > /tmp/gate-bats.log 2>&1 &
          pids="$pids $!:bats(run-bats.sh)"
          for h in $harnesses; do
            bash "$h" > "/tmp/$(basename "$h").log" 2>&1 &
            pids="$pids $!:$h"
          done
          fail=0
          for p in $pids; do
            pid="${p%%:*}"; h="${p#*:}"
            if wait "$pid"; then echo "PASS $h"; else echo "::error::FAIL $h"; fail=1; fi
          done
          # 로그는 스위트별로 접어서 낸다(병렬 인터리브 방지 — 진단 가능성이 곧 이 게이트의 값이다).
          echo "::group::bats (run-bats.sh)"
          cat /tmp/gate-bats.log
          echo "::endgroup::"
          for h in $harnesses; do
            echo "::group::$(basename "$h")"
            cat "/tmp/$(basename "$h").log"
            echo "::endgroup::"
          done
          exit "$fail"
      - name: skopeo 실물 타임아웃 스모크 (핀된 이미지 + 제어된 블랙홀)
        # digest-exporter의 인-데드라인 예산 전체가 "skopeo가 실제로 t에 끊긴다"는 전제 위에 서 있다.
        # PATH stub으로는 그 전제를 증명할 수 없어(stub이 skopeo를 대체하니 stub 자신을 테스트할 뿐)
        # 핀된 이미지 + 응답 없는 TCP sink로 직접 잰다.
        run: bash tests/gates/skopeo-timeout-smoke.sh
      # app-shared `.mts`가 node strip-types(앱 레포 secret:seal 경로)에서도 도는지를 required gate가 보장한다
      # — 별도 잡이면 비-required라 무성 회귀다. node는 setup-bun ban의 유일한 의식적 예외.
      # CI는 node 24로 돌지만 **계약 하한은 node 22.18**이다(앱 레포가 그걸 쓴다).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 — node strip-types 실행용
        # package-manager-cache:false — strip-types 스모크 전용이라 deps 캐시가 불필요하고, bun은
        # setup-node 캐시 미지원이라 lockfile 부재로 깨질 수 있다(의도를 명시해 못박는다).
        with: { node-version: "24.14.0", package-manager-cache: false }
      - name: app-shared .mts strip-types 스모크 (node 계약 하한)
        run: tests/gates/app-shared-node-smoke.sh
