# 주기적 terraform reconcile — 취소·실패한 apply의 자가 수렴 (권위 안전망).
# push-triggered apply(iac.yaml)가 어떤 이유로든 누락돼도(취소/일시 장애) apps.json↔실제
# DNS/tunnel 드리프트를 다음 주기에 수렴시킨다. queue:max에 의존하지 않는 최후 보루.
name: "🔁 tf-reconcile"
run-name: "🔁 tf-reconcile — ${{ github.event_name == 'schedule' && '스케줄' || format('수동({0})', github.actor) }}"
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: homelab-mutation
  cancel-in-progress: false
  queue: max

jobs:
  # Phase 0(TF/R2 secrets 등록) 전에 머지되면 스케줄이 매 30분 실패+Telegram 스팸 →
  # 시크릿 부재 시 reconcile을 skip해 run을 깨끗한 성공으로 만든다.
  preflight:
    runs-on: ubuntu-24.04-arm
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - id: check
        env:
          CF: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
          R2: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$CF" ] && [ -n "$R2" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Phase 0 미완(TF_CLOUDFLARE_TOKEN/R2_* 미설정) — tf-reconcile skip"
          fi

  reconcile:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ secrets.TF_DOMAIN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with: { ref: main } # 항상 main 최신 — 머지된 선언 상태가 권위
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform init (R2 backend)
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: cloudflare
      - name: drift 감지 (plan -out=tf.plan)
        id: drift
        run: |
          set +e
          terraform -chdir=infra/cloudflare plan -input=false -lock-timeout=120s \
            -detailed-exitcode -out=tf.plan
          rc=$?
          set -e
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT"; echo "드리프트 없음 — no-op" ;;
            2) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      # drift-2: delete/replace는 무인 apply 금지하되 reconcile 잡은 죽이지 않는다(alert-and-skip) —
      # 합법 teardown(push-apply 취소)이 30분마다 잡을 영구 red로 만드는 것을 막는다. ⚠️ F3: 원자적이라 delete
      # 포함 시 비-delete도 함께 대기. ⚠️ codex pass5 F1: outcome이 아니라 가드의 **typed output**으로 분기 —
      # result=='ok'만 apply, 'blocked-delete'면 alert-and-skip, 'error'(가드 자체 깨짐)면 잡을 loud 실패.
      - name: destroy 가드 (block, alert-and-skip)
        id: guard
        if: steps.drift.outputs.drift == 'true'
        continue-on-error: true
        uses: ./.github/actions/tf-destroy-guard
        with:
          mode: block
          root: infra/cloudflare
          plan: tf.plan
          # allow: app 공개 DNS(app[*]) delete는 자동 apply(차단 제외) — teardown 머지/취소 후 다음 주기에
          # 자동 회수. apex/www(public[*])는 비대상. allow_max=1: 대량 삭제는 자동 허용 취소→차단.
          allow: '^cloudflare_dns_record\.app\['
          allow_max: '1'
      # codex pass5 F1: 가드 내부 오류(plan 손상·jq 부재 등)는 delete 차단과 다르다 — 조용히 skip하지 말고 잡 실패.
      - name: 가드 내부 오류면 잡 실패 (delete 차단과 구분)
        if: steps.drift.outputs.drift == 'true' && steps.guard.outputs.result == 'error'
        run: |
          echo "::error::tf-destroy-guard 내부 오류(result=error) — 가드 신뢰 불가, reconcile 잡 실패시켜 가시화"
          exit 1
      - name: apply (드리프트 + 가드 result=ok일 때만)
        if: steps.drift.outputs.drift == 'true' && steps.guard.outputs.result == 'ok'
        run: terraform -chdir=infra/cloudflare apply -input=false tf.plan
      - name: telegram notify (수렴/실패/delete-차단 시에만)
        if: failure() || steps.drift.outputs.drift == 'true'
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ steps.guard.outputs.result == 'blocked-delete' && 'drift' || (job.status == 'success' && steps.drift.outputs.drift == 'true' && 'drift' || job.status) }}
          source: IaC수렴
          title: IaC 수렴
          ident: "drift=${{ steps.drift.outputs.drift }} guard=${{ steps.guard.outputs.result }} (blocked-delete면 owner 로컬 apply)"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # ── github/tailscale 루트: plan-only 드리프트 가시성 (무인 apply 절대 금지) ──────────────────
  # 이 두 루트는 "신뢰 앵커/고-blast-radius"다: github 루트는 CI가 소비하는 Actions 시크릿(secrets.tf)과
  # branch protection(repo.tf, contexts=["gate"])을 관리하고, tailscale 루트는 ACL/auth-key를 관리한다.
  # CI에서 무인 apply하면 광범위 PAT/OAuth를 CI에 저장해야 해 보안 모델(App 토큰 최소권한·branch protection
  # 우회 불가)을 위반한다. 그래서 cloudflare(좁은 DNS/tunnel 스코프)만 apply하고, 이 둘은 plan만 돌려
  # 드리프트를 알리며 수렴은 owner 로컬 apply로 한다. read 토큰이 시크릿에 없으면 preflight가 skip(Phase-0 토글).
  drift-github:
    runs-on: ubuntu-24.04-arm
    # 스텝-레벨 게이트라 시크릿이 없으면 **스텝만** 전부 skip되고 job은 그대로 success로 끝난다 —
    # run conclusion만 보는 관측자에겐 "돌았다"와 구별이 안 된다(2026-07-27 라이브 실측: 이 job은
    # TF_GITHUB_TOKEN 미등록으로 한 번도 실행된 적이 없는데 매 30분 초록이었다).
    # 이 승격이 회계 job(accounting)이 볼 수 있는 **유일한** 신호다 — plan 스텝이 실제로 진입했을 때만 true.
    outputs:
      executed: ${{ steps.drift.outputs.executed }}
    steps:
      # needs: preflight 금지 — preflight의 actor 가드 스텝은 if: workflow_dispatch 조건부라
      # schedule 경로에서 preflight가 skip되면 의존 잡도 통째로 skip된다. 가드 스텝을 잡별로 복제한다.
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - id: pf
        env:
          TOK: ${{ secrets.TF_GITHUB_TOKEN }}
          R2: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$TOK" ] && [ -n "$R2" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TF_GITHUB_TOKEN/R2_* 미설정 — github 루트 드리프트 체크 skip"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.pf.outputs.configured == 'true'
        with: { ref: main }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: steps.pf.outputs.configured == 'true'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform init (R2 backend, github)
        if: steps.pf.outputs.configured == 'true'
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: github
      - name: plan (드리프트 감지 — apply 안 함)
        id: drift
        if: steps.pf.outputs.configured == 'true'
        env:
          TF_VAR_github_owner: ${{ secrets.TF_GITHUB_OWNER }}
          TF_VAR_github_token: ${{ secrets.TF_GITHUB_TOKEN }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 준비상태 회계 신호 — 첫 줄에 둔다. 뒤로 미루면 plan이 죽었을 때 "안 돌았다"로 오귀속된다
          # (실패는 이미 job을 빨갛게 만들어 loud하다 — 회계가 잡는 것은 *조용한* 미실행뿐이다).
          echo "executed=true" >> "$GITHUB_OUTPUT"
          # ⚠️ **`-target`이 계약이다 — 전체 plan은 읽기 전용 자격으로 원리적으로 불가능하다.**
          #    GitHub은 repo의 merge 설정(allow_squash_merge·allow_auto_merge·delete_branch_on_merge…)을
          #    **Administration:write 토큰에게만** 응답에 싣는다. 읽기 전용 PAT에는 그 필드가 **null로
          #    빠지고**, provider가 부재를 `false`로 읽어 `false -> true` **영구 허위 드리프트**를 만든다
          #    (2026-08-19 실측: 같은 시점에 owner R&W 토큰은 "No changes", 읽기 전용 PAT는 2 to change).
          #    403이 아니라 **조용한 오답**으로 나타나는 것이 이 함정의 전부다.
          #    ⇒ write를 주는 우회는 금지다. 이 워크플로가 지키는 것이 바로 그 신뢰 앵커(branch protection·
          #      ruleset)인데, 그걸 다시 쓸 수 있는 자격을 CI에 놓는 것이 된다.
          #    ⇒ 그래서 **읽히는 것만** 감시한다. github_repository 두 건은 감시 밖이고, 그 사실은
          #      policy/workflow-readiness.json이 계상한다(조용한 축소가 아니라 선언된 갭이다).
          # ⚠️ 이 목록은 `infra/github/*.tf`의 비-repository 리소스 **전건**이어야 한다. 리소스를 더하고
          #    여기 안 더하면 새 리소스가 조용히 무감시가 된다 — infra/github/test_ci_targets.bats가 막는다.
          set +e
          terraform -chdir=infra/github plan -input=false -lock-timeout=120s -detailed-exitcode -no-color \
            -target=github_branch_protection.main \
            -target=github_repository_ruleset.bump_poll_writer_only \
            -target=github_actions_secret.telegram_bot_token \
            -target=github_actions_secret.telegram_chat_id
          rc=$?
          set -e
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT"; echo "github 드리프트 없음" ;;
            2) echo "drift=true" >> "$GITHUB_OUTPUT"; echo "::warning::github 루트 드리프트 감지 — owner 로컬 apply 필요(CI 무인 apply 금지)" ;;
            *) exit "$rc" ;;
          esac
      - name: telegram notify (드리프트/실패 시에만)
        if: steps.pf.outputs.configured == 'true' && (failure() || steps.drift.outputs.drift == 'true')
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status == 'success' && steps.drift.outputs.drift == 'true' && 'drift' || job.status }}
          source: IaC드리프트
          title: github 루트 드리프트
          ident: "root=github drift=${{ steps.drift.outputs.drift }} (수렴은 owner 로컬 apply)"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  drift-tailscale:
    runs-on: ubuntu-24.04-arm
    # drift-github와 같은 이유의 승격(위 주석) — 이 job도 스텝-레벨 게이트다.
    outputs:
      executed: ${{ steps.drift.outputs.executed }}
    steps:
      # needs: preflight 금지 — preflight의 actor 가드 스텝은 if: workflow_dispatch 조건부라
      # schedule 경로에서 preflight가 skip되면 의존 잡도 통째로 skip된다. 가드 스텝을 잡별로 복제한다.
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - id: pf
        env:
          TOK: ${{ secrets.TF_TAILSCALE_OAUTH_ID }}
          R2: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$TOK" ] && [ -n "$R2" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TF_TAILSCALE_OAUTH_ID/R2_* 미설정 — tailscale 루트 드리프트 체크 skip"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.pf.outputs.configured == 'true'
        with: { ref: main }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: steps.pf.outputs.configured == 'true'
        with:
          # ⚠️ **형제 잡(1.9.8)과 일부러 다르다 — 맞추지 마라.** terraform은 state를 쓴 버전보다
          # 낮은 바이너리로는 그 state를 **읽지도 못한다**("state snapshot was created by Terraform
          # vX, which is newer than current vY"). plan-only여도 refresh가 state를 읽으므로 같다.
          # 이 핀은 **헤드룸**이다 — 세 루트의 state writer는 전부 ≤1.9.8이고(실측 2026-08-19:
          # 1.9.8 바이너리로 github 8건·tailscale 3건·cloudflare 26건 `state list`가 정상 열렸다),
          # 1.15.5는 어떤 writer보다도 높아 이 plan-only 감시가 writer 상승에 죽지 않는다.
          # ⚠️ 초판 주석의 "owner 머신은 이미 1.15.5다"는 **낡은 사실이다** — 그 머신(맥미니)은
          #    폐기됐고 owner 로컬 작업기는 NUC(terraform 1.9.8)로 옮겨갔다. 그 문장을 근거로
          #    다른 핀들을 '선제' 통일하면 cloudflare/github 등식이 깨진다.
          # 핀은 **루트마다 독립**이다(state writer가 다르므로 통일이 오히려 고장이다):
          #   · cloudflare — CI(iac.yaml:76 plan·:179 apply · 이 파일 :73 apply)와 owner 로컬
          #     apply(blocked-delete 복구 경로)가 번갈아 쓴다 ⇒ 그 핀들 = owner 바이너리 **등식**.
          #   · github — owner 로컬 apply 전용이고 CI(이 파일 :189)는 plan-only ⇒ CI 핀 ≥ writer.
          #   · iac.yaml:27(validate all roots)은 `init -backend=false`라 state를 안 만져 등식 밖이다.
          #   ✅ 그 등식은 이제 기계가 진다 — infra/cloudflare/versions.tf·infra/github/versions.tf의
          #     `required_version = "= 1.9.8"`이 한 변만 올라가도 init에서 fail-closed로 죽인다.
          #     이 루트(tailscale)만 `>= 1.9.0`이라 1.15.5로 돌 수 있다.
          # 🔁 **재발 지점**: owner 머신 terraform이 1.15.5를 넘어서면 이 핀이 다시 낡는다. 로컬
          #    apply 후 이 값을 함께 올릴 것(Renovate 비대상 — customManager 없고 github-actions
          #    manager도 비활성이라 자동 갱신 경로가 아예 없다).
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - name: terraform init (R2 backend, tailscale)
        if: steps.pf.outputs.configured == 'true'
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: tailscale
      - name: plan (드리프트 감지 — apply 안 함)
        id: drift
        if: steps.pf.outputs.configured == 'true'
        env:
          TF_VAR_ts_bootstrap_oauth_id: ${{ secrets.TF_TAILSCALE_OAUTH_ID }}
          TF_VAR_ts_bootstrap_oauth_secret: ${{ secrets.TF_TAILSCALE_OAUTH_SECRET }}
          TF_VAR_dns_nameserver_tailscale_ip: ${{ secrets.TF_TAILSCALE_DNS_NAMESERVER_IP }}
          # CI 전용 읽기 전용 스코프 — **이 줄이 없으면 이 job은 원리적으로 못 돈다.** provider는
          # var.ts_oauth_scopes를 그대로 토큰 교환에 요청하는데, 기본값은 owner 로컬 apply용 write
          # 집합이다(infra/tailscale/variables.tf). 읽기 전용 OAuth 클라이언트로 write 스코프를
          # 요청하면 교환 자체가 403("cannot grant scopes …")이라 plan이 죽는다 — skip이 아니라 red다.
          # 값은 2026-08-19 실측으로 확정한 최소 집합이고 셋 다 load-bearing이다(근거·제거 시 증상은
          # variables.tf의 ts_oauth_scopes 주석). 특히 oauth_keys:read를 빼면 에러가 아니라 **허위
          # 드리프트**가 난다(tailscale_oauth_client.k8s_operator를 삭제된 것으로 읽어 `1 to add`).
          # devices:core/auth_keys는 plan에 불필요하다 — 넣지 마라(권한 과잉).
          TF_VAR_ts_oauth_scopes: '["policy_file:read","dns:read","oauth_keys:read"]'
        run: |
          # 준비상태 회계 신호(drift-github와 동일 규약 — 그 주석 참고).
          echo "executed=true" >> "$GITHUB_OUTPUT"
          set +e
          terraform -chdir=infra/tailscale plan -input=false -lock-timeout=120s -detailed-exitcode -no-color
          rc=$?
          set -e
          case "$rc" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT"; echo "tailscale 드리프트 없음" ;;
            2) echo "drift=true" >> "$GITHUB_OUTPUT"; echo "::warning::tailscale 루트 드리프트 감지 — owner 로컬 apply 필요(CI 무인 apply 금지)" ;;
            *) exit "$rc" ;;
          esac
      - name: telegram notify (드리프트/실패 시에만)
        if: steps.pf.outputs.configured == 'true' && (failure() || steps.drift.outputs.drift == 'true')
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status == 'success' && steps.drift.outputs.drift == 'true' && 'drift' || job.status }}
          source: IaC드리프트
          title: tailscale 루트 드리프트
          ident: "root=tailscale drift=${{ steps.drift.outputs.drift }} (수렴은 owner 로컬 apply)"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}

  # ── 준비상태 회계 — 게이트 **밖**의 감시자 (G-09) ───────────────────────────────────────────
  # 위 job들이 자격 부재로 skip되면 run은 **초록**이고, 그 job 안의 알림은 `if: always()`여도 함께
  # skip된다(skip된 job은 스텝을 0개 실행한다) → owner 신호 0. 게이트 밖에서만 관측할 수 있다.
  # ⚠️ `if: !cancelled()` 필수 — 기본 success()가 걸리면 감시자가 감시 대상과 같은 운명에 묶인다.
  # 판정 기준은 policy/workflow-readiness.json(원장) — 원장↔워크플로 정합은 ci.yaml gate가 강제한다.
  accounting:
    needs: [preflight, reconcile, drift-github, drift-tailscale]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with: { ref: main } # 원장의 권위는 머지된 상태다(브랜치 로컬 수정이 회계를 무르게 하지 못한다)
      - uses: ./.github/actions/setup-bun
      - id: acct
        env:
          WORKFLOW_NEEDS: ${{ toJSON(needs) }} # 비신뢰 입력 아님(자기 job 출력) — 그래도 with: 보간 대신 env로
        run: bun tools/check-workflow-readiness.ts --workflow tf-reconcile.yaml
      # 선언된 갭(gaps)은 telegram에 넣지 않는다 — 매 30분 재발해 진짜 신호를 덮는다. 갭의 venue는
      # 로그 + job summary + 원장이고, 알림은 **선언되지 않은** 미실행(failures/warnings)에만 쓴다.
      - name: telegram notify (required 미실행 · 원장 불일치 시에만 — 선언된 갭은 제외)
        if: always() && (steps.acct.outcome == 'failure' || steps.acct.outputs.warnings != '0')
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ steps.acct.outcome == 'failure' && 'failure' || 'drift' }}
          source: 준비상태
          title: 워크플로 준비상태
          ident: "tf-reconcile — 원장 대비 미실행/불일치"
          body: ${{ steps.acct.outputs.body }}
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
