# active&&public host의 라이브 DNS resolve 체크 (drift-2 잔여, opt-in 스케줄). apply 실패로 active:true인데
# DNS가 안 생긴 경우를 잡는다. 라이브 DNS 호출은 이 워크플로 안에서만 — required gate는 클러스터리스 유지.
name: "🔁 dns-drift"
run-name: "🔁 dns-drift — ${{ github.event_name == 'schedule' && '스케줄' || format('수동({0})', github.actor) }}"
on:
  schedule:
    - cron: "23 */6 * * *"   # 6시간마다(DNS는 자주 안 변함)
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: dns-drift
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 — 로컬 telegram-notify 액션 resolve + 체커 실행(F8 가드 충족)
      - uses: ./.github/actions/setup-bun
        with: { install: 'false' }     # dns 체크는 deps 불요
      # ⚠️ "대상 0건이면 skip" 게이트를 두지 않는다 — 예약 platform host는 구조적으로 항상 ≥1이라
      #    0은 "대상 없음"이 아니라 **열거 붕괴**다(그 형태는 파싱 실패를 0으로 흡수해 fail-open이었다).
      #    검사기가 `--floor reserved=<n>`(기본 1) 바닥값으로 exit 1을 낸다. 준비상태 클래스가 아니라
      #    열거 붕괴 클래스라 처방이 accounting job이 아니다. cf. docs/traps.md 「열거 붕괴」
      - id: check
        run: |
          bun tools/dns-drift-check.ts --apps infra/cloudflare/apps.json > /tmp/drift.json
          # ⚠️ codex pass4 F3: drift 알림은 .drift(NXDOMAIN)만 센다 — transient(SERVFAIL/timeout)는 거짓 알림 방지.
          n=$(bun -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/drift.json","utf8"));process.stdout.write(String(o.drift.length))')
          t=$(bun -e 'const o=JSON.parse(require("fs").readFileSync("/tmp/drift.json","utf8"));process.stdout.write(String(o.transient.length))')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "transient=$t" >> "$GITHUB_OUTPUT"
          [ "$t" -gt 0 ] && echo "::warning::DNS resolve 일시 실패 ${t}건(transient — drift 아님, 재확인)"
          cat /tmp/drift.json
      - name: telegram notify (드리프트/실패 시에만)
        if: failure() || steps.check.outputs.count != '0'
        uses: ./.github/actions/telegram-notify
        with:
          # check 스텝 크래시·**상류 스텝 실패로 skip** 시 count가 미설정('')이라 count!='0'이 참→'drift'로
          # 오라벨된다. contract-drift.yaml·audit.yaml과 같은 긍정 가드(== 'success')를 앞에 둬
          # success가 아닌 모든 결과를 'failure'로 접는다(`== 'failure'`만 보면 skipped가 새어 나간다).
          status: ${{ steps.check.outcome == 'success' && (steps.check.outputs.count != '0' && 'drift' || 'success') || 'failure' }}
          source: IaC드리프트
          title: DNS 드리프트
          ident: "active&&public host 미해결 ${{ steps.check.outputs.count }}건"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
