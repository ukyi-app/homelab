name: "📦 build"
run-name: "📦 build — ${{ github.event_name == 'workflow_dispatch' && format('수동({0})', github.actor) || 'push' }}"
on:
  push:
    branches: [main]
    paths:
      - "ops/**" # 플랫폼 ops 이미지 소스(pg-tools 등). 배포-전용 apps/는 빌드 대상 아님(외부 레포에서 빌드)
      - ".github/workflows/build.yaml"
  # 신규 기본 브랜치 생성 push는 paths diff가 없어 트리거가 스킵된다(첫 라이브 push에서 확인)
  # — 초기 시드/재빌드용 수동 트리거.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # 네이티브 arm64 runner 유지 — arm64 leg는 에뮬레이션 없이 돈다. amd64 leg만 QEMU를 탄다
    # (NUC 이전, 2026-08). pg-tools는 apt + curl뿐이라 컴파일이 없어 에뮬레이션 비용이 감당 가능하다.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # 사용자 앱은 외부 레포(ukyi-app/<app>)에서 빌드된다. homelab은 플랫폼 ops 이미지만 빌드.
        app: [pg-tools]
    outputs:
      sha: ${{ github.sha }}
    steps:
      - name: actor 가드 (workflow_dispatch 한정 — 스케줄/기타 트리거 무영향)
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 디스패치 자격(actions:write)은 워크플로 단위 스코프가 불가 — 허용목록(bump-poll) 외 전 진입점 가드(P2-1).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::workflow_dispatch는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # 변경 감지가 git diff $BEFORE..$SHA를 쓴다 — 기본 depth=1이면 BEFORE 커밋이 없어
          # diff가 항상 실패(빌드 스킵)한다.
          fetch-depth: 0
      # ⚠️ setup-buildx **앞**에 와야 한다 — buildx 빌더는 생성 시점에 등록된 binfmt 핸들러만 본다.
      #   순서가 뒤집히면 amd64 leg가 "exec format error"로 죽는다. tests/gates/test_ci-build.bats가 순서를 고정.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: detect changed app
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          APP: ${{ matrix.app }}
        run: |
          # workflow_dispatch(수동 시드)와 신규 브랜치 push(BEFORE가 비었거나 0…0)는 diff가 불가능
          # → 전체 빌드. 첫 라이브에서 둘 다 build=false로 빠져 이미지 0개가 됐던 버그.
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          # ops/ 소스(Dockerfile 등) **또는 이 워크플로 자신**의 변경을 "changed"로 간주한다.
          # ⚠️ 이 워크플로가 빠져 있었다. on.push.paths는 build.yaml 변경을 트리거로 삼는데
          #   감지는 ops/만 봐서, 워크플로만 바뀐 push는 **트리거되고 빌드는 skip**된 채 잡이
          #   success로 끝났다. 2026-08 멀티아치 전환(#430)에서 실측: 머지 후 run은 초록인데
          #   `build & push`가 skipped라 GHCR 이미지는 그대로 단일 아키텍처 bare manifest였다.
          #   워크플로는 빌드 스펙(platforms·provenance·setup-qemu)을 정의하므로 그 변경은
          #   이미지 내용 변경이다 — 트리거와 감지가 같은 집합을 봐야 침묵이 없다.
          #   (ops 이미지엔 deploy/가 없어 자기-루프 무관)
          elif git diff --name-only "$BEFORE" "$SHA" \
               | grep -qE "^ops/${APP}/|^\.github/workflows/build\.yaml$"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - name: compute extra tag (pg-tools carries the canonical 18-rclone tag M4 references)
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
          SHA: ${{ github.sha }}
        run: |
          TAGS="ghcr.io/${OWNER}/${APP}:sha-${SHA}"
          if [ "${APP}" = "pg-tools" ]; then
            TAGS="${TAGS},ghcr.io/${OWNER}/pg-tools:18-rclone"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: build & push
        if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ops/${{ matrix.app }}
          # 멀티아치(NUC 이전). ⚠️ ops/pg-tools/Dockerfile:7의 `ARG TARGETARCH`에 **기본값이 없어야**
          #   한다 — stage-level 기본값은 BuildKit predefined platform arg를 이겨서 OCI config만
          #   amd64이고 kubectl/rclone은 arm64인 이미지를 조용히 만든다(#424에서 실측·제거).
          platforms: linux/amd64,linux/arm64
          push: true
          # ⚠️ 2플랫폼이 된 지금 이 값이 **더** 중요하다. attestation이 켜지면 index에
          #   unknown/unknown child 2개가 붙고 그 매니페스트가 run마다 달라져 index digest가
          #   비결정적이 된다(실측: provenance=false 2회 동일 468db06f… / 기본값 2회 상이).
          #   그러면 tools/poll-ghcr.ts computeBump의 "동일 digest — 멱등 no-op"이 영영 안 걸려
          #   내용 무변경 커밋마다 PR→머지→rollout이 헛돈다.
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # 실제로 빌드된 앱만 기록해 write-back(bump.yaml)이 그 앱들만 bump하게 한다 —
      # 변경 없는 앱을 push된 적 없는 :sha 태그로 가리키는 일이 없도록 (→ ImagePullBackOff).
      - name: record built app
        if: steps.changed.outputs.build == 'true'
        env:
          APP: ${{ matrix.app }}
        run: mkdir -p built && printf '%s' "${APP}" > "built/${APP}"
      - name: upload built-app marker
        if: steps.changed.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: built-${{ matrix.app }}
          path: built/${{ matrix.app }}
          retention-days: 1
      # 빌드 결과를 owner에게 가시화 — push 실패가 Actions UI에만 묻히지 않게(if: always()).
      - name: telegram notify
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: 배포
          title: 이미지 빌드
          ident: ${{ matrix.app }}@${{ github.sha }}
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
