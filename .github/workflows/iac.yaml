name: "🌍 iac"
on:
  pull_request:
    paths:
      - "infra/**"
      - "platform/argocd/**"
      - "Makefile"
      - "scripts/**"
  # post-merge SHA 고정 apply: 머지된 커밋의 apps.json/dns/tunnel 상태를 그대로 적용한다.
  # 트랜잭션 안전: 라이브 Cloudflare는 commit 전에 절대 건드리지 않는다(커밋된 상태만 apply).
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"

permissions:
  contents: read

jobs:
  iac-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
      # ⚠️ apt로 bats를 깔지 않는다 — arm64는 ports.ubuntu.com 미러가 SPOF고 2026-07 실장애를 냈다.
      #    setup-toolchain은 불변 커밋 SHA로 clone+대조한다(그 근거는 composite 주석이 SSOT).
      - uses: ./.github/actions/setup-toolchain
        with:
          bats: 'true'
      - name: terraform init (no backend) + validate all roots
        run: |
          for r in cloudflare tailscale github; do
            # -lockfile=readonly: 커밋된 멀티플랫폼 lock과 어긋나면(provider 추가/버전 변경) 실패 → 드리프트 게이트화.
            terraform -chdir=infra/$r init -backend=false -lockfile=readonly
          done
          make tf-validate
      - name: terraform 의존 bats 가드 (fmt/validate·prevent_destroy·apps.json SSOT)
        # gate(terraform 미설치)에 못 넣는 terraform-결합 테스트만 여기서 advisory로 실행한다.
        # argocd_values·root_app은 platform/argocd로 이동 → required gate 러너가 수집·실행(이중실행 방지로 제외).
        # test_tf_reconcile.bats도 같은 이유로 여기서 빠졌다 — terraform 비의존(전 @test가 워크플로 grep)이라
        # required gate가 수집한다. 여기 남기면 이중 실행이고, 게다가 위 paths 필터가 `.github/**`를 안 봐서
        # tf-reconcile.yaml만 바꾸는 PR에서는 이 advisory 자체가 뜨지 않았다(= 유일 실행처가 아니었다).
        run: |
          bats infra/_tests/test_tf_validate.bats </dev/null # tf fmt/validate + R2 prevent_destroy 가드(이전엔 미게이트)
          bats infra/cloudflare/test_apps_data.bats </dev/null # apps.json DNS/tunnel SSOT(active/public·ingress 순서·host 유일성) — terraform validate 의존이라 gate 불가

  # ── PR: cloudflare 루트 plan 미리보기 — 머지 전 add/change/destroy를 job summary에 게시(드리프트/변경 가시성) ──
  # 라이브 state(R2) 대비 실제 plan을 돌려 리뷰어가 머지 전에 적용 diff를 본다. 정보성(required check는 gate) —
  # plan은 entitlement 400(무료 플랜 rate-limit 등 apply-time 거부)까지는 못 잡지만 리소스 add/change/destroy는 보여준다.
  iac-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    # 스텝-레벨 게이트라 시크릿이 없으면 스텝만 skip되고 job은 success다 — 그 상태의 **빈 job summary**를
    # 리뷰어가 "변경 없음"으로 오독한다(정보 부재가 정보로 읽힌다). 준비상태 회계(accounting job)가
    # 볼 수 있는 유일한 신호가 이 승격이다.
    outputs:
      executed: ${{ steps.plan.outputs.executed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      # 시크릿 부재(Phase 0 미완/외부 기여) 시 skip — 깨끗한 성공(required 아님).
      - id: pf
        env:
          CF: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
          R2: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$CF" ] && [ -n "$R2" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TF/R2 시크릿 미설정 — cloudflare plan 미리보기 skip"
          fi
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: steps.pf.outputs.configured == 'true'
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform init (R2 backend, readonly)
        if: steps.pf.outputs.configured == 'true'
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: cloudflare
      - name: terraform plan → job summary
        id: plan
        if: steps.pf.outputs.configured == 'true'
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_zone_name: ${{ secrets.TF_DOMAIN }}
        run: |
          # 준비상태 회계 신호 — 첫 줄에 둔다(실패는 이미 loud하다; 회계는 *조용한* 미실행만 잡는다).
          echo "executed=true" >> "$GITHUB_OUTPUT"
          set +e
          terraform -chdir=infra/cloudflare plan -input=false -lock-timeout=120s -no-color \
            -detailed-exitcode -out=tf.plan > plan.txt 2>&1
          rc=$?
          set -e
          {
            echo "## Cloudflare plan 미리보기"
            case "$rc" in
              0) echo "✅ 변경 없음 (no-op)" ;;
              2) echo "ℹ️ 적용 대기 변경 있음 — 아래 plan 확인" ;;
              *) echo "⚠️ plan 실패(exit $rc)" ;;
            esac
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0(no-op)·2(변경 있음)는 정상, 그 외만 실패로 가시화(required 아님 → PR 차단 안 함).
          [ "$rc" = "0" ] || [ "$rc" = "2" ] || exit "$rc"
      # 인라인 destroy jq 경고를 tf-destroy-guard composite(warn)로 치환 — 산출된 tf.plan을 검사.
      # allow: app 공개 DNS(cloudflare_dns_record.app[*]) delete는 자동 apply 표면이라 경고 제외
      # (teardown은 정상 흐름) — apex/www·구조적 delete/replace만 경고. allow_max 초과 대량 삭제도 경고.
      # 실제 plan은 위 job summary에 게시된다.
      - name: destroy 사전 경고 (warn)
        if: steps.pf.outputs.configured == 'true'
        uses: ./.github/actions/tf-destroy-guard
        with:
          mode: warn
          root: infra/cloudflare
          plan: tf.plan
          allow: '^cloudflare_dns_record\.app\['
          allow_max: '1'

  # ── 준비상태 회계 — 게이트 **밖**의 감시자 (G-09) ───────────────────────────────────────────
  # iac-plan이 시크릿 부재로 스텝을 전부 skip하면 job은 success이고 summary만 비는데, 그 빈 summary가
  # "변경 없음"으로 읽힌다. 이 job이 needs.iac-plan.outputs.executed를 봐 그 침묵을 red로 바꾼다.
  # ⚠️ fork PR은 **구조적으로** 시크릿을 못 받는다 — 원장 면제가 아니라 트리거 경계라 여기서 제외한다
  #    (원장에 넣으면 same-repo PR의 진짜 미설정까지 함께 면제된다). 판정은 `head.repo.fork`가 아니라
  #    **head 레포 == 이 레포**로 한다: 시크릿 가용성을 정하는 것은 "PR이 같은 레포에서 왔는가"이고,
  #    `.fork`는 *이 레포 자신이 어딘가의 fork인지*를 함께 참으로 만들어 회계를 통째로 끌 수 있다.
  # ⚠️ `if: !cancelled()` 필수(tf-reconcile 회계 job 주석과 동일 이유).
  accounting:
    needs: [iac-plan]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/setup-bun
      - env:
          WORKFLOW_NEEDS: ${{ toJSON(needs) }}
        # telegram 없음 — PR 컨텍스트라 red 체크 자체가 사람이 보는 신호다(매 PR 알림은 소음이 된다).
        run: bun tools/check-workflow-readiness.ts --workflow iac.yaml

  # ── push-to-main: cloudflare 루트 plan→apply (R2 state) ─────────────────────────────
  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 이 워크플로에서 homelab-mutation을 쥐는 잡은 여기뿐이다(잡-레벨 concurrency).
    # 근거 전문은 bump-poll.yaml preflight 잡 주석. 실측(최근 100 run): iac p50 29s / max 121s.
    timeout-minutes: 20
    # 전역 변이 직렬화 그룹 공유 — tfstate race 차단. queue:max로 취소 누락 차단.
    # 그래도 취소/실패하면 tf-reconcile.yaml(주기)이 다음 주기에 수렴시킨다.
    concurrency:
      group: homelab-mutation
      cancel-in-progress: false
      queue: max
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ secrets.TF_DOMAIN }}
    steps:
      - name: replay 가드 (이벤트 구동 잡 — 재실행 개시자만 검사한다)
        env:
          ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 이 잡은 owner 디스패치 대상이 아니라 **이벤트 구동**이다 — 출처는 잡 `if:`와 branch
          # protection이 진다. 그래서 actor 축은 모양이 맞지 않고, 남는 축은 재실행뿐이다:
          # 재실행은 원래 이벤트를 **그대로 재생**하므로 출처 술어가 그대로 통과한다.
          # (actions:write는 재실행 동사를 포함하고, 그 자격은 앱 레포에 실재한다.)
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — replay 가드 fail-closed"; exit 1; }
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 — push 이벤트의 머지 SHA가 기본 체크아웃 — SHA 고정
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform init (R2 backend)
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: cloudflare
      - name: terraform plan (-out=tf.plan)
        run: terraform -chdir=infra/cloudflare plan -input=false -lock-timeout=120s -out=tf.plan
      # primary merge→apply 경로 destroy 가드 — apex/www(public[*])·tunnel/ruleset/zone 등 구조적
      # 리소스의 delete/replace는 무인 apply 차단. (prevent_destroy R2 버킷은 plan에서 이미 막힘.)
      # allow: app 공개 DNS(cloudflare_dns_record.app[*]) delete만 자동 apply 허용 — create-app의 DNS
      # 추가 자동 apply와 대칭으로 teardown-app 머지 시 DNS/tunnel ingress가 자동 회수된다.
      # allow_max=1: 대량 app DNS 삭제(apps.json 통째 비움)는 자동 허용 취소→차단(blast-radius 캡).
      - name: destroy 가드 (block)
        uses: ./.github/actions/tf-destroy-guard
        with:
          mode: block
          root: infra/cloudflare
          plan: tf.plan
          allow: '^cloudflare_dns_record\.app\['
          allow_max: '1'
      - name: terraform apply (plan 산출물만 적용)
        run: terraform -chdir=infra/cloudflare apply -input=false tf.plan
      - name: telegram notify
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: IaC
          title: Cloudflare 적용
          ident: ${{ github.sha }}
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
