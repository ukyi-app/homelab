name: "🌍 iac"
on:
  pull_request:
    paths:
      - "infra/**"
      - "platform/argocd/**"
      - "justfile"
      - "scripts/**"
  # post-merge SHA 고정 apply: 머지된 커밋의 apps.json/dns/tunnel 상태를 그대로 적용한다.
  # 트랜잭션 안전: 라이브 Cloudflare는 commit 전에 절대 건드리지 않는다(커밋된 상태만 apply).
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/**"

permissions:
  contents: read

jobs:
  iac-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 이 잡(iac-validate)은 그룹을 쥐지 **않는다**
    # (homelab-mutation은 아래 apply 잡의 잡-레벨 concurrency뿐이다). 그래서 근거가 다르다 —
    # 그룹 밖 천장의 전문은 ci.yaml gate 잡 주석, 그룹 쪽 전문은 bump-poll.yaml preflight 잡 주석.
    # 값 근거 — 2026-09-03 라이브 실측(최근 40 run 중 완료 37건, 잡 실행구간): iac-validate p50 15s / max 20s
    # (대부분이 terraform·툴체인 설치).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: "1.16.2"
      # ⚠️ apt로 bats를 깔지 않는다 — arm64는 ports.ubuntu.com 미러가 SPOF고 2026-07 실장애를 냈다.
      #    setup-toolchain은 불변 커밋 SHA로 clone+대조한다(그 근거는 composite 주석이 SSOT).
      - uses: ./.github/actions/setup-toolchain
        with:
          bats: 'true'
          just: 'true'
      - name: terraform init (no backend) + validate all roots
        run: |
          for r in cloudflare tailscale github; do
            # -lockfile=readonly: 커밋된 멀티플랫폼 lock과 어긋나면(provider 추가/버전 변경) 실패 → 드리프트 게이트화.
            terraform -chdir=infra/$r init -backend=false -lockfile=readonly
          done
          just tf-validate
      - name: CI 권한 HCL mock plan (운영 자격 없음)
        run: terraform -chdir=infra/github test -no-color
      - name: terraform 의존 bats 가드 (fmt/validate·prevent_destroy·apps.json SSOT)
        # gate(terraform 미설치)에 못 넣는 terraform-결합 테스트만 여기서 advisory로 실행한다.
        # argocd_values·root_app은 platform/argocd로 이동 → required gate 러너가 수집·실행(이중실행 방지로 제외).
        # test_tf_reconcile.bats도 같은 이유로 여기서 빠졌다 — terraform 비의존(전 @test가 워크플로 grep)이라
        # required gate가 수집한다. 여기 남기면 이중 실행이고, 게다가 위 paths 필터가 `.github/**`를 안 봐서
        # tf-reconcile.yaml만 바꾸는 PR에서는 이 advisory 자체가 뜨지 않았다(= 유일 실행처가 아니었다).
        run: |
          bats infra/_tests/test_tf_validate.bats </dev/null # tf fmt/validate + R2 prevent_destroy 가드(이전엔 미게이트)
          bats infra/cloudflare/test_apps_data.bats </dev/null # apps.json DNS/tunnel SSOT(active/public·ingress 순서·host 유일성) — terraform validate 의존이라 gate 불가

  # PR은 자격 없는 validate만 실행한다. 인증 plan은 reviewed-plan.yaml의 검토 SHA 수동 요청이다.

  # ── push-to-main: cloudflare 루트 plan→apply (R2 state) ─────────────────────────────
  apply:
    environment: homelab-main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 이 워크플로에서 homelab-mutation을 쥐는 잡은 여기뿐이다(잡-레벨 concurrency).
    # 근거 전문은 bump-poll.yaml preflight 잡 주석. 실측(최근 100 run): iac p50 29s / max 121s.
    timeout-minutes: 20
    # 전역 변이 직렬화 그룹 공유 — tfstate race 차단. queue:max로 취소 누락 차단.
    # 그래도 취소/실패하면 tf-reconcile.yaml(주기)이 다음 주기에 수렴시킨다.
    concurrency:
      group: homelab-mutation
      cancel-in-progress: false
      queue: max
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.TF_CLOUDFLARE_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.TF_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_name: ${{ secrets.TF_DOMAIN }}
    steps:
      - name: main 운영 자격 경계 (실제 job마다 검사)
        id: authority
        env:
          REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        shell: bash
        run: |
          # GitHub login은 대소문자를 구별하지 않는다. 모든 actor 가드가 같은 정규화를 쓴다.
          OWNER="${OWNER,,}"
          ACTOR="${ACTOR,,}"
          TRIGGERING="${TRIGGERING,,}"
          # Environment의 서버 branch 정책이 권위다. 이 검사는 trusted main의 대리 실행·부분 재실행도 닫는다.
          [ "$REF" = "refs/heads/main" ] && [ "$REPOSITORY_ID" = "1265054638" ] || { echo "::error::homelab main 실행만 허용"; exit 1; }
          [ -n "$OWNER" ] || { echo "::error::HOMELAB_OWNER 미설정"; exit 1; }
          case "$ATTEMPT" in ''|*[!0-9]*|0) echo "::error::run_attempt 불량"; exit 1;; esac
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행은 owner만 허용"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              [ "$ACTOR" = "$OWNER" ] || { echo "::error::dispatch actor 거부"; exit 1; }
              [ "$TRIGGERING" = "$ACTOR" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::dispatch 개시자 거부"; exit 1; } ;;
            push|schedule|workflow_run) ;;
            *) echo "::error::운영 이벤트 거부"; exit 1 ;;
          esac
      - name: replay 가드 (이벤트 구동 잡 — 재실행 개시자만 검사한다)
        env:
          ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # GitHub login은 대소문자를 구별하지 않는다. 모든 actor 가드가 같은 정규화를 쓴다.
          OWNER="${OWNER,,}"
          TRIGGERING="${TRIGGERING,,}"
          # 이 잡은 owner 디스패치 대상이 아니라 **이벤트 구동**이다 — 출처는 잡 `if:`와 branch
          # protection이 진다. 그래서 actor 축은 모양이 맞지 않고, 남는 축은 재실행뿐이다:
          # 재실행은 원래 이벤트를 **그대로 재생**하므로 출처 술어가 그대로 통과한다.
          # (actions:write는 재실행 동사를 포함하고, 그 자격은 앱 레포에 실재한다.)
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — replay 가드 fail-closed"; exit 1; }
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0 — push 이벤트의 머지 SHA가 기본 체크아웃 — SHA 고정
      # ★ 검사 코드 출처 — checkout 직후·terraform(local plan/apply) 앞에서 고정한다.
      - name: 검사 코드 출처 캡처 (checkout 직후 — HEAD 변이 앞)
        id: aiops_source
        uses: ./.github/actions/aiops-provenance
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # renovate: datasource=github-releases depName=hashicorp/terraform
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - name: terraform init (R2 backend)
        uses: ./.github/actions/tf-r2-init
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        with:
          root: cloudflare
      - name: terraform plan (-out=tf.plan)
        run: terraform -chdir=infra/cloudflare plan -input=false -lock-timeout=120s -out=tf.plan
      # primary merge→apply 경로 destroy 가드 — apex/www(public[*])·tunnel/ruleset/zone 등 구조적
      # 리소스의 delete/replace는 무인 apply 차단. (prevent_destroy R2 버킷은 plan에서 이미 막힘.)
      # allow: app 공개 DNS(cloudflare_dns_record.app[*]) delete만 자동 apply 허용 — create-app의 DNS
      # 추가 자동 apply와 대칭으로 teardown-app 머지 시 DNS/tunnel ingress가 자동 회수된다.
      # allow_max=1: 대량 app DNS 삭제(apps.json 통째 비움)는 자동 허용 취소→차단(blast-radius 캡).
      - name: destroy 가드 (block)
        uses: ./.github/actions/tf-destroy-guard
        with:
          mode: block
          root: infra/cloudflare
          plan: tf.plan
          allow: '^cloudflare_dns_record\.app\['
          allow_max: '1'
      - name: terraform apply (plan 산출물만 적용)
        id: aiops_check
        run: terraform -chdir=infra/cloudflare apply -input=false tf.plan
      - name: AIOps 검사 결과 기록
        if: always()
        continue-on-error: true
        uses: ./.github/actions/aiops-observation
        with:
          producer: iac.yaml/apply
          target: apply
          job-result: ${{ job.status }}
          steps: ${{ toJSON(steps) }}
          primary-step: aiops_check
          source-revision: ${{ steps.aiops_source.outputs.source-revision }}
      - name: telegram notify
        if: ${{ (always()) && steps.authority.outcome == 'success' }}
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: IaC
          title: Cloudflare 적용
          ident: ${{ github.sha }}
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
