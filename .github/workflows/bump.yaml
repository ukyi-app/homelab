name: "🔼 bump"
on:
  workflow_run:
    workflows: ["📦 build"]
    types: [completed]
  # 외부 앱 레포의 v1 dispatch 경로는 폐기됨 — 배포 반영은 GHCR 폴링(bump-poll.yaml)과
  # 앱 release의 bump-poll 디스패치가 권위.

# 직렬화: 모든 main 변이(변이 디스패처/bump-poll/bump)가 공유하는 전역 큐에 합류한다.
# values-writeback 전용 그룹은 queue:max가 없어 동시 3번째 write-back이 대기 건을 조용히 취소했다
# (races-1/2 — 인-repo bump 유실). 진행 중인 커밋은 절대 취소하지 않는다(cancel-in-progress:false).
# queue:max(2026-05 GA)는 cancel-in-progress:true와 병용 불가 — false 유지.
concurrency:
  group: homelab-mutation
  cancel-in-progress: false
  queue: max

# GITHUB_TOKEN은 최소 권한만: main 쓰기는 writer App 토큰의 PR 경로가 전담한다.
permissions:
  contents: read
  actions: read # download-artifact가 다른 run의 아티팩트를 읽는 데 필요
  packages: read # docker manifest inspect용 — 없으면 GHCR 조회가 익명 처리되어 digest 검증이 항상 실패

jobs:
  writeback:
    # 이 레포의 `main`에서 돈 성공한 build에만 반응한다 (fork/PR build는 절대 아님) —
    # 아니면 공격자가 통제한 아티팩트 내용이 write-back PR 내용을 조종할 수 있다.
    if: >-
      ${{ github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — homelab-mutation 그룹의 천장(근거 전문은 bump-poll.yaml preflight 잡 주석).
    # 값 근거 — 2026-09-02 라이브 실측(최근 100 run 실행구간): bump p50 22s / max 337s.
    timeout-minutes: 15
    # matrix 없음: 직렬화된 단일 job이 실제로 빌드된 앱만 bump하고
    # (build.yaml의 `built-*` 아티팩트에서 도출), 각 digest 실존을 검증한 뒤 한 번만 커밋한다.
    steps:
      # writer App 토큰(설치는 org 전체 — `owner`/`repositories` 생략이 현재 레포로 한정한다):
      # App 토큰은 branch protection을 우회하지 못하므로
      # main 직접 push가 아니라 PR + auto-merge로 쓴다(required check `gate`가 리뷰 게이트).
      # checkout 자체에 토큰이 필요해 이 첫 step에서 create-github-app-token을 인라인 발급한다
      # (핀 SSOT: tests/gates/test_app-token-sha-ssot.bats가 전 콜사이트 동일 SHA 강제).
      - name: replay 가드 (이벤트 구동 잡 — 재실행 개시자만 검사한다)
        env:
          ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 이 잡은 owner 디스패치 대상이 아니라 **이벤트 구동**이다 — 출처는 잡 `if:`와 branch
          # protection이 진다. 그래서 actor 축은 모양이 맞지 않고, 남는 축은 재실행뿐이다:
          # 재실행은 원래 이벤트를 **그대로 재생**하므로 출처 술어가 그대로 통과한다.
          # (actions:write는 재실행 동사를 포함하고, 그 자격은 앱 레포에 실재한다.)
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — replay 가드 fail-closed"; exit 1; }
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.HOMELAB_WRITER_APP_ID }}
          private-key: ${{ secrets.HOMELAB_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          token: ${{ steps.token.outputs.token }}
      - uses: ./.github/actions/setup-bun
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: download built-app markers from the build run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: built-*
          # ⚠️ 워크스페이스(=레포 체크아웃) **밖**에 푼다. 레포 트리 안이면 이 다운로드가 untracked
          #    잔여물이 되어 아래 스테이징 완전성 판정의 노이즈가 되고, 더 나쁘게는 `git add -A --
          #    apps platform` 천장이 넓어지는 날 산출물이 커밋에 실릴 수 있다.
          path: ${{ runner.temp }}/built
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: derive the set of apps that were actually built
        id: set
        run: |
          built_apps="$(find "$RUNNER_TEMP/built" -mindepth 1 -maxdepth 1 -type f -printf '%f ' 2>/dev/null | sed 's/ *$//')"
          if [ -z "$built_apps" ]; then
            echo "apps=" >> "$GITHUB_OUTPUT"; echo "nothing built — no write-back"; exit 0
          fi
          echo "apps=$built_apps" >> "$GITHUB_OUTPUT"
          echo "built: $built_apps"
      - name: verify digests + bump ONLY built apps + PR once (auto-merge)
        id: bump
        if: steps.set.outputs.apps != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: "sha-${{ github.event.workflow_run.head_sha }}"
          OWNER: "${{ github.repository_owner }}"
          APPS: ${{ steps.set.outputs.apps }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for app in $APPS; do
            # 아티팩트 유래 이름 정제: 엄격한 소문자 앱 이름이 아니면 전부 건너뛴다
            case "$app" in
              ''|*[!a-z0-9-]*) echo "skip suspicious app name: '$app'"; continue ;;
            esac
            # ops 이미지의 canonical 태그(소비자가 참조하는 안정 태그). 새 ops 이미지를 추가하면 여기와
            # tools/repin-ops-image.ts의 CATALOG에 함께 등록한다 — 이 case 우변 집합 == CATALOG 키 집합을
            # test_ops-repin.bats「bump.yaml's opstag case set matches the tool CATALOG keys」가 대조한다
            # (한쪽에만 추가하면 red — 잊으면 opstag=""로 그 이미지가 조용히 재핀 안 되는 D-1 갭을 닫는다).
            case "$app" in
              pg-tools) opstag="pg-tools:18-rclone" ;;
              skopeo)   opstag="skopeo:alpine" ;;
              *)        opstag="" ;;
            esac
            # 배포되는 앱은 values.yaml을 bump, ops 이미지는 인라인 digest를 **레포에서 파생한 전 사이트**에 재핀
            if [ -f "apps/$app/deploy/prod/values.yaml" ]; then
              echo "verify ghcr.io/$OWNER/$app:$SHA exists BEFORE bumping"
              docker manifest inspect "ghcr.io/$OWNER/$app:$SHA" >/dev/null 2>&1 \
                || { echo "::error::ghcr.io/$OWNER/$app:$SHA missing — refusing to bump (would ImagePullBackOff)"; exit 1; }
              bun tools/bump-tag.ts "$app" "$SHA"
            elif [ -n "$opstag" ]; then
              # ops 이미지: values.yaml 없음 — canonical 태그의 새 digest를 인라인 핀 전 사이트에 재핀(부분 갱신 skew 차단).
              # 대상 수를 여기 적지 않는다 — 도구가 레포에서 파생하므로 주석의 숫자가 곧 사본이 된다.
              digest="$(docker buildx imagetools inspect "ghcr.io/$OWNER/$opstag" --format '{{.Manifest.Digest}}')"
              case "$digest" in sha256:*) : ;; *) echo "::error::$opstag digest 해석 실패: '$digest'"; exit 1 ;; esac
              bun tools/repin-ops-image.ts "$opstag" "$digest"
            else
              echo "skip $app (no deploy values.yaml, no re-pin registry)"; continue
            fi
          done
          # ── 스테이징 완전성 판정 [staged-completeness] ────────────────────────────────
          # 천장(`git add -A -- apps platform`)은 상한으로 남긴다 — 재는 것은 열거가 아니라
          # **잔여물**이다: 위 도구들이 이 두 루트 밖에 쓰면 그 변경은 커밋에서 조용히 유실되고
          # PR이 부분 표면으로 열린다(형제 자리의 2026-08-18 실사고 — pr-first-commit/action.yml).
          # 포함 판정은 `:(exclude)` pathspec으로 git에게 시킨다 — 아래 `git add`와 같은 매처다.
          # ⚠️ 판정은 `git diff --quiet` 조기 종료 **앞**이다. 뒤에 두면 도구가 천장 밖에만 쓴
          #    경우(추적 변경 0) 이 스텝이 "no values changed"로 초록 종료해 판정을 아예 지나간다.
          residue="$(git status --porcelain --untracked-files=all -- . ':(exclude)apps' ':(exclude)platform')"
          if [ -n "$residue" ]; then
            echo "::error::apps/platform 천장 밖 변경이 남는다 — 이대로면 커밋에서 유실된다"
            echo "$residue"
            exit 1
          fi
          # ── [/staged-completeness] ───────────────────────────────────────────────────
          if git diff --quiet; then echo "no values changed"; exit 0; fi
          git config user.name "ukyi-homelab-writer[bot]"
          git config user.email "293311924+ukyi-homelab-writer[bot]@users.noreply.github.com"
          branch="bump/build-${RUN_ID}"
          git checkout -b "$branch"
          # ⚠️ **파일 화이트리스트를 쓰지 않는다.** 재핀 도구가 대상을 레포에서 파생하므로 여기 목록을
          #    두면 사본이 하나 더 생기고, 어긋나는 순간 **다음 재빌드가 방금 고친 드리프트를 되돌린다**
          #    (실측: 도구는 6파일을 고치는데 목록은 4개만 스테이지했다). 디렉토리 스코프만 준다 —
          #    러너는 fresh checkout이라 이 두 루트의 변경은 위 도구들이 만든 것뿐이다.
          #    (apps를 디렉토리로 주는 이유: 인레포 앱 0일 때 glob 미매치 pathspec 에러 회피.)
          #    cf. docs/traps.md 「이미지 핀의 존재 ≠ 일치 ≠ 소유자」
          git add -A -- apps platform
          git commit -m "chore: 빌드 산출물 이미지 핀 갱신 (${APPS})"
          git push -u origin "$branch"
          # PR-first 쓰기 모델: gate 통과 시 자동 머지(squash). 머지 후 브랜치는 자동 삭제(repo 설정).
          gh pr create --base main --head "$branch" \
            --title "chore: 이미지 태그 갱신 (${APPS})" \
            --body "build → write-back 자동 PR. required check \`gate\` 통과 시 auto-merge."
          # PR 생성 확정 후 신호 — 이후 auto-merge 실패해도 PR은 존재(알림이 PR 생성을 정확히 반영)
          echo "result=pr" >> "$GITHUB_OUTPUT"
          bash scripts/auto-merge-or-fail.sh "$branch"
      - name: telegram notify
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: 배포
          title: 이미지 태그 갱신
          ident: "apps=[${{ steps.set.outputs.apps }}] -> sha-${{ github.event.workflow_run.head_sha }}"
          body: "${{ job.status == 'success' && steps.bump.outputs.result == 'pr' && 'PR 생성됨(머지 대기)' || '' }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
