# create-app 변이 디스패처 — 신규 앱 온보딩(외부 레포 config를 main HEAD에서 read → 매니페스트+공개 PR).
# 트리거 경계(런북 app-platform): 앱 레포는 homelab-write 자격 0 — owner가 여기서 workflow_dispatch로 실행.
# 변이 로직은 _create-app.yaml(reusable)에 있다 — 이 파일은 trigger+validate+notify 셸.
name: "✨ create-app"
run-name: "✨ create-app — ${{ inputs.app }}${{ inputs.correlation != '' && format(' [{0}]', inputs.correlation) || '' }}"
on:
  workflow_dispatch:
    inputs:
      app:
        description: "앱 이름 (= ukyi-app/<app> 레포명)"
        required: true
      correlation:
        description: "상관 nonce (CLI 수령증 — run-name 에코, 비우면 기존 run-name 그대로)"
        required: false
        default: ""

# 전역 직렬화: 모든 homelab-mutation 워크플로(변이 디스패처/bump-poll/iac/tf-reconcile)가 같은 그룹.
# queue: max — pending FIFO 큐잉. cancel-in-progress와 병용 불가(AGENTS.md 함정) — 절대 true 금지.
concurrency:
  group: homelab-mutation
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — workflow-레벨 concurrency라 이 보조 잡도 run이 사는 동안 homelab-mutation을
    # 쥔다(그룹 천장의 근거 전문은 bump-poll.yaml preflight 잡 주석). 실제 변이의 상한은 동명
    # `_*.yaml` reusable의 잡에 있다 — route 잡(`uses:`)에는 timeout-minutes를 둘 수 없다(actionlint 거부).
    timeout-minutes: 5
    steps:
      - name: actor 가드 (owner 전용 변이 — bump-poll/audit는 비대상)
        env:
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        run: |
          # 변이 디스패처는 owner만 트리거 가능. 앱 레포 dispatch 자격(actions:write)이 변이까지
          # 트리거하는 표면을 차단(B11 선행 조건). vars.HOMELAB_OWNER 미설정 시 fail-closed(빈 값 거부 — vacuous 방지).
          [ -n "$OWNER" ] || { echo "::error::repo variable HOMELAB_OWNER 미설정 — actor 가드 fail-closed"; exit 1; }
          # 재실행 축 — **이벤트를 보지 않는다.** github.run_attempt은 재실행이 보존할 수 없는 유일한
          # 값이고, attempt>=2의 개시자는 언제나 actions:write를 든 주체다(스케줄러도 push도 재실행을
          # 하지 않는다). 그래서 이 축에는 열거할 트리거가 없다 — 열거 밖이라는 개념이 성립하지 않는다.
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행(attempt=$ATTEMPT)은 owner($OWNER)만 개시 가능 — 개시자=$TRIGGERING 거부"; exit 1; }
          # 트리거 축 — 종전 `if:` 한정을 본문으로 옮긴 것이다. 스텝 자체는 **모든 이벤트에서 돈다**:
          # `if:`로 한정하면 push/schedule run의 재실행에서 스텝이 skip되고(skip은 실패가 아니다) 위 축이 사라진다.
          [ "$EVENT" = "workflow_dispatch" ] || exit 0
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::변이 디스패처는 owner($OWNER)만 실행 가능 — actor=$ACTOR 거부"; exit 1; }
          # 재실행은 github.actor를 **최초 트리거 신원으로 보존**한다(개시자는 triggering_actor다).
          # actor만 보면 owner의 과거 디스패치를 재실행하는 것으로 통과한다 — actions:write는 재실행 동사를 포함한다.
          [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::변이 디스패처는 owner($OWNER)만 실행 가능 — 재실행 개시자=$TRIGGERING 거부"; exit 1; }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with: { ref: main }
      - uses: ./.github/actions/setup-bun
        with: { install: 'false' }     # validate-mutation 체크는 deps 불요
      - env:
          PAYLOAD: ${{ toJSON(github.event.inputs) }} # owner 입력도 비신뢰 — env 경유, 인라인 보간 금지
        run: |
          printf '%s' "$PAYLOAD" > /tmp/payload.json
          bun tools/validate-mutation.ts --action create-app --payload-file /tmp/payload.json

  create-app:
    needs: validate
    uses: ./.github/workflows/_create-app.yaml
    with:
      app: ${{ github.event.inputs.app }}
    secrets: inherit
    permissions:
      contents: read
      packages: read # _create-app.yaml의 GHCR digest 해석에 필수 — reusable 권한은 caller가 상한 (A.5 F1)

  notify:
    needs: [validate, create-app]
    if: failure() || cancelled()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5 # 보조 잡 — 위 validate와 같은 이유(실패 알림도 그룹을 쥔다)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/mutation-notify
        with:
          results: ${{ toJSON(needs) }}
          title: create-app 실행
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
