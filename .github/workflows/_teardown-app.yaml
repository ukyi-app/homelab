# teardown-app reusable — dispatcher(action=teardown-app)가 호출. writer App 토큰으로 fresh main 브랜치에서
# apps/<app> 제거 + apps.json/원장 갱신 → PR(required check `gate`). **auto-merge 안 함 = 파괴는 수동 머지.**
name: "🧰 _teardown-app"
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      confirm:
        required: true
        type: string

# 기본 셸(bash -e {0})은 pipefail 부재 — 명시 bash로 전 run 스텝에 -eo pipefail 강제
# (가드: tests/gates/test_workflow-pipefail.bats)
defaults:
  run:
    shell: bash

jobs:
  teardown:
    environment: homelab-main
    runs-on: ubuntu-24.04-arm
    # timeout-minutes — 디스패처의 route 잡(`uses:`)에는 걸 수 없어(actionlint 거부) 변이 본체의 상한이
    # 여기 있다. homelab-mutation 그룹 천장의 근거 전문은 bump-poll.yaml preflight 잡 주석 —
    # 이 잡의 gh/git 호출도 실행기 하위 상한이 없다(tools/lib/exec.ts `timeoutMs: 0`).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: main 운영 자격 경계 (실제 job마다 검사)
        id: authority
        env:
          REF: ${{ github.ref }}
          REPOSITORY_ID: ${{ github.repository_id }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ vars.HOMELAB_OWNER }}
        shell: bash
        run: |
          # GitHub login은 대소문자를 구별하지 않는다. 모든 actor 가드가 같은 정규화를 쓴다.
          OWNER="${OWNER,,}"
          ACTOR="${ACTOR,,}"
          TRIGGERING="${TRIGGERING,,}"
          # Environment의 서버 branch 정책이 권위다. 이 검사는 trusted main의 대리 실행·부분 재실행도 닫는다.
          [ "$REF" = "refs/heads/main" ] && [ "$REPOSITORY_ID" = "1265054638" ] || { echo "::error::homelab main 실행만 허용"; exit 1; }
          [ -n "$OWNER" ] || { echo "::error::HOMELAB_OWNER 미설정"; exit 1; }
          case "$ATTEMPT" in ''|*[!0-9]*|0) echo "::error::run_attempt 불량"; exit 1;; esac
          [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::재실행은 owner만 허용"; exit 1; }
          case "$EVENT" in
            workflow_dispatch)
              [ "$ACTOR" = "$OWNER" ] || { echo "::error::dispatch actor 거부"; exit 1; }
              [ "$TRIGGERING" = "$ACTOR" ] || [ "$TRIGGERING" = "$OWNER" ] || { echo "::error::dispatch 개시자 거부"; exit 1; } ;;
            push|schedule|workflow_run) ;;
            *) echo "::error::운영 이벤트 거부"; exit 1 ;;
          esac
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: writer
        with:
          app-id: ${{ secrets.HOMELAB_WRITER_APP_ID }}
          private-key: ${{ secrets.HOMELAB_WRITER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: main
          token: ${{ steps.writer.outputs.token }}
      - uses: ./.github/actions/setup-bun
      - name: confirm 가드 재검증 (파괴 경계 — defense-in-depth, teardown 前)
        env:
          APP: ${{ inputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # 외부 디스패처가 이미 검사했어도 파괴 경계(reusable)에서 confirm===app을 다시 강제 —
          # 다른/미래 호출자가 confirm 없이·불일치로 호출하는 것을 차단(env 경유, 인라인 보간 금지).
          # writer 토큰의 destructive 사용(push/PR)은 이 검증 통과 후에만 일어난다.
          printf '{"app":"%s","confirm":"%s"}' "$APP" "$CONFIRM" > /tmp/td-payload.json
          bun tools/validate-mutation.ts --action teardown-app --payload-file /tmp/td-payload.json
      - name: 철거 plan + PR 본문 (수동 머지)
        env:
          APP: ${{ inputs.app }}
        run: |
          [ -d "apps/$APP" ] || { echo "::error::apps/$APP 없음 — 이미 철거됐거나 이름 오류"; exit 1; }
          # 사전 active 상태 기록(롤백 시 DNS 복원 필요 여부 판단용)
          active=$(jq -r --arg a "$APP" '(map(select(.name==$a)) | .[0].active) // false' infra/cloudflare/apps.json 2>/dev/null || echo unknown)
          bun tools/teardown-app.ts --app "$APP" --repo-root . | tee /tmp/plan.json
          {
            echo "teardown-app 자동 생성 PR입니다. **머지 = 철거 승인** — ArgoCD가 Application/워크로드/SealedSecret prune; active였으면 머지 후 iac.yaml이 DNS/tunnel ingress를 **자동 제거**(app 공개 DNS는 destroy 가드 allowlist라 무인 apply 허용). 별도 수동 terraform apply 불필요."
            echo
            echo "**사전 상태**: active=${active} (롤백 시 DNS 복원 필요 여부 판단)"
            echo "**롤백**: 잘못 머지하면 이 PR을 git revert(또는 GitHub Revert) → apps/${APP}/(SealedSecret 포함)+apps.json 행+원장 행 복원 → ArgoCD 재생성 + (active였으면) iac DNS 재적용."
            echo
            echo '```json'
            cat /tmp/plan.json
            echo '```'
          } > /tmp/pr-body.md
      - name: PR-first 커밋 (auto-merge 안 함 — 파괴는 수동 머지)
        id: aiops_check
        uses: ./.github/actions/pr-first-commit
        with:
          branch: teardown/teardown-app-${{ inputs.app }}-${{ github.run_id }}
          # ⚠️ `tools/vendored-contract.json`은 teardown-app.ts가 동봉 계약 target 행을 빼는 자리다
          #    (tools/lib/vendored-targets.ts). 천장 밖이면 그 제거가 커밋에서 유실돼 로스터 등식이
          #    stale-target으로 발화한다 — 형제 실사고는 `_create-app.yaml`의 add-paths 주석이 SSOT.
          add-paths: apps docs/memory-ledger.md infra/cloudflare/apps.json platform tools/vendored-contract.json
          commit-message: "chore: ${{ inputs.app }} 앱 철거 (teardown-app)"
          pr-title: "chore: ${{ inputs.app }} 앱 철거 (teardown-app)"
          pr-body-file: /tmp/pr-body.md
          auto-merge: 'false'
          gh-token: ${{ steps.writer.outputs.token }}
      - name: AIOps 검사 결과 기록
        if: always()
        continue-on-error: true
        uses: ./.github/actions/aiops-observation
        with:
          producer: _teardown-app.yaml/teardown
          target: ${{ inputs.app }}
          job-result: ${{ job.status }}
          steps: ${{ toJSON(steps) }}
          primary-step: aiops_check
      - name: telegram notify
        if: ${{ (always()) && steps.authority.outcome == 'success' }}
        uses: ./.github/actions/telegram-notify
        with:
          status: ${{ job.status }}
          source: 해체
          title: "${{ job.status == 'success' && '앱 철거 PR' || '앱 철거' }}"
          ident: ${{ inputs.app }}
          body: "${{ job.status == 'success' && 'PR 생성됨(수동 머지 대기)' || '' }}"
          link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
