name: tf-r2-init
description: R2(S3 호환) backend.hcl 작성 + terraform init (-lockfile=readonly). state key는 root에서 파생. R2 자격은 env(R2_ACCOUNT_ID/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY)로 상속.
inputs:
  root:
    description: tf 루트 디렉토리명 (cloudflare | github | tailscale)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # ⚠️ 이 한 줄이 root → state key 파생의 **유일한 고리**인데 actionlint는 못 본다.
        #    실측(2026-08-29): `inputs.bogus`로 바꿔도, 리터럴 `cloudflare`로 하드코딩해도 무경고 —
        #    `actionlint`는 .github/workflows/만 린트하고 composite action의 자기 env는 안 본다.
        #    그래서 증인이 tools/tests/test_tf-r2-init.bats에 있다(정적 배선 단언 + 실행 픽스처).
        ROOT: ${{ inputs.root }}
      run: |
        # ── state key는 root에서 **파생**한다. 입력으로 받지 않는다. ──────────────────────────
        # 별도 `state-key` 입력이던 시절 5/5 콜사이트가 `<root>/prod/terraform.tfstate`로 같아
        # 정보가 0이었고, 짝이 어긋나도 `terraform init`은 성공해 한 루트가 다른 루트의 state를
        # 관리할 수 있었다(tf-destroy-guard는 delete만 막아 "전 리소스 create" plan은 통과한다).
        # 입력을 지우면 남은 `with: state-key:`를 actionlint가 required gate에서 red로 만든다 —
        # 실측(2026-08-29): 입력만 제거한 상태에서 5/5 콜사이트 전부 red, rc 1.
        #
        # root 화이트리스트 — 오타·임의 문자열·경로 이탈(`../`)이 조용히 새 state 오브젝트를
        # 만들지 못하게 한다. 목록↔실제 tf 루트(infra/*/backend.tf, `_` 접두 템플릿 제외) 등식은
        # tools/tests/test_tf-r2-init.bats가 강제한다(손 관리 목록이 드리프트하면 red).
        case "$ROOT" in
          cloudflare|github|tailscale) ;;
          *) echo "tf-r2-init: unsupported root '$ROOT' (cloudflare|github|tailscale)" >&2; exit 1 ;;
        esac
        # backend.hcl은 .gitignore 등록됨 — R2 자격이 평문이라 절대 커밋/로그 금지(set -x 금지).
        cat > "infra/${ROOT}/backend.hcl" <<EOF
        endpoints  = { s3 = "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" }
        access_key = "${R2_ACCESS_KEY_ID}"
        secret_key = "${R2_SECRET_ACCESS_KEY}"
        key        = "${ROOT}/prod/terraform.tfstate"
        EOF
        # -lockfile=readonly: 커밋된 멀티플랫폼 lock과 어긋나면 실패 → 공급망/재현성 가드(불변식 SSOT)
        terraform -chdir="infra/${ROOT}" init -backend-config=backend.hcl -input=false -lockfile=readonly
