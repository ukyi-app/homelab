# sshd 하드닝 — root 로그인 금지 · 키 인증만. `host-config.sh --apply`가 설치한다.
#
# ⚠️ 파일명의 `10-` 접두가 **load-bearing**이다. sshd_config는 systemd 드롭인과 우선순위가
#    **정반대**다 — man sshd_config: "for each keyword, the first obtained value will be used",
#    그리고 sshd_config.d/*.conf 는 본 파일 **앞에** Include된다. 즉 글롭 사전순으로 먼저 읽힌
#    파일이 이긴다. NUC에는 이미 `50-cloud-init.conf`(600 root:root, 내용 열람 불가)가 있고,
#    `10-` 이라야 그것을 이긴다. `60-` 으로 바꾸면 조용히 무력화된다.
#    → `host-config.sh --check`가 이 디렉토리에서 우리보다 **사전순 앞선 .conf가 없는지** 본다.
#
# ⚠️ 이 하드닝은 owner의 접속 경로를 끊지 않는다(실측): `ssh ukyi@100.109.208.81`은 sshd가 아니라
#    tailscaled가 처리하는 **Tailscale SSH**이고(세션 부모 = `tailscaled be-child ssh`),
#    LAN 경로에도 ~/.ssh/authorized_keys에 공개키 5건이 이미 있다.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
