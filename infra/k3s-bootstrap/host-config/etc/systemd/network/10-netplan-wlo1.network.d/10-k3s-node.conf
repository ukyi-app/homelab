# 링크(wlo1)가 DHCP가 준 DNS를 **쓰지 않게** 한다. `host-config.sh --apply`가 설치한다.
#
# ⚠️ 이것은 R7(LAN DNS를 AdGuard로)이 여는 콜드스타트 교착을 **원천에서** 막는 파일이다.
#    라우터의 DHCP option 6을 AdGuard로 바꾸면 노드도 그 값을 받는데, 그 주소는 노드 자신의
#    LAN IP이므로 노드에게 **LOCAL**이다. 그러면 CNI portmap이 심는 DNAT에 걸린다(실측 2026-08-18):
#
#        -A OUTPUT   -m addrtype --dst-type LOCAL -j CNI-HOSTPORT-DNAT
#        -A CNI-DN-… -p udp -m udp --dport 53 -j DNAT --to-destination <AdGuard 파드>:53
#
#    마지막 규칙에 **목적지 IP 제한이 없다.** 콜드스타트에서 AdGuard 파드가 아직 없으면 노드의
#    질의가 블랙홀로 가고, 이름해석 없이는 이미지를 pull하지 못해 AdGuard가 영영 못 뜬다.
#    resolved.conf.d의 `DNSStubListener=no`가 막은 것과 **같은 교착의 다른 문**이다 —
#    거기서는 127.0.0.53이 LOCAL이었고, 여기서는 노드의 LAN IP가 LOCAL이다.
#
# ⚠️ `UseDNS=false`면 링크별 DNS가 비고, 그때 비로소 resolved.conf.d의 `DNS=`(=versions.env의
#    HOST_UPSTREAM_DNS)가 governing이 된다. 그 파일의 주석이 "`DNS=`는 링크별 DNS가 없을 때의
#    폴백"이라고 적어 둔 조건을 이 파일이 **실제로 성립시킨다** — 둘은 한 쌍이다.
#
# ⚠️ 파일명이 netplan의 생성 이름(`10-netplan-wlo1.network`)에 결합돼 있다. 인터페이스를 유선
#    (`enp86s0`)으로 옮기면 이 드롭인은 **조용히 무효**가 된다 — netplan이 다른 이름을 만든다.
#    그 경우를 잡는 것은 이 파일이 아니라 `host-preflight.sh` [3]의 자기참조 리졸버 거부다
#    (라이브에서 실효를 보므로 이름 결합과 무관하다). 둘 다 있어야 한다.
[DHCP]
UseDNS=false
