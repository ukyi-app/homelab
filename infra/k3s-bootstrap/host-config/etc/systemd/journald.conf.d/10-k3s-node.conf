# journald 상한 — R4 disk-fill 방어. `host-config.sh --apply`가 설치한다.
#
# ⚠️ 상한을 **명시하는 것 자체**가 요점이다. 미설정 시 systemd는 min(파일시스템의 10%, 4G)를
#    유도하는데, NUC 루트가 913G라 실효 상한이 4G가 된다(실측: journalctl -t systemd-journald 의
#    "System Journal (…) is 93.9M, max 4G"). 그리고 유도값은 파일시스템 크기를 따라 조용히
#    움직여서 어떤 검사도 "얼마여야 하는가"를 말할 수 없다.
#
# ⚠️ 이 상한은 eviction과 맞물린다. `k3s-install.sh`의 `nodefs.available<10%`가 루트를 보는데,
#    로그·PV·(D4 한시 구간의) bulk가 전부 같은 파일시스템이다. 로그 폭주 하나가 클러스터 전역
#    축출로 번지는 경로를 이 한 줄이 막는다.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=1G
RuntimeMaxUse=64M
