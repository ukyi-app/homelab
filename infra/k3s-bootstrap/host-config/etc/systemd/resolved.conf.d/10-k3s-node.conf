# k3s 노드의 이름해석을 **클러스터 독립**으로 만든다. `host-config.sh --apply`가 설치한다.
#
# ⚠️ `DNSStubListener=no`인 이유는 ":53 바인드 충돌"이 아니다. 실측(2026-08-11)상 resolved는
#    127.0.0.53 / 127.0.0.54만 잡고 0.0.0.0:53은 잡지 않으며, svclb도 리터럴 바인드가 아니라
#    hostPort다. 즉 바인드 충돌은 애초에 없다. 진짜 이유는 CNI portmap이 심는 DNAT다:
#
#        -A OUTPUT   -m addrtype --dst-type LOCAL -j CNI-HOSTPORT-DNAT
#        -A CNI-DN-… -p udp --dport 53 -j DNAT --to-destination <AdGuard>:53
#
#    마지막 규칙에 **목적지 IP 제한이 없다.** 127.0.0.53도 LOCAL이므로 노드 자신이 스텁에 던지는
#    질의가 전부 AdGuard 파드로 끌려간다 → 부팅 시 AdGuard가 없으면 이름해석 불가 → 이미지 pull
#    불가 → AdGuard가 영영 못 뜬다. 스텁을 끄고 /etc/resolv.conf가 비-loopback 업스트림을 가리키면
#    그 패킷은 `--dst-type LOCAL`에 안 걸려 DNAT를 피한다.
#
# ⚠️ 이 드롭인만으로는 부족하다. tailscale이 `~.` 라우팅 도메인으로 **모든** 질의를 가져가고
#    (실측: tailscale0의 DNS Domain에 `~.`, Resolvers=100.112.20.3=맥미니), 그 업스트림이 곧
#    라이브 클러스터의 AdGuard다. `host-config.sh --apply`가 `tailscale set --accept-dns=false`를
#    함께 걸고, `host-preflight.sh` [3]이 tailnet 리졸버 잔존을 거부한다.
#
# `DNS=`는 링크별 DNS(wlo1의 DHCP)가 없을 때의 폴백이다 — 값은 versions.env의 HOST_UPSTREAM_DNS와
# 정합해야 하며 test_03-host-config.bats가 그것을 대조한다.
#
# 🔴 **2026-08-18: 값을 라우터(192.168.117.1)에서 공인 리졸버 2개로 바꿨다. R7이 만든 교착 때문이다.**
#    R7에서 라우터(NETGEAR Orbi RBR350)가 DHCP 광고 DNS를 따로 못 정하는 기종이라(런북 lan-dns.md
#    §2 "경우 B") **라우터의 인터넷 DNS 자체를 AdGuard로** 돌렸다. 그 순간 노드의 경로가
#    `노드 → 라우터 → AdGuard`가 되어, 위 CNI DNAT 교착과 **논리적으로 동일한 교착**이 한 홉 뒤에서
#    되살아났다. 실측 2026-08-18(AdGuard 파드 삭제 순간):
#        deb.debian.org -> ;; communications error to 192.168.117.1#53: timed out  4026ms
#    containerd/k3s는 이 파일이 만드는 /etc/resolv.conf를 **직접** 읽으므로 그대로 이미지 pull 불능이다
#    → AdGuard가 영영 못 뜬다. 일상 재부팅은 이미지 캐시로 가려지고 **G11 콜드스타트 증명이 밟는다.**
#
# ⚠️ **이전 판이 믿던 안전망은 존재하지 않았다.** 여기 주석은 "`FallbackDNS=`를 건드리지 않으면
#    (systemd 기본 = 공인 리졸버) 라우터를 잃어도 이름해석이 남는다"고 적었으나 **틀렸다.**
#    systemd 문서: FallbackDNS는 *"only used if no other DNS server information is known"* —
#    `DNS=`가 설정돼 있으면 **영원히 발동하지 않는다.** 위 실측이 그것을 확인했다(폴백 없이 timeout).
#    그래서 폴백을 `FallbackDNS=`가 아니라 **`DNS=`의 두 번째 항목**으로 둔다. 이건 glibc/Go의
#    표준 동작(순서대로 시도, 실패 시 다음)이라 확실하다.
#
# ⚠️ 라우터를 아예 뺀 이유: 라우터를 1순위로 두면 AdGuard 장애·콜드스타트마다 **질의당 약 5초**의
#    타임아웃을 물고 나서야 2순위로 넘어간다(이미지 pull 수십 건이면 치명적이다). 노드는
#    `*.home.ukyi.app` split-horizon도, 광고 차단도 필요 없다(2026-08-18 owner 확인 + 레포 실측:
#    노드의 systemd·cron·부트스트랩 어디도 `.home.` 이름을 해석하지 않는다). 노드의 이름해석을
#    **라우터와 클러스터 양쪽으로부터 독립**시키는 것이 이 드롭인의 원래 목적이다.
#    ⚠️ 대가: 노드 질의가 AdGuard의 DoH를 안 타고 평문 :53으로 나간다. LAN 기기는 영향 없다.
[Resolve]
DNSStubListener=no
DNS=1.1.1.1 9.9.9.9
