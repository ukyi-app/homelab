# k3s 노드의 이름해석을 **클러스터 독립**으로 만든다. `host-config.sh --apply`가 설치한다.
#
# ⚠️ `DNSStubListener=no`인 이유는 ":53 바인드 충돌"이 아니다. 실측(2026-08-11)상 resolved는
#    127.0.0.53 / 127.0.0.54만 잡고 0.0.0.0:53은 잡지 않으며, svclb도 리터럴 바인드가 아니라
#    hostPort다. 즉 바인드 충돌은 애초에 없다. 진짜 이유는 CNI portmap이 심는 DNAT다:
#
#        -A OUTPUT   -m addrtype --dst-type LOCAL -j CNI-HOSTPORT-DNAT
#        -A CNI-DN-… -p udp --dport 53 -j DNAT --to-destination <AdGuard>:53
#
#    마지막 규칙에 **목적지 IP 제한이 없다.** 127.0.0.53도 LOCAL이므로 노드 자신이 스텁에 던지는
#    질의가 전부 AdGuard 파드로 끌려간다 → 부팅 시 AdGuard가 없으면 이름해석 불가 → 이미지 pull
#    불가 → AdGuard가 영영 못 뜬다. 스텁을 끄고 /etc/resolv.conf가 비-loopback 업스트림을 가리키면
#    그 패킷은 `--dst-type LOCAL`에 안 걸려 DNAT를 피한다.
#
# ⚠️ 이 드롭인만으로는 부족하다. tailscale이 `~.` 라우팅 도메인으로 **모든** 질의를 가져가고
#    (실측: tailscale0의 DNS Domain에 `~.`, Resolvers=100.112.20.3=맥미니), 그 업스트림이 곧
#    라이브 클러스터의 AdGuard다. `host-config.sh --apply`가 `tailscale set --accept-dns=false`를
#    함께 걸고, `host-preflight.sh` [3]이 tailnet 리졸버 잔존을 거부한다.
#
# `DNS=`는 링크별 DNS(wlo1의 DHCP)가 없을 때의 폴백이다 — 값은 versions.env의 HOST_UPSTREAM_DNS와
# 정합해야 하며 test_03-host-config.bats가 그것을 대조한다.
# `FallbackDNS=`는 건드리지 않는다(systemd 기본 = 공인 리졸버). 노드가 라우터를 잃어도 이름해석이
# 남아야 클러스터 독립이 유지된다 — 여기서 값을 비우면 라우터 장애가 곧 콜드스타트 불능이다.
[Resolve]
DNSStubListener=no
DNS=192.168.117.1
