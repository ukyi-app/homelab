# NVMe 링크의 ASPM L1 비활성 — PCIe correctable RxErr 폭주 차단.
# `host-config.sh --apply`가 이 파일을 설치하고 `systemd-tmpfiles --create`로 즉시 반영한다.
# 부팅 시에는 systemd-tmpfiles-setup.service가 같은 줄을 다시 건다(재부팅 내성).
#
# ⚠️ **A/B 실측 (2026-08-15, NUC)** — per-device 노브를 껐다 켜며 카운터를 쟀다:
#      ASPM L1 ON : 유휴 60초 +9 · 부하(8GiB direct read) +0 · 처리량 1.2~1.3 GB/s
#      ASPM L1 OFF: 유휴 60초 +0 · 부하             +0 · 처리량 1.2 GB/s
#    ⇒ **에러는 부하가 아니라 유휴에서만 난다** — 링크가 L1로 내려갔다 기상할 때 나는 것이다.
#    처리량 손실은 0이고, 대가는 유휴 전력이 조금 오르는 것뿐이다.
#
# ⚠️ 방치해도 데이터 위험은 없었다(전부 correctable · `aer_dev_fatal`/`nonfatal` 0 ·
#    `LnkCap`=`LnkSta`=8GT/s x4로 강등 없음). 그럼에도 끄는 이유는 둘이다:
#      (a) 이 디스크가 **단일 실패점**이다 — `/`·`/boot`·`/mnt/bulk`·전 k3s PV가 전부 여기 있다.
#      (b) 부팅 후 `TOTAL_ERR_COR`가 3만 건대로 쌓여 **나중에 진짜 링크 문제를 가린다**.
#    실제로 2026-08-14 콜드스타트 장애가 만든 잦은 유휴↔활성 전환이 카운터를 튀게 했고,
#    처음엔 그것을 하드웨어 열화로 오독할 뻔했다.
#
# ⚠️ **PCI 주소가 아니라 드라이버 경유 글롭을 쓴다** — `/sys/bus/pci/devices/0000:01:00.0/...`로
#    박으면 슬롯이 바뀌거나 두 번째 M.2(2TB, 장착 예정)를 달았을 때 조용히 빗나간다.
#    `drivers/nvme/*`는 NVMe 컨트롤러만 정확히 잡고(실측: 이 기계에서 1건), 새 디스크도 자동 포함된다.
# ⚠️ `w`는 **대상이 없으면 아무것도 하지 않는다**(생성하지 않는다) — 디스크가 빠져도 실패하지 않는다.
# ⚠️ 이 파일이 `.conf`인 것은 우연이 아니다: `host-config.sh`의 트리 열거가
#    `find . -type f -name '*.conf'`다. `.rules`/`.cfg`로 두면 **조용히 무시된다**(vacuous green).
w /sys/bus/pci/drivers/nvme/*/link/l1_aspm - - - - 0
