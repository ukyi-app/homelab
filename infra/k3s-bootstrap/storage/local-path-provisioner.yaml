# SSOT: seed-only — 이 트리는 **ArgoCD가 수렴시키지 않는다**(docs/decisions/0007 1). 적용자는 owner-local
#   `apply-storage.sh`(`${LOCAL_PATH_PROVISIONER_IMAGE}`·`${LOCAL_PATH_HELPER_IMAGE}`·
#   `${BULK_STORAGE_PATH}`를 렌더해 apply)뿐이고, Renovate가 올리는 핀은 재구축 목표값이지 현재
#   라이브 값이 아니다.
#   ⚠️ 감사 60 prov-1~3(2026-09-05): provisioner 이미지가 하드코딩 태그에서 위 첫 플레이스홀더로
#      바뀌었다 — versions.env의 `LOCAL_PATH_PROVISIONER_IMAGE`(digest 핀, 헬퍼와 같은 형태)가 이제
#      digest 소유자다(policy/image-ownership.json의 그 자리 무소유 선언은 제거됐다).
#   라이브 대조는 두 축이다: `verify-cluster.sh` [10][11](세 값 전부 — owner 손 실행)과
#   `platform/victoria-stack/prod/rules/r8-substrate.yaml`의 `SubstrateProvisionerPinDrift`
#   warning(**상주 주기 신호** — KSM `kube_pod_container_info.image_spec`을 이제 repo:tag@digest
#   **전체 문자열**과 대조한다 — 매니페스트가 그 형태를 렌더하므로 라이브 image_spec도 그 형태다).
#   ⚠️ helper digest는 여전히 **보지 못한다**(ConfigMap data 안 문자열이라 KSM에 없다) → [11]은 손 실행 전용.
#   ⚠️ 위 플레이스홀더가 가리키는 값을 올리는 PR은 versions.env·r8 룰 리터럴과 **같은 커밋에서** 움직여야
#      한다(등식: test_06-storage-manifests.bats · tests/gates/test_vmalert-config.bats).
#   ⚠️ 라이브 실측 2026-09-03: 두 Deployment 모두 `v0.0.36` · helper `sha256:fd8d9aa6…`(핀과 갈려 있다).
#      2026-09-05 digest 승격 이후에도 라이브는 여전히 v0.0.36 태그 형태다 — owner substrate 수렴 전.
#   자원 limit은 `docs/memory-ledger.md`의 `local-path-storage` 행과 기계 대조된다(check-resource-limits).
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-sa
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints", "persistentvolumes", "pods"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-sa
    namespace: local-path-storage
---
# ---------- 내장(internal) provisioner (StorageClass: standard) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner-internal
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels: { app: local-path-provisioner-internal }
  template:
    metadata:
      labels: { app: local-path-provisioner-internal }
    spec:
      serviceAccountName: local-path-provisioner-sa
      containers:
        - name: local-path-provisioner
          image: ${LOCAL_PATH_PROVISIONER_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["local-path-provisioner"]
          args:
            - start
            - --provisioner-name=homelab.io/local-path-internal
            - --config=/etc/config/config.json
            - --service-account-name=local-path-provisioner-sa
            # v0.0.30은 --configmap-name(기본 `local-path-config`)이 필수다: provisioner가 읽고
            # 모든 helper pod에 마운트하는(setup/teardown/helperPod 스크립트) configmap의 이름이다.
            # 우리는 이름을 바꿨으므로 이게 없으면 데몬이 fatal나고 helper pod마다 FailedMount가 난다(volume "script").
            - --configmap-name=local-path-config-internal
            - --helper-pod-file=/etc/config/helperPod.yaml
          env:
            - name: POD_NAMESPACE
              value: local-path-storage
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: config-volume, mountPath: /etc/config/ }
      volumes:
        - name: config-volume
          configMap: { name: local-path-config-internal }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config-internal
  namespace: local-path-storage
data:
  config.json: |
    {
      "nodePathMap": [
        { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/var/lib/rancher/k3s-storage/internal"] }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: ${LOCAL_PATH_HELPER_IMAGE}
          imagePullPolicy: IfNotPresent
---
# ---------- bulk provisioner (StorageClass: bulk-ssd) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner-bulk
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels: { app: local-path-provisioner-bulk }
  template:
    metadata:
      labels: { app: local-path-provisioner-bulk }
    spec:
      serviceAccountName: local-path-provisioner-sa
      containers:
        - name: local-path-provisioner
          image: ${LOCAL_PATH_PROVISIONER_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["local-path-provisioner"]
          args:
            - start
            - --provisioner-name=homelab.io/local-path-bulk
            - --config=/etc/config/config.json
            - --service-account-name=local-path-provisioner-sa
            # v0.0.30은 --configmap-name(기본 `local-path-config`)이 필수다: provisioner가 읽고
            # 모든 helper pod에 마운트하는(setup/teardown/helperPod 스크립트) configmap의 이름이다.
            # 우리는 이름을 바꿨으므로 이게 없으면 데몬이 fatal나고 helper pod마다 FailedMount가 난다(volume "script").
            - --configmap-name=local-path-config-bulk
            - --helper-pod-file=/etc/config/helperPod.yaml
          env:
            - name: POD_NAMESPACE
              value: local-path-storage
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: config-volume, mountPath: /etc/config/ }
      volumes:
        - name: config-volume
          configMap: { name: local-path-config-bulk }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config-bulk
  namespace: local-path-storage
data:
  config.json: |
    {
      "nodePathMap": [
        { "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["${BULK_STORAGE_PATH}"] }
      ]
    }
  setup: |
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
        - name: helper-pod
          image: ${LOCAL_PATH_HELPER_IMAGE}
          imagePullPolicy: IfNotPresent
