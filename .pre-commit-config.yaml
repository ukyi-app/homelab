# 커밋 전에 CI(ci.yaml)와 같은 검사를 로컬에서 먼저 돌린다. 쓰려면 mise install 뒤 pre-commit install.
# gitleaks·actionlint·shellcheck는 local 훅이다. 바이너리 버전은 .tool-versions 한 곳에서 오고
# 여기 rev로 다시 적지 않는다. 같은 도구의 버전을 두 곳에 적으면 어긋난다(옛 R29·R37).
# 외부 훅 저장소는 태그가 아니라 커밋 SHA로 고정한다. 태그는 옮겨질 수 있다.
# 이 파일과 local 훅이 부르는 코드(tools/ci/ 등)는 체크아웃한 트리에서 온다. 남이 만든 PR 브랜치에서는 돌리지 않는다
# (AGENTS.md, docs/runbooks-public/github.md 2절). 이 파일 안의 방어는 그 PR이 함께 고칠 수 있어 경계가 아니다.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
        # Kubernetes 매니페스트는 한 파일에 문서 여러 개를 둔다.
        args: [--allow-multiple-documents]
        # Helm 템플릿은 렌더 전에는 YAML이 아니다. parse 음성 fixture는 일부러 깨진 YAML이다(tools/ci/).
        exclude: (/templates/|^tools/ci/fixtures/workflow-guard/parse\.yaml$)
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged)
        # 루트 .gitleaksignore의 fingerprint는 어느 룰의 finding이든 버린다. --gitleaks-ignore-path를 바꿔도
        # 스캔 루트의 파일을 따로 읽어 막지 못하므로(v8.30.1 실측) 파일이 있으면 멈춘다. ci도 같은 파일을 거부한다.
        entry: bash -c 'if [ -e .gitleaksignore ]; then echo ".gitleaksignore를 두지 않는다(gitleaks finding을 버린다)" >&2; exit 1; fi; exec gitleaks git --pre-commit --staged --redact --verbose --ignore-gitleaks-allow --config .gitleaks.toml'
        language: system
        pass_filenames: false
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.+\.ya?ml$
      - id: shellcheck
        name: shellcheck (host·tools scripts)
        # -x: host 스크립트가 source하는 env 파일까지 따라가 본다.
        entry: shellcheck -x -P SCRIPTDIR
        language: system
        types: [shell]
        files: ^(host|tools)/
      - id: workflow-guard
        name: workflow-guard (bun run ci의 워크플로 단계)
        # 전체 bun run ci는 렌더·Terraform까지 돌아 느리다. 커밋 때는 워크플로 검사만, 나머지는 PR의 ci가 본다.
        entry: bun tools/ci/main.ts --only workflows,workflow-guard
        language: system
        pass_filenames: false
        files: ^(\.github/workflows/|tools/ci/)
