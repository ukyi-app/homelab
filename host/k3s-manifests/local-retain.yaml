# 데이터용 StorageClass. install.sh --k3s가 k3s 자동 배포 디렉터리
# /var/lib/rancher/k3s/server/manifests/에 넣고, k3s가 시작할 때마다 다시 적용한다.
# 손으로 지워도 k3s를 재시작하면 돌아온다. Argo CD보다 먼저 있어야 해서 host 층에 둔다.
#
# 기본 클래스는 k3s 내장 local-path(Delete) 그대로다. PVC를 지워도 데이터가 남아야 하는
# 볼륨만 이 클래스를 고른다.
# - WaitForFirstConsumer는 필수다. local-path는 파드가 놓인 노드에 hostPath PV를 만들므로
#   Immediate면 노드를 몰라 바인딩에 실패한다.
# - StorageClass 필드는 바꿀 수 없다. reclaimPolicy를 고쳐도 적용이 실패하고, 이미 만든 PV의
#   reclaim은 SC를 바꿔도 그대로다. 처음부터 Retain으로 둔다.
# - hostPath PV에는 fsGroup이 적용되지 않는다. 쓰는 컨테이너의 uid를 맞춘다.
# - kubelet_volume_stats가 없고 용량 제한도 강제되지 않는다. 디스크는 node-exporter
#   파일시스템 지표와 경보로 본다.
# - PV는 /var/lib/rancher/k3s/storage 아래라 k3s-uninstall.sh가 함께 지운다. 보존은 R2 백업이 맡는다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-retain
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
