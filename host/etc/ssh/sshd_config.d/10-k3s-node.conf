# sshd 하드닝: root 로그인 금지, 키 인증만(H4). host/install.sh --host-config가 복사한다.
#
# 파일 이름의 10- 접두를 바꾸지 않는다. sshd_config는 키마다 먼저 읽힌 값이 이기고, 이 디렉터리의
# 파일은 사전순으로 읽힌다(systemd drop-in과 반대). Ubuntu의 50-cloud-init.conf보다 앞서야 하고,
# 60-으로 지으면 조용히 진다. install.sh가 이보다 앞서는 .conf가 없는지 확인한다.
#
# 운영 NUC의 원격 접속은 Tailscale SSH(sshd가 아님)이고 LAN 경로도 키가 있어 끊기지 않는다.
# 새 VM은 비밀번호 SSH가 막히므로 키나 콘솔 접근을 먼저 마련한다.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
