# 노드 자신의 이름 해석을 클러스터와 공유기에서 떼어 낸다(B.8 E2, H5).
# host/install.sh --host-config가 같은 경로의 /etc 아래로 복사한다.
#
# DNSStubListener=no: 바인드 충돌 때문이 아니다. CNI portmap이 hostPort :53을 DNAT할 때
# 목적지 주소를 가리지 않는다(-m addrtype --dst-type LOCAL). 127.0.0.53도 노드에게 LOCAL이라,
# 스텁이 켜져 있으면 노드의 질의가 AdGuard 파드로 끌려간다. 콜드스타트에 AdGuard가 아직 없으면
# 이름 해석이 안 되고, 이미지 pull이 막혀 AdGuard가 영영 뜨지 못한다.
#
# DNS=: 공유기를 넣지 않는다. 공유기가 LAN DNS를 AdGuard로 보내므로 노드 -> 공유기 -> AdGuard로
# 같은 교착이 한 홉 뒤에서 생긴다. 공유기를 1순위로 두면 AdGuard 장애 때마다 질의당 약 5초씩
# 늦는다. 폴백은 DNS=의 두 번째 항목이다. FallbackDNS=는 DNS=가 있으면 쓰이지 않는다.
# DNS= 줄을 둘 두면 덮어쓰지 않고 이어 붙어 앞줄이 1순위가 되므로 한 줄로만 둔다.
# 값은 host/versions.env의 NODE_UPSTREAM_DNS와 같아야 한다(install.sh가 복사 전에 대조).
#
# 이 파일만으로는 부족하다. 링크가 DHCP DNS를 받으면 링크별 DNS가 이 값보다 우선하고
# (networkd drop-in이 막음), tailscale의 ~. 라우팅이 모든 질의를 MagicDNS로 가져간다
# (install.sh가 tailscale set --accept-dns=false). 대가: 노드 질의는 평문 :53으로 공용 DNS에 간다.
[Resolve]
DNSStubListener=no
DNS=1.1.1.1 9.9.9.9
