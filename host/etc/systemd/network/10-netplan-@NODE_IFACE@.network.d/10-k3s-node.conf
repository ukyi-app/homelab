# 클러스터 인터페이스가 DHCP·RA로 받은 DNS를 쓰지 않게 한다(B.8 E2, H5).
# host/install.sh --host-config가 경로의 @NODE_IFACE@를 host/clusters/<이름>.env의 NODE_IFACE로
# 바꿔 /etc/systemd/network/10-netplan-<iface>.network.d/에 쓴다. host/etc/에서 경로를 바꿔 쓰는
# 파일은 이것 하나다.
#
# 링크별 DNS는 resolved.conf.d의 전역 DNS=보다 우선한다. DHCP가 AdGuard(노드 자신의 LAN IP라
# 노드에게 LOCAL, portmap DNAT에 걸림)나 AdGuard로 보내는 공유기를 광고하면 노드 이름 해석이 다시
# AdGuard에 묶인다. 이 파일이 있어야 전역 DNS=가 실제로 쓰인다. resolved drop-in과 한 쌍이다.
#
# 디렉터리 이름이 netplan이 만든 10-netplan-<iface>.network에 묶여 있다. 인터페이스가 바뀌면
# 이 파일은 조용히 무효가 된다. 그래서 install.sh가 링크의 실제 .network 이름과 맞는지 보고,
# preflight.sh --after가 링크 상태 파일에서 로드 여부와 빈 DNS를 본다.
# 설치만으로는 적용되지 않는다. networkctl reconfigure가 필요하고 그때 IPv4가 약 2초 사라진다.
#
# 옛 파일은 [DHCP] 하나였다. systemd 259 문서에는 그 절이 없어 문서에 있는 절 이름으로 나눠 적는다.
[DHCPv4]
UseDNS=false

[DHCPv6]
UseDNS=false

[IPv6AcceptRA]
UseDNS=false
