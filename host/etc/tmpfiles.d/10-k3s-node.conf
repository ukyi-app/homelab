# NVMe 링크의 ASPM L1을 끈다(H4). host/install.sh --host-config가 복사하고
# systemd-tmpfiles --create로 바로 적용한다. 부팅 때는 systemd-tmpfiles-setup.service가 다시 건다.
#
# 옛 NUC 실측: correctable PCIe 에러는 부하가 아니라 유휴에서 L1에 들어갔다 깨어날 때만 났고,
# 끄면 0건, 처리량 손실도 없었다. 데이터 위험은 없었지만 카운터가 쌓이면 진짜 링크 문제를
# 가리고 하드웨어 열화로 오독하게 된다. 대가는 유휴 전력이 조금 오르는 것뿐이다.
#
# PCI 주소가 아니라 드라이버 경유 glob을 쓴다. 슬롯이 바뀌거나 디스크를 더해도 그대로 맞는다.
# w는 대상이 없으면 아무것도 하지 않으므로 NVMe가 없는 VM에서도 실패하지 않는다.
w /sys/bus/pci/drivers/nvme/*/link/l1_aspm - - - - 0
