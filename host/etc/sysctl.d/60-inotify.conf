# inotify 인스턴스 한도(사용자마다). host/install.sh --host-config가 복사하고 sysctl --load로 바로 건다.
# 부팅 때는 systemd-sysctl.service가 다시 건다. host/verify.sh가 설치된 파일과 커널 값을 본다.
#
# 기본 128로는 모자랐다(2026-10-27 운영 NUC). k3s와 root로 도는 컨테이너가 root 몫을 거의 다 써서
# libvirt default 네트워크의 dnsmasq가 "failed to create inotify: Too many open files"로 뜨지 못했고,
# libvirtd가 virsh 요청에 답하지 않았다(vm.md 1.2). 사용자 네임스페이스를 쓰지 않아 컨테이너 안 root도
# 호스트 root와 한 몫으로 센다. 그래서 root 데몬 아무거나 같은 자리에서 실패할 수 있다.
# 감시 수(max_user_watches, 503713)는 충분해서 그대로 둔다.
#
# 8192는 k8s 노드 이미지가 쓰는 값이다(EKS AL2023 노드 이미지, awslabs/amazon-eks-ami의 sysctl.conf).
# 한도일 뿐이라 올려도 미리 쓰는 메모리는 없다. 대가는 인스턴스를 새는 프로세스가 더 늦게 드러나는 것이다.
# 운영 NUC와 VM이 같은 값을 쓴다(사용자 결정 2026-10-27).
#
# 60: Ubuntu 26.04 배포판 파일(/usr/lib/sysctl.d/50-*, 55-*)보다 뒤에 읽혀 같은 키가 생겨도 이 값이 이긴다.
fs.inotify.max_user_instances = 8192
