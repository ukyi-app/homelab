# expect: fail
# match: '/tmp/ledger' does not match pattern
# /tmp는 emptyDir 자리다. 원장을 그 아래에 두면 파드가 바뀔 때 사라진 줄 모른다.
chartVersion: 1.3.0
kind: web
port: 8080
resources: {cpu: 10m, memory: 32Mi}
repository: ghcr.io/ukyi-app/app
digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
revision: 0123456789abcdef0123456789abcdef01234567
hold: false
tailnetPrefix: ""
persistence: {existingClaim: deletion-ledger, mountPath: /tmp/ledger}
strategy: Recreate
