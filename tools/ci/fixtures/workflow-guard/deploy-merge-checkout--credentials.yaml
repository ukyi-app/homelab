# path: .github/workflows/deploy-merge.yaml
# expect: deploy-merge-checkout
# persist-credentials를 끄지 않으면 토큰이 .git/config에 남아 뒤 단계가 읽을 수 있다.
name: deploy-merge
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
jobs:
  merge:
    runs-on: ubuntu-24.04
    environment:
      name: automerge
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
