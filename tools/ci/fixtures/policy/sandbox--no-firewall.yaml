# check: sandbox
# expect: fail
# rule: sandbox
# match: 첫 init 컨테이너가 egress-firewall 하나여야 한다
# 방화벽 init이 없으면 netpol 적용 전 공백과 노드 로컬 경로가 열린다.
apiVersion: v1
kind: Service
metadata: {name: egress-proxy, namespace: egress}
spec:
  clusterIP: 10.43.0.28
  ports: [{name: proxy, port: 3128}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: sandbox}
spec:
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: x
          env: [{name: HTTPS_PROXY, value: "http://10.43.0.28:3128"}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
