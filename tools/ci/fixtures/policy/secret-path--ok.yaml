# check: secret-path
# expect: pass
# 대조군: 데이터 차트(영속 Valkey)와 platform/cnpg의 백업 자격, 앱 차트의 상대 키, 플랫폼 store의 절대 키.
# origin: data:smoke[prod]
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: app-smoke
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: /platform/backup/R2_ACCESS_KEY_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: app-smoke
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: smoke/valkey/PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: /platform/observability/X
