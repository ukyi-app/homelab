# check: readonly-rbac
# expect: fail
# 라벨을 떼면 verb 검사를 피한다. 이름과 bot-reader 바인딩이 잡는다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-readonly
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bot-reader
subjects:
  - kind: ServiceAccount
    name: bot-reader
    namespace: bot-slot-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-readonly
