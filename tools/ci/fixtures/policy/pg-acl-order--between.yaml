# check: pg-acl-order
# expect: fail
# rule: pg-acl-order
# match: 사이에 있다
# PVC가 Database와 같은 wave라 Pending이면 wave 3의 pg-acl이 돌지 않는다.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: smoke
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  cluster: { name: pg }
  name: smoke
  owner: smoke
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pg-acl-smoke
  namespace: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    metadata:
      labels:
        homelab.ukyi.app/role: pg-acl
    spec:
      restartPolicy: Never
      containers:
        - name: acl
          image: x
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  namespace: app-smoke
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
