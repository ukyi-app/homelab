# check: volume
# expect: fail
# rule: volume
# match: 작업자에는 원장이 보이지 않아야
# origin: bot-slot[prod]:platform/bot-slot
# 작업자(sandbox)에 원장 claim을 붙인다(설계 C.8).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sandbox
  labels: {homelab.ukyi.app/chart: app-1.3.0}
spec:
  strategy: {type: Recreate}
  replicas: 1
  template:
    metadata:
      labels: {homelab.ukyi.app/app: worker}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: app
          image: ghcr.io/ukyi-app/worker@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      volumes:
        - name: persistence
          persistentVolumeClaim: {claimName: deletion-ledger}
