# check: sandbox
# expect: fail
# rule: sandbox
# match: egress-proxy Service 주소
# 작업자 프록시 주소가 Service clusterIP와 다르면 init 규칙이 허용한 주소와 어긋난다.
apiVersion: v1
kind: Service
metadata: {name: egress-proxy, namespace: egress}
spec:
  clusterIP: 10.43.0.28
  ports: [{name: proxy, port: 3128}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: sandbox}
spec:
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: fw
          image: x
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [NET_ADMIN]}}
      containers:
        - name: worker
          image: x
          env: [{name: HTTPS_PROXY, value: "http://10.43.0.29:3128"}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
