# check: readonly-rbac
# expect: fail
# 읽기만이어도 Secret·로그는 읽지 않는다(설계 C.8, 봇 R05~R06).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-readonly
  labels:
    homelab.ukyi.app/readonly: "true"
rules:
  - apiGroups: [""]
    resources: [secrets, pods/log]
    verbs: [get]
