# check: sandbox
# expect: fail
# rule: sandbox
# match: 저장 공간:
# 마운트 지점 자체를 가리키면 마운트가 빠진 날 루트 디스크의 빈 디렉터리가 그대로 붙는다.
apiVersion: v1
kind: PersistentVolume
metadata: {name: worker-task-state}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: {namespace: sandbox, name: worker-task-state}
  local: {path: /var/lib/taskstate/mnt}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [ci-node]}]
