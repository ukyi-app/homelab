# check: secret-path
# expect: fail
# rule: secret-path
# match: /platform/backup/ 아래만
# 앱 store의 절대 키는 백업 자격만. 데이터 차트 렌더라도 다른 플랫폼 경로는 못 읽는다.
# origin: data:smoke[prod]
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: app-smoke
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: /platform/cloudflared/TUNNEL_TOKEN
