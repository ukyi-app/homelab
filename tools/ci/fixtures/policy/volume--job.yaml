# check: volume
# expect: fail
# rule: volume
# match: 게시 서버 Deployment만
# origin: bot-slot[prod]:platform/bot-slot
# 원장을 Job(백업·복원·마이그레이션 같은 일회성 파드)에 붙인다.
apiVersion: batch/v1
kind: Job
metadata:
  name: homelab-bot-migrate
  namespace: app-homelab-bot
  labels: {homelab.ukyi.app/chart: app-1.3.0}
spec:
  template:
    metadata:
      labels: {homelab.ukyi.app/app: homelab-bot-migrate}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532}
      containers:
        - name: app
          image: ghcr.io/ukyi-app/homelab-bot-migrate@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      volumes:
        - name: persistence
          persistentVolumeClaim: {claimName: deletion-ledger}
