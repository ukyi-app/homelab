# check: sandbox
# expect: fail
# rule: sandbox
# match: Localhost 프로필은
# node-exporter 프로필을 다른 워크로드가 가져다 쓴다. 예외는 observability의 DaemonSet node-exporter 컨테이너뿐이다.
apiVersion: apps/v1
kind: Deployment
metadata: {name: other, namespace: observability}
spec:
  selector: {matchLabels: {app: other}}
  template:
    metadata: {labels: {app: other}}
    spec:
      containers:
        - name: node-exporter
          image: x
          securityContext:
            appArmorProfile: {type: Localhost, localhostProfile: homelab-sandbox-node-exporter-v1}
