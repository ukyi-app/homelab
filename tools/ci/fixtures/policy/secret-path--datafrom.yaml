# check: secret-path
# expect: fail
# rule: secret-path
# match: /platform/backup/ 아래만
# dataFrom extract도 본다.
# origin: app:smoke[prod]
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: app-smoke
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  dataFrom:
    - extract:
        key: /apps/other/postgres
