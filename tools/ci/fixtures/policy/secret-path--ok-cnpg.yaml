# check: secret-path
# expect: pass
# 대조군: platform/cnpg가 database ns에 받는 백업 자격(t11-cnpg).
# origin: cnpg-cluster[prod]:platform/cnpg/cluster
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: database
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: /platform/backup/R2_ENDPOINT
