# check: readonly-rbac
# expect: fail
# 옛 사고: 관측 ClusterRole에 전역 delete를 더해도 필수 검사가 통과했다(L30).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-readonly
  labels:
    homelab.ukyi.app/readonly: "true"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
