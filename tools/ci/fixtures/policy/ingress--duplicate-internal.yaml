# check: ingress
# expect: fail
# 두 앱이 같은 tailnet 이름을 쓰면 뒤에 붙은 기기 이름이 바뀌어 선언한 주소로 닿지 않는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: a-internal
  namespace: app-a
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [shared]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: b-internal
  namespace: app-b
spec:
  ingressClassName: tailscale
  tls:
    - hosts: [shared]
