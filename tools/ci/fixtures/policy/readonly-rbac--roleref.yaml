# check: readonly-rbac
# expect: fail
# rule: readonly-rbac
# match: 읽기 전용 라벨 역할이 아닌 ClusterRole/cluster-admin
# 옛 사고: roleRef를 cluster-admin으로 바꿔도 통과했다(L30).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-readonly
  labels:
    homelab.ukyi.app/readonly: "true"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bot-reader
subjects:
  - kind: ServiceAccount
    name: bot-reader
    namespace: bot-slot-probe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
