# check: workload
# expect: fail
# rule: image-digest
# match: digest 고정이 아니다
# ReplicationController도 파드 템플릿을 배포한다.
apiVersion: v1
kind: ReplicationController
metadata:
  name: x
  namespace: app-x
spec:
  replicas: 1
  template:
    metadata: {labels: {app: x}}
    spec:
      containers:
        - name: x
          image: nginx:latest
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
