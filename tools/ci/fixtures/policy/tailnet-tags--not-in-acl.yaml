# check: tailnet-tags
# expect: fail
# rule: tailnet-tags
# match: tagOwners에 tag:k8s-operator가 없다
# ACL에 없는 태그. operator가 인증 키를 못 받아 Ingress가 Progressing에 머문다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: x
  namespace: app-x
  annotations:
    tailscale.com/tags: tag:not-in-acl
