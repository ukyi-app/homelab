# check: sandbox
# expect: pass
# 작업 레인 조합은 worker-task의 worker 컨테이너에만 있고, init은 RuntimeDefault, 라벨·자격·PVC는 worker와 나뉜다(설계 C.8).
apiVersion: v1
kind: Service
metadata: {name: egress-proxy, namespace: egress}
spec:
  clusterIP: 10.43.0.28
  ports: [{name: proxy, port: 3128}]
---
apiVersion: v1
kind: Service
metadata: {name: worker, namespace: sandbox}
spec: {selector: {app: worker}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: worker-task, namespace: sandbox}
spec: {selector: {app: worker-task}, ports: [{port: 8080}]}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: worker-task-state}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef: {namespace: sandbox, name: worker-task-state}
  local: {path: /var/lib/taskstate/mnt/data}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions: [{key: kubernetes.io/hostname, operator: In, values: [ci-node]}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: worker-task-state, namespace: sandbox}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: worker-task-state
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker-task, namespace: sandbox}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: worker-task}}
  template:
    metadata: {labels: {app: worker-task}}
    spec:
      hostUsers: false
      shareProcessNamespace: true
      automountServiceAccountToken: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      volumes:
        - {name: firewall-run, emptyDir: {}}
        - {name: credential, secret: {secretName: worker-task-credential-claude-subscription}}
        - {name: worker-state, persistentVolumeClaim: {claimName: worker-task-state}}
      initContainers:
        - name: egress-firewall
          image: docker.io/nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
          command: ["/bin/sh", "-euc"]
          args:
            - |
              for t in iptables ip6tables; do
                "$t" -P OUTPUT DROP
                "$t" -F OUTPUT
                "$t" -A OUTPUT -o lo -j ACCEPT
                "$t" -A OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
              done
              iptables -A OUTPUT -d "$PROXY_IP/32" -p tcp --dport "$PROXY_PORT" -m conntrack --ctstate NEW -j ACCEPT
              iptables -A OUTPUT -j REJECT
              ip6tables -A OUTPUT -j REJECT
              iptables -S OUTPUT
              ip6tables -S OUTPUT
          volumeMounts: [{name: firewall-run, mountPath: /run}]
          env: [{name: PROXY_IP, value: "10.43.0.28"}, {name: PROXY_PORT, value: "3128"}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [NET_ADMIN]}}
      containers:
        - name: worker
          image: x
          env: [{name: HTTPS_PROXY, value: "http://10.43.0.28:3128"}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            procMount: Unmasked
            seccompProfile: {type: Localhost, localhostProfile: homelab/sandbox-worker-v1.json}
            appArmorProfile: {type: Localhost, localhostProfile: homelab-sandbox-worker-v1}
