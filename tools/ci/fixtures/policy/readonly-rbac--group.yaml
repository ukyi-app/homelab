# check: readonly-rbac
# expect: fail
# rule: readonly-rbac
# match: 그룹)를 같은 렌더의 읽기 전용 라벨 역할이 아닌
# SA는 system:serviceaccounts 그룹에 자동으로 든다. 그룹 바인딩으로 bot-reader에 쓰기 권한이 생긴다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: all-sa-admin
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
