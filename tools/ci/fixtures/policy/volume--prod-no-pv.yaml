# check: volume
# expect: fail
# rule: volume
# match: 같은 클러스터(prod)에 PV
# origin: data:homelab-bot[prod]
# 운영에서 PVC가 가리키는 PV가 없다(이름 오타). Pending으로 남아 봇이 뜨지 않는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deletion-ledger
  namespace: app-homelab-bot
  annotations: {argocd.argoproj.io/sync-options: "Prune=false,Delete=false"}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: local-ledger
  volumeName: homelab-bot-ledger
  resources: {requests: {storage: 1Gi}}
