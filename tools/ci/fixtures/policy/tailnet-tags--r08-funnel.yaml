# check: tailnet-tags
# expect: fail
# rule: tailnet-tags
# match: Funnel을 쓰지 않는다
# Funnel은 인터넷 공개다. R08은 tailnet 전용이다(사용자 결정 2026-11-06).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelab-bot-r08
  namespace: app-homelab-bot
  annotations:
    tailscale.com/tags: tag:k8s-r08
    tailscale.com/funnel: "true"
