# check: sandbox
# expect: fail
# rule: sandbox
# match: shareProcessNamespace: true는
# 다른 차트의 파드. 켜면 같은 파드의 컨테이너끼리 프로세스와 환경이 보인다.
apiVersion: apps/v1
kind: Deployment
metadata: {name: other, namespace: app-other}
spec:
  selector: {matchLabels: {app: other}}
  template:
    metadata: {labels: {app: other}}
    spec:
      shareProcessNamespace: true
      containers:
        - {name: app, image: x}
