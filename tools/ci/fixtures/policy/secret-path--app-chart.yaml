# check: secret-path
# expect: fail
# rule: secret-path
# match: 데이터 차트와 platform/cnpg 렌더에서만
# 앱 차트(앱 렌더)는 백업 자격을 받지 않는다.
# origin: app:smoke[prod]
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: x
  namespace: app-smoke
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: x
  data:
    - secretKey: K
      remoteRef:
        key: /platform/backup/R2_SECRET_ACCESS_KEY
