# expect: fail
# rule: olive-isolation
# match: RoleBinding를 두지 않는다
# 감독 네임스페이스에 감독 SA를 묶는 RoleBinding. 감독에게 Kubernetes 권한이 없다(D-37).
patch:
  - in: chart
    add:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: {name: supervisor-edit, namespace: olive-control}
      roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
      subjects: [{kind: ServiceAccount, name: supervisor, namespace: olive-control}]
