# expect: fail
# rule: olive-executor-split
# match: 볼륨 effect-signing이 표의 Secret olive-effect-signing-key의 키 EFFECT_SIGNING_KEY 하나가 아니다
# 효과 서명 키 볼륨이 다른 Secret(olive-tls)을 가리킨다. 실행기가 그 키로 서명하지 못하거나 다른 비밀을 키로 읽는다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.volumes:
        match: {name: effect-signing}
        set: {secret.secretName: olive-tls}
