# expect: fail
# rule: olive-targets
# match: role은 roles 안의 계약 v1 역할 이름 하나다
# also: olive-executor-split
# 읽기 실행기에 배정한 역할(role)을 그 대상의 역할 목록(roles) 밖의 v1 역할(pr_review)로 바꿨다. 목록에 없는 역할로 도는 실행기다.
# 렌더된 OLIVE_ROLE·역할 이미지가 role과 어긋나 분할 검사도 잡는다.
patch:
  - in: targets
    select: {id: reader}
    set: {role: pr_review}
