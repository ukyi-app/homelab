# expect: fail
# rule: olive-executor-split
# match: env TLS_KEY에 valueFrom을 두지 않는다
# 대리 설치 init 컨테이너에 TLS 개인 키를 env로 넣었다. init은 역할 컨테이너가 읽는 agent-bin에 쓸 수 있다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-diagnosis, name: executor}
    edit:
      spec.template.spec.initContainers:
        match: {name: olive-init}
        set:
          env: [{name: TLS_KEY, valueFrom: {secretKeyRef: {name: olive-tls, key: tls.key}}}]
