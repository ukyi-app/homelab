# expect: fail
# rule: olive-ignore-differences
# match: 대상 writer(Deployment sandbox/worker-task)에 적용되는 넓은 예외다
# 지금 root(olive가 꺼진 조합)의 sandbox Application에만 writer를 덮는 넓은 예외가 있다. 대상 차트를 켠 root만 보면 놓치는데,
# 클러스터에 적용되는 것은 지금 root의 Application이다. Respect 옵션은 함께 넣어 이 위반만 나게 한다.
patch:
  - in: apps
    render: root
    select: {kind: Application, name: sandbox}
    append:
      spec.ignoreDifferences: {group: apps, kind: "*", jsonPointers: [/spec/replicas]}
      spec.syncPolicy.syncOptions: RespectIgnoreDifferences=true
