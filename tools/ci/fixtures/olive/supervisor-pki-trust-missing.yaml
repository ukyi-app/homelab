# expect: fail
# rule: olive-supervisor-env
# match: 볼륨 이름이 감독 표와 다르다: 빠짐 ["trust"]
# pki와 신뢰 묶음을 켠 차트 ci 렌더에서 감독의 신뢰 볼륨과 마운트만 뺐다. 진입점은 /run/olive/trust의 묶음을 읽지 못해 92로 끝난다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-control, name: supervisor}
    remove:
      spec.template.spec.volumes: {name: trust}
      spec.template.spec.containers.0.volumeMounts: {name: trust}
