# expect: fail
# rule: olive-isolation
# match: 대상 자료 밖의 워크로드다
# 읽기 실행기 네임스페이스에 CronJob을 더했다. 정지는 대상 Deployment만 내리고 자물쇠는 이미 뜬 파드를 막지 못한다.
# 이 위반만 나도록 SA·보안 문맥은 올리브 격리 조건에 맞춘다.
patch:
  - in: chart
    add:
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: cleanup, namespace: olive-reader}
      spec:
        schedule: "0 * * * *"
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: executor
                automountServiceAccountToken: false
                restartPolicy: Never
                containers:
                  - name: cleanup
                    image: x
                    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
