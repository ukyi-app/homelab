# expect: fail
# rule: olive-executor-split
# match: OLIVE_AGENT_SOCKET(["/run/olive/agent/."])이 표의 /run/olive/agent/agent.sock 하나가 아니다
# 두 컨테이너의 소켓을 같은 값 /run/olive/agent/.로 바꿨다. 폴더는 맞고 두 값도 같지만 파일 이름이 폴더 자신을 가리켜 소켓이 아니다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.containers:
        match: {name: role}
        set:
          env:
            - {name: OLIVE_AGENT_SOCKET, value: /run/olive/agent/.}
            - {name: BUN_OPTIONS, value: ""}
            - {name: BUN_BE_BUN, value: ""}
            - {name: LD_PRELOAD, value: ""}
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.containers:
        match: {name: executor}
        set:
          env:
            - {name: OLIVE_ROLE, value: isolated_reader}
            - {name: OLIVE_INSTANCE, value: reader}
            - {name: OLIVE_POLICY_REVISION, value: ci-policy}
            - {name: OLIVE_SIGNING_KEY_FILE, value: /run/olive/effect-signing/EFFECT_SIGNING_KEY}
            - {name: OLIVE_SUPERVISOR_URI, value: "spiffe://olive.internal/ns/olive-control/supervisor"}
            - {name: OLIVE_STORE_DIR, value: /var/lib/olive-executor/store}
            - {name: OLIVE_AGENT_SOCKET, value: /run/olive/agent/.}
