# expect: fail
# rule: olive-executor-split
# match: 이 계약 v1 revision 꼴(^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$)의 값 하나가 아니다(감독.
# 감독의 OLIVE_POLICY_REVISION만 빈 값으로 렌더했다. 진입점이 81로 끝난다. 실행기는 견줄 감독 값이 없어 꼴만 본다. 값 파일의 빈 값은 렌더가 먼저 멈춘다
# (olive.ts policyRevisionRenderTest). 이 fixture는 렌더를 거치지 않은 모양도 CI가 잡는지 대상 하나씩 본다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-control, name: supervisor}
    edit:
      spec.template.spec.containers.0.env:
        match: {name: OLIVE_POLICY_REVISION}
        set: {value: ""}
