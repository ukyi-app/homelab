# expect: pass
# init이 기본 종료 메시지 경로를 명시했다. 생략과 같으므로 위반 0건이어야 한다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.initContainers:
        match: {name: olive-init}
        set: {terminationMessagePath: /dev/termination-log}
