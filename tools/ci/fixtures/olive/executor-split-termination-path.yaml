# expect: fail
# rule: olive-executor-split
# match: terminationMessagePath("/opt/olive-generation/marker")가 생략도 기본 /dev/termination-log도 아니다(executor
# 제어의 종료 메시지 파일을 세대 표식 경로에 두었다. kubelet이 그 자리에 빈 파일을 붙여 init이 쓴 표식을 가리고,
# 제어는 빈 표식을 읽어 generation_malformed로 94를 반복한다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.containers:
        match: {name: executor}
        set: {terminationMessagePath: /opt/olive-generation/marker}
