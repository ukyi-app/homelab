# expect: fail
# rule: olive-targets
# match: role은 roles 안의 계약 v1 역할 이름 하나다
# also: olive-executor-split
# 읽기 실행기에 배정한 역할(role)에 대상 id(reader)를 적었다. 계약 v1의 역할 이름이 아니라 실행기가 받지 않는다(D-64).
# 렌더된 실행기의 OLIVE_ROLE(isolated_reader)과 역할 이미지가 role과 어긋나 분할 검사도 잡는다.
patch:
  - in: targets
    select: {id: reader}
    set: {role: reader}
