# expect: fail
# rule: olive-executor-store
# match: 밖에 붙이지 않는다
# also: olive-executor-split
# 진단 실행기 파드의 역할 컨테이너(D-100)에 상태 저장소를 붙였다. 다른 uid의 모델이 저장소 ID·nonce·영수증을 고칠 수 있다.
# 분할 검사(비밀·PVC는 executor에만)도 같은 마운트를 잡는다.
patch:
  - in: all
    select: {kind: Deployment, namespace: olive-diagnosis, name: executor}
    edit:
      spec.template.spec.containers:
        match: {name: role}
        set:
          volumeMounts:
            - {name: agent-bin, mountPath: /opt/olive-agent, readOnly: true}
            - {name: agent-link, mountPath: /run/olive/agent, readOnly: true}
            - {name: role-tmp, mountPath: /tmp}
            - {name: store, mountPath: /var/lib/olive-executor}
