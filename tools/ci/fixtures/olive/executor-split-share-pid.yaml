# expect: fail
# rule: olive-executor-split
# match: shareProcessNamespace를 두지 않는다
# 진단 실행기 파드가 PID 공간을 나누게 했다. 역할 쪽에서 제어 프로세스와 /proc/<pid>/root로 그 파일에 닿는다(D-102).
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-diagnosis, name: executor}
    set:
      spec.template.spec.shareProcessNamespace: true
