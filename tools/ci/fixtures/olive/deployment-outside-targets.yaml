# expect: fail
# rule: olive-chart-targets
# match: targets.yaml에 없는 Deployment다
# platform/olive가 대상 자료에 없는 Deployment를 만든다. 올리브 ns 밖이라 olive-isolation은 보지 않는 자리다.
patch:
  - in: chart
    add:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: helper, namespace: default}
      spec:
        replicas: 0
        selector: {matchLabels: {app: helper}}
        template:
          metadata: {labels: {app: helper}}
          spec:
            automountServiceAccountToken: false
            containers: [{name: helper, image: x}]
