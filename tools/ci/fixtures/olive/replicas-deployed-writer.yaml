# expect: fail
# rule: olive-replicas
# match: 대상 writer의 spec.replicas가 0이 아니다(1)
# 지금 root(켜진 sandbox)의 VM 값 렌더에서만 작성 Deployment가 1이다. ci/*.yaml 렌더만 보면 놓친다.
# 전제(지금 root의 VM에 sandbox Application과 작성 Deployment가 있다)를 켠 root에서 복사해 직접 만든다. sandbox가 prod에만 켜진
# 구성에서도 이 사례가 같은 것을 증명한다.
patch:
  - {in: render, render: root, select: {kind: Application, name: sandbox, origin: "root-vm[vm]:platform/root"}, drop: true}
  - {in: render, render: root, from: root+켬, select: {kind: Application, name: sandbox, origin: "root-vm[vm]:platform/root"}}
  - {in: render, render: root, select: {origin: "sandbox[vm]:platform/sandbox", kind: Deployment, name: worker-task}, drop: true}
  - {in: render, render: root, from: root+켬, select: {origin: "sandbox[vm]:platform/sandbox", kind: Deployment, name: worker-task}}
  - in: render
    render: root
    select: {origin: "sandbox[vm]:platform/sandbox", kind: Deployment, namespace: sandbox, name: worker-task}
    set: {spec.replicas: 1}
