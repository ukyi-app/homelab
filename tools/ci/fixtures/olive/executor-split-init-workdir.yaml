# expect: fail
# rule: olive-executor-split
# match: workingDir("/opt/olive-agent")가 생략도 이미지 작업 폴더 /app도 아니다(olive-init
# 대리 설치 init의 작업 폴더를 빈 설치 폴더로 바꿨다. bun이 상대 경로 src/main/agent-install.ts를 그 아래에서 찾아 init이 끝나지 않는다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-reader, name: executor}
    edit:
      spec.template.spec.initContainers:
        match: {name: olive-init}
        set:
          workingDir: /opt/olive-agent
