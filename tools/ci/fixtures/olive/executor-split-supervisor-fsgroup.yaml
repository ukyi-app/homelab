# expect: fail
# rule: olive-executor-split
# match: 감독 파드의 fsGroup(없음)이 65532가 아니다
# 감독 파드에서 fsGroup 한 줄만 뺐다(templates/_helpers.tpl olive.podSecurity). 서명 키·계정·TLS Secret은 0440이라 감독이 읽지 못한다.
# 실행기 파드에서 뺀 것과 달리 감독에는 있어야 한다(D-103).
patch:
  - in: all
    select: {kind: Deployment, namespace: olive-control, name: supervisor}
    unset: [spec.template.spec.securityContext.fsGroup]
