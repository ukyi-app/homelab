# expect: fail
# rule: olive-executor-split
# match: OLIVE_AGENT_SOCKET이 두 컨테이너에서 다르다
# 역할 컨테이너의 소켓 경로를 같은 폴더의 다른 이름으로 바꿨다. 대리가 붙지 못해 제어가 hello를 기다리다 끝난다.
patch:
  - in: chart
    select: {kind: Deployment, namespace: olive-diagnosis, name: executor}
    edit:
      spec.template.spec.containers:
        match: {name: role}
        set:
          env:
            - {name: OLIVE_AGENT_SOCKET, value: /run/olive/agent/other.sock}
            - {name: BUN_OPTIONS, value: ""}
            - {name: BUN_BE_BUN, value: ""}
            - {name: LD_PRELOAD, value: ""}
