# expect: fail
# rule: olive-owner
# match: 대상 writer의 자리에 다른 소스 adguard(platform/adguard)가 Deployment를 낸다
# owner-other-source.yaml의 다른 표기: metadata.namespace를 빈 문자열로 적었다. Argo CD는 빈 namespace를 destination(sandbox)으로
# 채우므로 생략과 같은 자리다.
patch:
  - in: render
    render: root
    origin: "adguard[vm]:platform/adguard"
    ns: sandbox
    add:
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: worker-task, namespace: ""}
      spec:
        replicas: 0
        selector: {matchLabels: {app: worker-task}}
        template:
          metadata: {labels: {app: worker-task}}
          spec: {containers: [{name: worker, image: x}]}
