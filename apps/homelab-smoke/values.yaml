# homelab app add가 만들었다(설계 C.7). 이 파일은 사람이 고쳐도 된다. CLI는 다루는 키만 바꾼다.
chartVersion: 1.1.0
kind: web
port: 8080
resources: { cpu: "50m", memory: "128Mi" }
public: { host: smoke.ukyi.app }
uses: { postgres: true, valkey: true }
# T13 시나리오 2. 시험 앱 코드에 마이그레이션이 없어 이미지의 bun으로 멱등 DDL만 돈다(Bun.sql은 DATABASE_URL을 읽는다).
# 역할이 아직 없으면 접속 실패로 Job이 실패하고 Argo CD retry로 수렴한다(설계 G 시나리오 2).
migration:
  command:
    - bun
    - -e
    - 'await Bun.sql`create table if not exists t13_smoke (id int primary key, at timestamptz not null default now())`; console.log("migrate ok"); process.exit(0)'
secrets: [T13_SMOKE_TOKEN, T13_MISSING_KEY]
