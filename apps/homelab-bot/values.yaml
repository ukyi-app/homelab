# homelab app add가 만들었다(설계 C.7). 이 파일은 사람이 고쳐도 된다. CLI는 다루는 키만 바꾼다.
chartVersion: 1.2.0
kind: web
port: 8080
# 실측 전 값이다(Node 24 게시 서버, pg Pool·Gateway WebSocket). memory는 limit도 같다. 첫 배포 뒤 사용량을 보고 줄인다.
resources: { cpu: "100m", memory: "256Mi" }
secrets: [DISCORD_BOT_TOKEN, GITHUB_REVIEW_WEBHOOK_SECRET, GRAFANA_READER_TOKEN, HEALTHCHECKS_PING_URL, RUNTIME_POLICIES, WORKER_CONTROL_PRIVATE_KEY]
uses: { postgres: true }
# GitHub webhook 공개 경로 https://hooks.ukyi.app/github(설계 C.8, D6 (a)). 차트 Ingress는 설계의 /github Exact가 아니라
# / Prefix다. 밖에서는 Cloudflare WAF 규칙 1(infra/cloudflare/main.tf)이 /github POST 밖을 먼저 막고, 봇도 8080의 그 밖
# 경로는 404로 답한다. 함정: WAF를 거치지 않는 클러스터 안 요청(Traefik web에 닿는 cloudflared 파드 등)이
# Host: hooks.ukyi.app을 붙이면 /readyz·/metrics까지 닿는다. 이 host를 다른 Ingress가 함께 쓰면 Traefik은 규칙 길이가
# 같을 때 어느 쪽으로 보낼지 정하지 않는다(edge-probe를 같은 PR에서 지운 이유).
public: { host: hooks.ukyi.app }
# 봇은 /healthz가 없다. /readyz는 DB·루프 상태를 본다. Gateway가 끊겨도 Ready를 유지해야 webhook·경보 수신이
# 계속된다(봇 ARCHITECTURE §8). 그래서 liveness는 두지 않는다(Gateway 단절은 지표 경보로 알린다).
probes: { readiness: { path: /readyz } }
# 적용된 버전은 건너뛰고 advisory lock으로 동시 실행을 막는다(봇 #12). Sync hook Job이라 매 sync마다 돈다.
migration: { command: ["node", "dist/src/migrate-main.js"] }
# K8s API 읽기(파드 상태·Argo CD Application CR, D8·D9)는 platform/bot-slot이 이 ns에 만든 읽기 전용 SA로 한다.
serviceAccountName: bot-reader
# 비밀이 아닌 주소. 봇은 기본값 없이 이 env를 요구하고, 경로는 / 하나만 받는다.
# 봇 파드 → 이 셋은 bot-slot NetworkPolicy가 연다(작업자 8080, Grafana 3000, API Endpoint 6443).
env:
  # 이 클러스터의 파드 egress는 IPv4만이다(공유 차트 정책). Node 기본 happy eyeballs는 주소마다 250ms만 기다려
  # 먼 IPv4(hc-ping.com 독일, 왕복 약 300ms)를 모두 끊고 ETIMEDOUT을 낸다(2026-10-30 첫 배포 하트비트 실패 실측).
  # IPv4를 먼저 고르고 시도당 2초를 준다. 클러스터 안 주소와 Discord(Cloudflare)는 영향 없다.
  NODE_OPTIONS: "--dns-result-order=ipv4first --network-family-autoselection-attempt-timeout=2000"
  WORKER_URL: "http://worker.sandbox:8080/"
  GRAFANA_URL: "http://grafana.observability:3000/"
  KUBERNETES_API_URL: "https://kubernetes.default.svc/"
