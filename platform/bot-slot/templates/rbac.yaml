{{- /*
(3) 읽기 전용 Kubernetes 자격(설계 C.8 읽기 전용 접근 (a), AC-P12). 봇은 공유 차트의 serviceAccountName: bot-reader로 토큰을 받는다.
get·list·watch만. secrets·configmaps·pods/log·pods/exec는 없다. 기본 역할 view는 configmaps를 읽어 쓰지 않는다.
라벨 homelab.ukyi.app/readonly가 붙은 역할은 ci(tools/ci/policy.ts checkReadonlyRbac, L30)가 verb·자원·roleRef를 본다.
aggregationRule을 쓰지 않는다. 다른 역할의 권한을 끌어온다.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bot-reader
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homelab-readonly
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
    homelab.ukyi.app/readonly: "true"
rules:
  - apiGroups: [""]
    resources: [pods, services, events, nodes, namespaces, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  # kubectl events는 events.k8s.io를 먼저 읽는다.
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, databases, backups]
    verbs: [get, list, watch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bot-reader
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: bot-reader
    namespace: {{ .Values.target.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab-readonly
