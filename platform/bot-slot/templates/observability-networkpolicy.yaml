{{- /*
받는 쪽 observability 허용 둘. 설계 C.8은 "observability에 ingress 정책을 두지 않는다"를 전제했지만 실제 스택(#834,
platform/observability/stack/networkpolicy.yaml)은 ingress 기본 거부이고 Alertmanager egress도 좁힌다.
그래서 봇 경로가 그 정책들에 막히지 않게 여기서 더한다. 그쪽 파일은 고치지 않는다(봇 값이 두 곳으로 나뉘지 않게).
*/}}
# 봇 → Grafana 3000. Grafana 정책은 tailscale ns에서만 ingress를 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-slot-grafana-ingress
  namespace: observability
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.target.namespace }}
          podSelector:
            matchLabels:
              {{- include "botSlot.targetSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 3000
---
# Alertmanager → 봇 경보 수신 포트. Alertmanager egress는 DNS와 인터넷 443(10.0.0.0/8 제외)뿐이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-slot-alertmanager-egress
  namespace: observability
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.target.namespace }}
          podSelector:
            matchLabels:
              {{- include "botSlot.targetSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.target.alertPort }}
