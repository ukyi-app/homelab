{{- /*
R08 수신 경로(설계 C.3.5·C.8, 사용자 결정 2026-11-06): 사람 helper → https://<접두><serviceName>.<tailnet>.ts.net/external-task-events
→ 전용 Tailscale 프록시 → 이 Service → 봇 R08 리스너. 인터넷 공개·Funnel·NodePort는 없다.

켜는 순서가 중요하다: ACL apply → root의 cluster.r08.enabled를 켜는 PR. 태그가 ACL에 없으면 operator의 인증 키 발급이 실패해
(v1.104.1 sts.go newAuthKey) Ingress status가 비고, Argo CD는 그동안 Progressing으로 본다(v3.5.5 health_ingress.go).
Degraded가 아니라 ArgoCDAppDegraded가 울리지 않는다. operator가 재시도하므로 나중에 apply하면 Ingress를 다시 만들지 않아도 풀린다.
다른 리소스는 막지 않는다. 이 차트는 단일 wave(probe와 함께 켜지 않는다, schema)라 Application이 Ingress health를 기다리지 않고,
bot-slot은 root의 마지막 wave라 root도 기다리지 않는다(gitops-engine sync_context.go, tools/ci checkBotSlotLastWave).
그래서 여기에 sync-wave를 붙이지 않는다. 붙여 다단계가 되면 Ingress가 뒤 wave를 막을 수 있다.

Service selector는 matchExpressions가 없어 마이그레이션 Job 파드(같은 app 라벨)를 뺄 수 없다(alert-service.yaml과 같은 한계).
Job이 도는 동안 요청 일부가 실패할 수 있고 helper가 재전송한다.
*/}}
{{- if .Values.r08.enabled }}
{{- $name := include "botSlot.r08Name" . }}
{{- $host := printf "%s%s" .Values.tailscale.prefix .Values.r08.serviceName }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "botSlot.targetSelector" . | nindent 4 }}
  ports:
    - name: r08
      port: {{ .Values.r08.port }}
      targetPort: {{ .Values.r08.port }}
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
  annotations:
    # operator는 Ingress의 ProxyClass를 annotation에서 읽는다. operator의 defaultProxyClass와 같은 값이다.
    tailscale.com/proxy-class: homelab-proxy
    # 이 태그 하나만. tag:k8s를 함께 붙이면 member·tag:nuc → tag:k8s:443 규칙이 이 프록시에도 적용된다.
    # 태그는 프록시의 인증 키를 처음 만들 때만 쓰이고, operator는 메타데이터만 바뀐 변경을 무시한다. 바꿀 때는 Ingress를 다시 만든다(설계 P21).
    tailscale.com/tags: tag:k8s-r08
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ $host | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # 다른 경로는 프록시가 404로 끝내 리스너까지 오지 않는다. operator는 Prefix만 지원하고 Exact도 Prefix로 다뤄 하위 경로는 통과한다.
          # 보안 경계는 이 줄이 아니라 POST /external-task-events만 받는 리스너와 서명이다.
          # 프록시는 사람 기기 요청에 Tailscale-User-Login 등 신원 헤더를 더해 넘긴다. 리스너는 이 헤더를 믿지도 남기지도 않는다.
          - path: /external-task-events
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: r08
{{- end }}
