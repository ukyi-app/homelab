{{- /*
(1) 봇 ns 정책(설계 C.8 담는 것 (1)). 공유 차트의 기본 거부·허용 목록(C.4.5)에 봇만 쓰는 경로를 더한다.
차트의 인터넷 443 규칙이 사설 대역(10/8·172.16/12·192.168/16)을 빼서 이 경로들은 차트만으로는 막힌다. NetworkPolicy는 허용의 합집합이다.
포트는 Service 포트가 아니라 DNAT 뒤 실제 목적지 포트다(이 k3s의 kube-router는 kube-proxy DNAT 뒤 패킷에 정책을 건다).
vmsingle·VictoriaLogs·Alertmanager API는 열지 않는다. Alertmanager API는 침묵을 만들 수 있다.
Argo CD API(argocd-server)도 열지 않는다. 봇은 Application 상태를 SA로 Kubernetes API에서 읽는다(T16b D9).
Kubernetes API는 노드 로컬 경로지만 이 k3s(v1.36.5+k3s1)의 kube-router는 INPUT 체인에서도 파드 egress를 검사한다.
허용이 없으면 거부된다(T16b D8, 시험 파드 실측). 여는 것은 Endpoint IP의 TCP 6443뿐이고, 읽을 수 있는 범위는
SA bot-reader의 읽기 전용 역할이 정한다(rbac.yaml). 네트워크 허용은 HTTP 메서드·자원을 제한하지 않는다.
*/}}
{{- $api := .Values.kubernetesApi.endpointCIDRs }}
{{- if not $api }}
{{- fail "kubernetesApi.endpointCIDRs가 비었다. root가 values-<클러스터>.yaml의 cluster.kubernetesApi.endpointCIDRs를 넘겨야 한다(platform/root/templates/bot-slot.yaml)" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bot-slot
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "botSlot.labels" . | nindent 4 }}
spec:
  podSelector:
    {{- include "botSlot.targetPodSelector" . | nindent 4 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 경보 수신. 받는 쪽 Alertmanager의 egress는 observability-networkpolicy.yaml이 연다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: {{ .Values.target.alertPort }}
  egress:
    # 작업 전달. 받는 쪽 허용은 sandbox-networkpolicy.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: sandbox
          podSelector:
            matchLabels:
              {{- include "botSlot.workerSelector" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.target.workerPort }}
    # 대시보드 보기·데이터소스 질의(Grafana SA bot-reader). 받는 쪽 허용은 observability-networkpolicy.yaml.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 3000
    # Kubernetes API(SA bot-reader). 봇은 https://kubernetes.default.svc(10.43.0.1:443)로 부르지만 정책이 보는 것은
    # DNAT 뒤 Endpoint IP:6443이다. 10.43.0.1/32:443을 열면 맞지 않아 거부가 그대로 남는다(T16b D8 후보 B).
    - to:
        {{- range $api }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 6443
