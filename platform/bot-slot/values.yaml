# 대상 값 하나(설계 C.8). E4b~E8은 시험 값이었고, E9(T16b)가 봇 등록 PR보다 먼저 봇 값으로 바꿨다(D-15).
# 봇을 지울 때는 시험 값(namespace·app bot-slot-probe)과 probe: true로 되돌린다. 봇 ns 값을 남기면 다음 콜드스타트에서
# 이 Application이 ns를 기다리며 끝없이 재시도한다(이 Application은 대상 ns를 만들지 않는다).
# 그때 vmalert core.yaml TargetMissing의 job="bot-slot" 줄과 rules/bot.yaml도 함께 지운다. 시험 값에서는 지표 Service가
# 없어 그 줄이 계속 울린다(templates/metrics-service.yaml).
target:
  # 봇 파드가 도는 ns. 시험 값이면 probe: true가 이 ns를 만든다.
  namespace: app-homelab-bot
  # 봇 파드의 homelab.ukyi.app/app 라벨 값(공유 차트의 selector 라벨).
  app: homelab-bot
  # sandbox 작업자 컨테이너 포트. platform/sandbox의 worker 컨테이너 포트와 같아야 한다(values.schema.json이 8080으로 묶는다).
  workerPort: 8080
  # 봇의 경보 수신 포트. 앱 포트(공개 webhook, 8080)와 갈라 Traefik과 Alertmanager의 허용을 포트로 나눈다(D-15).
  alertPort: 8081
  # 봇 지표(GET /metrics) 포트. 봇은 /metrics를 앱 서버(8080, 봇 src/http.ts PORTS.publisher)에서만 낸다.
  # apps/homelab-bot/values.yaml의 port와 같은 값이다(차트가 달라 참조하지 못해 schema가 8080으로 묶는다).
  metricsPort: 8080

# E4b~E8 준비 확인용. 시험 ns, 공유 차트 정책을 손으로 옮긴 정책, 시험 파드 둘을 만든다.
# target.namespace가 bot-slot-probe일 때만 true다(values.schema.json).
probe: false

# 봇이 SA bot-reader로 읽는 Kubernetes API의 실제 Endpoint(default/kubernetes의 EndpointSlice 주소). T16b D8.
# 클러스터 값이라 여기는 빈 자리값이고, root가 values-<클러스터>.yaml의 cluster.kubernetesApi.endpointCIDRs를 넘긴다
# (platform/root/templates/bot-slot.yaml). 비면 렌더가 실패한다. 운영 주소를 기본값으로 두면 VM이 조용히 물려받는다.
# schema가 IPv4 /32만, 중복 없이 받고 0·127·파드(10.42/16)·Service(10.43/16) 대역을 거부한다.
# Service IP(10.43.0.1)로는 열리지 않는다: 정책은 kube-proxy DNAT 뒤 목적지(노드 IP:6443)에 걸린다.
# 파드·Service 대역은 k3s 기본값(host/clusters/*.env의 POD_CIDR·SERVICE_CIDR)이다. 바꾸면 schema도 바꾼다.
kubernetesApi:
  endpointCIDRs: []
