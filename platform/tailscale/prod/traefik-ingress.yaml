# Traefik :443(websecure)을 tailnet에 TCP passthrough로 노출하는 tailscale LoadBalancer.
# 예전엔 tailscale Ingress(L7 Serve)로 homelab.<tailnet>.ts.net cert를 종단했으나, 그러면
# *.home.ukyi.app SNI를 못 받아 브라우저가 cert 불일치로 실패했다. 이제 L4 passthrough로
# 바꿔 TLS가 Traefik까지 도달하고, Traefik이 web-internal-tls 리스너의 와일드카드 cert로
# 종단한다. 체인: 기기 → AdGuard(*.home → 이 디바이스 IP) → (TCP, tailnet 암호화) → Traefik :443.
apiVersion: v1
kind: Service
metadata:
  name: traefik-ts
  namespace: gateway
  annotations:
    # 요청 machine name. ⚠️ 이 값이 곧 tailnet 이름은 아니다 — coordination server가 충돌 시 `-N` 접미를
    # 붙이고(2026-08 Mac 시대 잔존 디바이스 `homelab`이 이름을 점유해 `homelab-1`로 등록), 노드 hostname이
    # 안 바뀌면 재파생하지 않는다(2026-09-02 실측: 죽은 디바이스 제거 + 프록시 파드 재시작 후에도 `-1` 유지 —
    # 되찾으려면 admin console 수동 rename). 실제 이름·IP의 SSOT는 이 Service의 `status.loadBalancer.ingress[]`
    # 이고, AdGuard rewrite 리컨실러(platform/adguard)가 그 IP를 따라간다. 100.x IP는 state Secret이 살아 있는
    # 한 안정적이다(파드 재시작 무관).
    tailscale.com/hostname: homelab
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/instance: traefik-gateway
    app.kubernetes.io/name: traefik
  ports:
    - { name: https, port: 443, targetPort: websecure, protocol: TCP } # → Traefik :8443
