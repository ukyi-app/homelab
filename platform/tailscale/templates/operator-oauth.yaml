{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
# operator OAuth client(Services·Devices Core·Auth Keys write, 태그 tag:k8s-operator). 공식 설치 문서 기준이다.
# 차트는 oauth.clientId를 비워 두면 같은 ns의 Secret operator-oauth(client_id, client_secret)를 마운트한다.
# wave -1: operator 파드(wave 0)보다 먼저 Secret이 있어야 한다. 없으면 파드가 볼륨을 못 붙여 Application이 멈춘다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale/OPERATOR_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: tailscale/OPERATOR_OAUTH_CLIENT_SECRET
{{- end }}
