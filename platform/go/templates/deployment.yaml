{{- /* nginx 1.30.6(2026-10-21 기준 stable), alpine-slim 멀티 아키텍처 index(2026-10-21 Docker Hub에서 확인). init도 같은 이미지다. */}}
{{- $image := "docker.io/nginxinc/nginx-unprivileged:1.30.6-alpine-slim@sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go
  namespace: go
spec:
  # 상태가 없다. 멈춰도 전체 주소(https://<이름>.<tailnet>.ts.net)는 그대로라 짧은 입력만 잠시 없어진다(D-30).
  replicas: 1
  selector:
    matchLabels:
      app: go
  template:
    metadata:
      labels:
        app: go
      annotations:
        # ConfigMap만 바뀌면 파드가 다시 뜨지 않아 옛 규칙이 남는다.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged 이미지의 nginx 사용자.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 시작 검사: tailnet 도메인이 비었거나 <이름>.ts.net 꼴이 아니면 여기서 멈춰 파드가 서비스하지 않는다.
        # 잘못된 값으로 뜨면 모든 go/<이름>이 엉뚱한 호스트로 간다. 값 자체는 출력하지 않는다(D-23).
        # 값이 바뀌어도(tailnet 이름 변경) 파드는 다시 뜨지 않는다. ExternalSecret 갱신 뒤 파드를 다시 만든다.
        - name: render-config
          image: {{ $image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              d="${TAILNET_DOMAIN:-}"
              # 줄바꿈 등 라벨 밖 문자를 먼저 거른다. grep은 줄 단위라 둘째 줄만 맞아도 통과한다.
              case "$d" in
                "" | *[!a-z0-9.-]*) echo "TAILNET_DOMAIN is empty or has invalid characters" >&2; exit 1 ;;
              esac
              printf '%s\n' "$d" | grep -Eqx '[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.ts\.net' || {
                echo "TAILNET_DOMAIN is not <name>.ts.net" >&2
                exit 1
              }
              sed "s/__TAILNET_DOMAIN__/$d/g" /etc/go/nginx.conf.tmpl > /run/go/nginx.conf
              nginx -t -q -c /run/go/nginx.conf -e stderr
          env:
            - name: TAILNET_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: go-tailnet
                  key: TAILNET_DOMAIN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: template
              mountPath: /etc/go
              readOnly: true
            - name: run
              mountPath: /run/go
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      containers:
        - name: nginx
          image: {{ $image }}
          command: ["nginx", "-c", "/run/go/nginx.conf", "-e", "stderr", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # kubelet 프로브는 노드에서 오므로 NetworkPolicy에 막히지 않는다(설계 B.8).
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: run
              mountPath: /run/go
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        - name: template
          configMap:
            name: go-nginx
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
