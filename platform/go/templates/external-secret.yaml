{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
# tailnet 도메인(<이름>.ts.net)을 실행 때 넣는다. 저장소·이미지에 두지 않는다(D-23).
# 운영은 Infisical homelab/prod, VM은 homelab-dev/dev의 같은 경로 /platform/go/TAILNET_DOMAIN이다.
# VM도 같은 tailnet에 붙으므로 값이 같다(접두 vm-는 차트가 붙인다).
# wave -1: Deployment보다 먼저 Secret이 있어야 init 컨테이너가 CreateContainerConfigError로 멈추지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go-tailnet
  namespace: go
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: go-tailnet
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: TAILNET_DOMAIN
      remoteRef:
        key: go/TAILNET_DOMAIN
{{- end }}
