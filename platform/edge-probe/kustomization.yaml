# 공개 경로 시험 앱(T08a 검증, 설계 C.3.4 준비 확인·C.8 webhook 경로). e3-probe와 같은 방식의 임시 Application이다.
# - edge-probe.ukyi.app: GET/HEAD / 가 200. 터널 → Traefik → Ingress 경로 확인용.
# - hooks.ukyi.app/github: POST만, GitHub X-Hub-Signature-256(HMAC)만 검사. 봇 배포 때(T16b) 이 경로를 봇에 넘기고 지운다.
# 정리: 이 디렉터리, root 템플릿 edge-probe.yaml, values.yaml의 edgeProbe 블록을 함께 지우고 Infisical 키를 지운다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - externalsecret.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
