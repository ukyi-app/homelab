apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-probe
  namespace: app-edge-probe
data:
  server.py: |
    # 표준 라이브러리만 쓴다. 비밀값과 요청 본문은 로그에 남기지 않는다.
    import hashlib
    import hmac
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    SECRET = os.environb[b"GITHUB_WEBHOOK_SECRET"]
    PROBE_HOST = os.environ["PROBE_HOST"]
    HOOKS_HOST = os.environ["HOOKS_HOST"]
    MAX_BODY = 256 << 10  # ping·시험 본문은 수 KB다. 서명 검사 전에 읽으므로 작게 둔다
    # 공개 경로라 서명을 모르는 클라이언트도 연결을 열 수 있다. 동시 처리 수와 소켓 읽기 시간을 묶어
    # 느린 본문 전송으로 스레드·메모리가 쌓여 유일한 파드가 멈추지 않게 한다.
    SLOTS = threading.BoundedSemaphore(8)


    class Handler(BaseHTTPRequestHandler):
        server_version = "edge-probe"
        sys_version = ""
        timeout = 5  # 소켓 읽기 제한(초). 넘으면 연결을 끊는다

        def handle(self):
            if not SLOTS.acquire(blocking=False):
                try:
                    self.wfile.write(b"HTTP/1.1 503 Service Unavailable\r\nContent-Length: 0\r\nConnection: close\r\n\r\n")
                except OSError:
                    pass
                return
            try:
                super().handle()
            finally:
                SLOTS.release()

        def reply(self, code, body=b""):
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(body)

        def host(self):
            return (self.headers.get("Host") or "").split(":")[0].lower()

        def do_GET(self):
            if self.path == "/healthz":
                return self.reply(200, b"ok\n")
            if self.host() == PROBE_HOST and self.path == "/":
                return self.reply(200, b"edge-probe ok\n")
            self.reply(404)

        do_HEAD = do_GET

        def do_POST(self):
            # 수신 경로는 hooks host 하나다. edge-probe host의 / Prefix로 들어온 /github는 WAF 규칙 1을 거치지 않는다.
            if self.host() != HOOKS_HOST or self.path != "/github":
                return self.reply(404)
            try:
                length = int(self.headers.get("Content-Length") or "0")
            except ValueError:
                return self.reply(400)
            if length < 0 or length > MAX_BODY:
                return self.reply(413)
            body = self.rfile.read(length)
            expected = "sha256=" + hmac.new(SECRET, body, hashlib.sha256).hexdigest()
            # 상수 시간 비교(C.8). 길이가 달라도 같은 함수로 비교한다.
            if not hmac.compare_digest(self.headers.get("X-Hub-Signature-256", ""), expected):
                return self.reply(401)
            self.reply(200, ("ok " + self.headers.get("X-GitHub-Event", "") + "\n").encode())

        def log_message(self, fmt, *args):
            # 메서드·경로·상태만. 클라이언트 주소는 터널이라 의미가 없다.
            # 잘못된 요청은 command·path가 정해지기 전에 기록될 수 있다.
            print(f"{getattr(self, 'command', '-')} {getattr(self, 'path', '-')} {args[1] if len(args) > 1 else ''}", flush=True)


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
