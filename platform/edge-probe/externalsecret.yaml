# 시험 webhook과 함께 쓰는 HMAC 비밀. 사람이 Infisical homelab/prod /apps/edge-probe/GITHUB_WEBHOOK_SECRET에 무작위 값을
# 만들고, GitHub 시험 webhook의 Secret 칸에 같은 값을 넣는다. 설계에 보관 위치가 없어 앱 경로에 둔다(T08a "필요한 자격").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: edge-probe
  namespace: app-edge-probe
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: edge-probe
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # store의 secretsPath(/apps)에 이어 붙는 상대 경로다. /로 시작하면 secretsPath를 무시한다(U06).
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: edge-probe/GITHUB_WEBHOOK_SECRET
