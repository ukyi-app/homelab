apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-probe
  namespace: app-edge-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-probe
  template:
    metadata:
      labels:
        app: edge-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          # python 3.15.0-alpine 멀티 아키텍처 index(2026-10-20 Docker Hub에서 확인). 표준 라이브러리만 쓴다.
          image: docker.io/library/python:3.15.0-alpine@sha256:2699b90f4d562a22e2dd076c82f964032f64814204bff36d271a54ba4cc2c7e2
          command: ["python", "-I", "-u", "/app/server.py"]
          env:
            - name: PROBE_HOST
              value: edge-probe.ukyi.app
            # secretKeyRef, optional 없음: 키가 없으면 파드가 시작하지 않는다(빈 비밀로 서명을 통과시키지 않게).
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: edge-probe
                  key: GITHUB_WEBHOOK_SECRET
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: edge-probe
