{{- /*
Grafana UI를 https://<접두>grafana.<tailnet>.ts.net 으로(설계 C.3.5·C.3.7). 짧은 이름은 TLS 연결 실패다.
operator Ingress reconcile은 메타데이터만 바뀐 변경을 무시한다. 이름·주석을 바꿀 때는 Ingress를 다시 만든다(설계 P21).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    # operator는 Ingress의 ProxyClass를 annotation에서 읽는다. operator의 defaultProxyClass와 같은 값이다.
    tailscale.com/proxy-class: homelab-proxy
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - {{ printf "%sgrafana" .Values.tailscale.prefix | quote }}
  rules:
    - host: {{ printf "%sgrafana" .Values.tailscale.prefix | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
