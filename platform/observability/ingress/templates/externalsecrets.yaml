{{- /*
관측 스택의 자격(Alertmanager receiver 둘, Grafana 관리자). 본체는 ../stack(kustomize)에 있고 같은 observability
Application의 두 번째 source인 이 차트로 옮겼다(T23). 복구 스위치(externalSecrets.enabled)를 Helm 값으로 받아야 하는데
stack은 룰·알림 템플릿의 이중 중괄호 때문에 Helm으로 바꿀 수 없어서다. 같은 Application 안이라 Argo CD 추적은 그대로다.
끄면(externalSecrets.enabled: false) 셋 다 내지 않는다. 같은 이름 Secret은 손으로 만든다.

Alertmanager는 receiver마다 다른 ExternalSecret과 optional 볼륨이다. *_file을 보낼 때마다 읽으므로(0.34.1 notify/telegram,
notify/webhook) Secret이 아직 없어도 파드는 뜨고 그 receiver만 실패하며(alertmanager_notifications_failed_total), Secret이
생기면 kubelet이 볼륨을 채워 재시작 없이 보낸다. 키 하나가 없을 때 다른 receiver까지 막지 않으려고 receiver별로 나눴다.
다만 키가 없는 ExternalSecret은 Degraded라 observability Application도 Degraded이고, root가 뒤 wave를 기다린다.
켜기 전에 Infisical 키를 먼저 넣는다.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: alertmanager-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 ES의 Argo CD tracking 주석까지 Secret으로 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: token
      remoteRef:
        key: alerting/TELEGRAM_BOT_TOKEN
    # chat ID는 비밀은 아니지만 개인 식별자라 공개 저장소에 두지 않는다(chat_id_file).
    - secretKey: chat_id
      remoteRef:
        key: alerting/TELEGRAM_CHAT_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-healthchecks
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: alertmanager-healthchecks
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: ping_url
      remoteRef:
        key: alerting/HEALTHCHECKS_PING_URL
---
# Grafana 관리자. Grafana 파드는 이 Secret을 볼륨으로 붙인다(../stack/grafana.yaml). optional이 아니라 없으면 파드가 뜨지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: grafana-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: user
      remoteRef:
        key: observability/GRAFANA_ADMIN_USER
    - secretKey: password
      remoteRef:
        key: observability/GRAFANA_ADMIN_PASSWORD
{{- end }}
