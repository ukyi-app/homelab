# vmauth: Grafana 데이터소스(vmsingle·VictoriaLogs) 앞의 읽기 전용 프록시(vmauth/auth.yaml).
# vmalert는 쓰기가 필요해 vmsingle에, vector는 VictoriaLogs에 직접 붙는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmauth
  labels:
    app.kubernetes.io/name: vmauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmauth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8426"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmauth
          # v1.154.1, Docker Hub 멀티 아키텍처 index 확인: 2026-10-23. vmsingle과 같은 버전으로 올린다.
          image: victoriametrics/vmauth:v1.154.1@sha256:d8c65a73b8a30a0777417d43a13fbfaea1da1aa4ec4cd68905baf996072376bf
          args:
            - -auth.config=/etc/vmauth/auth.yaml
            - -httpListenAddr=:8427
            # 내부 API(/metrics, /-/reload, /flags, /debug/pprof)를 다른 포트로 뗀다. 같은 포트면 Grafana 쪽에서
            # 인증 키 없이 /-/reload·pprof에 닿는다. 8426은 NetworkPolicy상 vmsingle 수집만 닿는다.
            - -httpInternalListenAddr=:8426
          env:
            - name: GOMEMLIMIT
              value: "48MiB"
          ports:
            - name: http
              containerPort: 8427
            - name: internal
              containerPort: 8426
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # 로컬 실측 유휴 RSS 약 14Mi. 응답은 버퍼에 담지 않고 흘려 보낸다.
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /health
              port: internal
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/vmauth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vmauth-config
---
apiVersion: v1
kind: Service
metadata:
  name: vmauth
  labels:
    app.kubernetes.io/name: vmauth
spec:
  selector:
    app.kubernetes.io/name: vmauth
  ports:
    - name: http
      port: 8427
      targetPort: http
