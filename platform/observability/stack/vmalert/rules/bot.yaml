# 봇(homelab-bot) 자신의 상태 경보(봇 ARCHITECTURE §8 (c)). 지표는 vmsingle/scrape.yaml의 bot-slot job이 모은다.
# service 라벨을 붙이지 않는다. 봇 receiver는 등록 서비스가 아닌 경보를 감사만 남기고 202로 버려 Telegram(형제 route)만 받는다.
# 봇이 자기 장애를 Discord로 알리지 못하고(Gateway 단절), 자기 게시 불확실 경보를 다시 게시하는 되먹임도 막는다.
# 수집이 끊기면 아래 시계열이 없어져 이 룰들은 조용하다. 그 경우는 TargetDown(up == 0)과 TargetMissing(Service 없음)이 본다.
groups:
  - name: bot
    rules:
      # 봇은 Gateway가 끊겨도 Ready를 유지해(webhook·경보 수신 계속) KubePodNotReady로는 안 잡힌다. 이 지표가 유일한 클러스터 안 신호다.
      # 10분: 정상 재연결은 RESUME 몇 초, 재시도 backoff 상한이 60초 + 지터 1초라 연속 실패 9번 남짓을 넘겨야 운다.
      # 하트비트(healthchecks.io)는 Gateway가 5분 넘게 끊기면 ping을 멈춘다(봇 gatewayGraceMs). 이 경보는 같은 사건의 클러스터 안 경로다.
      # 봇이 heartbeat ACK 누락(약 45초)을 보면 close 응답을 기다리지 않고 바로 0으로 바꾸고 재연결한다. close 이벤트만 기다리면
      # 망이 패킷을 버릴 때(DROP) 13분 동안 1로 남아 이 경보가 울리지 않는다(S16 실측).
      - alert: HomelabBotGatewayDisconnected
        expr: homelab_bot_gateway_connected == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 봇 Discord Gateway가 10분 넘게 끊겼다. Discord 메시지·명령을 받지 못한다
          description: "봇은 Ready라 webhook·경보 수신은 계속된다. 봇 로그의 gateway_retry·gateway_drop 사유와 파드의 인터넷 443을 본다."

      # unknown은 Discord 전송 결과를 모르는 게시다. 자동 재전송은 0회이고, 대조가 30초마다 마커를 찾는다(간격 1초부터 두 배, 상한 15분).
      # 15분: 응답만 잃은 게시는 첫 대조(1분 안)에서 sent가 된다. 15분이면 검색 9번 남짓이 지나 사람이 볼 일이다.
      # 24시간 지나거나 100건을 넘으면 봇이 blocked로 닫아(감사 delivery_unresolved_retired) 이 경보가 풀린다. 풀렸다고 전달된 것은 아니다.
      - alert: HomelabBotOutboxUnknown
        expr: homelab_bot_outbox_unknown > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "봇 게시 {{ $value }}건의 Discord 전달 여부를 15분 넘게 확인하지 못했다"
          description: "자동 재전송은 하지 않는다. 해당 스레드에 답이 올라갔는지 Discord에서 보고, 봇 감사 로그를 확인한다."

  # 작업 레인(봇 T18). 게시 서버는 TASK_LANE_ENABLED가 켜져 있고 정책의 task 절이 유효할 때만 작업자·레인 시계열을 낸다.
  # 스위치를 끄면 그 시계열이 통째로 없어 이 그룹은 조용하다.
  # 함정: 스위치를 켰는데 정책이 틀려도(policy_invalid) 그 시계열은 똑같이 없다. 둘을 가르는 것은 스위치·정책과 무관하게 나오는
  # homelab_bot_task_gate_closed다(HomelabBotTaskGateClosed). 이 시계열을 내지 않는 봇 이미지에서는 이 경보도 조용하고 게시 서버 로그 task_gate에만 남는다.
  # 전부 warning이다. 작업 레인만 막히고 대화·리뷰는 계속되어, 원장처럼 약속이 깨지는 critical과 다르다.
  # warning이면 Telegram 형제 route로 간다. 봇 Discord 안내는 Gateway가 끊기면 받지 못하므로 이 경로가 비AI 신호다.
  - name: task-lane
    rules:
      # 사유는 봇 taskPrecondition이 정한다(switch_off, policy_invalid). 닫힌 사유 줄만 1이고 열렸거나 작업자를 기다리면 모두 0이다.
      # switch_off는 사람의 결정이라 울리지 않는다. 판정은 기동 때 한 번이라 스스로 풀리지 않는다.
      # 10분: 정책을 고쳐 다시 띄우는 동안의 닫힘은 넘긴다.
      - alert: HomelabBotTaskGateClosed
        expr: homelab_bot_task_gate_closed{reason!="switch_off"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "봇 작업 레인이 {{ $labels.reason }} 사유로 10분 넘게 닫혀 있다. 스위치는 켜져 있다"
          description: "작업 명령을 등록하지 않고 작업 레인 지표도 없다. 대화·리뷰는 계속된다. 게시 서버 로그 task_gate를 보고 Infisical RUNTIME_POLICIES의 task 절을 고친다. 기동 때 한 번만 판정하므로 고친 뒤 봇을 다시 띄워야 풀린다."

      # routed·intake_open은 게시 서버가 30초마다 GET /v1/task/intake로 알아낸 값이다. routed는 작업 모드 작업자가 200과 맞는 모양으로
      # 답했다는 뜻이고, intake_open은 그 답의 open이다. 닿지 못하면 둘 다 0이라 intake_open만 보면 미연결과 섞인다.
      # 작업자는 볼륨·자격 문제에도 Ready를 유지해 KubePodNotReady로 잡히지 않는다. 같은 볼륨의 NodeFilesystemAlmostFull은
      # 여유 10%를 보므로 쓰기 오류·자격 문제는 못 본다.
      # 10분: 원인이 풀리면 작업자의 다음 검사(30초)에 저절로 열린다. 검사 20번 남짓을 못 넘기는 일시 오류는 울리지 않는다.
      - alert: HomelabBotTaskWorkerIntakeClosed
        expr: homelab_bot_task_worker_intake_open == 0 and homelab_bot_task_worker_routed == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 봇 작업자(worker-task)가 10분 넘게 새 작업을 받지 않는다
          description: "작업자는 Ready이고 대화·리뷰는 계속된다. 사유는 라벨에 없다. 작업자 로그 task_intake_closed의 reason, 게시 서버 로그 task_worker_intake의 reasons, 작업자 /v1/task/intake로 본다. 볼륨 사유면 /list로 대기 작업을 끝내 공간을 비운다."

      # 다음을 모두 routed 0으로 낸다: 연결 실패, 5초 시간 초과, 200이 아닌 응답(옛 이미지·작업 모드가 아닌 작업자의 404), 모양이 다른 답.
      # 기동 검사 실패도 여기로 온다. /readyz가 503이라 Service 주소에서 빠진다. 그때는 KubePodNotReady(15분)도 함께 운다.
      # Ready인데 닿지 않는 경우(NetworkPolicy, 잘못된 TASK_WORKER_URL, 옛 이미지)는 이 경보만 본다.
      # 10분: 작업자는 Recreate라 이미지를 바꾸면 새 파드가 Ready가 될 때까지 0이다. 게시 서버 기동 직후 첫 검사 전의 0도 넘긴다.
      - alert: HomelabBotTaskWorkerUnrouted
        expr: homelab_bot_task_worker_routed == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 봇 게시 서버가 작업자(worker-task)에 10분 넘게 닿지 않는다
          description: "새 작업을 받지 못하고 세션 정리 재시도도 실패한다. 대화·리뷰는 계속된다. sandbox의 worker-task 파드 상태와 로그 task_lane_closed를 보고, Ready면 이미지, WORKER_LANES, NetworkPolicy, 게시 서버 TASK_WORKER_URL을 본다."

      # task_lane_closed는 DB의 닫힘 사유이고 지금 사유 하나만 1이다. unknown이 cleanup_pending을, cleanup_pending이 retention_full을 가린다.
      # 가려졌던 사유가 드러나면 그 경보의 for는 처음부터 센다. 사유마다 시간 규모와 할 일이 달라 룰을 나눈다.
      # unknown은 작업 프로세스가 끝났는지 모르는 상태다. 작업 레인은 자동 대조가 없어 /task-release로만 풀린다.
      # 5분: 봇 Discord 안내가 먼저 나갈 시간이다. 스스로 풀리지 않아 더 기다려도 얻는 것이 없다.
      - alert: HomelabBotTaskLaneUnknown
        expr: homelab_bot_task_lane_closed{reason="unknown"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 봇 작업 레인이 unknown으로 5분 넘게 닫혀 있다. 사람이 풀어야 한다
          description: "종료를 확인하지 못한 작업이 있고 스스로 풀리지 않는다. 대화·리뷰는 계속된다. /list로 작업을 찾아 /task-release target:<job-id>로 해제한다. 작업자가 프로세스 소멸을 확인해야 풀린다."

      # 봇이 30초마다 세션 공간 삭제를 다시 시도하고, 지워지면 저절로 열린다.
      # 15분: 재시도 30번이다. HomelabBotTaskWorkerUnrouted(10분)보다 길어, 작업자 재시작 동안의 실패는 그쪽이 먼저 알린다.
      - alert: HomelabBotTaskLaneCleanupPending
        expr: homelab_bot_task_lane_closed{reason="cleanup_pending"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 봇 작업 레인이 cleanup_pending으로 15분 넘게 닫혀 있다
          description: "끝난 작업의 세션 공간을 지웠는지 확인하지 못해 새 작업을 받지 않는다. 대화·리뷰는 계속된다. 작업자에 닿는지(HomelabBotTaskWorkerUnrouted)와 작업자 로그, 작업 볼륨 상태를 본다."

      # 보존 세션이 8개면 새 작업만 닫고, 보존 중인 세션을 잇는 일은 계속된다.
      # 1시간: 질문 대기는 1시간이면 만료되어 한 칸이 빈다. 그 뒤에도 차 있으면 모델 대기처럼 자동 폐기가 없는 세션이 칸을 쥔 것이다.
      - alert: HomelabBotTaskLaneRetentionFull
        expr: homelab_bot_task_lane_closed{reason="retention_full"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 봇 작업 레인 보존 세션 8개가 1시간 넘게 차 있다
          description: "새 작업을 받지 않는다. 대화·리뷰는 계속된다. /list로 대기 작업을 보고 /answer·/resume-model로 끝내거나 /task-cancel로 멈춘다."

  # R08 읽기 전용 알림 수신(봇 ARCHITECTURE §15). 지표는 리스너 8082가 아니라 봇 8080 /metrics에 붙어 bot-slot job이 모은다.
  # 8082는 readiness에 묶이지 않아 KubePodNotReady로는 안 잡힌다. 스위치가 꺼지거나 봇 파드가 없으면(VM은 Pending) 시계열이 없어 조용하다.
  # 함정: 스위치를 끈 뒤에도 쌓인 알림은 계속 나가지만 시계열이 없어 이 그룹으로는 보이지 않는다.
  # 함정: 미게시 수를 DB에서 읽어, DB가 끊기면 /metrics 전체가 503이고 이 그룹도 조용하다. 그때는 TargetDown이 운다.
  # 사람 세션의 턴 완료를 알리는 부가 기능이라 전부 warning이다.
  # DB 슬롯 포화(db_waiting)는 룰을 두지 않는다. 대기는 5초 안에 끝나 요청이 닿는 순간의 표본만 0이 아니고, 슬롯이 묶이면 대기가 unavailable로 끝나 아래가 본다.
  - name: external-task
    rules:
      # pending은 outbox를 따라가고 보냈는지 모르는 unknown도 여기 센다. 평소 게시는 몇 초라 15분이면 게시가 막힌 것이다.
      # 막히는 원인: Discord REST 401, 정책 읽기 실패, 스레드 기록 공백(게시자가 멈춰 두고 재시도), 전송 결과 미상(HomelabBotOutboxUnknown도 운다).
      # 15분: HomelabBotOutboxUnknown과 같다. 연결별 100건·전체 1,000건이 차면 수신이 429·503으로 거절한다.
      - alert: HomelabBotExternalTaskUnposted
        expr: homelab_bot_external_task_unposted > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "봇 R08 미게시 알림 {{ $value }}건이 15분 넘게 Discord에 나가지 않았다"
          description: "사람 세션의 턴 완료 알림이 밀려 있다. 전체 1,000건·연결별 100건이 차면 수신도 거절한다. 봇 로그의 게시 오류와 HomelabBotOutboxUnknown을 보고 Discord 토큰(REST 401)과 정책을 확인한다. 받지 않을 연결은 /detach로 막는다."

      # unavailable은 수신의 내부 오류다: 처리 기한 5초 초과, 복원 장벽·DB 오류(로그 external_task_error), 정책 읽기 실패(로그 없음).
      # 값이 아니라 늘어나는지 본다(카운터, 재기동하면 0부터). 사람 세션의 알림이라 요청이 드물고 helper 재시도 간격이 15분까지 벌어져,
      # 창 20분이어야 실패가 이어지는 동안 값이 끊기지 않는다. 창보다 긴 for 30분이라 DB 장애 조치 같은 10분 미만의 실패는 울리지 않는다.
      - alert: HomelabBotExternalTaskUnavailable
        expr: increase(homelab_bot_external_task_requests{outcome="unavailable"}[20m]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 봇 R08 수신이 30분 넘게 503(unavailable)으로 실패한다
          description: "helper가 큐에 두고 재시도하지만 발생 뒤 24시간이 지난 알림은 버린다. 봇 로그 external_task_error, 정책 RUNTIME_POLICIES 읽기, DB 지연을 본다. 대화·리뷰와 경보 수신은 R08에 묶이지 않는다."

  # 기억 삭제 원장(D-12 후속, 원장 계약 v1). 원장이 열리지 않아도 봇은 Ready를 유지하고 기억 경로만 닫는다(T20 2단계 계약).
  # 그래서 KubePodNotReady로는 안 잡히고 이 룰들이 유일한 신호다. 절차는 restore.md 4절.
  - name: deletion-ledger
    rules:
      # 운영만 본다. VM에는 SSD가 없어 bot-slot이 원장 PV·StorageClass local-ledger를 만들지 않는다(values-vm.yaml).
      # 그 PV가 있는 클러스터에서만 /mnt/bulk 시계열을 기대한다. 룰은 클러스터 값 없이 kustomize로 같으므로(E8 VM 격리 1번)
      # 클러스터 이름 대신 원장 PV의 존재로 가른다.
      # 미마운트면 node-exporter에 그 mountpoint 시계열이 없다(nofail이라 OS·k3s는 뜬다). local PV는 미마운트를 구분하지
      # 못해 루트 디스크 쪽 같은 경로를 붙일 수 있다. node-exporter가 안 보일 때(up 없음·0)는 TargetDown이 보고 이 룰은 조용하다.
      # 함정: /mnt/bulk는 host/clusters/prod.env의 BULK_MOUNT, PV 경로(values-prod.yaml deletionLedger.path)와 같아야 한다.
      - alert: HomelabBotLedgerDiskNotMounted
        expr: |
          max by (persistentvolume) (kube_persistentvolume_info{storageclass="local-ledger"})
          unless on() node_filesystem_size_bytes{mountpoint="/mnt/bulk", fstype="ext4"}
          and on() up{job="node-exporter"} == 1
        # 5분: fstab 줄이 nofail(장치 대기 10초)이라 부팅 때 마운트가 k3s보다 조금 늦을 수 있다. 그 틈과 수집 한두 번의 누락을 넘긴다.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "삭제 원장 PV {{ $labels.persistentvolume }}가 있는데 /mnt/bulk(ext4)가 마운트돼 있지 않다"
          description: "봇 기억 삭제가 멈춘다. 파드를 재시작하지 말고 NUC에서 findmnt /mnt/bulk, sudo -v && host/verify.sh --cluster prod로 SSD를 본다."
          runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

      # ext4 errors=remount-ro 등으로 읽기 전용이 되면 원장 append가 EROFS로 실패한다. 기존 NodeFilesystemAlmostFull은
      # 읽기 전용을 빼고 본다. 스스로 풀리지 않는 상태라 for 없이 바로 울린다. VM에는 이 mountpoint가 없어 조용하다.
      - alert: HomelabBotLedgerDiskReadOnly
        expr: node_filesystem_readonly{mountpoint="/mnt/bulk"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} /mnt/bulk(삭제 원장 SSD)가 읽기 전용이다"
          description: "봇 기억 삭제가 원장에 기록되지 않는다. dmesg·journalctl -k에서 ext4 오류를 보고 사람이 fsck·재마운트를 판단한다."
          runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

      # failed: 이 프로세스는 원장을 더 쓰지 않는다(fsync 실패 등). fenced: 단일 작성자 잠금(DB advisory lock)을 잃었다.
      # 함정: 봇은 열기 실패(missing·generation_mismatch·lock_held 등)도 failed로 낸다. 재시도할 수 있는 열기 실패는 60초마다
      # 다시 연다. Recreate 재기동 직후 옛 파드의 DB 세션이 잠금을 아직 쥐면(lock_held) 잠깐 failed가 된다.
      # 5분: 재열기 4~5번이 모두 실패해야 운다. 정상 재기동의 lock_held는 옛 세션이 끝나면 다음 재열기에서 풀린다.
      # 쓰는 중의 failed·fenced는 재기동 전까지 풀리지 않아 5분 뒤 그대로 운다.
      - alert: HomelabBotLedgerFailed
        expr: homelab_bot_deletion_ledger_state{state=~"failed|fenced"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "봇 삭제 원장 상태가 {{ $labels.state }}다. 기억 기능이 닫혔고 삭제가 끝나지 않는다"
          description: "봇 로그의 deletion_ledger_<사유>(stage·errno)를 본다. 쓰는 중의 failed·fenced는 재기동 전까지 닫혀 있다. 원장 파일을 지우거나 새로 만들지 않는다."
          runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

      # closed: 아직 열지 않았다(첫 Gateway READY 전) 또는 종료 중. degraded: 마지막 원장 작업이 재시도할 수 있는 오류(디렉터리
      # fsync·쓰기·읽기)로 실패했다. 다음 성공에 ready가 된다.
      # 30분: failed(5분)보다 길게 둔다. 둘 다 스스로 풀릴 수 있는 상태다. closed가 길어지는 흔한 원인(Gateway 단절로 첫 READY
      # 지연)은 HomelabBotGatewayDisconnected(10분)가 먼저 알리고, degraded로 삭제가 밀리면 HomelabBotMemoryDeletionStuck(30분)이
      # 함께 본다. 배포(Recreate) 뒤 첫 READY는 수십 초라 울리지 않는다.
      - alert: HomelabBotLedgerNotReady
        expr: homelab_bot_deletion_ledger_state{state=~"closed|degraded"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "봇 삭제 원장이 30분 넘게 {{ $labels.state }} 상태다"
          description: "기억 삭제가 대기로 남는다. 봇 로그의 deletion_ledger_<사유>와 /mnt/bulk 여유·읽기 전용 여부를 본다."
          runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

      # 삭제 요청은 원장 기록과 DB 정리가 둘 다 끝나야 완료다. 못 끝낸 것은 pending으로 남고 resume이 60초마다 다시 한다.
      # 30분: 정상이면 1~2분 안에 풀린다. 값이 대기 시간 자체라 시간에 따라 늘기만 해 for를 두지 않는다(없으면 봇이 0을 낸다).
      - alert: HomelabBotMemoryDeletionStuck
        expr: homelab_bot_memory_deletion_pending_oldest_seconds > 30 * 60
        labels:
          severity: warning
        annotations:
          summary: "봇 기억 삭제가 30분 넘게 끝나지 않았다"
          description: "삭제한 기억은 숨겨져 있지만 원장·DB 정리가 끝나지 않았다. HomelabBotLedger* 경보, DB 연결, 봇 로그의 원장·삭제 오류를 본다."
          runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md
