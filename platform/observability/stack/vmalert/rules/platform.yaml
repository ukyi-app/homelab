# 플랫폼 구성 요소 지표. Argo CD notifications는 쓰지 않고 이 지표 경보로 대신한다
# (webhook 방식은 토큰을 DEBUG 로그로 남긴다, 설계 B.8 E4).
groups:
  - name: platform
    rules:
      - alert: ArgoCDAppDegraded
        expr: max by (name) (argocd_app_info{health_status="Degraded"}) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Argo CD Application {{ $labels.name }}가 30분 넘게 Degraded다"

      - alert: ArgoCDAppOutOfSync
        expr: max by (name) (argocd_app_info{sync_status="OutOfSync"}) == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Argo CD Application {{ $labels.name }}가 30분 넘게 OutOfSync다"

      # ESO는 Ready 조건마다 status True·False 두 시계열을 내고 해당하는 쪽이 1이다(v2.13.0 실측).
      - alert: ExternalSecretNotReady
        expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready", status="False"}) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }}가 10분 넘게 Ready가 아니다"
          description: "Infisical 키 이름·경로와 ESO 인증을 본다. 이미 만든 Secret은 마지막 값으로 남아 있다."

      # 커넥터가 Cloudflare 에지에 맺은 연결 수. 정상이면 4이고 0이면 공개 요청이 NUC까지 오지 못한다.
      # 커넥터가 재시작을 되풀이하면 값이 0인 구간과 시계열이 없는 구간이 번갈아 온다. 둘 다 참으로 두고, max로 라벨을
      # 없애 두 쪽의 라벨을 맞춘다. 라벨이 갈리면 경보가 둘로 나뉘어 구간이 바뀔 때마다 for를 처음부터 다시 센다.
      # [2m]: 수집(30초 주기)이 한두 번 빠져도 창 안에 정상 값이 남아 참이 되지 않는다.
      # 커넥터와 에지 사이만 본다. Traefik 쪽은 TargetDown·TargetMissing(job traefik)이 본다.
      - alert: CloudflaredTunnelDown
        expr: |
          max(max_over_time(cloudflared_tunnel_ha_connections[2m])) < 1
          or absent_over_time(cloudflared_tunnel_ha_connections[2m])
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "cloudflared의 Cloudflare 에지 연결이 5분 넘게 없거나 지표가 없다. 공개 경로가 끊겼을 수 있다"
          description: "kubectl -n cloudflared get pods, kubectl -n cloudflared logs deploy/cloudflared. 터널 토큰과 7844 나가는 길을 본다."

  # 아래 룰은 지표가 없으면 시계열이 없어 발화하지 않는다. CNPG 수집 대상이 사라지면 core.yaml TargetMissing이 본다.
  # Valkey 백업 지표는 영속 Valkey 앱이 없어 운영 수집으로 확인하지 못했다([미검증]).
  - name: data
    rules:
      # cnpg_collector_up은 인스턴스 파드(포트 이름 metrics, 9187)가 PostgreSQL에 붙으면 1이다.
      # 이 그룹의 CNPG 지표 셋은 CNPG 1.30.1 + plugin v0.15.1의 9187 출력에서 이름을 확인했다(kind 실측).
      - alert: CNPGClusterNotHealthy
        expr: max by (namespace, cluster) (cnpg_collector_up) < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CNPG 클러스터 {{ $labels.namespace }}/{{ $labels.cluster }}에서 PostgreSQL에 붙은 인스턴스가 없다"

      # Barman Cloud Plugin 지표. cnpg_collector_last_available_backup_timestamp는 plugin 백업에서 0에 머물러 쓰지 않는다(운영 실측). sidecar가 인스턴스 9187로 낸다. 백업이 한 번도 없으면 값이 0이라 바로 발화한다.
      - alert: PGBackupStale
        expr: time() - max by (namespace, cluster) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp) > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.cluster }}의 마지막 성공 백업이 26시간보다 오래됐다"

      # 실패한 적이 없으면 last_failed_time이 -1이다. 복구 직후 sidecar가 뜨기 전 몇 초 동안 실패가 쌓여도 곧 성공 시각이 앞서 발화하지 않는다.
      - alert: WALArchiveFailing
        expr: |
          max by (namespace, cluster) (cnpg_pg_stat_archiver_last_failed_time)
          > max by (namespace, cluster) (cnpg_pg_stat_archiver_last_archived_time)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.cluster }}의 WAL 아카이브가 마지막 성공 뒤 실패하고 있다"

      # 백업 CronJob 이름에 valkey-backup이 들어간다고 가정한다(데이터 차트가 정할 때 맞춘다).
      # 한 번도 성공하지 않은 CronJob은 last_successful_time이 없어 여기서 잡히지 않는다. 실패는 KubeJobFailed가 본다.
      - alert: ValkeyBackupStale
        expr: time() - max by (namespace, cronjob) (kube_cronjob_status_last_successful_time{cronjob=~".*valkey-backup.*"}) > 26 * 3600
        labels:
          severity: warning
        annotations:
          summary: "Valkey 백업 {{ $labels.namespace }}/{{ $labels.cronjob }}의 마지막 성공이 26시간보다 오래됐다"

  # cert-manager 인증서(수집 job cert-manager). 클러스터 안 인증서만 본다(공개 TLS는 Cloudflare, ts.net은 Tailscale).
  # 인증서는 만료 15일 전에 갱신된다. 7일 남았으면 갱신이 8일 넘게 실패한 것이다.
  # 발급 전(status.notAfter 없음) 인증서는 만료 시각이 0이라 > 0으로 뺀다. 그 경우는 CertificateNotReady가 본다([미검증] v1.21.2 값).
  # 1일 미만이면 warning도 함께 울리지 않게 warning을 1일 이상으로 자른다.
  - name: certificates
    rules:
      - alert: CertificateExpiringSoon
        expr: |
          (max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) > 0) - time() < 7 * 86400
          and (max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) > 0) - time() >= 86400
        labels:
          severity: warning
        annotations:
          summary: "인증서 {{ $labels.namespace }}/{{ $labels.name }}가 7일 안에 만료된다"
          description: "만료 15일 전 갱신이 8일 넘게 실패했다. kubectl describe certificate·certificaterequest와 cert-manager 컨트롤러 로그를 본다."

      - alert: CertificateExpiringCritical
        expr: (max by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) > 0) - time() < 86400
        labels:
          severity: critical
        annotations:
          summary: "인증서 {{ $labels.namespace }}/{{ $labels.name }}가 1일 안에 만료된다(이미 만료됐을 수도 있다)"
          description: "갱신이 2주 가까이 실패했다. kubectl describe certificate·certificaterequest와 cert-manager 컨트롤러 로그를 본다."

      # condition="True" 시계열이 0이면 False·Unknown 어느 쪽이든 Ready가 아니다. 발급·갱신 중 잠깐 False라 10분 기다린다.
      - alert: CertificateNotReady
        expr: max by (namespace, name) (certmanager_certificate_ready_status{condition="True"}) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "인증서 {{ $labels.namespace }}/{{ $labels.name }}가 10분 넘게 Ready가 아니다"
          description: "kubectl describe certificate로 조건 메시지를 보고, Issuer와 cert-manager 컨트롤러 로그를 본다."
