rule_files:
  - ../rules/kubernetes.yaml
evaluation_interval: 1m
tests:
  - name: KubePodCrashLooping은 3번 재시작하면 발화하고 멎으면 20분 안에 해소된다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{job="kube-state-metrics", instance="kube-state-metrics", namespace="app-a", pod="a-1", container="app"}'
        values: "0 1 2 3x30"
      # 재시작 2번은 조용하다. 재부팅의 재시작은 컨테이너마다 1회다.
      - series: 'kube_pod_container_status_restarts_total{job="kube-state-metrics", instance="kube-state-metrics", namespace="app-b", pod="b-1", container="app"}'
        values: "0x5 1x5 2x30"
    alert_rule_test:
      - eval_time: 2m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: []
      - eval_time: 4m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: &crashloop-a1
          - exp_labels:
              severity: warning
              namespace: app-a
              pod: a-1
              container: app
            exp_annotations:
              summary: app-a/a-1의 app가 최근 1시간에 3번 이상 재시작했다
              description: kubectl -n app-a logs a-1 -c app --previous
      - eval_time: 20m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: *crashloop-a1
      - eval_time: 24m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: []

  # 대기 상한 5분에 이른 크래시 루프. 재시작이 5분마다 있어 경보가 끊기지 않는다.
  - name: KubePodCrashLooping은 재시작 대기가 5분이어도 이어서 발화한다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{job="kube-state-metrics", instance="kube-state-metrics", namespace="app-a", pod="a-1", container="app"}'
        values: "0x4 1x4 2x4 3x4 4x4 5x4 6x4 7x4 8x4 9x4"
    alert_rule_test:
      - eval_time: 12m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: []
      - eval_time: 16m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: *crashloop-a1
      - eval_time: 44m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: *crashloop-a1

  # 9분 돌다 죽고 5분 기다리는 크래시 루프. Ready가 돌아와 KubePodNotReady의 for가 끊겨도 여기서 잡는다.
  - name: KubePodCrashLooping은 몇 분 돌다 죽는 컨테이너도 발화한다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{job="kube-state-metrics", instance="kube-state-metrics", namespace="app-a", pod="a-1", container="app"}'
        values: "0x13 1x13 2x13 3x13 4x13"
    alert_rule_test:
      - eval_time: 30m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: []
      - eval_time: 43m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: *crashloop-a1
      - eval_time: 55m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: *crashloop-a1

  # 첫 값을 증가로 세면 예전 재시작 5회로 발화한다.
  - name: KubePodCrashLooping은 수집이 1시간 넘게 끊겼다 돌아와도 조용하다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{job="kube-state-metrics", instance="kube-state-metrics", namespace="app-a", pod="a-1", container="app"}'
        values: "5x10 _x90 5x30"
    alert_rule_test:
      - eval_time: 105m
        groupname: kubernetes
        alertname: KubePodCrashLooping
        exp_alerts: []

  - name: KubePodNotReady는 끝난 파드를 빼고 15분 뒤에 발화한다
    interval: 1m
    input_series:
      - series: 'kube_pod_status_ready{namespace="app-a", pod="a-1", condition="true"}'
        values: "0x20"
      - series: 'kube_pod_status_phase{namespace="app-a", pod="a-1", phase="Running"}'
        values: "1x20"
      - series: 'kube_pod_status_phase{namespace="app-a", pod="a-1", phase="Succeeded"}'
        values: "0x20"
      - series: 'kube_pod_status_ready{namespace="app-a", pod="job-1", condition="true"}'
        values: "0x20"
      - series: 'kube_pod_status_phase{namespace="app-a", pod="job-1", phase="Succeeded"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 14m
        groupname: kubernetes
        alertname: KubePodNotReady
        exp_alerts: []
      - eval_time: 16m
        groupname: kubernetes
        alertname: KubePodNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: app-a
              pod: a-1
            exp_annotations:
              summary: app-a/a-1가 15분 넘게 Ready가 아니다

  - name: KubePodNotReady는 스케줄되지 못해 ready 시계열이 없는 파드도 15분 뒤에 발화한다
    interval: 1m
    input_series:
      - series: 'kube_pod_status_phase{namespace="app-a", pod="unscheduled", phase="Pending"}'
        values: "1x20"
      # 스케줄되어 Ready 조건이 붙어도 for를 다시 세지 않는다.
      - series: 'kube_pod_status_phase{namespace="app-a", pod="late", phase="Pending"}'
        values: "1x20"
      - series: 'kube_pod_status_ready{namespace="app-a", pod="late", condition="true"}'
        values: "_x8 0x12"
      # 곧 Running이 되면 조용하다.
      - series: 'kube_pod_status_phase{namespace="app-a", pod="recovered", phase="Pending"}'
        values: "1x5 0x15"
      - series: 'kube_pod_status_ready{namespace="app-a", pod="recovered", condition="true"}'
        values: "_x5 1x15"
    alert_rule_test:
      - eval_time: 14m
        groupname: kubernetes
        alertname: KubePodNotReady
        exp_alerts: []
      - eval_time: 16m
        groupname: kubernetes
        alertname: KubePodNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: app-a
              pod: late
            exp_annotations:
              summary: app-a/late가 15분 넘게 Ready가 아니다
          - exp_labels:
              severity: warning
              namespace: app-a
              pod: unscheduled
            exp_annotations:
              summary: app-a/unscheduled가 15분 넘게 Ready가 아니다

  - name: OOMKilled는 최근 재시작이 있을 때만 발화한다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="observability", pod="vector-x", container="vector", reason="OOMKilled"}'
        values: "1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="observability", pod="vector-x", container="vector"}'
        values: "3x15 4x15"
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="app-a", pod="a-1", container="app", reason="OOMKilled"}'
        values: "1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="app-a", pod="a-1", container="app"}'
        values: "7x30"
      # OOM이 아닌 재시작은 조용하다.
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="app-b", pod="b-1", container="app", reason="Error"}'
        values: "1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="app-b", pod="b-1", container="app"}'
        values: "3x15 4x15"
    alert_rule_test:
      - eval_time: 18m
        groupname: kubernetes
        alertname: OOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: observability
              pod: vector-x
              container: vector
            exp_annotations:
              summary: observability/vector-x의 vector가 OOMKilled로 재시작했다
              description: limit에 백로그 여유가 있는지 본다(vector·VictoriaLogs 결합 루프, 설계 B.8 E4).
      - eval_time: 28m
        groupname: kubernetes
        alertname: OOMKilled
        exp_alerts: []

  - name: OOMKilled는 새 파드의 첫 OOM 재시작을 잡는다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="app-a", pod="a-1", container="app", reason="OOMKilled"}'
        values: "_x5 1x10"
      - series: 'kube_pod_container_status_restarts_total{namespace="app-a", pod="a-1", container="app"}'
        values: "0x4 1x10"
    alert_rule_test:
      - eval_time: 4m
        groupname: kubernetes
        alertname: OOMKilled
        exp_alerts: []
      - eval_time: 8m
        groupname: kubernetes
        alertname: OOMKilled
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: app-a
              pod: a-1
              container: app
            exp_annotations:
              summary: app-a/a-1의 app가 OOMKilled로 재시작했다
              description: limit에 백로그 여유가 있는지 본다(vector·VictoriaLogs 결합 루프, 설계 B.8 E4).

  # 첫 값을 증가로 세면 예전 재시작으로 발화한다.
  - name: OOMKilled는 수집이 끊겼다 돌아오거나 시계열이 새로 생겨도 재시작이 없으면 조용하다
    interval: 1m
    input_series:
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="observability", pod="gap", container="vector", reason="OOMKilled"}'
        values: "1x10 _x30 1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="observability", pod="gap", container="vector"}'
        values: "5x10 _x30 5x30"
      - series: 'kube_pod_container_status_last_terminated_reason{namespace="observability", pod="new", container="vector", reason="OOMKilled"}'
        values: "_x40 1x30"
      - series: 'kube_pod_container_status_restarts_total{namespace="observability", pod="new", container="vector"}'
        values: "_x40 3x30"
    alert_rule_test:
      - eval_time: 45m
        groupname: kubernetes
        alertname: OOMKilled
        exp_alerts: []

  - name: KubeJobFailed
    interval: 1m
    input_series:
      - series: 'kube_job_failed{namespace="app-a", job_name="backup-1", condition="true"}'
        values: "1x5"
      - series: 'kube_job_failed{namespace="app-a", job_name="backup-2", condition="true"}'
        values: "0x5"
    alert_rule_test:
      - eval_time: 2m
        groupname: kubernetes
        alertname: KubeJobFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: app-a
              job_name: backup-1
            exp_annotations:
              summary: Job app-a/backup-1가 실패했다
              description: 원인을 본 뒤 실패한 Job을 지우면 해소된다.
