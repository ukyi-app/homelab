# vmalert-tool unittest(ci: tools/ci). 시각은 2000-01-01 UTC(946684800)에서 시작한다.
# 라벨은 bot-slot job이 붙이는 모양이다(instance는 Service 이름, namespace는 봇 ns).
rule_files:
  - ../rules/bot.yaml
evaluation_interval: 1m
tests:
  - name: HomelabBotGatewayDisconnected는 10분 지나야 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_gateway_connected{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x2 0x15"
    alert_rule_test:
      - eval_time: 11m
        groupname: bot
        alertname: HomelabBotGatewayDisconnected
        exp_alerts: []
      - eval_time: 13m
        groupname: bot
        alertname: HomelabBotGatewayDisconnected
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 Discord Gateway가 10분 넘게 끊겼다. Discord 메시지·명령을 받지 못한다
              description: 봇은 Ready라 webhook·경보 수신은 계속된다. 봇 로그의 gateway_retry·gateway_drop 사유와 파드의 인터넷 443을 본다.

  # 재연결이 중간에 성공하면 for가 처음부터 다시 센다. 짧은 단절이 쌓여 울리지 않는다.
  - name: HomelabBotGatewayDisconnected는 재연결되면 다시 센다
    interval: 1m
    input_series:
      - series: 'homelab_bot_gateway_connected{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0x7 1 0x7"
    alert_rule_test:
      - eval_time: 15m
        groupname: bot
        alertname: HomelabBotGatewayDisconnected
        exp_alerts: []

  - name: HomelabBotOutboxUnknown은 15분 지나야 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_outbox_unknown{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0x2 2x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: bot
        alertname: HomelabBotOutboxUnknown
        exp_alerts: []
      - eval_time: 18m
        groupname: bot
        alertname: HomelabBotOutboxUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 게시 2건의 Discord 전달 여부를 15분 넘게 확인하지 못했다
              description: 자동 재전송은 하지 않는다. 해당 스레드에 답이 올라갔는지 Discord에서 보고, 봇 감사 로그를 확인한다.

  # 첫 대조에서 sent가 되는 unknown(응답만 잃은 게시)은 울리지 않는다.
  - name: HomelabBotOutboxUnknown은 곧 풀리는 unknown에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_outbox_unknown{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0 1 1 0x20"
    alert_rule_test:
      - eval_time: 20m
        groupname: bot
        alertname: HomelabBotOutboxUnknown
        exp_alerts: []

  # 작업 레인(rules/bot.yaml task-lane 그룹).
  - name: HomelabBotTaskWorkerIntakeClosed는 작업자에 닿는데 접수가 10분 닫혀 있으면 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_worker_routed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x20"
      - series: 'homelab_bot_task_worker_intake_open{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x2 0x18"
    alert_rule_test:
      - eval_time: 12m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts: []
      - eval_time: 13m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 작업자(worker-task)가 10분 넘게 새 작업을 받지 않는다
              description: 작업자는 Ready이고 대화·리뷰는 계속된다. 사유는 라벨에 없다. 작업자 로그 task_intake_closed의 reason, 게시 서버 로그 task_worker_intake의 reasons, 작업자 /v1/task/intake로 본다. 볼륨 사유면 /list로 대기 작업을 끝내 공간을 비운다.

  # 원인이 풀리면 다음 검사에 열린다. 짧게 닫힌 일이 쌓여 울리지 않는다.
  - name: HomelabBotTaskWorkerIntakeClosed는 접수가 다시 열리면 처음부터 센다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_worker_routed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x20"
      - series: 'homelab_bot_task_worker_intake_open{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0x7 1 0x7"
    alert_rule_test:
      - eval_time: 15m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts: []

  # 닿지 못하면 intake_open도 0이다. 접수 닫힘으로 오인하지 않고 미연결로만 운다.
  - name: 작업자에 닿지 않으면 HomelabBotTaskWorkerUnrouted만 10분 뒤 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_worker_routed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x2 0x18"
      - series: 'homelab_bot_task_worker_intake_open{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x2 0x18"
    alert_rule_test:
      - eval_time: 12m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts: []
      - eval_time: 13m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 게시 서버가 작업자(worker-task)에 10분 넘게 닿지 않는다
              description: 새 작업을 받지 못하고 세션 정리 재시도도 실패한다. 대화·리뷰는 계속된다. sandbox의 worker-task 파드 상태와 로그 task_lane_closed를 보고, Ready면 이미지, WORKER_LANES, NetworkPolicy, 게시 서버 TASK_WORKER_URL을 본다.
      - eval_time: 18m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts: []

  # 게시 서버 기동 직후 첫 검사 전과 작업자 Recreate 동안의 0은 울리지 않는다.
  - name: HomelabBotTaskWorkerUnrouted는 작업자 재시작에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_worker_routed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0 1x4 0x5 1x15"
      - series: 'homelab_bot_task_worker_intake_open{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0 1x4 0x5 1x15"
    alert_rule_test:
      - eval_time: 20m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts: []
      - eval_time: 20m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts: []

  - name: HomelabBotTaskLaneUnknown은 5분 지나면 발화하고 해제하면 풀린다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="unknown"}'
        values: "0x2 1x10 0x8"
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="cleanup_pending"}'
        values: "0x20"
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="retention_full"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 7m
        groupname: task-lane
        alertname: HomelabBotTaskLaneUnknown
        exp_alerts: []
      - eval_time: 8m
        groupname: task-lane
        alertname: HomelabBotTaskLaneUnknown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              reason: unknown
            exp_annotations:
              summary: 봇 작업 레인이 unknown으로 5분 넘게 닫혀 있다. 사람이 풀어야 한다
              description: 종료를 확인하지 못한 작업이 있고 스스로 풀리지 않는다. 대화·리뷰는 계속된다. /list로 작업을 찾아 /task-release target:<job-id>로 해제한다. 작업자가 프로세스 소멸을 확인해야 풀린다.
      - eval_time: 14m
        groupname: task-lane
        alertname: HomelabBotTaskLaneUnknown
        exp_alerts: []

  - name: HomelabBotTaskLaneCleanupPending은 15분 지나야 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="unknown"}'
        values: "0x25"
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="cleanup_pending"}'
        values: "0x2 1x23"
    alert_rule_test:
      - eval_time: 17m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts: []
      - eval_time: 18m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              reason: cleanup_pending
            exp_annotations:
              summary: 봇 작업 레인이 cleanup_pending으로 15분 넘게 닫혀 있다
              description: 끝난 작업의 세션 공간을 지웠는지 확인하지 못해 새 작업을 받지 않는다. 대화·리뷰는 계속된다. 작업자에 닿는지(HomelabBotTaskWorkerUnrouted)와 작업자 로그, 작업 볼륨 상태를 본다.
      - eval_time: 18m
        groupname: task-lane
        alertname: HomelabBotTaskLaneUnknown
        exp_alerts: []

  # 재시도 몇 번 만에 지워지면 울리지 않는다.
  - name: HomelabBotTaskLaneCleanupPending은 곧 지워지면 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="cleanup_pending"}'
        values: "0 1x5 0x20"
    alert_rule_test:
      - eval_time: 22m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts: []

  # 사유는 하나만 1이다. unknown을 해제해 cleanup_pending이 드러나면 for를 처음부터 센다.
  - name: 가려졌던 cleanup_pending이 드러나면 for를 처음부터 센다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="unknown"}'
        values: "1x10 0x20"
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="cleanup_pending"}'
        values: "0x10 1x20"
    alert_rule_test:
      - eval_time: 25m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts: []
      - eval_time: 26m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              reason: cleanup_pending
            exp_annotations:
              summary: 봇 작업 레인이 cleanup_pending으로 15분 넘게 닫혀 있다
              description: 끝난 작업의 세션 공간을 지웠는지 확인하지 못해 새 작업을 받지 않는다. 대화·리뷰는 계속된다. 작업자에 닿는지(HomelabBotTaskWorkerUnrouted)와 작업자 로그, 작업 볼륨 상태를 본다.

  - name: HomelabBotTaskLaneRetentionFull은 1시간 지나야 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="retention_full"}'
        values: "0x2 1x70"
    alert_rule_test:
      - eval_time: 62m
        groupname: task-lane
        alertname: HomelabBotTaskLaneRetentionFull
        exp_alerts: []
      - eval_time: 63m
        groupname: task-lane
        alertname: HomelabBotTaskLaneRetentionFull
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              reason: retention_full
            exp_annotations:
              summary: 봇 작업 레인 보존 세션 8개가 1시간 넘게 차 있다
              description: 새 작업을 받지 않는다. 대화·리뷰는 계속된다. /list로 대기 작업을 보고 /answer·/resume-model로 끝내거나 /task-cancel로 멈춘다.

  # 질문이 만료되어 칸이 비면 1시간 전에 풀린다.
  - name: HomelabBotTaskLaneRetentionFull은 질문 만료로 칸이 비면 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_lane_closed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", reason="retention_full"}'
        values: "0 1x55 0x20"
    alert_rule_test:
      - eval_time: 70m
        groupname: task-lane
        alertname: HomelabBotTaskLaneRetentionFull
        exp_alerts: []

  # 스위치를 끄거나 정책이 틀리면 레인 시계열이 없다. 봇의 다른 지표는 그대로 나온다.
  - name: 레인 시계열이 없으면 작업 레인 경보는 모두 조용하다
    interval: 1m
    input_series:
      - series: 'homelab_bot_gateway_connected{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "1x90"
    alert_rule_test:
      - eval_time: 80m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerIntakeClosed
        exp_alerts: []
      - eval_time: 80m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts: []
      - eval_time: 80m
        groupname: task-lane
        alertname: HomelabBotTaskLaneUnknown
        exp_alerts: []
      - eval_time: 80m
        groupname: task-lane
        alertname: HomelabBotTaskLaneCleanupPending
        exp_alerts: []
      - eval_time: 80m
        groupname: task-lane
        alertname: HomelabBotTaskLaneRetentionFull
        exp_alerts: []

  # 울리는 중에 스위치를 끄면 시계열이 사라져 풀린다.
  - name: 레인 시계열이 사라지면 울리던 경보가 풀린다
    interval: 1m
    input_series:
      - series: 'homelab_bot_task_worker_routed{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0x15 _x15"
      - series: 'homelab_bot_task_worker_intake_open{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0x15 _x15"
    alert_rule_test:
      - eval_time: 14m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 게시 서버가 작업자(worker-task)에 10분 넘게 닿지 않는다
              description: 새 작업을 받지 못하고 세션 정리 재시도도 실패한다. 대화·리뷰는 계속된다. sandbox의 worker-task 파드 상태와 로그 task_lane_closed를 보고, Ready면 이미지, WORKER_LANES, NetworkPolicy, 게시 서버 TASK_WORKER_URL을 본다.
      - eval_time: 25m
        groupname: task-lane
        alertname: HomelabBotTaskWorkerUnrouted
        exp_alerts: []

  # 삭제 원장(rules/bot.yaml deletion-ledger 그룹). 라벨은 kube-state-metrics(honor_labels)·node-exporter(instance = 노드 이름)·
  # bot-slot job이 붙이는 모양이다. 원장 PV는 운영에만 있다(VM은 values-vm.yaml deletionLedger: {}).
  - name: HomelabBotLedgerDiskNotMounted는 원장 PV가 있는데 /mnt/bulk가 없으면 5분 뒤 발화한다
    interval: 1m
    input_series:
      - series: 'kube_persistentvolume_info{job="kube-state-metrics", instance="kube-state-metrics", persistentvolume="homelab-bot-deletion-ledger", storageclass="local-ledger"}'
        values: "1x20"
      - series: 'up{job="node-exporter", instance="nuc-15-pro", namespace="observability"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="nuc-15-pro", namespace="observability", mountpoint="/", fstype="ext4"}'
        values: "980000000000x20"
    alert_rule_test:
      - eval_time: 4m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts: []
      - eval_time: 6m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts:
          - exp_labels:
              severity: critical
              persistentvolume: homelab-bot-deletion-ledger
            exp_annotations:
              summary: 삭제 원장 PV homelab-bot-deletion-ledger가 있는데 /mnt/bulk(ext4)가 마운트돼 있지 않다
              description: 봇 기억 삭제가 멈춘다. 파드를 재시작하지 말고 NUC에서 findmnt /mnt/bulk, sudo -v && host/verify.sh --cluster prod로 SSD를 본다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

  # 사람이 다시 마운트하면 풀린다.
  - name: HomelabBotLedgerDiskNotMounted는 /mnt/bulk가 마운트되면 풀린다
    interval: 1m
    input_series:
      - series: 'kube_persistentvolume_info{job="kube-state-metrics", instance="kube-state-metrics", persistentvolume="homelab-bot-deletion-ledger", storageclass="local-ledger"}'
        values: "1x20"
      - series: 'up{job="node-exporter", instance="nuc-15-pro", namespace="observability"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="nuc-15-pro", namespace="observability", mountpoint="/mnt/bulk", fstype="ext4"}'
        values: "_x8 1900000000000x12"
    alert_rule_test:
      - eval_time: 7m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts:
          - exp_labels:
              severity: critical
              persistentvolume: homelab-bot-deletion-ledger
            exp_annotations:
              summary: 삭제 원장 PV homelab-bot-deletion-ledger가 있는데 /mnt/bulk(ext4)가 마운트돼 있지 않다
              description: 봇 기억 삭제가 멈춘다. 파드를 재시작하지 말고 NUC에서 findmnt /mnt/bulk, sudo -v && host/verify.sh --cluster prod로 SSD를 본다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md
      - eval_time: 10m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts: []

  # VM에는 원장 PV가 없다. /mnt/bulk가 없어도 울리지 않는다.
  - name: HomelabBotLedgerDiskNotMounted는 원장 PV가 없는 클러스터(VM)에서 울리지 않는다
    interval: 1m
    input_series:
      - series: 'up{job="node-exporter", instance="vm-node", namespace="observability"}'
        values: "1x20"
      - series: 'node_filesystem_size_bytes{job="node-exporter", instance="vm-node", namespace="observability", mountpoint="/", fstype="ext4"}'
        values: "80000000000x20"
    alert_rule_test:
      - eval_time: 15m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts: []

  # node-exporter를 못 읽으면 모든 파일시스템 시계열이 사라진다. 미마운트로 오인하지 않는다(TargetDown이 본다).
  - name: HomelabBotLedgerDiskNotMounted는 node-exporter가 내려가 있으면 울리지 않는다
    interval: 1m
    input_series:
      - series: 'kube_persistentvolume_info{job="kube-state-metrics", instance="kube-state-metrics", persistentvolume="homelab-bot-deletion-ledger", storageclass="local-ledger"}'
        values: "1x20"
      - series: 'up{job="node-exporter", instance="nuc-15-pro", namespace="observability"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskNotMounted
        exp_alerts: []

  - name: HomelabBotLedgerDiskReadOnly는 /mnt/bulk가 읽기 전용이 되면 바로 발화한다
    interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{job="node-exporter", instance="nuc-15-pro", namespace="observability", mountpoint="/mnt/bulk", fstype="ext4"}'
        values: "0x3 1x5"
      # /mnt/bulk 밖 마운트의 읽기 전용은 이 경보의 대상이 아니다.
      - series: 'node_filesystem_readonly{job="node-exporter", instance="nuc-15-pro", namespace="observability", mountpoint="/mnt/other", fstype="ext4"}'
        values: "1x8"
    alert_rule_test:
      - eval_time: 3m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskReadOnly
        exp_alerts: []
      - eval_time: 4m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerDiskReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              job: node-exporter
              instance: nuc-15-pro
              namespace: observability
              mountpoint: /mnt/bulk
              fstype: ext4
            exp_annotations:
              summary: nuc-15-pro /mnt/bulk(삭제 원장 SSD)가 읽기 전용이다
              description: 봇 기억 삭제가 원장에 기록되지 않는다. dmesg·journalctl -k에서 ext4 오류를 보고 사람이 fsck·재마운트를 판단한다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

  # 지표는 one-hot이다(지금 상태만 1). failed·fenced는 5분 이어져야 운다.
  - name: HomelabBotLedgerFailed는 fenced가 5분 이어지면 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="ready"}'
        values: "1x2 0x10"
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="fenced"}'
        values: "0x2 1x10"
    alert_rule_test:
      - eval_time: 6m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerFailed
        exp_alerts: []
      - eval_time: 8m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              state: fenced
            exp_annotations:
              summary: 봇 삭제 원장 상태가 fenced다. 기억 기능이 닫혔고 삭제가 끝나지 않는다
              description: 봇 로그의 deletion_ledger_<사유>(stage·errno)를 본다. 쓰는 중의 failed·fenced는 재기동 전까지 닫혀 있다. 원장 파일을 지우거나 새로 만들지 않는다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

  # Recreate 재기동 직후 옛 세션이 잠금을 쥐어(lock_held) 열기가 잠깐 failed가 되고, 60초 뒤 재열기에서 ready가 된다.
  - name: HomelabBotLedgerFailed는 재기동 때 잠깐의 failed(lock_held)에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="closed"}'
        values: "1 0x20"
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="failed"}'
        values: "0 1x2 0x18"
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="ready"}'
        values: "0x3 1x18"
    alert_rule_test:
      - eval_time: 20m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerFailed
        exp_alerts: []

  # 열기 실패(예: missing, SSD 미마운트)도 failed다. 계속되면 울리고, 재열기가 성공해 ready가 되면 풀린다.
  - name: HomelabBotLedgerFailed는 열기 실패가 이어지면 울리고 ready로 돌아오면 풀린다
    interval: 1m
    input_series:
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="failed"}'
        values: "1x7 0x5"
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="ready"}'
        values: "0x7 1x5"
    alert_rule_test:
      - eval_time: 6m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              state: failed
            exp_annotations:
              summary: 봇 삭제 원장 상태가 failed다. 기억 기능이 닫혔고 삭제가 끝나지 않는다
              description: 봇 로그의 deletion_ledger_<사유>(stage·errno)를 본다. 쓰는 중의 failed·fenced는 재기동 전까지 닫혀 있다. 원장 파일을 지우거나 새로 만들지 않는다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md
      - eval_time: 9m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerFailed
        exp_alerts: []

  - name: HomelabBotLedgerNotReady는 degraded가 30분 이어지면 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="degraded"}'
        values: "0 1x35"
    alert_rule_test:
      - eval_time: 30m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerNotReady
        exp_alerts: []
      - eval_time: 32m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
              state: degraded
            exp_annotations:
              summary: 봇 삭제 원장이 30분 넘게 degraded 상태다
              description: 기억 삭제가 대기로 남는다. 봇 로그의 deletion_ledger_<사유>와 /mnt/bulk 여유·읽기 전용 여부를 본다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md

  # 배포(Recreate) 뒤 첫 Gateway READY까지 잠깐 closed인 것은 울리지 않는다.
  - name: HomelabBotLedgerNotReady는 기동 때 잠깐의 closed에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="closed"}'
        values: "1x2 0x35"
      - series: 'homelab_bot_deletion_ledger_state{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot", state="ready"}'
        values: "0x2 1x35"
    alert_rule_test:
      - eval_time: 35m
        groupname: deletion-ledger
        alertname: HomelabBotLedgerNotReady
        exp_alerts: []

  - name: HomelabBotMemoryDeletionStuck은 가장 오래된 삭제 대기가 30분을 넘으면 발화한다
    interval: 1m
    input_series:
      # 대기 없음(0) 뒤 삭제 하나가 1분마다 60초씩 늘어난다.
      - series: 'homelab_bot_memory_deletion_pending_oldest_seconds{job="bot-slot", instance="homelab-bot-metrics", namespace="app-homelab-bot"}'
        values: "0 60+60x40"
    alert_rule_test:
      - eval_time: 30m
        groupname: deletion-ledger
        alertname: HomelabBotMemoryDeletionStuck
        exp_alerts: []
      - eval_time: 32m
        groupname: deletion-ledger
        alertname: HomelabBotMemoryDeletionStuck
        exp_alerts:
          - exp_labels:
              severity: warning
              job: bot-slot
              instance: homelab-bot-metrics
              namespace: app-homelab-bot
            exp_annotations:
              summary: 봇 기억 삭제가 30분 넘게 끝나지 않았다
              description: 삭제한 기억은 숨겨져 있지만 원장·DB 정리가 끝나지 않았다. HomelabBotLedger* 경보, DB 연결, 봇 로그의 원장·삭제 오류를 본다.
              runbook: https://github.com/ukyi-app/homelab/blob/main/docs/runbooks-public/restore.md
