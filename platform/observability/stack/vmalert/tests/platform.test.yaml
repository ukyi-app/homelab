rule_files:
  - ../rules/platform.yaml
evaluation_interval: 1m
tests:
  - name: ArgoCDAppDegraded·OutOfSync는 30분 뒤에 발화한다
    interval: 1m
    input_series:
      - series: 'argocd_app_info{name="adguard", namespace="argocd", health_status="Degraded", sync_status="Synced"}'
        values: "1x40"
      - series: 'argocd_app_info{name="go", namespace="argocd", health_status="Healthy", sync_status="OutOfSync"}'
        values: "1x40"
      - series: 'argocd_app_info{name="tailscale", namespace="argocd", health_status="Healthy", sync_status="Synced"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 29m
        groupname: platform
        alertname: ArgoCDAppDegraded
        exp_alerts: []
      - eval_time: 31m
        groupname: platform
        alertname: ArgoCDAppDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              name: adguard
            exp_annotations:
              summary: Argo CD Application adguard가 30분 넘게 Degraded다
      - eval_time: 31m
        groupname: platform
        alertname: ArgoCDAppOutOfSync
        exp_alerts:
          - exp_labels:
              severity: warning
              name: go
            exp_annotations:
              summary: Argo CD Application go가 30분 넘게 OutOfSync다

  - name: ExternalSecretNotReady는 Ready=False 시계열이 1일 때만
    interval: 1m
    input_series:
      - series: 'externalsecret_status_condition{namespace="observability", name="alertmanager-healthchecks", condition="Ready", status="False"}'
        values: "1x15"
      - series: 'externalsecret_status_condition{namespace="observability", name="alertmanager-healthchecks", condition="Ready", status="True"}'
        values: "0x15"
      - series: 'externalsecret_status_condition{namespace="adguard", name="adguard-auth", condition="Ready", status="False"}'
        values: "0x15"
      - series: 'externalsecret_status_condition{namespace="adguard", name="adguard-auth", condition="Ready", status="True"}'
        values: "1x15"
      - series: 'externalsecret_status_condition{namespace="app-a", name="old", condition="Deleted", status="False"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 9m
        groupname: platform
        alertname: ExternalSecretNotReady
        exp_alerts: []
      - eval_time: 11m
        groupname: platform
        alertname: ExternalSecretNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: observability
              name: alertmanager-healthchecks
            exp_annotations:
              summary: ExternalSecret observability/alertmanager-healthchecks가 10분 넘게 Ready가 아니다
              description: Infisical 키 이름·경로와 ESO 인증을 본다. 이미 만든 Secret은 마지막 값으로 남아 있다.

  - name: CloudflaredTunnelDown은 연결이 하나라도 있으면 발화하지 않는다
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 20m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []

  - name: CloudflaredTunnelDown은 연결이 0이 되고 5분 뒤 발화한다
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared"}'
        values: "4x5 0x20"
    alert_rule_test:
      - eval_time: 9m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 11m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: cloudflared의 Cloudflare 에지 연결이 5분 넘게 없거나 지표가 없다. 공개 경로가 끊겼을 수 있다
              description: kubectl -n cloudflared get pods, kubectl -n cloudflared logs deploy/cloudflared. 터널 토큰과 7844 나가는 길을 본다.

  - name: CloudflaredTunnelDown은 파드가 사라져 지표가 없어져도 발화한다
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared"}'
        values: "4x5 _x20"
    alert_rule_test:
      - eval_time: 9m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 11m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: cloudflared의 Cloudflare 에지 연결이 5분 넘게 없거나 지표가 없다. 공개 경로가 끊겼을 수 있다
              description: kubectl -n cloudflared get pods, kubectl -n cloudflared logs deploy/cloudflared. 터널 토큰과 7844 나가는 길을 본다.

  - name: CloudflaredTunnelDown은 재시작을 되풀이해 0과 빈 구간이 번갈아도 for가 끊기지 않는다
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared"}'
        values: "4x5 0 _x3 0 _x3 0 _x3 0 _x3 0 _x3"
    alert_rule_test:
      - eval_time: 9m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 11m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: cloudflared의 Cloudflare 에지 연결이 5분 넘게 없거나 지표가 없다. 공개 경로가 끊겼을 수 있다
              description: kubectl -n cloudflared get pods, kubectl -n cloudflared logs deploy/cloudflared. 터널 토큰과 7844 나가는 길을 본다.

  - name: CloudflaredTunnelDown은 짧은 재연결과 수집 실패에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{job="cloudflared", instance="cloudflared"}'
        values: "4x5 0x2 4x5 _ 4x5 _ 4x5"
    alert_rule_test:
      - eval_time: 8m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 11m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []
      - eval_time: 20m
        groupname: platform
        alertname: CloudflaredTunnelDown
        exp_alerts: []

  - name: 데이터 지표가 아직 없으면 아무것도 발화하지 않는다
    interval: 1m
    input_series:
      - series: 'up{job="vmsingle", instance="vmsingle"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 10m
        groupname: data
        alertname: CNPGClusterNotHealthy
        exp_alerts: []
      - eval_time: 10m
        groupname: data
        alertname: PGBackupStale
        exp_alerts: []
      - eval_time: 10m
        groupname: data
        alertname: WALArchiveFailing
        exp_alerts: []
      - eval_time: 10m
        groupname: data
        alertname: ValkeyBackupStale
        exp_alerts: []

  - name: CNPGClusterNotHealthy와 WALArchiveFailing
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="database", cluster="pg", instance="pg-1"}'
        values: "0x10"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "200x15"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 6m
        groupname: data
        alertname: CNPGClusterNotHealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cluster: pg
            exp_annotations:
              summary: CNPG 클러스터 database/pg에서 PostgreSQL에 붙은 인스턴스가 없다
      - eval_time: 11m
        groupname: data
        alertname: WALArchiveFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cluster: pg
            exp_annotations:
              summary: database/pg의 WAL 아카이브가 마지막 성공 뒤 실패하고 있다

  - name: WALArchiveFailing은 실패 뒤 성공하면 해소된다
    interval: 1m
    input_series:
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "200x15"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "300x15"
    alert_rule_test:
      - eval_time: 11m
        groupname: data
        alertname: WALArchiveFailing
        exp_alerts: []

  # time()은 946684800 + eval_time이다. 백업 시각 946684800은 시험 시작 시각이다.
  - name: PGBackupStale·ValkeyBackupStale은 26시간을 넘으면 발화한다
    interval: 10m
    input_series:
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", cluster="pg", instance="pg-1"}'
        values: "946684800x170"
      - series: 'kube_cronjob_status_last_successful_time{namespace="app-a", cronjob="a-valkey-backup"}'
        values: "946684800x170"
      - series: 'kube_cronjob_status_last_successful_time{namespace="app-a", cronjob="a-report"}'
        values: "946684800x170"
    alert_rule_test:
      - eval_time: 25h
        groupname: data
        alertname: PGBackupStale
        exp_alerts: []
      - eval_time: 27h
        groupname: data
        alertname: PGBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: database
              cluster: pg
            exp_annotations:
              summary: database/pg의 마지막 성공 백업이 26시간보다 오래됐다
      - eval_time: 27h
        groupname: data
        alertname: ValkeyBackupStale
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: app-a
              cronjob: a-valkey-backup
            exp_annotations:
              summary: Valkey 백업 app-a/a-valkey-backup의 마지막 성공이 26시간보다 오래됐다

  - name: PGBackupMetricsMissing은 백업이나 WAL 지표가 없는 Cluster를 30분 뒤에 알린다
    interval: 1m
    input_series:
      # 지표가 모두 있으면 조용하다. 실패한 적이 없으면 last_failed_time은 -1이다.
      - series: 'cnpg_collector_up{namespace="database", cluster="pg", instance="pg-1"}'
        values: "1x40"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", cluster="pg", instance="pg-1"}'
        values: "946684800x40"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "-1x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "946684800x40"
      # 백업 지표만 없다.
      - series: 'cnpg_collector_up{namespace="database", cluster="no-backup", instance="no-backup-1"}'
        values: "1x40"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="no-backup", instance="no-backup-1"}'
        values: "-1x40"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="database", cluster="no-backup", instance="no-backup-1"}'
        values: "946684800x40"
      # WAL 지표 하나만 없다.
      - series: 'cnpg_collector_up{namespace="database", cluster="no-wal", instance="no-wal-1"}'
        values: "1x40"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", cluster="no-wal", instance="no-wal-1"}'
        values: "946684800x40"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="no-wal", instance="no-wal-1"}'
        values: "-1x40"
      # 복원 시험의 임시 Cluster에는 백업 지표가 원래 없다.
      - series: 'cnpg_collector_up{namespace="database", cluster="pg-restore-20261103", instance="pg-restore-20261103-1"}'
        values: "1x40"
      # PostgreSQL에 붙지 못한 Cluster는 CNPGClusterNotHealthy가 본다.
      - series: 'cnpg_collector_up{namespace="database", cluster="down", instance="down-1"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 29m
        groupname: data
        alertname: PGBackupMetricsMissing
        exp_alerts: []
      - eval_time: 31m
        groupname: data
        alertname: PGBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: database
              cluster: no-backup
            exp_annotations:
              summary: database/no-backup의 백업·WAL 지표가 없어 PGBackupStale·WALArchiveFailing이 울리지 못한다
              description: plugin-barman-cloud 컨테이너 상태와 로그를 본다. 판을 올렸다면 지표 이름이 바뀌었는지 본다.
          - exp_labels:
              severity: warning
              namespace: database
              cluster: no-wal
            exp_annotations:
              summary: database/no-wal의 백업·WAL 지표가 없어 PGBackupStale·WALArchiveFailing이 울리지 못한다
              description: plugin-barman-cloud 컨테이너 상태와 로그를 본다. 판을 올렸다면 지표 이름이 바뀌었는지 본다.

  - name: PGBackupMetricsMissing은 있던 지표가 사라져도 알린다
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="database", cluster="pg", instance="pg-1"}'
        values: "1x60"
      - series: 'barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="database", cluster="pg", instance="pg-1"}'
        values: "946684800x10 _x50"
      - series: 'cnpg_pg_stat_archiver_last_failed_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "-1x60"
      - series: 'cnpg_pg_stat_archiver_last_archived_time{namespace="database", cluster="pg", instance="pg-1"}'
        values: "946684800x60"
    alert_rule_test:
      - eval_time: 30m
        groupname: data
        alertname: PGBackupMetricsMissing
        exp_alerts: []
      - eval_time: 55m
        groupname: data
        alertname: PGBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: database
              cluster: pg
            exp_annotations:
              summary: database/pg의 백업·WAL 지표가 없어 PGBackupStale·WALArchiveFailing이 울리지 못한다
              description: plugin-barman-cloud 컨테이너 상태와 로그를 본다. 판을 올렸다면 지표 이름이 바뀌었는지 본다.

  # 시각은 946684800(2000-01-01 UTC)에서 시작한다. 만료 시각 = 946684800 + 남은 초.
  # 정상 15일(갱신 직전), 6일, 12시간, 발급 전(0) 인증서를 함께 둔다. eval_time 1h는 남은 시간을 거의 바꾸지 않는다.
  - name: CertificateExpiring은 7일 미만 warning, 1일 미만 critical, 15일은 조용하다
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="barman-cloud-client", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "947980800x70"
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="barman-cloud-server", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "947203200x70"
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="almost-gone", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "946728000x70"
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="not-issued", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "0x70"
    alert_rule_test:
      - eval_time: 1h
        groupname: certificates
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cnpg-system
              name: barman-cloud-server
            exp_annotations:
              summary: 인증서 cnpg-system/barman-cloud-server가 7일 안에 만료된다
              description: 만료 15일 전 갱신이 8일 넘게 실패했다. kubectl describe certificate·certificaterequest와 cert-manager 컨트롤러 로그를 본다.
      - eval_time: 1h
        groupname: certificates
        alertname: CertificateExpiringCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: cnpg-system
              name: almost-gone
            exp_annotations:
              summary: 인증서 cnpg-system/almost-gone가 1일 안에 만료된다(이미 만료됐을 수도 있다)
              description: 갱신이 2주 가까이 실패했다. kubectl describe certificate·certificaterequest와 cert-manager 컨트롤러 로그를 본다.

  - name: CertificateExpiring은 갱신 전 정상 인증서(15일 남음)에 울리지 않는다
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="barman-cloud-client", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "947980800x70"
      - series: 'certmanager_certificate_expiration_timestamp_seconds{namespace="cnpg-system", name="barman-cloud-server", issuer_name="selfsigned", issuer_kind="Issuer", issuer_group="cert-manager.io"}'
        values: "947980800x70"
    alert_rule_test:
      - eval_time: 1h
        groupname: certificates
        alertname: CertificateExpiringSoon
        exp_alerts: []
      - eval_time: 1h
        groupname: certificates
        alertname: CertificateExpiringCritical
        exp_alerts: []

  # cert-manager는 조건마다 True·False·Unknown 세 시계열을 내고 해당하는 쪽이 1이다.
  - name: CertificateNotReady는 Ready=True 시계열이 10분 넘게 0일 때만
    interval: 1m
    input_series:
      - series: 'certmanager_certificate_ready_status{namespace="cnpg-system", name="barman-cloud-client", condition="True"}'
        values: "1x15"
      - series: 'certmanager_certificate_ready_status{namespace="cnpg-system", name="barman-cloud-client", condition="False"}'
        values: "0x15"
      - series: 'certmanager_certificate_ready_status{namespace="cnpg-system", name="barman-cloud-server", condition="True"}'
        values: "0x15"
      - series: 'certmanager_certificate_ready_status{namespace="cnpg-system", name="barman-cloud-server", condition="False"}'
        values: "1x15"
    alert_rule_test:
      - eval_time: 9m
        groupname: certificates
        alertname: CertificateNotReady
        exp_alerts: []
      - eval_time: 11m
        groupname: certificates
        alertname: CertificateNotReady
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: cnpg-system
              name: barman-cloud-server
            exp_annotations:
              summary: 인증서 cnpg-system/barman-cloud-server가 10분 넘게 Ready가 아니다
              description: kubectl describe certificate로 조건 메시지를 보고, Issuer와 cert-manager 컨트롤러 로그를 본다.

  # 시각은 946684800(2000-01-01 UTC)에서 시작한다. 만료 시각 = 946684800 + 남은 초. eval_time 1h는 남은 시간을 거의 바꾸지 않는다.
  - name: TailnetTLSExpiring은 20일 미만 warning, 7일 미만 critical, 25일은 조용하다
    interval: 1m
    input_series:
      - series: 'homelab_tailnet_tls_not_after_seconds{instance="nuc", tls_host="fresh"}'
        values: "948844800x70"
      - series: 'homelab_tailnet_tls_not_after_seconds{instance="nuc", tls_host="soon"}'
        values: "948326400x70"
      - series: 'homelab_tailnet_tls_not_after_seconds{instance="nuc", tls_host="critical"}'
        values: "947203200x70"
      # 이 클러스터의 Ingress가 아닌 기기(다른 클러스터의 프록시)는 만료가 가까워도 조용하다.
      - series: 'homelab_tailnet_tls_not_after_seconds{instance="nuc", tls_host="vm-grafana"}'
        values: "947203200x70"
      - series: 'kube_ingress_tls{namespace="a", ingress="fresh", tls_host="fresh", secret=""}'
        values: "1x70"
      - series: 'kube_ingress_info{namespace="a", ingress="fresh", ingressclass="tailscale"}'
        values: "1x70"
      - series: 'kube_ingress_tls{namespace="a", ingress="soon", tls_host="soon", secret=""}'
        values: "1x70"
      - series: 'kube_ingress_info{namespace="a", ingress="soon", ingressclass="tailscale"}'
        values: "1x70"
      - series: 'kube_ingress_tls{namespace="a", ingress="critical", tls_host="critical", secret=""}'
        values: "1x70"
      - series: 'kube_ingress_info{namespace="a", ingress="critical", ingressclass="tailscale"}'
        values: "1x70"
    alert_rule_test:
      - eval_time: 1h
        groupname: tailnet-tls
        alertname: TailnetTLSExpiringSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              tls_host: soon
            exp_annotations:
              summary: tailnet 인증서 soon가 20일 안에 만료된다. 자동 갱신이 실패하고 있다
              description: kubectl -n tailscale logs로 ts-soon 프록시 로그의 cert·acme 줄을 본다.
      - eval_time: 1h
        groupname: tailnet-tls
        alertname: TailnetTLSExpiringCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              tls_host: critical
            exp_annotations:
              summary: tailnet 인증서 critical가 7일 안에 만료된다
              description: kubectl -n tailscale logs로 ts-critical 프록시 로그의 cert·acme 줄을 본다. 프록시를 다시 띄우면 갱신을 다시 시도한다.

  - name: TailnetTLSProbeFailing은 Ingress가 있는 대상만 15분 뒤에 발화한다
    interval: 1m
    input_series:
      - series: 'kube_ingress_tls{namespace="observability", ingress="grafana", tls_host="grafana", secret=""}'
        values: "1x20"
      - series: 'kube_ingress_info{namespace="observability", ingress="grafana", ingressclass="tailscale"}'
        values: "1x20"
      - series: 'homelab_tailnet_tls_probe_success{instance="nuc", tls_host="grafana"}'
        values: "0x20"
      # 지운 Ingress의 옛 기기. 오프라인으로 남아 계속 실패하지만 대상이 아니다.
      - series: 'homelab_tailnet_tls_probe_success{instance="nuc", tls_host="old-proxy"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 14m
        groupname: tailnet-tls
        alertname: TailnetTLSProbeFailing
        exp_alerts: []
      - eval_time: 16m
        groupname: tailnet-tls
        alertname: TailnetTLSProbeFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              tls_host: grafana
            exp_annotations:
              summary: tailnet 인증서 grafana를 15분 넘게 검증하지 못했다. 만료, 이름 불일치, 연결 실패 중 하나다
              description: journalctl -u homelab-tls-monitor로 실패 종류를 보고, kubectl -n tailscale get pods로 ts-grafana 프록시를 본다.

  - name: TailnetTLSMissing은 결과가 없는 tailnet Ingress만 15분 뒤에 발화한다
    interval: 1m
    input_series:
      # 새 tailnet Ingress. 수집기 결과가 없다.
      - series: 'kube_ingress_tls{namespace="app-a", ingress="a", tls_host="new-ui", secret=""}'
        values: "1x20"
      - series: 'kube_ingress_info{namespace="app-a", ingress="a", ingressclass="tailscale"}'
        values: "1x20"
      # 결과가 있는 대상은 조용하다.
      - series: 'kube_ingress_tls{namespace="observability", ingress="grafana", tls_host="grafana", secret=""}'
        values: "1x20"
      - series: 'kube_ingress_info{namespace="observability", ingress="grafana", ingressclass="tailscale"}'
        values: "1x20"
      - series: 'homelab_tailnet_tls_probe_success{instance="nuc", tls_host="grafana"}'
        values: "1x20"
      # tailnet이 아닌 Ingress는 대상이 아니다.
      - series: 'kube_ingress_tls{namespace="app-b", ingress="b", tls_host="public.example", secret="tls"}'
        values: "1x20"
      - series: 'kube_ingress_info{namespace="app-b", ingress="b", ingressclass="traefik"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 14m
        groupname: tailnet-tls
        alertname: TailnetTLSMissing
        exp_alerts: []
      - eval_time: 16m
        groupname: tailnet-tls
        alertname: TailnetTLSMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              tls_host: new-ui
            exp_annotations:
              summary: tailnet Ingress new-ui의 인증서 확인 결과가 없다
              description: tailscale status에 tag:k8s 기기로 있는지, 호스트의 /var/lib/homelab-tls-monitor/tailnet_tls.prom이 있는지 본다. 없으면 sudo host/install.sh --tls-monitor.

  # 호스트가 tailnet에 들지 않는 클러스터. operator의 Ingress는 있지만 호스트에서 확인하지 못한다.
  - name: TailnetTLSMissing은 끔 표시가 있으면 조용하다
    interval: 1m
    input_series:
      - series: 'kube_ingress_tls{namespace="observability", ingress="grafana", tls_host="vm-grafana", secret=""}'
        values: "1x20"
      - series: 'kube_ingress_info{namespace="observability", ingress="grafana", ingressclass="tailscale"}'
        values: "1x20"
      - series: 'homelab_tailnet_tls_disabled{instance="vm"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 16m
        groupname: tailnet-tls
        alertname: TailnetTLSMissing
        exp_alerts: []

  # time()이 946684800부터 간다. 시각이 그대로면 오래된다.
  - name: TailnetTLSCollectorFailing은 멈추면 발화한다
    interval: 1m
    input_series:
      - series: 'homelab_tailnet_tls_collect_timestamp_seconds{instance="nuc"}'
        values: "946684800x40"
      - series: 'homelab_tailnet_tls_collect_success{instance="nuc"}'
        values: "1x40"
    alert_rule_test:
      - eval_time: 20m
        groupname: tailnet-tls
        alertname: TailnetTLSCollectorFailing
        exp_alerts: []
      - eval_time: 27m
        groupname: tailnet-tls
        alertname: TailnetTLSCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: tailnet 인증서 수집기가 멈췄거나 tailscale status를 읽지 못한다
              description: systemctl status homelab-tls-monitor.timer, journalctl -u homelab-tls-monitor

  - name: TailnetTLSCollectorFailing은 목록을 못 읽어도 발화하고 정상이면 조용하다
    interval: 1m
    input_series:
      # 시각은 계속 간다. 수집기는 돌지만 tailscale status를 못 읽는다.
      - series: 'homelab_tailnet_tls_collect_timestamp_seconds{instance="nuc"}'
        values: "946684800+60x40"
      - series: 'homelab_tailnet_tls_collect_success{instance="nuc"}'
        values: "1x5 0x35"
    alert_rule_test:
      - eval_time: 4m
        groupname: tailnet-tls
        alertname: TailnetTLSCollectorFailing
        exp_alerts: []
      - eval_time: 19m
        groupname: tailnet-tls
        alertname: TailnetTLSCollectorFailing
        exp_alerts: []
      - eval_time: 22m
        groupname: tailnet-tls
        alertname: TailnetTLSCollectorFailing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: tailnet 인증서 수집기가 멈췄거나 tailscale status를 읽지 못한다
              description: systemctl status homelab-tls-monitor.timer, journalctl -u homelab-tls-monitor
