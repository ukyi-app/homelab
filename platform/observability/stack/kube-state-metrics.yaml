apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-kube-state-metrics
rules:
  - apiGroups: [""]
    # resourcequotas: 올리브 정지 자물쇠(olive-stop)를 경보가 읽는다(vmalert/rules/olive.yaml).
    resources: ["nodes", "pods", "services", "persistentvolumeclaims", "persistentvolumes", "namespaces", "resourcequotas"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  # kube_ingress_tls·kube_ingress_info. tailnet 인증서 경보가 있어야 할 대상을 여기서 얻는다.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observability-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          # v2.20.0, registry.k8s.io 멀티 아키텍처 index.
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          # 위 ClusterRole과 같은 목록이다. 하나를 더하면 둘 다 고친다(권한이 없으면 그 자원 지표가 조용히 빈다).
          args:
            - --port=8080
            - --telemetry-port=8081
            - --resources=cronjobs,daemonsets,deployments,ingresses,jobs,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,resourcequotas,services,statefulsets
            # 올리브 "켠 적 있음" 표식 하나만 지표로 낸다. 네임스페이스마다 kube_namespace_annotations 한 줄이 생기고, 표식이 없는 곳은
            # annotation_ 라벨이 빠진 채로 나온다. 그래서 규칙은 값 "true"까지 맞춘다. 표식 이름을 바꾸면 vmalert/rules/olive.yaml도 함께 바꾼다.
            - --metric-annotations-allowlist=namespaces=[homelab.ukyi.app/olive-started]
            # 올리브 정지 자물쇠의 소유 라벨 하나만 지표로 낸다. quota마다 kube_resourcequota_labels 한 줄이 생기고, 라벨이 없는 quota는
            # label_ 라벨이 빠진 채로 나온다. 규칙은 그 한 줄을 "자물쇠가 아니다"의 증거로 쓴다. 라벨 이름을 바꾸면 vmalert/rules/olive.yaml도 함께 바꾼다.
            - --metric-labels-allowlist=resourcequotas=[homelab.ukyi.app/olive-stop]
          env:
            - name: GOMEMLIMIT
              value: "72MiB"
          ports:
            - name: http-metrics
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 80Mi
          # /healthz는 프로세스만 보고 API 접근·informer 동기화가 실패해도 200이다. 그러면 지표가 비어도 up=1이라
          # TargetDown·TargetMissing이 침묵한다. v2.20.0 공식 예시(examples/standard)대로 telemetry 포트의 /readyz.
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
