# VictoriaLogs 데이터소스는 플러그인이 필요해 두지 않는다. 로그는 VictoriaLogs 자체 UI(/select/vmui)로 본다.
apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    # vmsingle 직결이 아니라 읽기 전용 프록시(vmauth/auth.yaml)로. Viewer도 이 데이터소스로 임의 경로를 부를 수 있다.
    url: http://vmauth:8427
    isDefault: true
    editable: false
