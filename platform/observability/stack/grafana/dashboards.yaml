apiVersion: 1
providers:
  - name: homelab
    folder: Homelab
    type: file
    # UI에서 고친 내용은 다음 읽기에서 Git 내용으로 돌아간다.
    allowUiUpdates: false
    # false여야 Git에서 지운 대시보드가 Grafana DB에서도 지워진다. true면 폐기한 대시보드가 남는다.
    disableDeletion: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
