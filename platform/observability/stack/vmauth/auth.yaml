# Grafana → vmsingle·VictoriaLogs 읽기 전용 허용 목록. Grafana Viewer는 데이터소스 resources 경로로 임의 경로에 POST할 수 있어
# 직결이면 vmsingle delete_series·import(실측 204), VictoriaLogs /insert/*·/internal/force_merge(실측 200)까지 닿는다. 질의 API만 연다.
# src_paths는 경로 전체가 맞아야 하고, vmauth가 ../·%2e%2e를 정리한 뒤 비교한다(실측). 목록 밖은 400.
# 방법(GET·POST)은 가리지 않는다. 아래 경로는 어떤 방법이든 읽기만 한다(DELETE /api/v1/series도 목록 조회, 실측).
unauthorized_user:
  url_map:
    - src_paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/query_exemplars
        - /api/v1/series
        - /api/v1/labels
        - /api/v1/label/[^/]+/values
        - /api/v1/metadata
        - /api/v1/status/buildinfo
      url_prefix: http://vmsingle:8428
    # 플러그인 v0.33.1이 부르는 경로만(pkg/plugin/query.go, datasource.go). 봇은 /api/ds/query로 query·hits·stats를 쓴다.
    # /select/logsql/tail은 넣지 않는다. VictoriaLogs가 tail에 시간 제한도 동시 질의 제한도 걸지 않아
    # Viewer 하나가 끝없는 질의를 여럿 열 수 있다. 대가로 Explore의 Live 보기는 실패한다.
    - src_paths:
        - /select/logsql/query
        - /select/logsql/hits
        - /select/logsql/stats_query
        - /select/logsql/stats_query_range
        - /select/logsql/field_names
        - /select/logsql/field_values
        - /select/logsql/facets
        - /select/logsql/streams
        - /select/logsql/stream_field_names
        - /select/logsql/stream_field_values
        - /select/tenant_ids
      url_prefix: http://victorialogs:9428
