# Grafana → vmsingle 읽기 전용 허용 목록. Grafana Viewer는 데이터소스 resources 경로로 임의 경로에 POST할 수 있어
# vmsingle 직결이면 delete_series·import까지 닿는다(실측 204). 질의 API만 연다.
# src_paths는 경로 전체가 맞아야 하고, vmauth가 ../·%2e%2e를 정리한 뒤 비교한다(실측). 목록 밖은 400.
# 방법(GET·POST)은 가리지 않는다. 아래 경로는 vmsingle에서 어떤 방법이든 읽기만 한다(DELETE /api/v1/series도 목록 조회, 실측).
unauthorized_user:
  url_map:
    - src_paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/query_exemplars
        - /api/v1/series
        - /api/v1/labels
        - /api/v1/label/[^/]+/values
        - /api/v1/metadata
        - /api/v1/status/buildinfo
      url_prefix: http://vmsingle:8428
