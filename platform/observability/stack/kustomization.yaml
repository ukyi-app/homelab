# 관측 스택(설계 C.3.7, D-09 최소 구성). root의 observability Application이 이 디렉터리와
# ../ingress(Grafana 내부 Ingress, 클러스터 접두가 필요해 Helm)를 두 source로 묶는다.
# 클러스터마다 다른 값은 여기 두지 않는다(E8 VM 격리 1번). 자격은 ExternalSecret이 같은 키 이름으로
# 클러스터의 Infisical 프로젝트에서 읽는다.
#
# 룰·알림 템플릿의 {{ }}가 Helm 템플릿과 부딪히지 않게 Helm이 아니라 kustomize로 둔다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - networkpolicy.yaml
  - vmsingle.yaml
  - vmalert.yaml
  - vmauth.yaml
  - alertmanager.yaml
  - grafana.yaml
  - victorialogs.yaml
  - vector.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml

# 이름에 내용 해시가 붙는 ConfigMap은 바뀌면 파드 템플릿의 참조가 바뀌어 Argo CD sync만으로 롤아웃된다.
# 평문 ConfigMap은 바뀌어도 파드가 옛 내용을 계속 쓴다(설계 B.8 E4, 옛 AM이 일주일 묵은 설정을 썼다).
# 최상위 generatorOptions에 disableNameSuffixHash를 두지 않는다. 그러면 아래 해시 롤아웃이 모두 사라진다.
configMapGenerator:
  # 파일을 다시 읽는 기능이 없어 해시 롤아웃에 맡긴다.
  - name: alertmanager-config
    files:
      - alertmanager/alertmanager.yml
  # vmauth는 다시 읽을 수 있지만 상태가 없어 재시작해도 잃는 것이 없다.
  - name: vmauth-config
    files:
      - vmauth/auth.yaml
  - name: vector-config
    files:
      - vector/vector.yaml
  - name: grafana-provisioning
    files:
      - grafana/datasources.yaml
      - grafana/dashboards.yaml
  # 아래 셋은 프로세스가 주기적으로 다시 읽어 재시작 없이 바뀐다. 해시를 붙이면 바뀔 때마다 재시작해
  # vmalert는 pending 경보의 for 시계를 처음부터 다시 센다(tailnet 이탈 경보는 1시간 창).
  # kubelet이 ConfigMap 볼륨을 갱신하는 데 1분 남짓 걸린다. subPath로 붙이면 갱신되지 않는다.
  - name: vmalert-rules
    options:
      disableNameSuffixHash: true
    files:
      - vmalert/rules/core.yaml
      - vmalert/rules/kubernetes.yaml
      - vmalert/rules/platform.yaml
      - vmalert/rules/adguard.yaml
  - name: vmsingle-scrape
    options:
      disableNameSuffixHash: true
    files:
      - vmsingle/scrape.yaml
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
    files:
      - grafana/dashboards/homelab-overview.json
