{{- $name := include "app.name" . }}
{{- if .Values.secrets }}
---
# 앱 시크릿. 원본은 Infisical homelab/prod /apps/<앱>/<KEY>이고 이것은 실행용 사본이다(설계 C.6.2).
# 키를 하나씩 적는다. 빠진 키는 동기화 실패로 드러나고 파드 env의 secretKeyRef가 새 파드를 막는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-app
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- include "app.externalSecretSpec" $ | nindent 2 }}
  target:
    name: {{ $name }}-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $name }}/{{ . }}
    {{- end }}
{{- end }}
{{- if .Values.uses.postgres }}
---
# DB 연결. 비밀번호 원본은 /apps/<앱>/postgres/PASSWORD 하나이고, database ns의 역할 Secret(데이터 차트)과
# 이 연결 Secret이 사본이다(설계 C.5.1). 역할·DB 이름은 앱 이름이다. 접속은 pg-rw 직결이다(Pooler 없음, D-22).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- include "app.externalSecretSpec" . | nindent 2 }}
  target:
    name: {{ $name }}-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # ESO 템플릿이다. Helm이 렌더하지 않게 중괄호를 문자열로 낸다.
        DATABASE_URL: {{ printf "postgresql://%s:{{ .password | urlquery }}@pg-rw.database.svc:5432/%s?sslmode=require" $name $name | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $name }}/postgres/PASSWORD
{{- end }}
{{- if .Values.uses.valkey }}
---
# Valkey 연결. 캐시(앱 차트)든 영속(데이터 차트)이든 같은 ns의 Service <앱>-valkey:6379에 default 사용자로 붙는다
# (설계 C.5.6). Service 이름은 T11의 Valkey 렌더와 맞추는 약속이다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-valkey-url
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- include "app.externalSecretSpec" . | nindent 2 }}
  target:
    name: {{ $name }}-valkey-url
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        VALKEY_URL: {{ printf "redis://default:{{ .password | urlquery }}@%s-valkey:6379/0" $name | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $name }}/valkey/PASSWORD
{{- end }}
