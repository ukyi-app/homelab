# 복구 스위치(externalSecrets.enabled: false, ApplicationSet apps가 넣음). web-full과 같은 앱에서 ExternalSecret만 빠진다.
# ci 단계 external secrets switch가 ExternalSecret 0개와 나머지 문서가 web-full과 같은지 본다(tools/ci/switch.ts).
chartVersion: 1.2.0
kind: web
port: 8080
resources: { cpu: 50m, memory: 128Mi }
probes:
  readiness: { path: /healthz }
  liveness: { path: /healthz, periodSeconds: 30 }
public:
  host: smoke.ukyi.app
internal:
  name: smoke
secrets: [EXAMPLE_API_KEY, OTHER_KEY]
env:
  LOG_LEVEL: info
uses:
  postgres: true
  valkey: true
cache:
  enabled: true
migration:
  command: ["./migrate", "up"]
repository: ghcr.io/ukyi-app/app
digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
revision: 0123456789abcdef0123456789abcdef01234567
hold: false
tailnetPrefix: vm-
externalSecrets:
  enabled: false
