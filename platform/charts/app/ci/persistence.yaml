# 시험 values: 기존 PVC를 붙이고 Recreate로 도는 web 앱(봇 삭제 원장 모양). 마이그레이션 Job에는 볼륨이 없어야 한다.
chartVersion: 1.3.0
kind: web
port: 8080
resources: { cpu: 50m, memory: 128Mi }
probes:
  readiness: { path: /readyz }
uses:
  postgres: true
migration:
  command: ["node", "dist/src/migrate-main.js"]
serviceAccountName: bot-reader
persistence:
  existingClaim: deletion-ledger
  mountPath: /var/lib/homelab-bot/ledger
strategy: Recreate
repository: ghcr.io/ukyi-app/app
digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
revision: 0123456789abcdef0123456789abcdef01234567
hold: false
tailnetPrefix: ""
