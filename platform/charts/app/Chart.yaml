# 공유 차트 app(설계 C.4.5). 앱마다 apps/<앱>/values.yaml(사람)과 image.yaml(배포 App)로 렌더한다.
#
# 버전은 git 태그 app-chart-v<version>이다. 앱은 values.yaml의 chartVersion으로 태그를 고르고,
# 차트를 바꾸는 PR은 어느 앱에도 바로 적용되지 않는다. 시험 앱이 먼저 올리고 다른 앱은 각자 PR로 따라간다.
# 태그는 관리자만 만들고(ruleset D2) 아무도 옮기거나 지우지 못한다(D1). 이 파일의 version과 태그를 같게 둔다.
# semver: patch는 렌더가 같거나 버그 수정, minor는 선택 항목 추가, major는 values 형식 변경.
apiVersion: v2
name: app
description: Shared chart for homelab apps
type: application
version: 1.2.0
# 캐시 Valkey(설계 C.5.6). 공식 차트를 cacheServer라는 이름으로 넣고 cache.enabled로 켠다. 사람이 적는 키는 cache이고
# cacheServer는 차트 내부 값이다(앱 values에 적으면 ci가 막는다, tools/ci/render.ts).
# CI는 외부 레지스트리를 조회하지 않고, Argo CD v3.5.5는 charts/에 묶음이 있으면 dependency build를 하지 않는다
# (reposerver/repository/repository.go, "missing in charts/ directory"일 때만 build). 그래서 tgz를 커밋한다.
# 버전을 올릴 때는 tgz, 아래 version, 공식 index.yaml의 digest(= tgz sha256)를 함께 바꾸고 데이터 차트도 같이 올린다.
# 0.12.0 tgz sha256: 64d43433d6b80addb012dd7c21a1bf674bf034dc51210b6bf8eae9ddaf83740f
dependencies:
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    alias: cacheServer
    condition: cache.enabled
