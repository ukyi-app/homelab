# 기본값. 앱이 반드시 정할 값(kind, resources, 이미지)에는 기본값을 두지 않는다. 빠지면 schema가 렌더를 막는다.
# 키 설명은 values.schema.json의 description에 있다.
secrets: []
env: {}
uses:
  postgres: false
  valkey: false
cache:
  enabled: false

# 캐시 Valkey(공식 차트 valkey, Chart.yaml의 cacheServer) 내부 값. 앱 values에 적지 않는다(ci가 막는다).
# 데이터 차트(platform/charts/app-data)의 valkeyServer와 같은 이미지·인증 모양이다. 바꿀 때 둘을 함께 바꾼다.
# 크기는 고정이다(설계 C.5.6 기본값): maxmemory 64mb, memory limit = 64 × 1.5 + 64 = 160Mi.
# subchart 값은 템플릿으로 계산할 수 없어 앱마다 크기를 바꾸는 값은 아직 없다.
cacheServer:
  # Service·Deployment 이름이 <릴리스>-valkey = <앱>-valkey가 된다(앱 차트 연결 Secret의 주소).
  # 앱 이름에 valkey가 들어가면 차트가 릴리스 이름만 써서 앱 Service와 겹친다. _helpers.tpl이 막는다.
  nameOverride: valkey
  image:
    registry: docker.io
    repository: valkey/valkey
    # 이미지 index digest(멀티 아키텍처). 9.1.2는 차트 0.12.0의 appVersion이다.
    tag: "9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
  serviceAccount:
    create: false
    automount: false
  # 앱 Deployment(wave 2)보다 먼저 뜬다. 같은 Application의 ExternalSecret(wave 0) 뒤다.
  workloadAnnotations:
    argocd.argoproj.io/sync-wave: "1"
  deploymentStrategy: Recreate
  resources:
    requests: { cpu: 10m, memory: 160Mi }
    limits: { memory: 160Mi }
  initResources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 16Mi }
  # 기본 probe는 인증 없는 valkey-cli ping이다. NOAUTH 응답도 exit 0이라 프로세스가 답하는지만 본다(9.1.2 실측).
  readinessProbe:
    enabled: true
  auth:
    enabled: true
    # tpl로 렌더된다. ExternalSecret <앱>-valkey-auth(templates/externalsecret.yaml)의 password 키.
    usersExistingSecret: "{{ .Release.Name }}-valkey-auth"
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: password
  valkeyConfig: |
    maxmemory 64mb
    maxmemory-policy allkeys-lru
    save ""
    appendonly no
