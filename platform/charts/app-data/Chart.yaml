# 데이터 차트 app-data(설계 C.5). data/<앱>/values.yaml로 렌더한다. ApplicationSet data가 앱마다 Application
# <앱>-data를 만든다(릴리스 이름 = 앱 이름). 앱 Application과 따로라 앱을 지워도 데이터는 남는다(설계 C.5.5).
#
# 버전은 git 태그 data-chart-v<version>이다. 앱은 data/<앱>/values.yaml의 chartVersion으로 태그를 고른다.
# 태그·semver 규칙은 공유 차트 app과 같다(platform/charts/app/Chart.yaml).
apiVersion: v2
name: app-data
description: Data resources (PostgreSQL role and database, persistent Valkey) for one homelab app
type: application
version: 1.0.3
# 영속 Valkey(설계 C.5.6). 공식 차트를 valkeyServer라는 이름으로 넣는다. 사람이 적는 키는 valkey이고 valkeyServer는
# 차트 내부 값이다(data values에 적으면 ci가 막는다, tools/ci/render.ts).
# condition은 앞 경로가 있으면 그 값, 없으면 다음 경로다(Helm). running: false(복원 중 멈춤)면 서버만 내리고
# PVC·백업 CronJob(suspend)은 남긴다. Helm condition은 부정을 못 해 suspend: true 대신 running: false로 적는다.
# tgz를 커밋하는 이유와 버전 올리는 법은 platform/charts/app/Chart.yaml과 같다. 두 차트를 함께 올린다.
# 0.12.0 tgz sha256: 64d43433d6b80addb012dd7c21a1bf674bf034dc51210b6bf8eae9ddaf83740f
dependencies:
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm/
    alias: valkeyServer
    condition: valkey.running,valkey.persistent
