{{- if .Values.postgres.enabled }}
{{- $name := include "data.name" . }}
# 앱 역할의 비밀번호(설계 C.5.1). 원본은 Infisical /apps/<앱>/postgres/PASSWORD 하나이고, 앱 ns의 연결 Secret
# (앱 차트 <앱>-db)과 이 Secret이 사본이다. database ns는 store infisical-apps만 쓸 수 있다(conditions).
# cnpg.io/reload: 값이 바뀌면 CNPG가 바로 ALTER ROLE 한다[S31]. 회전 순서는 docs/runbooks-public/rotate.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-role-{{ $name }}
  namespace: database
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- include "data.externalSecretSpec" . | nindent 2 }}
  target:
    name: pg-role-{{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # template이 없으면 ExternalSecret의 라벨(Argo CD tracking 포함)이 Secret에 복사된다(설계 B.8 E3).
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      mergePolicy: Replace
      data:
        username: {{ $name }}
        # ESO 템플릿이다. Helm이 렌더하지 않게 중괄호를 문자열로 낸다.
        password: {{ "{{ .password }}" | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ $name }}/postgres/PASSWORD
---
# 역할 이름 = 앱 이름 = DB owner. 앱끼리 owner를 공유하지 않는다(L10). reclaim retain이라 CR이 지워져도 역할이 남는다[S31](purge: true만 delete).
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: {{ $name }}
  namespace: database
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.protect" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: pg
  name: {{ $name }}
  login: true
  passwordSecret:
    name: pg-role-{{ $name }}
  databaseRoleReclaimPolicy: {{ include "data.reclaim" . }}
---
# DB 이름 = 앱 이름. databaseReclaimPolicy retain이라 CR이 지워져도 DB가 남는다[S30](purge: true만 delete).
# 같은 DB를 두 CR이 관리하면 두 번째를 CNPG가 거부한다.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $name }}
  namespace: database
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    {{- include "data.protect" . | nindent 4 }}
    argocd.argoproj.io/sync-wave: "2"
spec:
  cluster:
    name: pg
  name: {{ $name }}
  owner: {{ $name }}
  databaseReclaimPolicy: {{ include "data.reclaim" . }}
---
# PUBLIC CONNECT를 막는다(T13, 사용자 결정 2026-10-26). PostgreSQL은 새 DB에 PUBLIC CONNECT를 기본으로 줘 공유 Cluster의
# 다른 앱 역할도 이 DB에 접속한다(테이블 권한은 없다). CNPG 1.30.1 Database에는 DB 권한 필드가 없다(allowConnections는
# 모두를 막는다). 그래서 DB owner인 앱 역할 자격으로 REVOKE하는 hook을 둔다. 슈퍼유저 자격은 쓰지 않는다.
# Sync hook이라 sync마다 다시 돈다(멱등). 이미 있는 DB는 chartVersion을 올린 sync에서 막힌다.
# Database(wave 2) 바로 뒤 wave 3, 영속 Valkey(PVC·서버, wave 4) 앞이다. 1.0.3의 PostSync는 모든 Sync 리소스가 Healthy여야
# 돌아, 새 앱의 Valkey PVC가 Pending이면 새 DB가 PUBLIC CONNECT를 가진 채 남았다(PR #968 리뷰). wave 2 이상 3 미만에
# Healthy가 늦을 수 있는 리소스를 두지 않는다(tools/ci/data.ts checkPgAclOrder).
# 함정: 이 hook이 실패하면 그 sync는 wave 4(Valkey PVC·서버 Deployment)를 적용하지 않는다. 앞 wave의 Valkey 리소스
# (ExternalSecret·Service·ConfigMap·NetworkPolicy는 wave 0, 백업 CronJob은 wave 1)는 이미 적용됐을 수 있다.
# 함정: GitOps 밖에서 DB를 다시 만들면(restore.md 2절 4-3, homelab db restore) 기본 ACL로 돌아가는데 이 hook은 sync 때만
# 돈다. 그래서 그 절차가 같은 REVOKE·GRANT를 한다. 바꿀 때 셋을 함께 바꾼다(cli/src/core/pgrestore.ts).
# cnpg_metrics_exporter는 CNPG 1.30의 지표 수집 역할이다. target_databases '*'(기본 쿼리 pg_extensions)는 CONNECT 없는
# DB를 오류 없이 건너뛰어, 주지 않으면 그 DB 지표가 조용히 빠진다(1.30.1 metrics/collector.go).
apiVersion: batch/v1
kind: Job
metadata:
  # Job 이름은 63자까지다(파드 라벨 job-name). 앱 이름이 53자라 접두는 10자 안이다.
  name: pg-acl-{{ $name }}
  namespace: database
  labels:
    {{- include "data.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "3"
    # 성공한 Job은 지운다. 데이터 Application에는 finalizer가 없어 폐기(data/<앱> 삭제) 뒤에도 남는다.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "data.labels" . | nindent 8 }}
        # database ns는 들어오는 연결을 기본 거부한다. 이 라벨만 pg 5432로 받는다(platform/cnpg/cluster networkpolicy.yaml).
        homelab.ukyi.app/role: pg-acl
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "data.podSecurity" . | nindent 8 }}
      containers:
        - name: acl
          # Cluster pg와 같은 이미지라 노드에 이미 있다. 올릴 때 platform/cnpg/cluster/templates/cluster.yaml과 함께 옮긴다.
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:d72ace96f5803b12c341bb5dac48532e8c1f92f69e8a717a59d779bfc038dea9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Argo CD는 Database·DatabaseRole의 health를 몰라 CNPG가 DB·역할을 만들기 전에 이 Job이 뜰 수 있다. 새 파드는
              # 시작 직후 NetworkPolicy 허용 전 공백도 있다(templates/valkey.yaml). 그래서 접속될 때까지 기다린다.
              n=0
              until psql -tAc 'select 1' >/dev/null; do
                n=$((n + 1))
                [ "$n" -lt 36 ] || exit 1
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 -q \
                -c 'REVOKE CONNECT ON DATABASE "{{ $name }}" FROM PUBLIC' \
                -c 'GRANT CONNECT ON DATABASE "{{ $name }}" TO "{{ $name }}", cnpg_metrics_exporter'
              pub=$(psql -tAc "select has_database_privilege('public', current_database(), 'CONNECT')")
              [ "$pub" = f ]
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: pg-rw.database.svc
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ $name }}
            - name: PGDATABASE
              value: {{ $name }}
            - name: PGSSLMODE
              value: require
            # 막힌 SYN은 libpq 기본(무한)으로 기다린다. 위 반복이 한 번에 묶이지 않게.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-role-{{ $name }}
                  key: password
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            {{- include "data.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}
