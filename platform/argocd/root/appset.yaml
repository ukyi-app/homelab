# ApplicationSet 두 개. 플랫폼 컴포넌트는 일반 kustomize 디렉토리로 렌더하고,
# 앱은 공유 Helm 차트(multi-source: 차트 + 앱별 values)를 통해 렌더한다 —
# apps/<name>/deploy/prod에는 values.yaml만 있어서 단순 directory source로는
# 아무것도 렌더되지 않기 때문(Deployment/Service/HTTPRoute 없음).
# -------- 1) 플랫폼 컴포넌트 — 일반 git-directory generator --------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/ukyi-app/homelab.git
        revision: nuc-migration
        directories:
          - path: platform/*/prod
          # 제외: argocd(자기 관리), cnpg + victoria-stack(M4/M5에서 root/apps/ 아래
          # 수동 작성 Application), charts/(라이브러리이지 앱이 아님),
          # sealed-secrets(root/apps/ 수동 Application — wave 제어 필요, 이중 소유 금지).
          - { path: platform/argocd/*, exclude: true }
          - { path: platform/cnpg/*, exclude: true }
          - { path: platform/victoria-stack/*, exclude: true }
          - { path: platform/charts/*, exclude: true }
          - { path: platform/sealed-secrets/*, exclude: true }
          - { path: platform/namespaces/*, exclude: true } # 수동 Application으로 wave 제어(root/apps/namespaces.yaml)
          # ── dual-run: 라이브 Mac과 병행 운용하는 동안만 제외 (컷오버에서 이 줄을 지운다) ──
          # ⚠️ cloudflared는 **같은 터널 토큰**으로 두 번째 커넥터가 되어, Cloudflare가 공개 요청을
          #    두 클러스터에 **비결정적으로** 나눈다. 계획서 §3.4의 ⚠️ 항목.
          #    ⚠️ 근거가 한 겹 얇아졌다: 인-레포 배포 앱을 전부 철거해(#455·#456) "요청마다 다른
          #    Postgres를 봐서 가입/쓰기가 양쪽 DB로 갈린다"는 **되돌릴 수 없는** 데이터 발산 시나리오는
          #    사라졌다. 그래도 제외는 **유지한다** — 공개 표면이 남아 있고(apex/www · files ·
          #    argocd-webhook) 두 커넥터가 붙으면 요청이 여전히 비결정적으로 갈린다. files는 쓰기
          #    표면(업로드)이 있어 조용한 발산의 여지도 남는다.
          # ⚠️ 앱 제외 항목은 이제 없다 — `apps/`가 비어 appset이 아무 Application도 만들지 않는다.
          #    G4("전 Application Healthy")의 대상은 platform 컴포넌트 집합으로 좁아졌다.
          - { path: platform/cloudflared/*, exclude: true } # dual-run

  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}' # <component>-prod
      labels: { homelab.env: '{{ .path.basename }}' }
      finalizers:
        - resources-finalizer.argocd.argoproj.io # teardown 시 워크로드 cascade prune (고아화 방지)
    spec:
      project: platform
      source:
        repoURL: https://github.com/ukyi-app/homelab.git
        targetRevision: nuc-migration
        path: '{{ .path.path }}' # platform/<component>/prod — kustomization 디렉토리
        # destination.namespace 없음: 각 컴포넌트의 kustomization이 `namespace:`를
        # 직접 지정한다(gateway, edge, ...). 최초 apply는 CreateNamespace가 커버.
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
  # data-conn/cache/files Application에만 알림 라벨 — 데이터서비스 + files(NotReady 구독).
  # templatePatch(문자열 goTemplate)라 template.metadata의 inline `{{if}}`/미정의 `.X` 함정(missingkey=error) 없음.
  templatePatch: |
    {{- if has (index .path.segments 1) (list "data-conn" "cache" "files") }}
    metadata:
      labels:
        notify.homelab/telegram: "true"
    {{- end }}
---
# -------- 2) 앱 — 공유 차트를 각 앱의 values로 렌더 (multi-source Helm) --------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/ukyi-app/homelab.git
        revision: nuc-migration
        directories:
          - path: apps/*/deploy/prod # 배포되는 앱만 deploy/ 디렉토리를 가진다 (pg-tools는 없음)
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}' # <app>-prod
      labels:
        homelab.env: '{{ .path.basename }}'
        notify.homelab/telegram: "true" # 배포완료/저하 telegram 알림 구독(cm 중앙 selector)
      finalizers:
        - resources-finalizer.argocd.argoproj.io # teardown 시 워크로드 cascade prune (고아화 방지)
    spec:
      project: apps
      sources:
        # source #1: 공유 deploy 차트 (앱 렌더 방식의 SSOT)
        - repoURL: https://github.com/ukyi-app/homelab.git
          targetRevision: nuc-migration
          path: platform/charts/app
          helm:
            releaseName: '{{ index .path.segments 1 }}'
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
        # source #2: 같은 repo를 $values로 노출해 차트가 앱의 values를 읽게 함
        - repoURL: https://github.com/ukyi-app/homelab.git
          targetRevision: nuc-migration
          ref: values
        # source #3: 앱의 deploy 디렉토리를 KUSTOMIZE source로 렌더한다. Helm 차트(source #1)는
        # 앱의 secret을 담지 않으므로, 이것이 없으면 Deployment/migration의 envFrom secret이 누락된다.
        # 앱 시크릿 표준 경로는 create-app(v2) + SealedSecret(`<app>-secrets.sealed.yaml`을 resources:에).
        - repoURL: https://github.com/ukyi-app/homelab.git
          targetRevision: nuc-migration
          path: '{{ .path.path }}' # apps/<name>/deploy/prod: kustomization.yaml + (v2) <app>-secrets.sealed.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: prod
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
