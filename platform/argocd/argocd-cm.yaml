# argocd-cm patch(설계 C.3.3 표). install.yaml의 argocd-cm 위에 키 단위로 합쳐진다.
# 같은 키가 이미 있으면 값이 통째로 바뀐다(문자열 안을 합치지 않는다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # 공개 webhook 없이 main을 60초마다 폴링한다(확정(사용자 2026-10-18, T05)).
  # application-controller(이 값과 jitter)와 repo-server(이 값)는 시작할 때 env로 읽는다(install.yaml의 configMapKeyRef).
  # 그래서 이 ConfigMap만 바뀌어서는 반영되지 않고, 바꾼 뒤 두 파드를 재시작해야 한다.
  timeout.reconciliation: 60s
  # 기본 jitter 1분이 위 값에 더해져 실제 간격이 60~120초가 된다. 0이면 끈다(설계 B.8 E2).
  timeout.reconciliation.jitter: "0"

  # 내장 admin을 끈다. 사람은 로컬 계정 owner(login만), 봇 계정 bot-reader(apiKey만)는 T08b가 더한다.
  # owner 비밀번호는 ESO가 Infisical의 bcrypt 해시를 argocd-secret에 합친다(platform/external-secrets/templates/argocd-owner.yaml).
  admin.enabled: "false"
  accounts.owner: login

  # install.yaml이 이미 기본 목록을 이 키에 둔다. 키를 통째로 덮어쓰므로 기본 목록을 그대로 옮기고 Event만 더했다.
  # 설계 표의 Endpoints·EndpointSlice는 기본 목록에 있다. Event는 옛 실측이다(옛 bootstrap-values.yaml).
  # Argo CD를 올릴 때 새 install.yaml의 기본 목록과 대조한다.
  resource.exclusions: |
    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - ''
      - events.k8s.io
      kinds:
      - Event
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest

  # Application health. Argo CD 1.8에서 빠졌고 공식 문서의 Lua를 그대로 되살린다.
  # 이것이 없으면 root가 자식 Application의 Healthy를 기다리지 않아, wave가 생성 순서만 정한다.
  # 옛 구성은 이것이 없어 콜드스타트에서 앱 5개가 Missing에 고착했다(옛 SYNC-WAVES.md:7-15).
  # 그래도 Application 사이 순서는 health를 기다리는 것뿐이다. 음수 wave를 붙일 때는 "그 리소스를 Healthy로
  # 만드는 주체가 더 앞 wave에 있는가"를 확인한다. 아니면 교착이다(옛 콜드스타트 17시간, 설계 B.8 E2).
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs

  # ExternalSecret health 덮어쓰기(설계 C.3.3 표). T09 시나리오 6·7(E3 동등 절차, 2026-10-20)에서
  # Ready=True, 이력 있는 실패(Healthy), 이력 없는 실패(Degraded)를 확인했다.
  # 내장 health는 Ready=False를 바로 Degraded로 본다. 그러면 Infisical 장애 때 이미지만 바꾸는 배포까지
  # 뒤 wave에서 멈출 수 있다. 장애는 ExternalSecretNotReady 경보가 따로 알린다.
  # - status·conditions가 아직 없다(ESO가 처음 reconcile하기 전): Progressing
  # - Ready=True: Healthy
  # - Ready=False인데 지금 spec으로 동기화한 이력이 있다: Healthy(메시지에 실패 표시)
  # - Ready=False이고 그 이력이 없다(새 키를 더한 spec 변경이 실패): Degraded
  # 이력 판정: ESO는 동기화에 성공할 때만 status.syncedResourceVersion을 "<generation>-<라벨·주석 해시>"로 쓴다
  # (v2.13.0 pkg/controllers/util/util.go GetResourceVersion). 앞부분이 metadata.generation과 같으면 이력이 있다.
  # 양쪽을 tonumber로 맞춘다. Argo CD는 json.Number를 Lua 문자열로 넘기고, Lua의 ==는 숫자와 문자열을 같게 보지 않는다.
  # string.match 결과는 지역 변수에 먼저 받는다. gopher-lua에서 못 찾으면 값을 하나도 돌려주지 않아,
  # tonumber(string.match(...))로 바로 넘기면 스크립트가 에러로 끝난다(gopher-lua v1.1.2로 시험).
  # string.match를 쓰려면 아래 useOpenLibs가 필요하다. Argo CD는 Lua 표준 라이브러리를 기본으로 막는다.
  resource.customizations.useOpenLibs.external-secrets.io_ExternalSecret: "true"
  resource.customizations.health.external-secrets.io_ExternalSecret: |
    local hs = {}
    if obj.status == nil or obj.status.conditions == nil then
      hs.status = "Progressing"
      hs.message = "Waiting for ExternalSecret"
      return hs
    end
    local ready = nil
    for _, condition in ipairs(obj.status.conditions) do
      if condition.type == "Ready" then
        ready = condition
      end
    end
    if ready ~= nil and ready.status == "True" then
      hs.status = "Healthy"
      hs.message = ready.message
      return hs
    end
    if ready ~= nil and ready.status == "False" then
      local synced = obj.status.syncedResourceVersion
      local generation = tonumber(obj.metadata.generation)
      if synced ~= nil and generation ~= nil then
        local prefix = string.match(synced, "^(%d+)%-")
        if prefix ~= nil and tonumber(prefix) == generation then
          hs.status = "Healthy"
          hs.message = "Current spec was synced before; latest refresh failed: " .. (ready.message or "")
          return hs
        end
      end
      hs.status = "Degraded"
      hs.message = ready.message
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for ExternalSecret"
    return hs
