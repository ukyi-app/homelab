# 플랫폼 구성 요소의 ns와 PSA 라벨을 한 곳에서 선언한다(설계 C.3.3, 옛 P18).
#
# 목록: 설계 C.3.1 표의 플랫폼 구성 요소가 쓰는 ns만 둔다. 앱 ns(app-*)는 ApplicationSet apps가
# managedNamespaceMetadata로 만들고(T10), 봇 시험 ns bot-slot-probe는 봇 자리 Application이 만든다(T08b).
# 뒤 티켓(T08a·T08b·T09·T11)의 ns도 지금 미리 둔다. 여러 티켓이 이 파일에 블록을 더하다 충돌하지 않게 하려는 것이다.
# PSA 수준은 그 구성 요소를 만드는 티켓이 실측으로 확정하고, 자기 블록만 고친다.
#
# 구성 요소 Application에는 CreateNamespace를 쓰지 않는다. 그렇게 만든 ns에는 PSA 라벨이 없다
# (옛 cnpg-system·cert-manager, 옛 namespaces.yaml:5-7). 이 Application(wave -9)이 구성 요소(-8부터)보다 먼저 만든다.
#
# 기본은 enforce baseline, warn·audit restricted다(옛 실측 방식). warn·audit가 restricted 위반을 계속 알려
# 나중에 조일 근거가 된다. hostPath·hostPID·NET_ADMIN 같은 권한이 꼭 필요한 ns만 privileged다.
#
# 모든 ns에 Prune=false,Delete=false를 둔다. ns를 지우면 안의 PVC와 Secret까지 함께 지워진다.
# 매니페스트에서 빠지거나 Application이 지워져도 ns는 남는다.

# T07. bootstrap이 라벨 없이 먼저 만들고, 라벨은 여기서 붙인다.
# application-controller가 cluster-admin이라 이 ns의 PSA는 경계가 아니라 위생이다(설계 B.8 E2).
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T09. bootstrap 2번이 ESO 부트스트랩 Secret을 넣으려고 라벨 없이 먼저 만든다(설계 C.3.3).
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08a. 옛 실측: controller·cainjector·webhook이 restricted를 보장하지 않는다.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T11. CNPG operator와 Barman Cloud Plugin. 두 차트의 파드가 restricted를 지킨다(2026-10-23 kind 실측, 위반 경고 0).
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T11. CNPG 클러스터 pg와 앱 DB 역할. 운영 데이터 PVC가 있는 ns다.
# restricted: 인스턴스·initdb·백업·복구 Job이 모두 restricted에서 돈다(2026-10-23 kind 실측).
# 사람이 만드는 복원 Job(설계 C.5.7)도 runAsNonRoot·seccomp RuntimeDefault·capabilities drop ALL을 적어야 받아들여진다.
apiVersion: v1
kind: Namespace
metadata:
  name: database
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08a. 공개 HTTP 라우팅.
