# T08a. 프록시 파드가 TUN 장치와 sysctl 때문에 privileged가 필수다(설계 C.3.5, 옛 namespaces.yaml:116-131).
# privileged는 이 ns 하나에 가둔다. 옛 구성에서 다른 구성 요소와 ns를 함께 쓰다 프록시 재생성이 막힌 일이 있었다.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08a. 옛 실측: setcap(NET_BIND_SERVICE)과 allowPrivilegeEscalation 때문에 restricted가 안 된다.
apiVersion: v1
kind: Namespace
metadata:
  name: adguard
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08b. node-exporter·vector가 hostPath·hostPID를 쓰고 vector는 root다. baseline도 이것을 막는다(설계 B.8 E4).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08b. 작업자 파드의 init 컨테이너가 NET_ADMIN으로 출력 차단 규칙을 건다(설계 C.8).
# 그래서 privileged이고, 이 ns의 파드는 Git(Argo CD)만 만든다.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# T08b. 작업자의 허용 목록 egress 프록시(설계 C.8).
apiVersion: v1
kind: Namespace
