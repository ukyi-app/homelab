# 복구 멈춤(suspendedApps)과 복구 스위치(externalSecrets)를 함께 켠 렌더. VM 복구 PR은 둘을 같이 쓸 수 있다.
# 두 주입이 한 templatePatch에서 합쳐지는지 본다(templates/applicationset.yaml). ci 단계 external secrets switch가
# 이 templatePatch를 실제로 실행해 멈춘 앱과 나머지 앱 모두에 스위치가 들어가는지 본다(tools/ci/appset-patch.ts).
tailscale:
  prefix: vm-
suspendedApps:
  - homelab-smoke
externalSecrets:
  enabled: false
