# 복구 멈춤(valkeyRestore)과 복구 스위치(externalSecrets)를 함께 켠 렌더. VM 복구 PR은 둘을 같이 쓸 수 있다.
# ci 단계 external secrets switch가 이 templatePatch를 실제로 실행해 두 모드와 스위치가 함께 들어가는지 본다(tools/ci/appset-patch.ts).
backup:
  bucket: homelab-backups-vm
valkeyRestore:
  homelab-smoke: stopped
  homelab-smoke2: restoreMode
externalSecrets:
  enabled: false
