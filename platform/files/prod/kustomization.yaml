apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: files # files-prod Application의 권위 대상 namespace(appset destination.namespace 부재)
resources:
  - pvc.yaml
  - files-keys.sealed.yaml
  - ghcr-pull.sealed.yaml
  - deployment.yaml
  - service.yaml
  - httproute-internal.yaml
  - httproute-public.yaml
  - networkpolicy.yaml
# 이미지는 deployment.yaml에 repo:sha-<gitsha>@sha256:<digest> 인라인 핀(태그+digest 불변, 홈랩
# first-party 규약; kustomize images는 newTag+digest 동시 지정 불가라 인라인 채택).
# bump-poll **베스포크 레인 적용** — 같은 디렉토리 .image-pin.json이 핀 위치·승인(autoDeploy)
# SSOT이고, poll-ghcr 2차 순회가 이 인라인 핀을 재기록해 deployment.yaml 이미지 라인 갱신 PR을
# 연다(tools/poll-ghcr.ts planComponent). 무인 자동 머지 여부는 그 descriptor의 autoDeploy가
# 정한다 — 승인 자세는 거기서만 읽고 바꾼다.
