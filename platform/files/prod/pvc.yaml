# 사용자 파일 저장 — bulk-ssd 티어. ⚠️ 매체는 국면에 따라 다르다: 국면 A(versions.env의
# BULK_MIGRATION_WINDOW_UNTIL이 비어 있지 않음)에는 노드 루트 LV의 bind 마운트(/mnt/bulk)이고,
# 국면 B에서만 별도 2TB M.2다(virtiofs는 OrbStack 시절 서술 — 베어메탈 이전으로 소멸).
# storageClassName 명시 필수(opt-in; 누락 시 standard=노드 내장 디스크로 조용히 착지). Prune=false + SC bulk-ssd reclaimPolicy=Retain
# (git SSOT: infra/k3s-bootstrap/storage/storageclass-bulk-ssd.yaml)로 삭제민감 데이터 보호.
# 내구성 등급 = 비재생성(non-regenerable): files-data는 git+R2+age로 재구축 불가한 유일 자산.
#   · 오삭제/침묵유실 방어: Retain + Prune=false + /readyz free-space + FilesBackup/FilesBulkSSD 알림(r4).
#   · 매체 유실 방어: 오프-매체 rsync 사본(scripts/backup-files-data.sh, RPO=일1회/24h).
#     ⚠️ **국면 A에는 이 방어가 없다** — NUC은 디스크가 하나라 2차 매체가 원리적으로 존재할 수 없다.
#     실행자는 2026-08-19에 리눅스로 재작성돼 이미 커밋된 배선을 갖는다
#     (infra/k3s-bootstrap/host-config/etc/systemd/system/files-data-backup.{service,timer}) — 다만
#     같은 매체 사본이라는 false-green을 막으려고 국면 A 동안 **의도적으로 enable하지 않는다**.
#     국면 B(2TB M.2) 이후 `systemctl enable --now files-data-backup.timer` 한 줄로 복구된다.
#     그때까지 r4의 FilesBackupStale은 absent 가지가 한시 억제 상태다(만료 시 자동 재무장).
#   · R2 미사용(무료티어)은 '백업 없음'이 아니라 '백업 = 호스트 내장 디스크 사본'.
#   ⚠️ **DR 재결합 절차의 정본은 `docs/runbooks/external-ssd.md` §3이다**(2026-08-17 베어메탈 재작성에서
#      신설 — 옛 판은 macOS APFS 외장 볼륨 **생성** 런북이라 재결합 절차를 담은 적이 없었다).
#      요건은 `scripts/dr-drill.sh`의 [6.5] 주석도 인라인으로 들고 있고 그 수행 여부를 fail-loud로
#      검증한다(기존 bulk 데이터 디렉토리를 가리키는 hostPath PV를 claimRef로 정적 바인딩).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-data
  namespace: files
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: bulk-ssd
  resources:
    requests:
      storage: 100Gi
