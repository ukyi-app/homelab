# files 파일 스토어 — 단일 파드 2리스너. securityContext는 trip-mate(restricted) + fsGroup(adguard) 복제.
# 쓰기는 /data(PVC)·/tmp(emptyDir)뿐. 이미지는 repo:sha-TAG@sha256:DIGEST 인라인 핀(불변).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files
  labels:
    app.kubernetes.io/name: files
spec:
  replicas: 1
  strategy: { type: Recreate } # RWO PVC — 단일 노드, 신구 파드 볼륨 교착 회피
  selector:
    matchLabels: { app.kubernetes.io/name: files }
  template:
    metadata:
      labels: { app.kubernetes.io/name: files }
    spec:
      automountServiceAccountToken: false # k8s API 미사용
      imagePullSecrets: [ { name: ghcr-pull } ] # private GHCR
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        fsGroup: 65532 # 비루트의 RWO /data 쓰기 허용
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: files
          image: ghcr.io/ukyi-app/files:sha-d84eaddbf78438a38fc8897d66fa69e5b90f7dd1@sha256:9d1e9566252bbcb3729fe484173cc78dd54d423985707ca7a1b9065ac8bf5596 # sha-d84eadd + digest 인라인 핀(불변)
          ports:
            - { name: internal, containerPort: 8080 }
            - { name: public, containerPort: 8081 }
          env:
            - { name: FILES_DATA_DIR, value: /data }
            - { name: FILES_KEYS_PATH, value: /etc/files-keys/keys.json }
            - { name: FILES_INTERNAL_PORT, value: "8080" }
            - { name: FILES_PUBLIC_PORT, value: "8081" }
            - { name: FILES_PUBLIC_BASE_URL, value: "https://files.ukyi.app" }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            # right-size 2026-09-01: A′ peak 2.9Mi(14일) × 2.0x → req 하한 위 헤드룸을 남겨 64Mi(22x).
            # ⚠️ 32Mi로 더 내리지 않는다 — files-data는 재구축 불가한 유일 자산이고(pvc.yaml) 국면 A에는
            #    오프-매체 백업이 미-enable이다. 14일 창은 사람이 간헐적으로 쓰는 **업로드 경로**를
            #    대표한다는 증거가 없다(앱은 외부 레포라 스트리밍 여부를 여기서 확인할 수 없다).
            #    32Mi는 그 경로를 한 번 실측한 뒤에만. cpu limit 미설정(CFS throttling 회피 — 홈랩 규약).
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ "ALL" ] }
          livenessProbe:
            httpGet: { path: /healthz, port: internal }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            # /readyz = /data 실제 write 프로브 + free-space 확인 → 스토리지 저하 시 NotReady
            httpGet: { path: /readyz, port: internal }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: keys, mountPath: /etc/files-keys, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: keys
          secret:
            secretName: files-keys
            items: [ { key: keys.json, path: keys.json } ]
        - name: data
          persistentVolumeClaim: { claimName: files-data }
        - name: tmp
          emptyDir: {}
