{{- /*
시험 ns. platform/namespaces가 아니라 이 Application이 직접 만든다(봇 자리의 시험 ns bot-slot-probe와 같은 방식).
platform/namespaces는 늘 켜져 있어, 거기 두면 구성 요소가 꺼져 있어도 ns가 생기고 끌 때 지워지지 않는다.
Prune=false·Delete=false를 붙이지 않는다. 끄면 ns째 지워져야 한다(values.yaml 되돌리기).
restricted를 강제한다. 시험 파드가 티켓 할 일 1의 조건(비root, drop ALL, 권한 상승 금지, seccomp)을 못 지키면 뜨지 않는다.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "o02.namespace" . }}
  labels:
    {{- include "o02.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # 같은 Application 안의 ns 리소스보다 먼저.
    argocd.argoproj.io/sync-wave: "-1"
