# O02 시험 파드의 값. 켜고 끄는 스위치는 여기가 아니라 platform/root/values.yaml의 components.oliveO02.enabled다(기본 꺼짐).
#
# 되돌리기(검증이 끝나면):
#   1. 끄는 PR: components.oliveO02.enabled를 false로 되돌린다. root Application이 olive-o02 Application을 지우고,
#      그 Application의 resources-finalizer가 시험 ns와 안의 것을 함께 지운다(platform/root/templates/olive-o02.yaml).
#   2. 확인: kubectl get application -n argocd olive-o02 와 kubectl get namespace olive-o02-test 가 둘 다 NotFound.
#   3. 치우는 PR: platform/olive-o02/, platform/root/templates/olive-o02.yaml, values.yaml의 oliveO02 블록,
#      tools/olive-o02/, tools/ci/fixtures/platform/olive-o02/를 같은 PR에서 지운다. fixture만 남으면 CI가 그 fixture의
#      차트(platform/olive-o02/Chart.yaml)를 찾지 못해 실패한다. 2를 확인하기 전에 지우지 않는다(Application이 남은 채
#      원본이 사라지면 sync가 실패로 남는다).

# 파드에 넣는 hc. 공식 릴리스 서비스의 고정 버전 파일을 init 컨테이너가 받아 sha256을 대조한다(templates/session.yaml).
# 세 값은 함께 바꾼다. sha256은 https://releases.herdr.dev/core/<version>/manifest.json의 linux-x86_64 값이다.
# 이 값이 신뢰의 기준이다. 실행 때 manifest를 다시 읽지 않으므로, 릴리스 서비스가 나중에 파일을 바꾸면 init이 실패한다.
# hc 문서(docs/security.md)대로 릴리스 manifest에는 별도 서명이 없다. 2026-11-16에 받은 파일의 sha256과 안의 실행 파일을
# NUC에 설치된 0.1.21과 대조했다.
hc:
  version: "0.1.21"
  url: https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz
  sha256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1

# 세션 컨테이너의 상한. 시험 3(limits가 holder의 자식에도 걸리는지)이 이 값을 cgroup에서 읽어 대조한다.
# 메모리 상한은 limit-mem 단계가 일부러 넘긴다. 크게 잡으면 그 단계가 NUC 메모리를 그만큼 쓴다.
session:
  cpuLimit: 500m
  memoryLimit: 256Mi
