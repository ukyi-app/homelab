{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
# 터널 토큰은 Terraform이 만든 터널의 sensitive output을 사람이 Infisical에 넣는다(infra/README.md).
# 토큰을 바꾸면 env라 파드를 다시 만들어야 반영된다(rollout restart, 설계 B.8 E3).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  namespace: cloudflared
  annotations:
    # Deployment(wave 0)보다 먼저. 없으면 새 파드가 CreateContainerConfigError로 멈춘다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: token
      remoteRef:
        key: cloudflared/TUNNEL_TOKEN
{{- end }}
