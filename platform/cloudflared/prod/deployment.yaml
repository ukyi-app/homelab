apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: edge

spec:
  replicas: 1
  selector: { matchLabels: { app: cloudflared } }
  template:
    metadata:
      labels: { app: cloudflared }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false # SA 토큰 불요(k8s API 미사용) — 토큰 탈취 표면 제거(보안 감사 SA-1)
      securityContext:
        seccompProfile:
          type: RuntimeDefault   # 표준 정합(homepage/adguard/cnpg 동형) — userspace 터널이라 RuntimeDefault 안전
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.1@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283 # 멀티아치 index digest 핀(linux/arm64 검증)
          args: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-tunnel, key: token } }
            - name: GOMEMLIMIT
              value: "57MiB"
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            # right-size 2026-09-01: A′ peak 24.7Mi(14일) × 2.0x = 64Mi(2.59x). 옛 근거 "peak 51Mi,
            # p99 45Mi (1.89x)"는 working_set 기준이라 PR #564로 무효화됐다(그 값의 절반 이상이 캐시였다).
            # GOMEMLIMIT은 limit의 90%로 연동(57MiB).
            limits: { cpu: 300m, memory: 64Mi }
          livenessProbe:
            httpGet: { path: /ready, port: 9090 }
            initialDelaySeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: cloudflared }
