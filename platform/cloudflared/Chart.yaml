# 원격 관리 터널 커넥터(설계 C.3.4, T08a). 터널·ingress 규칙·DNS는 infra/cloudflare(Terraform) 한 곳에만 있다.
# 클러스터에는 Cloudflare API 토큰을 두지 않고 터널 토큰만 ESO로 받는다. VM은 같은 키 이름을 homelab-dev에서 읽는다.
#
# 차트인 이유: 복구 스위치(externalSecrets.enabled)를 root가 valuesObject로 넘긴다(E8 VM 격리 1번 A안, T23).
# 처음에는 kustomize였다. 함정: kustomization.yaml을 다시 두지 않는다. Chart.yaml과 함께 있으면 Argo CD가 어느 쪽으로
# 렌더할지 이 저장소에서 확인하지 않았고, ci(tools/ci/render.ts)는 Chart.yaml이 있으면 Helm으로 렌더한다.
# 템플릿에 이중 중괄호를 쓰면 Helm이 렌더한다. 컨테이너 인자 등에 그 문자열이 필요하면 이스케이프한다.
apiVersion: v2
name: cloudflared
description: Cloudflare remote-managed tunnel connector for one homelab cluster
type: application
version: 0.1.0
