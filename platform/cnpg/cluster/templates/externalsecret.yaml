# R2 백업 버킷 전용 Object Read & Write 토큰(설계 C.3.8). 사람이 Infisical homelab/prod /platform/backup에 넣는다.
# store는 infisical-apps다. infisical-platform의 conditions에는 database ns가 없다(AppProject data가 ExternalSecret을
# 만들 수 있는 ns라 앱 store 쪽, platform/external-secrets/templates/clustersecretstores.yaml).
# 키를 /로 시작하는 절대 경로로 적어 그 store의 secretsPath(/apps)를 건너뛴다(U06).
# 키가 없으면 이 ExternalSecret이 Degraded라 cnpg-cluster(wave -3)가 멈추고 root가 뒤 wave를 기다린다.
# 그래서 키를 먼저 넣고 components.cnpgCluster를 켠다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cnpg.credentialsSecret" . }}
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: {{ include "cnpg.credentialsSecret" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: /platform/backup/R2_ACCESS_KEY_ID
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: /platform/backup/R2_SECRET_ACCESS_KEY
    # S3 API endpoint URL(https://<계정 ID>.r2.cloudflarestorage.com). 계정 ID를 Git에 두지 않으려고 Secret으로 받는다.
    - secretKey: ENDPOINT_URL
      remoteRef:
        key: /platform/backup/R2_ENDPOINT
