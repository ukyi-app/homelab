{{- $secret := include "cnpg.credentialsSecret" . }}
# 쓰기 대상. 아카이브 위치는 s3://<bucket>/pg/<serverName>/이고 serverName은 Cluster의 plugin 파라미터가 정한다
# (ObjectStore CRD가 serverName을 CEL로 거부한다).
# Prune=false,Delete=false: revert나 Application 삭제로 백업 설정이 사라지지 않게(설계 C.5.5).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # base backup과 WAL을 함께 지운다. 14일보다 오래된 것 중 복구에 필요한 마지막 base backup은 남는다.
  retentionPolicy: 14d
  configuration:
    {{- include "cnpg.objectStoreConfiguration" (dict "bucket" .Values.backup.bucket "secret" $secret) | nindent 4 }}
  instanceSidecarConfiguration:
    env:
      {{- include "cnpg.sidecarEnv" (dict "secret" $secret) | nindent 6 }}
    # sidecar는 Cluster가 주입하는 네이티브 사이드카라 Cluster에 resources 자리가 없다. 여기가 유일한 자리다.
    # 옛 실측 peak 152.5Mi(매일 base backup 때, PGDATA 49MB)의 약 2배. DB가 커지면 다시 잰다.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 320Mi
{{- with .Values.cnpg.recoverySource }}
{{- if eq .serverName $.Values.cnpg.serverName }}
{{- fail "cnpg.recoverySource.serverName must differ from cnpg.serverName (same prefix mixes timelines, design C.6.4)" }}
{{- end }}
---
# 복구 원본(읽기 전용으로만 쓴다). 빈 NUC 복구 PR에서만 렌더하고 정리 PR에서 지운다(설계 C.6.4).
# 한 클러스터가 같은 ObjectStore를 백업과 복구에 함께 쓰지 않는다는 CNPG 권고대로 따로 둔다.
# retentionPolicy를 두지 않는다. 두면 plugin이 이 원본 prefix의 옛 백업을 지운다.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: r2-source
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  configuration:
    {{- include "cnpg.objectStoreConfiguration" (dict "bucket" (.bucket | default $.Values.backup.bucket) "secret" (.credentialsSecret | default $secret)) | nindent 4 }}
  instanceSidecarConfiguration:
    env:
      {{- include "cnpg.sidecarEnv" (dict "secret" (.credentialsSecret | default $secret)) | nindent 6 }}
{{- end }}
