apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-basebackup-local
  namespace: database
spec:
  accessModes: ["ReadWriteOnce"]
  # ⚠️ bulk 티어의 **물리 매체는 국면에 따라 다르다** — 국면 B(현재, 2026-08-26~)는 별도 2TB M.2이고,
  #    국면 A로 되돌아가면 NUC 내장 디스크의 bind다(국면 SSOT는 versions.env의 `BULK_MIGRATION_WINDOW_UNTIL`).
  #    불변인 것은 **용도**다: 스테이징 전용 — Postgres PGDATA에는 절대 금지.
  storageClassName: bulk-ssd
  resources:
    requests:
      storage: 100Gi
