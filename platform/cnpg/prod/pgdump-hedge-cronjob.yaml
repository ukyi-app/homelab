apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-dump-hedge-r2
  namespace: database
spec:
  # ⚠️ 로컬 basebackup(02:30 KST) 뒤다. R2 ScheduledBackup은 여기 끼지 않는다 — 그쪽은 operator
  #    TZ(UTC)의 03:00Z, 즉 12:00 KST라 이 창보다 **뒤**에 돈다(다른 시계다).
  schedule: "0 4 * * *" # 04:00 KST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            cnpg.io/backupRole: pgdump-hedge
        spec:
          restartPolicy: Never
          securityContext: { runAsUser: 26, runAsGroup: 26, fsGroup: 26, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: pgdump-hedge
              # digest 핀: mutable 태그는 build push 때마다 움직여 의도치 않은 이미지로 실행될 수 있다
              # (restore-drill-cronjob과 동일 규약). 갱신은 bump 체인이 아니라 의도적 커밋으로만.
              image: ghcr.io/ukyi-app/pg-tools:18-rclone@sha256:154b0e77f4e677d69605aa3abf76cc3061635e24cedbf617155e5179ccabcd45 # M6가 빌드 (ops/pg-tools/)
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              # ⚠️ **requests만 둔다 — limits는 의도적으로 없다.** 없으면 BestEffort QoS가 되어
              #    노드 압박 시 가장 먼저 evict된다. 이 잡은 백업 생산자다 — 압박이 백업을 먼저
              #    죽이는 순서는 정확히 반대다. requests를 주면 Burstable이 되어 그 순서가 뒤집힌다.
              # ⚠️ limits를 두지 않는 이유: 이 kind는 어떤 게이트도 읽지 않아(check-resource-limits.ts의
              #    KINDS에 CronJob/Job 부재) 틀린 limit이 무측정으로 출하된다. requests는
              #    스케줄링·evict 순서에만 영향을 주므로 틀려도 죽이지 않는다.
              #    (memory-ledger는 상주 워크로드만 회계한다 — :122가 전이 워크로드 제외를 명시.)
              resources:
                requests: { cpu: 100m, memory: 128Mi }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  # 논리 백업은 DB 단위다 — 클러스터 전역 물리 백업과 달리 여기 없는 DB는 물리
                  # 사본 손상(포맷/WAL 재생 실패) 시 복구 수단이 없다. databases/*.yaml의 논리 DB
                  # CR 전부 + 부트스트랩 app(restore_canary)을 나열한다. test_pgdump_hedge.bats가
                  # databases/ 와의 정합을 강제한다(누락 = CI 실패).
                  DBS="app page trip-mate"
                  # ⚠️ **클러스터별 prefix.** 라이브 Mac과 병행 운용하는 동안 같은 prefix를 쓰면
                  #    아래 `rclone delete --min-age 14d`가 **상대편의 덤프를 지운다**(파일명이
                  #    ${DB}-${TS}라 두 클러스터를 구별할 수 없다). 계획서 §3.4 표에 빠져 있던 충돌이다.
                  #    덮어쓰기는 없지만(타임스탬프) 프루닝은 prefix 전체를 훑는다.
                  # ⚠️ 컷오버 후에도 되돌리지 않는다(serverName pg-nuc와 같은 판단 — 이름 미관보다
                  #    전환 한 번을 줄이는 쪽). 대신 Mac 시대 `pgdump/`는 컷오버 체크리스트에서
                  #    한 번 정리한다 — 아무도 프루닝하지 않아 영원히 남는다.
                  DUMP_PREFIX="r2:homelab-pg-backups-prod/pgdump-nuc"
                  # kube-router가 새 파드의 네트워크 룰(ClusterIP 라우팅)을 설치하기 전, 파드 첫
                  # 동작으로 pg-rw에 접속하면 RST(Connection refused)가 나고 libpq는 즉시 포기한다
                  # (라이브 검증). pg-rw:5432가 연결 가능해질 때까지 짧게 대기한 뒤 진행한다.
                  for i in $(seq 1 30); do
                    if (exec 3<>/dev/tcp/pg-rw.database.svc/5432) 2>/dev/null; then break; fi
                    echo "[hedge] waiting for pg-rw:5432 (attempt ${i}/30)"; sleep 1
                  done
                  for DB in ${DBS}; do
                    KEY="${DUMP_PREFIX}/${DB}-${TS}.dump.gz"
                    echo "[hedge] pg_dump (custom format) ${DB} -> ${KEY}"
                    pg_dump --host=pg-rw.database.svc --port=5432 \
                            --username="$PGUSER" --dbname="${DB}" \
                            --format=custom --no-password \
                      | gzip -c \
                      | rclone rcat "${KEY}" --s3-region auto
                    echo "[hedge] verify object exists and is non-empty"
                    # pg-tools 이미지에는 python3가 없다 — sed로 파싱
                    SIZE="$(rclone size "${KEY}" --json | sed -n 's/.*"bytes":\([0-9][0-9]*\).*/\1/p')"
                    test "${SIZE}" -gt 0
                    echo "[hedge] OK db=${DB} size=${SIZE}"
                  done
                  echo "[hedge] prune dumps older than 14 days"
                  rclone delete "${DUMP_PREFIX}/" --min-age 14d
                  echo "[hedge] done dbs=[${DBS}]"
              envFrom:
                - secretRef: { name: cnpg-r2-creds } # M2 시드: RCLONE_CONFIG_R2_* + AWS_* (AWS_REGION=auto)
              env:
                # R2 Object-R&W 토큰은 HeadBucket을 거부한다 — rclone의 업로드 전 버킷 체크가
                # "버킷 없음→CreateBucket(403)"으로 오판하므로 체크를 끈다.
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
                # pg_dump는 app DB 전체를 떠야 한다 — restore_canary 등 postgres 소유 객체를 app
                # 롤로는 LOCK/덤프할 수 없어 permission denied로 실패한다(라이브 검증). 완전한 논리
                # 백업을 위해 관리형 superuser(pg-superuser)로 접속한다(basebackup과 동일 규약).
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: pg-superuser, key: username } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: pg-superuser, key: password } }
