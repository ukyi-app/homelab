apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-restore-drill
  namespace: database
spec:
  schedule: "0 5 * * 0" # 일요일 05:00 UTC(=14:00 KST — `timeZone` 미지정이라 UTC로 평가된다)
  # ⚠️ **dual-run 동안 정지한다.** 이 drill은 PASS 시 `HEALTHCHECKS_URL`을 ping하는데
  #    (`restore-drill-script.sh` 말미), 그 시드(`restore-drill-alerting.enc.yaml`)는 main과
  #    **바이트 동일**이다 — 즉 NUC이 ping하면 **라이브 Mac의 drill이 아예 안 돌아도 체크가 초록으로
  #    남는다.** `deadmanswitch-relay`를 dual-run에서 뺀 것과 **정확히 같은 이유**다
  #    (`tests/gates/test_dual-run-excludes.bats`의 "green-wash the live check").
  #    Telegram도 같은 chat이라 PASS가 두 건 온다.
  # ⚠️ **아카이브 원본은 문제가 아니다** — drill은 라이브 Cluster의 plugin `serverName`에서
  #    파생하므로 NUC은 `pg-nuc`, Mac은 `pg`를 복구한다(스크립트 헤더 주석 참조). 교차 오염 없다.
  # ⚠️ **새 알림을 만들지 않는다**: `CNPGRestoreDrillStale`은 NUC에서 이미 발화 중이다
  #    (metric이 한 번도 push된 적 없어 `absent()`가 참 — 2026-08-15 실측). suspend가 그 상태를
  #    바꾸지 않는다. `DeadmanswitchRelayUnreachable`이 relay 제외의 대가로 떠 있는 것과 같은 성질이다.
  # ⚠️ **G5(R2 → 일회용 클러스터 복구 증명)는 이 drill이 그대로 수행한다.** 정지시킨 뒤에도
  #    `kubectl -n database create job --from=cronjob/pg-restore-drill <name>`으로 **수동 실행**은 된다
  #    (suspend는 스케줄러만 막는다). 수동 실행 시 `HEALTHCHECKS_URL`을 빈 값으로 덮어 ping만 죽이면
  #    오염 없이 증거를 얻는다.
  # ⚠️ 컷오버에서 **`false`로 되돌린다.** 이 줄이 `dual-run` 마커를 달고 있어야
  #    `test_dual-run-excludes.bats`의 되돌림 집합에 잡힌다.
  suspend: true # dual-run
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0 # 실패한 drill은 조용히 재시도가 아니라 페이징되어야 한다
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels: { cnpg.io/job: restore-drill }
        spec:
          restartPolicy: Never
          serviceAccountName: restore-drill
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: drill
              # digest로 고정(불변): 이 Job은 database ns에서 delete 권한을 가진다; mutable 태그는
              # 몰래 교체될 수 있다. CI가 digest를 기록 — drill 활성화 전에 여기 고정할 것.
              image: ghcr.io/ukyi-app/pg-tools:18-rclone@sha256:3378c346d97885e0fbf9d459aa339e12fb68bd46a5192c5dc8ee4adfc36623f0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              command: ["/bin/bash", "/scripts/drill.sh"]
              env:
                - name: TELEGRAM_BOT_TOKEN
                  valueFrom: { secretKeyRef: { name: restore-drill-alerting, key: TELEGRAM_BOT_TOKEN } }
                - name: TELEGRAM_CHAT_ID
                  valueFrom: { secretKeyRef: { name: restore-drill-alerting, key: TELEGRAM_CHAT_ID } }
                - name: HEALTHCHECKS_URL
                  valueFrom: { secretKeyRef: { name: restore-drill-alerting, key: HEALTHCHECKS_URL } }
                - name: METRICS_PUSH_URL
                  value: "http://vmsingle.observability.svc:8428" # vmsingle import API (M5) — 성공 메트릭이 반드시 적재되어야 함
              volumeMounts:
                - { name: script, mountPath: /scripts }
          volumes:
            - name: script
              configMap: { name: restore-drill-script, defaultMode: 0755 }
