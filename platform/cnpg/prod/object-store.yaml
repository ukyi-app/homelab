apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: pg-r2
  namespace: database
  annotations:
    # ⚠️ **Cluster CR(wave -1)보다 먼저 apply되어야 한다.** 이 값이 없으면 기본 wave 0이 되어
    #    Cluster가 먼저 올라가는데, barman-cloud 플러그인은 참조된 ObjectStore가 없으면
    #    "barman object configuration not found"로 **무한 requeue**하며 pre-reconcile hook이
    #    reconciliation을 멈춘다 → Cluster가 영원히 Healthy가 되지 않는다 → ArgoCD가 wave -1에서
    #    대기하므로 **wave 0의 이 ObjectStore는 영원히 apply되지 않는다**(완전한 교착).
    #    2026-08-13 NUC 첫 bootstrap에서 실측: Cluster가 33분간 INSTANCES/READY 빈 채로 정지.
    # ⚠️ Mac(main)에서 드러나지 않은 이유 — 그 클러스터는 initdb로 시작해 **점진적으로** 구축됐고
    #    ObjectStore가 추가될 때 Cluster는 이미 떠 있었다. 즉 이 순서는 **콜드스타트에서만** 문제가
    #    된다. G11(콜드스타트 증명)이 잡아야 할 결함이 첫 실행에서 드러난 것이다.
    # generator 산출 Secret(cnpg-r2-creds 등)도 -2다(kustomization.yaml:39). 같은 wave 안에서는
    # ArgoCD가 Secret을 CRD 인스턴스보다 먼저 적용하므로 s3Credentials 참조가 깨지지 않는다.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: "s3://homelab-pg-backups-prod/"
    endpointURL: "https://52f958915d71663164a60636dc2905ce.r2.cloudflarestorage.com"
    s3Credentials:
      accessKeyId:
        name: cnpg-r2-creds # M2가 시드한 Secret (ns database)
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-r2-creds
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2
  # spec.env는 plugin v0.12 CRD 스키마에 없다(SSA 'field not declared in schema'로 라이브 거부)
  # — 사이드카 env는 instanceSidecarConfiguration 아래가 맞다.
  instanceSidecarConfiguration:
    env:
      - name: AWS_REGION
        value: "auto"
    # 사이드카 자원 캡(2026-09-01). 이 컨테이너는 `Cluster.spec.plugins[]`가 주입하는 **네이티브
    # 사이드카**(restartPolicy: Always인 initContainer)라 Cluster CR에는 resources 필드가 없다 —
    # 캡의 1급 경로는 여기(plugin v0.13.0 ObjectStore CRD)뿐이고, 벤더 manifest는 건드리지 않는다.
    # 근거: A′ peak 152.5Mi(14일·30초 해상도) × 2.0 = 305 → 16Mi 올림 320Mi(2.10x).
    # ⚠️ peak는 매일 03:00Z 베이스백업이 만든다(scheduled-backup.yaml). 같은 연산이 62~152Mi로
    #    2.5배 흔들리고, 그 창이 대표하는 것은 **PGDATA 49MB짜리 현재 데이터량**이다 — DB가 커지면
    #    재측정해야 한다(A′는 데이터량에 단조 비례하지 않지만 무관하지도 않다).
    # ⚠️ 캡을 주면 이 컨테이너의 limit이 KSM의 `kube_pod_init_container_resource_limits`로 나간다.
    #    ContainerMemoryNearLimit의 분모가 그 계열을 함께 보도록 같은 PR에서 고쳤다(rules/core.yaml).
    #    분모 없이 캡만 주면 "무캡·무알림"이 "캡·무알림·조용한 OOMKill"이 된다.
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 320Mi }
