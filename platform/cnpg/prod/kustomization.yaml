apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: database

resources:
  - namespace.yaml # database ns(PSA baseline 라벨) — cnpg-data App 소유, wave -3
  - object-store.yaml
  - cluster.yaml
  - pooler.yaml
  - scheduled-backup.yaml
  - basebackup-pvc.yaml
  - basebackup-pvc-warmup.yaml # Sync hook: WaitForFirstConsumer PVC를 sync 중에 Bound로(파일 주석 참조)
  - basebackup-cronjob.yaml
  - pgdump-hedge-cronjob.yaml
  - restore-drill-rbac.yaml
  - restore-drill-cronjob.yaml
  - ensure-role-password-rbac.yaml # SA/RBAC — managed role 비번 적용 보장 Job용
  - ensure-role-password-job.yaml # PostSync hook: owner/ro 비번 적용 결정적 보장(#3 회귀 차단, fail-closed)
  - networkpolicy.yaml # database 계층 ingress 격리
  - pg-rw-tailscale-service.yaml # pg-rw tailscale LoadBalancer(owner GUI/로컬 직결)
  - databases/ # 논리 DB + owner/ro 시크릿 (create-database 산출물)

generators:
  - secret-generator.yaml # KSOPS — database ns의 네 가지 시드를 전부 렌더 (아래 참조)

# restore-drill ConfigMap은 소스 스크립트로부터 생성되므로 실행 중인 `drill.sh`가
# 곧 source-of-truth다 — CronJob이 복원 없이 exit 0 할 수 있는 빈/플레이스홀더 경로가
# 존재하지 않는다. 렌더 테스트가 스크립트 내용 존재를 검증한다.
configMapGenerator:
  - name: restore-drill-script
    files:
      - drill.sh=restore-drill-script.sh
  - name: ensure-role-password-script # PostSync hook Job이 /scripts로 마운트
    files:
      - ensure-role-password.sh

generatorOptions:
  disableNameSuffixHash: true # 고정 이름: restore-drill-script, ensure-role-password-script
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # drill/role 스크립트 ConfigMap은 Cluster CR(wave -1)보다 먼저 apply

# ⚠️ **`generatorOptions`는 위 `configMapGenerator`에만 적용된다 — `generators:`(KSOPS exec
#    plugin) 산출물에는 **적용되지 않는다**.** kustomize의 generatorOptions는 내장 generator
#    (configMapGenerator/secretGenerator) 전용이다. 예전 주석은 "네 시드 + drill 스크립트"가
#    전부 wave -2를 받는다고 적었지만 **네 시드에는 한 번도 먹은 적이 없다**(렌더 실측:
#    KSOPS 산출 Secret 4개에 annotations 자체가 없다 → ArgoCD 기본 wave 0).
#    ⇒ Cluster(wave -1)가 자격 Secret(wave 0)보다 먼저 올라가고, barman이 R2 자격을 못 얻어
#    recovery가 실패하고, ArgoCD는 Cluster Healthy를 기다리며 wave 0으로 넘어가지 않는다.
#    **자기 자신을 기다리는 교착**이다(2026-08-13 NUC 첫 bootstrap에서 실측 — `#460`의 ObjectStore와
#    같은 클래스이지만 이쪽이 더 근본이다. ObjectStore를 고쳐도 이것 때문에 여전히 막혔다).
#    아래 patch가 KSOPS 산출물에 wave를 **명시적으로** 붙인다. strategic merge라 KSOPS가 나중에
#    자체 annotation을 붙여도 병합된다(덮어쓰지 않는다).
patches:
  - target: { kind: Secret, name: cnpg-r2-creds }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: cnpg-r2-creds
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
  - target: { kind: Secret, name: pg-app-credentials }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-app-credentials
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
  - target: { kind: Secret, name: pg-admin-credentials }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: pg-admin-credentials
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
  - target: { kind: Secret, name: restore-drill-alerting }
    patch: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: restore-drill-alerting
        annotations:
          argocd.argoproj.io/sync-wave: "-2"
