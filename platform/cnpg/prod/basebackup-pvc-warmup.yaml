# basebackup PVC 워밍 훅 — `pg-basebackup-local`을 sync 중에 Bound로 만든다.
#
# ⚠️ **왜 필요한가.** `bulk-ssd`는 `volumeBindingMode: WaitForFirstConsumer`라 **파드가 스케줄되기
#    전에는 절대 Bound되지 않는다.** 그런데 이 PVC를 마운트하는 유일한 워크로드는
#    `basebackup-cronjob.yaml`(`schedule: "30 2 * * *"`)이라 sync 시점에는 파드가 생기지 않는다.
#    ArgoCD의 내장 PVC health는 `Bound`만 Healthy이고 `Pending`은 Progressing이다 ⇒
#    이 PVC가 속한 **Sync phase의 마지막 wave(0)가 끝나지 않아 PostSync phase가 시작되지 않는다**.
#    그러면 `ensure-role-password`(PostSync hook)가 실행되지 않아 owner/ro 롤 비번 적용이
#    **다음 CronJob 실행까지(최대 ~24시간) 밀린다.** (2026-08-14 배경 감사 + 적대 검증으로 범위 확정 —
#    앱 전체 교착은 아니고 cnpg-data Application 하나에 국한된다.)
# ⚠️ **StorageClass의 volumeBindingMode를 바꾸는 것은 답이 아니다** — local-path 계열은 Immediate
#    바인딩이 "no node was specified"로 실패한다(`storageclass-standard.yaml` 주석에 실측 기록).
# ⚠️ **라이브에서는 원리적으로 안 보인다** — PVC가 이미 Bound라 순서가 무의미하다. 콜드스타트/DR 전용.
#
# 하는 일은 PVC를 마운트하고 즉시 끝나는 것뿐이다. 파드가 스케줄되는 순간 provisioner가 PV를
# 만들어 PVC가 Bound → Healthy가 되고 wave가 진행한다. **아무것도 쓰지 않는다**(읽기도 안 한다).
#
# wave: PVC와 같은 기본 wave 0. ArgoCD는 한 wave 안에서 kind 순서를 따르므로
# PersistentVolumeClaim이 Job보다 먼저 apply된다 — 순서를 따로 줄 필요가 없다.
# hook-delete-policy: HookSucceeded — 성공하면 즉시 지워 잔여물을 남기지 않는다.
# ⚠️ **BeforeHookCreation을 빼면 안 된다.** ArgoCD는 정책을 하나라도 명시하면 기본값
#    BeforeHookCreation을 넣지 않는다 — 그러면 실패한 Job이 이 고정 이름으로 남고, 다음 sync가
#    같은 이름의 그 Failed를 다시 읽어 Sync phase가 영영 안 닫힌다(retry 5회도 같은 Job을 본다).
#    콜드스타트/DR이 이 훅의 유일한 국면이자 실패 확률이 가장 높은 국면이라 자기치유가 필수다 —
#    형제 ensure-role-password-job.yaml이 같은 이유로 이 정책을 갖고 있다. 복구가 사람 손
#    (`kubectl -n database delete job basebackup-pvc-warmup`)뿐이면 PostSync는 그때까지 안 돈다.
apiVersion: batch/v1
kind: Job
metadata:
  name: basebackup-pvc-warmup
  namespace: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 3 # 노드 스케줄 지연/일시적 provisioner 실패를 흡수
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false # k8s API 미사용 — 토큰 탈취 표면 제거
      securityContext:
        # basebackup CronJob과 같은 uid/gid — 같은 볼륨을 쓰는 워크로드끼리 정체성을 맞춘다.
        # ⚠️ fsGroup에 기대지 않는다: hostPath 백엔드 PV에는 적용되지 않는다(traps-detail.md).
        #    이 Job은 아무것도 쓰지 않으므로 소유권에 영향을 주지 않는다.
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: warmup
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["/bin/true"] # 마운트가 목적이다 — 볼륨을 읽지도 쓰지도 않는다
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi } # 즉시 종료하는 훅 — 원장 상주 예산 비대상
          volumeMounts:
            - { name: backup, mountPath: /backup, readOnly: true }
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: pg-basebackup-local
