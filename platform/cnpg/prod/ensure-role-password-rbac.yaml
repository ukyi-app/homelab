# ensure-role-password PostSync hook Job용 ServiceAccount + 최소권한 RBAC(database ns 한정).
# 비번 Secret '값'은 읽지 않는다(secrets 권한 없음) — 검증은 cluster passwordStatus.resourceVersion
# 채워짐 여부로만 한다. nudge는 Cluster annotate(clusters patch)로 reconcile을 트리거한다.
apiVersion: v1
kind: ServiceAccount
metadata: { name: ensure-role-password, namespace: database }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ensure-role-password, namespace: database }
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    # get/list: passwordStatus.<role>.resourceVersion + byStatus.reconciled 멤버십(role 존재 증인 —
    # DROP된 role의 passwordStatus 엔트리가 남아 rv 검사만으론 공허 통과한다, 티켓 52) · patch:
    # nudge(annotate, 비번 값 불변). **verb 집합은 불변** — 둘 다 같은 Cluster 오브젝트의 status다.
    verbs: ["get", "list", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["get", "list"] # DB 열거 + applied 상태 + spec.ensure(absent 스킵) + metadata.uid(마커 ownerRef)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"] # per-DB freshness 마커 upsert(apply = get+create/patch)
# 마커의 Database CR ownerRef는 이 verb 집합 안에서 성립한다 — uid는 위 databases get에서 읽고,
# blockOwnerDeletion을 쓰지 않아 owner의 finalizers 하위리소스 update 권한이 필요 없다(경계 불변).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ensure-role-password, namespace: database }
subjects: [{ kind: ServiceAccount, name: ensure-role-password, namespace: database }]
roleRef: { kind: Role, name: ensure-role-password, apiGroup: rbac.authorization.k8s.io }
