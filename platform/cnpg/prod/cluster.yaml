apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Cluster CR; -1이라 앱(wave 0+)보다 먼저 Ready — 앱은 부팅 시 self-migrate
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4@sha256:b38bee8f92acd6d7276d5be32e9af36a0ea72c9d339945f1ae205a2acc3cbb89
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true # pg_basebackup이 쓰는 관리형 `pg-superuser` Secret(REPLICATION 가능)을 생성 — app 롤과는 별개의 자격증명
  postgresUID: 26
  postgresGID: 26

  postgresql:
    parameters:
      # 호스트 RAM이 아니라 1Gi POD LIMIT 기준 (호스트의 25% = 4GB OOM 함정 회피)
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      max_connections: "50"
      archive_timeout: "5min"
      wal_compression: "on"
      max_wal_size: "1GB"
      min_wal_size: "256MB"
    pg_hba:
      # local-basebackup CronJob의 pg_basebackup은 postgres 유저로 REPLICATION 연결을 연다 —
      # CNPG 기본 pg_hba는 replication을 streaming_replica(cert)만 허용하므로 postgres 유저의
      # replication 연결이 거부된다. 아래 두 줄로 명시 허용해야 한다.
      - hostssl replication postgres 10.42.0.0/16 scram-sha-256
      - host replication postgres 10.42.0.0/16 scram-sha-256

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

  storage:
    size: 40Gi
    storageClass: standard # 내장 512GB SSD
  walStorage:
    size: 10Gi
    storageClass: standard # 분리된 WAL PVC, 역시 내장 SSD

  # ⚠️ **NUC 이전 브랜치 전용 형태** — 계획서 G6("NUC의 primary pg가 initdb가 아니라 **recovery로**
  #    기동 + serverName 분리")의 실행체다. main(라이브 Mac)은 여전히 initdb 형태다.
  # ⚠️ CNPG는 `bootstrap`을 **초기화 시점에만** 읽고 이후 무시한다(라이브 CRD에 불변 CEL 없음 — 실측).
  #    즉 이 블록이 틀린 채로 sync돼도 ArgoCD는 **Synced+Healthy**다. G6의 통과 증명은 매니페스트나
  #    ArgoCD 상태가 아니라 **라이브 Cluster의 PGDATA 출처**(인스턴스 로그의 복구 경로)로만 세울 것.
  bootstrap:
    recovery:
      source: pg-mac # -> 아래 externalClusters[].name (읽기 전용 복구 원본)
      database: app
      owner: app
      secret:
        name: pg-app-credentials # M2가 시드 (platform/cnpg/prod/app-credentials.enc.yaml, ns database); bootstrap 전에 반드시 존재해야 함 — 이 kustomization의 KSOPS generator가 sync-wave -2에서 렌더 (Cluster의 -1보다 먼저)
      # ⚠️ `postInitApplicationSQL`은 recovery 스키마에 **없다**(CNPG 1.29.1 CRD 실측 — initdb 전용).
      #    restore_canary는 Mac base backup에 이미 들어 있어 복구와 함께 딸려온다. 컷오버 후
      #    initdb로 되돌아갈 일이 생기면 그때 이 3줄을 되살릴 것.

  plugins:
    # enabled는 webhook 주입 기본값이지만 명시 — plugins는 listType 미지정(SSA atomic)이라
    # 미기재 시 영구 OutOfSync (HTTPRoute group/kind/weight와 동일 클래스)
    # ⚠️ 여기가 **쓰기** serverName이다. 아래 externalClusters의 **읽기**와 반드시 달라야 한다 —
    #    같으면 두 primary(라이브 Mac + NUC)가 같은 R2 prefix에 아카이브해 타임라인이 섞이고
    #    유일한 오프사이트 PITR 경로가 망가진다(계획서 §3.4의 ❌ 항목).
    #    ObjectStore CRD는 serverName을 CEL로 **금지**하므로(barman-plugin/manifest.yaml:409-413)
    #    분리는 반드시 이 자리에서 한다 — ObjectStore를 하나 더 만드는 방법은 라이브에서 거부된다.
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-r2 # -> object-store.yaml의 ObjectStore (버킷 루트만 담는다)
        serverName: pg-nuc # 쓰기: s3://homelab-pg-backups-prod/pg-nuc/

  # 읽기 전용 복구 원본 — 라이브 Mac이 써 온 아카이브(`pg/`). ObjectStore는 같은 것을 공유하고
  # serverName만 다르다(읽기/쓰기가 서로 다른 필드라 한 ObjectStore로 동시에 표현된다).
  # ⚠️ 여기의 `isWALArchiver`는 **반드시 false**다 — 스키마엔 있지만 켜면 이 원본에도 쓰기가 붙는다.
  #    다만 **생략하면 안 된다**: `externalClusters`도 listType 미지정(SSA atomic)이라 webhook이
  #    주입하는 기본값(`enabled: true`·`isWALArchiver: false`)이 매니페스트에 없으면 ArgoCD가
  #    영구 OutOfSync를 낸다 — 위 `plugins:` 리스트와 **같은 클래스인데 이 자리만 빠져 있었다**
  #    (2026-08-14 NUC 실측: cnpg-data가 Healthy인 채로 5분마다 partial sync를 반복하며
  #     Cluster/pg만 OutOfSync로 남았다. 라이브 diff는 이 두 필드뿐이었다).
  externalClusters:
    - name: pg-mac
      plugin:
        name: barman-cloud.cloudnative-pg.io
        enabled: true # webhook 주입 기본값 — 명시하지 않으면 SSA atomic 리스트가 영구 OutOfSync
        isWALArchiver: false # 읽기 전용 원본이므로 false. 명시는 OutOfSync 방지용이지 동작 변경이 아니다
        parameters:
          barmanObjectName: pg-r2
          serverName: pg # 읽기: s3://homelab-pg-backups-prod/pg/

  # GUI/로컬 직결 전용 admin superuser 롤 — pg_basebackup용 관리형 pg-superuser(enableSuperuserAccess)와
  # 분리된 별도 자격(owner가 TablePlus 등으로 붙는다). 비번은 pg-admin-credentials(KSOPS, wave -2).
  # ★SSA-atomic 리스트: 서버 주입 기본값(ensure/inherit/connectionLimit)을 명시해야 ArgoCD가
  #   OutOfSync 플립을 안 한다(plugins 리스트와 동일 클래스). provision-db는 이 리스트에 owner/ro를
  #   append(보존)한다. 롤명 ukkiee은 seal-secret.mts F2 거부 SSOT(ADMIN_DB_USERS)와 동기 — 변경 시 동반 수정.
  managed:
    roles:
      - name: ukkiee
        ensure: present
        login: true
        superuser: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: pg-admin-credentials
      # page owner — create-database 산출물. ensure/inherit/connectionLimit는 서버 주입 기본값 명시(SSA atomic 리스트)
      - name: page
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-page-owner
      # page 읽기전용(모드2 디버깅) — GRANT는 managed role 범위 밖, PR checklist의 SQL 후처리 필요
      - name: page_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-page-ro
      # trip-mate owner — create-database 산출물. ensure/inherit/connectionLimit는 서버 주입 기본값 명시(SSA atomic 리스트)
      - name: trip-mate
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-trip-mate-owner
      # trip-mate 읽기전용(모드2 디버깅) — GRANT는 managed role 범위 밖, PR checklist의 SQL 후처리 필요
      - name: trip-mate_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-trip-mate-ro

  # vmagent의 pod-annotations job(role:pod)이 pg 인스턴스 파드를 발견·scrape하도록
  # prometheus.io/* 주석을 관리형 리소스에 상속시킨다(없으면 cnpg_*/barman_cloud_*/
  # cnpg_pg_stat_archiver_* 시리즈가 통째로 vmsingle에 부재 → R2BackupStale/WALArchiveStalled
  # 가 absent로 오발화/블라인드). Service/PVC에도 같은 주석이 붙지만 vmagent는 role:pod만
  # 쓰므로 무해. 메타데이터 전용 변경이라 파드 재생성/switchover 없음(단일 인스턴스 무중단).
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"

  monitoring:
    enablePodMonitor: false # prometheus.io annotation(inheritedMetadata 상속)으로 scrape (M5)
