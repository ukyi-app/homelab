apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # Cluster CR; -1이라 앱(wave 0+)보다 먼저 Ready — 앱은 부팅 시 self-migrate
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4@sha256:b38bee8f92acd6d7276d5be32e9af36a0ea72c9d339945f1ae205a2acc3cbb89
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true # pg_basebackup이 쓰는 관리형 `pg-superuser` Secret(REPLICATION 가능)을 생성 — app 롤과는 별개의 자격증명
  postgresUID: 26
  postgresGID: 26

  postgresql:
    parameters:
      # 호스트 RAM이 아니라 1Gi POD LIMIT 기준 (호스트의 25% = 4GB OOM 함정 회피)
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "8MB"
      maintenance_work_mem: "128MB"
      max_connections: "50"
      archive_timeout: "5min"
      wal_compression: "on"
      max_wal_size: "1GB"
      min_wal_size: "256MB"
    pg_hba:
      # local-basebackup CronJob의 pg_basebackup은 postgres 유저로 REPLICATION 연결을 연다 —
      # CNPG 기본 pg_hba는 replication을 streaming_replica(cert)만 허용하므로 postgres 유저의
      # replication 연결이 거부된다. 아래 두 줄로 명시 허용해야 한다.
      - hostssl replication postgres 10.42.0.0/16 scram-sha-256
      - host replication postgres 10.42.0.0/16 scram-sha-256

  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

  storage:
    size: 40Gi
    storageClass: standard # 내장 512GB SSD
  walStorage:
    size: 10Gi
    storageClass: standard # 분리된 WAL PVC, 역시 내장 SSD

  # ⚠️ CNPG는 `bootstrap`을 **초기화 시점에만** 읽고 이후 무시한다(라이브 CRD에 불변 CEL 없음 — 실측).
  #    즉 이 블록이 무엇이든 **이미 떠 있는 클러스터에는 no-op**이다. 라이브 `pg`는 2026-08-13에
  #    `recovery`(source: pg-mac)로 기동해 timeline=2로 살아 있고, 이 편집은 그것을 건드리지 않는다.
  #    증명이 필요하면 매니페스트나 ArgoCD 상태가 아니라 **PGDATA 출처**(인스턴스 로그)로 세울 것.
  # ✅ **감사 9 — 컷오버에서 `recovery`(pg-mac)를 걷어내고 initdb로 되돌렸다 (2026-08-17).**
  #    되돌리는 이유는 PONR 1의 `pg/` purge를 기다리는 것이 아니다. **지금 남겨두는 것 자체가 위험**이다:
  #    `Cluster/pg`가 볼륨을 잃고 재생성되면 `pg-mac`(컷오버 시점에 얼어붙은 Mac 아카이브)에서
  #    **낡은 데이터로 조용히 복구된 뒤 그것을 `pg-nuc/`에 아카이브**해 살아 있는 아카이브의
  #    타임라인을 오염시킨다. initdb면 **빈 DB로 요란하게** 떠서 사람이 알아채고
  #    `docs/runbooks/restore.md` 경로 A로 복구한다 — main이 Mac 시대 내내 갖고 있던 설계 그대로다.
  # ⚠️ 제3안(`recovery.source`를 `pg-nuc` 자기참조)은 채택하지 않았다. 가드가 막기 때문만이 아니라,
  #    복구본이 **자기가 복구해 온 prefix에 다시 아카이브를 시작**해 타임라인이 겹치고 R2엔
  #    버저닝이 없어(`infra/cloudflare/r2.tf`) 되돌릴 수 없다. 근거 전문은 ADR 0006.
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: pg-app-credentials # M2가 시드 (platform/cnpg/prod/app-credentials.enc.yaml, ns database); bootstrap 전에 반드시 존재해야 함 — 이 kustomization의 KSOPS generator가 sync-wave -2에서 렌더 (Cluster의 -1보다 먼저)
      # restore_canary를 git으로 시드한다 — DR 재구축(initdb)에서 자동 복원돼 주간 restore-drill이
      # 수동 재시드 없이 동작한다. postInitApplicationSQL은 app DB에 initdb 시 1회만 실행되고,
      # 기존 클러스터엔 no-op이다(R2 recovery 경로는 base backup의 테이블을 그대로 가져온다).
      # ⚠️ 이 시드가 **1회성**이라는 사실이 중요하다 — 라이브 canary는 영구히 1행이고(실측 2026-08-17)
      #    아무도 여기에 INSERT하지 않는다. 따라서 restore-drill의 행 수 비교는 상수 비교이고
      #    **아카이브 신선도(RPO)를 증명하지 못한다.** 드릴이 진짜 복구를 했는지는 그 스크립트의
      #    `SAW_NONHEALTHY` 증인이 본다(M17/PR #482). RPO 증명은 별건이다.
      postInitApplicationSQL:
        - CREATE TABLE IF NOT EXISTS restore_canary (id serial primary key, ts timestamptz default now())
        - INSERT INTO restore_canary DEFAULT VALUES

  plugins:
    # enabled는 webhook 주입 기본값이지만 명시 — plugins는 listType 미지정(SSA atomic)이라
    # 미기재 시 영구 OutOfSync (HTTPRoute group/kind/weight와 동일 클래스)
    # ⚠️ 여기가 이 클러스터의 **유일한 아카이브 serverName**이다(쓰기).
    #    ObjectStore CRD는 serverName을 CEL로 **금지**하므로(barman-plugin/manifest.yaml:409-413)
    #    이 값이 `s3://homelab-pg-backups-prod/<serverName>/{base,wals}/`를 통째로 정한다.
    # ⚠️ **`pg`로 되돌리지 마라.** 그 prefix에는 Mac 시대 아카이브가 남아 있고(PONR 1 미실행),
    #    같아지면 타임라인이 섞인다. R2엔 버저닝이 없어(`infra/cloudflare/r2.tf`) 되돌릴 수 없다.
    #    `ci.yaml`의 `EXPECT_PG_SERVERNAME=pg-nuc`가 main 진입 시 이 값을 고정한다.
    # ⚠️ 2026-08-17 감사 9로 `externalClusters`(읽기 원본 `pg-mac`)를 걷어냈다 —
    #    `check-pg-servername.sh`의 (A)는 "복구 원본이 **있다면** 쓰기와 다르다"라 원본이 없는
    #    형태도 green이다(`tests/gates/test_pg-servername.bats`가 그 케이스를 이미 픽스처로 갖고 있다).
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: pg-r2 # -> object-store.yaml의 ObjectStore (버킷 루트만 담는다)
        serverName: pg-nuc # 쓰기: s3://homelab-pg-backups-prod/pg-nuc/

  # GUI/로컬 직결 전용 admin superuser 롤 — pg_basebackup용 관리형 pg-superuser(enableSuperuserAccess)와
  # 분리된 별도 자격(owner가 TablePlus 등으로 붙는다). 비번은 pg-admin-credentials(KSOPS, wave -2).
  # ★SSA-atomic 리스트: 서버 주입 기본값(ensure/inherit/connectionLimit)을 명시해야 ArgoCD가
  #   OutOfSync 플립을 안 한다(plugins 리스트와 동일 클래스). provision-db는 이 리스트에 owner/ro를
  #   append(보존)한다. 롤명 ukkiee은 seal-secret.mts F2 거부 SSOT(ADMIN_DB_USERS)와 동기 — 변경 시 동반 수정.
  managed:
    roles:
      - name: ukkiee
        ensure: present
        login: true
        superuser: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: pg-admin-credentials
      # page owner — create-database 산출물. ensure/inherit/connectionLimit는 서버 주입 기본값 명시(SSA atomic 리스트)
      - name: page
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-page-owner
      # page 읽기전용(모드2 디버깅) — GRANT는 managed role 범위 밖, PR checklist의 SQL 후처리 필요
      - name: page_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-page-ro
      # trip-mate owner — create-database 산출물. ensure/inherit/connectionLimit는 서버 주입 기본값 명시(SSA atomic 리스트)
      - name: trip-mate
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-trip-mate-owner
      # trip-mate 읽기전용(모드2 디버깅) — GRANT는 managed role 범위 밖, PR checklist의 SQL 후처리 필요
      - name: trip-mate_ro
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: db-trip-mate-ro

  # vmagent의 pod-annotations job(role:pod)이 pg 인스턴스 파드를 발견·scrape하도록
  # prometheus.io/* 주석을 관리형 리소스에 상속시킨다(없으면 cnpg_*/barman_cloud_*/
  # cnpg_pg_stat_archiver_* 시리즈가 통째로 vmsingle에 부재 → R2BackupStale/WALArchiveStalled
  # 가 absent로 오발화/블라인드). Service/PVC에도 같은 주석이 붙지만 vmagent는 role:pod만
  # 쓰므로 무해. 메타데이터 전용 변경이라 파드 재생성/switchover 없음(단일 인스턴스 무중단).
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"

  monitoring:
    enablePodMonitor: false # prometheus.io annotation(inheritedMetadata 상속)으로 scrape (M5)
