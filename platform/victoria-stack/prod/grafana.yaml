apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: grafana }
    spec:
      automountServiceAccountToken: false # k8s API 미사용(대시보드=TSDB 질의) — SA 토큰 마운트 금지(메타갭 ⑤ W2-C)
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:13.1.0@sha256:121a7a9ece6dc10b969f1f96eed64b4f07dfac0d0b8abc070f7cb83bbde86f63
          # 컨테이너 하드닝: 권한상승 차단 + 전 capability drop. readOnlyRootFilesystem은
          # 플러그인 설치(/var/lib/grafana)·/tmp 쓰기 때문에 보류(별도 검증 후 적용).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: GF_INSTALL_PLUGINS, value: "victoriametrics-logs-datasource" }
            - { name: GF_SECURITY_ADMIN_USER, value: "ukkiee" } # argocd 로컬계정과 일관. data가 emptyDir(휘발 SQLite)라 재시작 시 깨끗이 rename.
            # admin/admin 절대 금지: 비밀번호는 M2가 시드한 SOPS secret
            # `alerting-secrets`(key GRAFANA_ADMIN_PASSWORD)에서 온다.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: alerting-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-dashboard-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboard-resources } }
        # 설계상 휘발성 SQLite (§8). 512Mi는 grafana가 **매 부팅마다 이 볼륨으로 런타임 다운로드하는**
        # 플러그인 페이로드(2026-07-25 실측 262,844 KiB — VL 데이터소스가 단일 zip에 8개 플랫폼
        # 바이너리를 동봉 + grafana 내장 preinstall 앱 4종)에 1.5배 이상 마진을 두기 위한 값이다.
        # 256Mi는 한계치의 99.7%였고 업스트림 릴리스 한 번에 kubelet eviction 루프로 터졌다.
        # 페이로드 축소는 13.1.0에서 불가(preinstall 킬스위치가 요구 데이터소스까지 제거) — 용량으로만 방어.
        # 가드: test_grafana_plugin_budget.bats. cf. vmagent는 앱 내부 상한(450MiB<512Mi)으로 같은 함정 방어.
        - { name: data, emptyDir: { sizeLimit: 512Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app.kubernetes.io/name: grafana }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
