apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - node-exporter.yaml
  - glances.yaml          # 호스트 메트릭 API(homepage 위젯) — node-exporter 동류
  - glances-netpol.yaml   # glances :61208을 homepage ns로만 제한(A.5#1)
  - kube-state-metrics.yaml
  - vmsingle.yaml
  - vmagent-scrape-config.yaml
  - vmagent.yaml
  - victorialogs.yaml
  - vector.yaml
  - alertmanager.yaml
  - networkpolicy.yaml    # 외부 egress 격리(alertmanager·relay) — minimal, metrics east-west 불간섭
  - rules/core.yaml
  - vmalert.yaml
  - rules/r4-storage-backup.yaml
  - rules/r5-cert-tls.yaml
  - rules/r6-ci-staleness.yaml
  - rules/r7-meta.yaml
  - ghcr-read.sealed.yaml # digest-exporter private GHCR inspect 자격(owner: make seal-ghcr-read)
  - digest-exporter.yaml
  - gha-liveness-exporter.yaml # GHA 스케줄 워크플로 liveness 하트비트(티켓 10 — run 밖 관측자)
  - pvc-du-exporter.yaml  # per-PVC 용량 가시화 CronJob + 전용 egress netpol(메타갭 ③ W1-A)
  # ⚠️ **relay 비활성(`#454`)은 2026-08-17 컷오버로 해제됐다.** 근거는 "두 클러스터가 같은 healthchecks
  #    체크를 ping하면 라이브 Mac이 죽어도 초록으로 남는다"였는데, 라이브 Mac 클러스터가 더 이상
  #    존재하지 않으므로 **경쟁 pinger가 원리적으로 없다.** 두 번째 클러스터를 다시 세우게 되면
  #    이 줄을 **먼저 다시 주석 처리해야 한다** — 그 순간부터 오프노드 dead-man이 거짓 초록이 된다.
  # ⚠️ 반대로 이 줄이 빠지면 Watchdog → AM webhook → healthchecks.io 체인이 통째로 끊긴다.
  #    끊김은 조용하다(오프노드 스위치는 ping **부재**를 페이징하므로 레포 안에 증거가 없다) —
  #    유일한 in-band 조기 신호가 `rules/core.yaml`의 `DeadmanswitchRelayUnreachable`이다.
  - deadmanswitch-relay.yaml
  - grafana-provisioning.yaml
  - grafana-dashboards.yaml
  - grafana.yaml
  - httproute-grafana.yaml

# alertmanager 설정은 generator로 — 내용 해시가 이름에 붙어 설정 변경 시 Deployment가 자동 rollout
# 된다(형제 선례: platform/homepage/prod/kustomization.yaml). 착지 전에는 평문 ConfigMap이라
# 수동 `rollout restart`가 유일한 보장이었고, 그것을 빠뜨려 라이브 파드가 8/27 렌더본을 무기한
# 쓰고 있었다(2026-09-03 실측). 근거·경고 전문은 alertmanager.yaml 헤더.
# ⚠️ `options.disableNameSuffixHash: true`를 켜면 그 자동 rollout이 사라진다 — 켜지 마라.
# ⚠️ generator 이름(`alertmanager-config`)은 Deployment volume 참조와 등식이다. kustomize의
#    nameReference 변환이 그 참조를 해시 이름으로 다시 쓰므로 이름을 바꾸면 양쪽을 함께 바꾼다.
configMapGenerator:
  - name: alertmanager-config
    files:
      # ConfigMap 키는 basename(`alertmanager.yml`) — initContainer가 그 이름으로 읽는다.
      - alertmanager-config/alertmanager.yml

# KSOPS exec generator(SOPS 복호화 Secret). 위 built-in configMapGenerator와 공존한다 —
# kustomize는 `configMapGenerator`(내장)와 `generators`(플러그인)를 각각 돌려 결과를 합친다.
generators:
  - secret-generator.yaml
