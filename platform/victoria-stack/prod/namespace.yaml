apiVersion: v1
kind: Namespace
metadata:
  name: observability
  annotations:
    # 이 ns가 prune되면 재생성 경로가 없다 — 소유 App(root/apps/victoria-stack.yaml)이
    # prune:true인데 `CreateNamespace=false`라 ArgoCD가 다시 만들지도 못한다.
    argocd.argoproj.io/sync-options: Prune=false # 매니페스트서 빠져도 ns prune(삭제) 금지(plan Pass5 #1)
  labels:
    app.kubernetes.io/part-of: victoria-stack
    # enforce=restricted는 물론 baseline도 라이브에서 node-exporter(hostPID+hostPath)/Vector(hostPath)
    # DS 생성을 거부함이 확인됨 — hostPath/host namespace는 privileged 프로파일에서만 허용된다.
    # privileged로 강제하고 restricted는 warn으로 남겨 점진 하드닝 신호로 쓴다 (단일 노드 홈랩 수용).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
