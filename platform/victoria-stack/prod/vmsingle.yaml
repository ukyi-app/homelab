apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  labels: { app.kubernetes.io/name: vmsingle }
spec:
  selector: { app.kubernetes.io/name: vmsingle }
  ports:
    - { name: http, port: 8428, targetPort: 8428 }
---
# W3 관측 TSDB bulk-ssd 이전(메타갭 캠페인 Task 13) — VCT는 불변이라 standalone PVC로 전환(F2,
# 컷오버 2026-07-08 STS delete-orphan 재생성). STS가 이 PVC를 직접 참조하므로 WFFC 바인딩은
# 파드 스케줄 시 자연 발생(DR 재구축 포함 — 바인더 Pod는 최초 이전 시에만 필요했음, F21).
# 스토리지 변경 절차는 runbooks/observability-bootstrap.md §5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmsingle-data-bulk
  labels: { app.kubernetes.io/name: vmsingle }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: bulk-ssd
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmsingle
  labels: { app.kubernetes.io/name: vmsingle }
spec:
  serviceName: vmsingle
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: vmsingle }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vmsingle }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8428" } # 자기관측 vm_* 메트릭
    spec:
      automountServiceAccountToken: false # k8s API 미사용(TSDB) — SA 토큰 마운트 금지(메타갭 ⑤ W2-C)
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.145.0@sha256:c014fb5a711d38cb24fd0673197592cd1394bb903dbb16aea565620c9c8a3d70
          args:
            - --storageDataPath=/storage
            # retention.maxDiskSpaceUsageBytes는 VictoriaMetrics ENTERPRISE 전용 — 커뮤니티 에디션이
            # "flag not defined"로 거부해 CrashLoop(라이브 확인). 디스크 폭주 가드는 시간 보존(30d)
            # + R4 disk-fill 알림(vmalert)으로 담당한다. (VictoriaLogs 쪽 동일 플래그는 커뮤니티 지원)
            - --retentionPeriod=30d
            # ⚠️ **allowedPercent가 아니라 absolute다**(2026-09-01, 관측 스택 마진 규약).
            #    비례 설정은 limit 상향을 캐시 예산 상향으로 옮겨 자기참조를 되살린다(캐시는 mmap이라
            #    GOMEMLIMIT이 못 막는다). 종전 예산 그대로(896Mi × 0.6 = 537.6Mi)를 절대값으로 고정한다.
            #    현재 캐시 사용량은 이 예산의 33.8%(181.8Mi)이고 그중 128Mi는 fastcache 32Mi 바닥값 4개다.
            #    563_714_457B = 537.6Mi (라이브 vm_allowed_memory_bytes와 동일한 값).
            - --memory.allowedBytes=563714457
            - --httpListenAddr=:8428
            - --dedup.minScrapeInterval=30s
          env:
            # ⚠️ **limit에 연동하지 않는다**(2026-09-01, 관측 스택 마진 규약 — 자기참조 차단).
            #    현재 사용률 73.4%로 힙은 이 상한에 닿지 않았고, rss 상승분은 힙 밖(캐시 mmap·커널)이다.
            #    limit 1056Mi 대비 800MiB는 75.8%로 ≤limit×0.95 게이트를 넉넉히 통과한다.
            - { name: GOMEMLIMIT, value: "800MiB" }
          ports:
            - { name: http, containerPort: 8428 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            # 관측 스택 마진 규약: RSS peak(현 기판, 30초) × 1.5 = 694.9 × 1.5 = 1042.3 → 1056Mi(1.52x).
            # 종전 896Mi는 1.29x로 미달이고, 다섯 중 유일하게 **재부팅 후에 최고점을 찍었다**(단조 상승).
            # ⚠️ 상승의 정체: UTC 자정 TSDB 일일 파티션 롤오버(+140Mi 계단) + 활성 시계열 증가
            #    (tsid 엔트리 68454 → 74782, 파드 재시작이 새 cgroup id 시계열을 만든다). 둘 다 정상
            #    운영에서 재현되므로 산정에 포함한다. 재부팅 전 평형 552Mi를 이미 142Mi 넘겼다.
            # ⚠️ 캐시 상한 합(920.74Mi)은 allowedPercent 예산(537.6Mi)의 **1.71배**로 오버서브스크립션이고
            #    축출은 개별 캐시 상한에서 일어난다 — 총합이 예산의 33.8%라고 안전한 것이 아니다.
            limits: { memory: 1056Mi }
          readinessProbe: { httpGet: { path: /health, port: 8428 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8428 }, initialDelaySeconds: 30 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: storage, mountPath: /storage }
      volumes:
        - name: storage
          # ⚠️ 이 PVC의 bulk 배치가 bulk 미마운트의 **유일한 즉시 페이징 경로**다: 미마운트면 kubelet이
          #    만든 root 0755 빈 디렉토리에 uid 65534가 쓰지 못해 CrashLoop -> vmalert가 Watchdog을
          #    평가하지 못함 -> alertmanager deadmanswitch ping 단절 -> healthchecks.io 약 4분 페이징.
          #    이 TSDB를 bulk에서 내리려면 대체 신호(오프-노드 마운트 감시)를 **같은 커밋에서** 세울 것 —
          #    hostPath `type: Directory`도 du-exporter의 F20도 미마운트를 잡지 못한다
          #    (pvc-du-exporter.yaml의 storage-bulk 볼륨 주석).
          persistentVolumeClaim: { claimName: vmsingle-data-bulk }
