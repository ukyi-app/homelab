# per-PVC 용량 가시화(메타갭 ③ W1-A) — 모든 PV가 hostPath(local-path)라 kubelet_volume_stats가 원천
# 부재하고(r4 상단 주석), bulk 티어는 node-exporter가 별도 series로 못 본다(F10). 이 CronJob이
# ⚠️ 2026-08-17 정정: 옛 문구는 «외장 bulk(virtiofs)»였다 — virtiofs는 OrbStack VM 시절의 전달 방식이고
#    베어메탈 이전으로 소멸했다. 국면 A의 bulk는 NUC 내장 디스크의 bind이고, 국면 B에서 별도 2TB M.2가 된다.
#    관측이 필요한 이유(별도 series로 안 보인다)는 전달 방식과 무관하게 그대로다.
# 두 provisioner 루트를 파드 내부에서 직접 du/df해 per-PVC 사용량(pvc_dir_size_bytes)과 티어 용량
# (storage_tier_{size,avail}_bytes)을 vmsingle에 push한다. 후자는 W3(관측 데이터 bulk 이전)의 선행 용량 신호다.
#
# ⚠️ 격리 계약(F8 — 전-PVC 읽기 도달성의 명시적 리스크 수용): 이 잡은 두 provisioner 루트 전체(무관한 앱·DB
#    볼륨 포함)를 읽는다. per-PVC 커버리지가 목적이라 스코프 축소 대신 아래 가드를 전부 강제해 유출 반경을 봉인한다:
#    (1) automountServiceAccountToken:false — API 미사용, 침해 시 토큰 동반 탈취 차단
#    (2) 전용 default-deny egress netpol — 허용은 vmsingle:8428·DNS:53만(인터넷·telegram 불허 → exfil 봉쇄)
#    (3) resources limits + readOnly 마운트 + readOnlyRootFilesystem
#    (4) 이미지는 레포 기존 digest 핀(pg-tools) 재사용 — 신규 서드파티 금지
#    세 번째 루트(/var/lib/kubelet/pods — meta-observability 01): grafana emptyDir du의 유일 경로다
#    (cadvisor에 파드별 fs 시리즈가 없음 — 라이브 실측).
#    ⚠️ 이 루트의 실제 표면 = 노드 상 **모든 파드**의 projected SA 토큰 · secret/configmap tmpfs
#       (hostPath rbind라 기동 시점 하위 마운트가 보인다) · 타 파드 emptyDir 전량 · etc-hosts.
#       DAC_READ_SEARCH는 PVC 순회용이지만 이 루트에서는 0600 토큰의 DAC 검사까지 우회하는
#       **읽기 개방의 활성화 요인**이다. 최대 반경은 노드 상 최고권한 SA 토큰(argocd 등)으로 본다.
#    ⚠️ "egress가 vmsingle뿐"은 완화가 **아니다**(2026-08-27 라이브 실측): 이 라벨의 프로브가
#       kubernetes.default.svc:443에 **도달했다**(HTTP 401 — 연결 성립). kube-router는 노드 자신
#       IP:6443 경로(ClusterIP DNAT 후)를 FORWARD 기반 netpol로 못 막는다(트랩 원장 「NetworkPolicy
#       egress apiserver ClusterIP 불가」와 같은 뿌리) — 즉 탈취 토큰은 **실사용 가능**하다.
#       vmsingle import도 임의 라벨을 받아 저대역 exfil 채널로 남는다.
#    → 남는 실완화는 readOnly 마운트 + readOnlyRootFilesystem(변이 불가) · 고정 digest 이미지의
#       고정 명령(일 1회 단명 CronJob — 상주 침해 표면 아님) · "숫자만 push"는 현 스크립트의
#       사실(침해 후 가드 아님)이다. 이 잔여를 **명시 수용**한다 — 대안(grafana 사이드카·별도
#       CronJob 분리)도 root 필수 + 같은 netpol 한계라 반경이 실질 동등하다(01 Comments).
#    root+DAC_READ_SEARCH: 0700 PVC 디렉토리(pg PGDATA 등)를 순회하려면 읽기 우회 capability가 필요하다.
#    drop:[ALL] 후 DAC_READ_SEARCH만 add(읽기-전용 우회 — 쓰기 불가), readOnly 마운트로 변이 경로 자체를 제거.
#    (라이브 dry-run 확인: internal 7 dirs·bulk 3 dirs, du_failures=0.)
---
# === default-deny egress: 이 잡의 모든 egress 거부(아래 allow가 최소만 재개방) ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pvc-du-exporter-default-deny-egress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pvc-du-exporter }
  policyTypes: [Egress]
---
# === allow egress: DNS + vmsingle import(내부 8428)만 — 인터넷 egress 없음(F8) ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pvc-du-exporter-allow-egress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pvc-du-exporter }
  policyTypes: [Egress]
  egress:
    - to: # DNS — vmsingle.observability.svc 해석(CoreDNS)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: # vmsingle import(같은 ns). ClusterIP→pod IP(kube-router DNAT후) 평가라 podSelector로 지정
        - podSelector: { matchLabels: { app.kubernetes.io/name: vmsingle } }
      ports: [{ protocol: TCP, port: 8428 }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-du-exporter
  namespace: observability
  labels: { app.kubernetes.io/name: pvc-du-exporter }
spec:
  schedule: "0 5 * * *" # 05:00 KST(k3s VM TZ=Asia/Seoul, 다른 CronJob과 동일 규약 — timeZone 미지정)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app.kubernetes.io/name: pvc-du-exporter }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0 # 0700 PVC 디렉토리 순회에 필요(DAC_READ_SEARCH와 함께)
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: du
              # digest 핀: pgdump-hedge-cronjob.yaml과 동일 값(의도적 커밋으로만 갱신, bump 체인 비대상).
              image: ghcr.io/ukyi-app/pg-tools:18-rclone@sha256:154b0e77f4e677d69605aa3abf76cc3061635e24cedbf617155e5179ccabcd45
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL], add: [DAC_READ_SEARCH] } # 읽기-전용 우회만(쓰기 불가)
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { cpu: 200m, memory: 64Mi }
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  TS=$(date +%s)
                  BODY=""
                  # 듀얼 provisioner 루트 둘 다 스캔(F9 — 경로 SSOT = versions.env:
                  #   INTERNAL_STORAGE_PATH=/var/lib/rancher/k3s-storage/internal,
                  #   BULK_STORAGE_PATH=/mnt/bulk — **마운트포인트**여야 한다. 국면 A(D4 한시)는
                  #   루트 LV의 bind 마운트, 국면 B는 실제 2TB M.2. 경로는 두 국면에 걸쳐 불변이다).
                  # local-path PVC 디렉토리명 = pvc-<uid>_<ns>_<pvcname> (k8s 이름엔 '_' 불가라 '_'가 유일 구분자).
                  # ⚠️ F20: 카운트는 티어별 — 전역 카운트는 bulk 경로가 틀려도 internal만으로 녹색이 된다.
                  N_internal=0; N_bulk=0
                  for root in /storage-internal /storage-bulk; do
                    tier=${root#/storage-}
                    for d in "$root"/*_*_*; do
                      [ -d "$d" ] || continue
                      base=$(basename "$d")
                      ns=$(echo "$base" | cut -d_ -f2)
                      pvc=$(echo "$base" | cut -d_ -f3-)
                      bytes=$(du -sb "$d" | cut -f1)
                      BODY="${BODY}pvc_dir_size_bytes{namespace=\"${ns}\",pvc=\"${pvc}\",tier=\"${tier}\"} ${bytes}\n"
                      case "$tier" in
                        internal) N_internal=$((N_internal+1)) ;;
                        bulk) N_bulk=$((N_bulk+1)) ;;
                      esac
                    done
                    # 티어별 fs 지표(F10) — 파드 내 statfs(df)로 계측한다.
                    # ⚠️ **국면 A(D4 한시) 동안 tier="bulk"의 df는 루트 파일시스템을 잰다** — bind
                    #    마운트라 같은 fs다. 즉 그 기간의 bulk 용량 신호는 internal과 같은 값이고,
                    #    이건 버그가 아니라 그 기간의 사실이다(bulk가 실제로 부트 디스크 위에 있다).
                    #    r4의 BulkStorageLow 문구가 이 사실을 반영한다. 국면 B에서 저절로 갈라진다.
                    read -r fs_size fs_avail <<< "$(df -B1 --output=size,avail "$root" | tail -1)"
                    BODY="${BODY}storage_tier_size_bytes{tier=\"${tier}\"} ${fs_size}\n"
                    BODY="${BODY}storage_tier_avail_bytes{tier=\"${tier}\"} ${fs_avail}\n"
                  done
                  # F9/F20: 티어별 fail-loud — internal은 상주 PVC 다수(라이브 7), bulk에도 알려진 상주 PVC가
                  # 최소 2개(files-data·pg-basebackup-local, 라이브 3). 0이면 경로/마운트가 틀린 것 — 녹색 하트비트 금지.
                  [ "$N_internal" -ge 1 ] || { echo "internal PVC 0개 — 마운트/경로 확인"; exit 1; }
                  [ "$N_bulk" -ge 1 ] || { echo "bulk PVC 0개 — bulk 경로/외장 마운트 확인(F20)"; exit 1; }
                  # grafana emptyDir 지문 스캔(meta-observability 01) — pod UID는 재생성마다 바뀌므로
                  # 경로 추적 대신 내용 지문(data 볼륨 안 grafana.db)으로 특정한다(RBAC 0 — 라이브 실측
                  # 매치 정확 1건·290,372 KiB가 파드 내부 du와 정합). 0건 = grafana 미가동일 수 있어
                  # 미방출(그건 TargetDown류 소관 — 이 exporter의 사망은 아래 하트비트가 감지). 2+건 =
                  # 지문 충돌(특정 전제 붕괴) — fail-loud. 글롭 무매치는 -f 검사가 걸러 nullglob 불요.
                  # ⚠️ 이 값만 kubelet의 sizeLimit 하드 limit과 비교되므로 kubelet과 **같은 회계**(블록,
                  #   -sB1)로 잰다 — 형제 PVC 루프의 -sb(apparent)는 소파일 다수에서 ~20%+ 과소라
                  #   (리뷰 실측) 예산 알림이 막으려던 것을 덜 막는다. 앵커 실측(290,372·290,380 KiB —
                  #   du -sk)도 블록 회계라 정합. du 실패(파드 소멸 레이스 — kubelet 트리는 휘발)는
                  #   그 후보만 건너뛴다(전체 사망 금지 — 1차 티어 신호와 분리).
                  N_gf=0; GF_BYTES=0
                  for d in /kubelet-pods/*/volumes/kubernetes.io~empty-dir/data; do
                    [ -f "$d/grafana.db" ] || continue
                    b=$(du -sB1 "$d" 2>/dev/null | cut -f1) || continue
                    [ -n "$b" ] || continue
                    N_gf=$((N_gf+1)); GF_BYTES=$b
                  done
                  if [ "$N_gf" -eq 1 ]; then BODY="${BODY}grafana_data_dir_size_bytes ${GF_BYTES}\n"; fi
                  # 매치 수는 **무조건** 방출한다 — 0건 미방출 + absent 없는 소비 룰 + 초록 하트비트가
                  # 겹치면 지문 붕괴(DB 파일명 변경·emptyDir→PVC 전환)가 영구 무성이 된다(리뷰 H2 —
                  # 죽은 알림 클래스의 생산자 쪽 변종·린터가 원리적으로 못 봄). GrafanaDuFingerprintLost
                  # (r4)가 이 게이지의 0을 페이징한다.
                  BODY="${BODY}grafana_du_fingerprint_matches ${N_gf}\n"
                  BODY="${BODY}pvc_du_last_success_timestamp ${TS}\n"
                  printf "%b" "$BODY" | curl -fsS --connect-timeout 5 --max-time 30 --data-binary @- \
                    "http://vmsingle.observability.svc:8428/api/v1/import/prometheus"
                  # 지문 충돌은 push **뒤**에 판정한다(리뷰 M1) — 부수 메트릭의 전제 붕괴가 1차 티어
                  # 신호·하트비트를 통째로 날리면 안 된다(티어 fail-loud와 범주가 다르다). 충돌 관측은
                  # 위 matches 게이지(≥2)가, Job Failed는 KubeJobFailed가 각각 진다.
                  [ "$N_gf" -le 1 ] || { echo "grafana.db 지문 ${N_gf}건 — 지문 충돌(특정 전제 붕괴)"; exit 1; }
                  echo "pushed: internal=${N_internal} bulk=${N_bulk} pvc dirs, grafana_fp=${N_gf}"
              volumeMounts:
                - { name: storage-internal, mountPath: /storage-internal, readOnly: true }
                - { name: storage-bulk, mountPath: /storage-bulk, readOnly: true }
                - { name: kubelet-pods, mountPath: /kubelet-pods, readOnly: true }
          volumes:
            - name: storage-internal
              hostPath: { path: /var/lib/rancher/k3s-storage/internal, type: Directory }
            - name: storage-bulk
              # provisioner 실경로(local-path-config-bulk nodePathMap) = versions.env의 BULK_STORAGE_PATH.
              # ⚠️ `type: Directory`는 **존재만 검사한다** — bulk 미마운트는 잡지 못한다.
              #    `/mnt/bulk`는 루트 fs 위의 마운트포인트 디렉토리라 미마운트에서도 항상 존재하고,
              #    bulk PV 4건이 전부 hostPath `DirectoryOrCreate`라 kubelet이 그 아래 `pvc-*`까지
              #    만든다 — 위 :138의 F20(`N_bulk -ge 1`)조차 통과한다.
              #    미마운트의 실제 페이징 경로는 vmsingle.yaml의 `vmsingle-data-bulk`가 이 티어 위에
              #    있다는 결합이다(TSDB CrashLoop -> Watchdog 단절 -> healthchecks deadman ≈4분).
              hostPath: { path: /mnt/bulk, type: Directory }
            - name: kubelet-pods
              # kubelet 코어 경로 — 부재 = 노드 이상이라 type: Directory의 fail-loud가 정당하다
              # (여기서는 경로 부재 자체가 노드 이상이라 존재 검사로 충분하다 — storage-bulk와 달리
              #  '마운트되었는가'를 묻지 않는다). 표면·완화는 상단 F8 계약 주석.
              hostPath: { path: /var/lib/kubelet/pods, type: Directory }
