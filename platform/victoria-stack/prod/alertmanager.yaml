# Alertmanager 배포(Deployment + Service). **설정 본문은 이 파일에 없다** —
# `alertmanager-config/alertmanager.yml`이 SSOT이고 `kustomization.yaml`의 `configMapGenerator`가
# 그 파일을 ConfigMap `alertmanager-config`로 굽는다.
#
# ★ 그 generator는 **내용 해시를 이름에 붙인다**. 설정을 고치면 ConfigMap 이름이 바뀌고, kustomize의
#   nameReference 변환이 아래 `volumes[config-in].configMap.name`을 그 새 이름으로 다시 쓴다 →
#   pod template이 변하므로 **ArgoCD 싱크만으로 롤아웃이 난다**. 형제 선례는
#   `platform/homepage/prod/kustomization.yaml`(같은 이유로 config를 generator로 둔다).
#
# ⚠️ 착지 전(≤2026-09-03)에는 이 파일이 평문 ConfigMap을 들고 있었고, 그때는 **수동 rollout이 유일한
#    보장**이었다(함정 원장: docs/traps-detail.md 「ConfigMap 변경 파드 자동 재시작 없음」).
#    그 함정이 실제로 물었다 — 2026-09-03 실측에서 라이브 파드가 2026-08-27 렌더본을 쓰고 있어
#    #607의 제목 매핑 2건이 실행 중 파드에 도달하지 않았다(red가 아니라 조용한 품질 저하).
#    ⇒ 이제 `kubectl rollout restart deploy/alertmanager -n observability`는 **정상 경로에서 불필요**하다.
#      필요해지는 경우는 generator를 우회해 라이브 ConfigMap을 손으로 고쳤을 때뿐이다.
#
# ⚠️ `configMapGenerator`에 `options.disableNameSuffixHash: true`를 켜지 마라 — 그 한 줄이 위 자동
#    롤아웃을 통째로 되돌려 옛 함정(무기한 옛 렌더본)으로 복귀시킨다. 해시 접미가 이 전환의 전부다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alertmanager }
      # vmagent의 pod-annotations job이 /metrics:9093을 스크레이프해
      # alertmanager_notifications_total / _failed_total{integration="telegram"}를 수집한다.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
    spec:
      automountServiceAccountToken: false # k8s API 미사용 — SA 토큰 마운트 금지(메타갭 ⑤ W2-C)
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: render-config
          image: busybox:1.38@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["sh", "-c"]
          args:
            - |
              sed "s/__CHAT_ID__/$TELEGRAM_CHAT_ID/" /config-in/alertmanager.yml > /config-out/alertmanager.yml
          env:
            - { name: TELEGRAM_CHAT_ID, valueFrom: { secretKeyRef: { name: alerting-secrets, key: TELEGRAM_CHAT_ID } } }
          volumeMounts:
            - { name: config-in, mountPath: /config-in }
            - { name: config-out, mountPath: /config-out }
          securityContext: { runAsNonRoot: true, runAsUser: 65534, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.33.0@sha256:af26fbe4dd1886ac0efd7bd55cd9027da262e105b137a376522b7c14c3626e4a
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
            - --web.listen-address=:9093
          ports: [{ name: http, containerPort: 9093 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe: { httpGet: { path: /-/ready, port: 9093 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config-out, mountPath: /etc/alertmanager }
            - { name: secrets, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - { name: config-in, configMap: { name: alertmanager-config } }
        - { name: config-out, emptyDir: {} }
        - { name: secrets, secret: { secretName: alerting-secrets } }
        - { name: data, emptyDir: { sizeLimit: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  selector: { app.kubernetes.io/name: alertmanager }
  ports: [{ name: http, port: 9093, targetPort: 9093 }]
