apiVersion: v1
kind: ConfigMap
metadata: { name: gha-liveness-exporter-script }
data:
  run.sh: |
    #!/bin/sh
    set -eu
    # GHA 스케줄 워크플로의 **마지막 성공 시각**을 GitHub API에서 읽어 vmsingle에 push한다.
    #
    # 왜 클러스터에서 도는가(티켓 10, 선택지 B): 09의 준비상태 회계는 *run 안에서* job이 조용히 skip되는
    # 것을 닫았다. 남은 표면은 **run이 아예 발생하지 않는 것**이다 — GitHub의 60일 스케줄 자동 비활성화·
    # Actions 비활성화·스케줄러 유실. 그건 run conclusion으로 원리적으로 볼 수 없다(없는 run은 색이 없다).
    # 관측자는 run **밖**에 있어야 하고, GitHub-hosted 러너는 internal-by-default 때문에 vmsingle에
    # 도달할 수 없으므로(내부 인입은 tailscale passthrough→:8443뿐) 방향은 **클러스터가 GitHub을 폴링**하는
    # 쪽뿐이다. in-repo 워처는 자기가 죽으면 신호가 0이고, 60일 자동 비활성화는 전 워크플로에 동시에
    # 적용되므로 그 경로에 원리적으로 무력하다.
    #
    # ⚠️ **자격증명이 없다.** 이 레포는 public이고(infra/github/repo.tf: 무료 플랜은 private repo에
    #    branch protection을 지원하지 않아 의식적으로 public이다) Actions runs 조회는 **미인증으로 된다**
    #    (실측 HTTP 200). 그래서 SealedSecret·만료 원장·회전 부담이 전부 없다.
    #    대가는 rate limit **60 req/hr(IP당)** 이고, 그게 아래 크론 주기의 상한을 정한다:
    #      워크플로 8종 × 2회/시(*/30) = 16 req/hr — 44건 여유. 크론을 */10으로 올리면 48 req/hr가 되어
    #      같은 IP의 다른 GitHub 트래픽과 합쳐 한도를 넘길 수 있다(그러면 403이 되고 scraped<configured로
    #      GHALivenessScrapeIncomplete가 발화한다 — fail-closed지만 소음이다).
    #
    # ⚠️ **이 exporter의 출력은 단조가 아니다 — 그리고 그건 여기서 고치지 않는다.**
    #    GitHub Actions API는 간헐적으로 **낡은 스냅샷을 200으로** 돌려준다(2026-08-19 실측: 같은 URL을
    #    몇 초 간격으로 두 번 부르면 `total_count`가 319 ↔ 1137로 갈리고 최신 run이 21.5일 낡은 것으로
    #    온다). 에러가 아니라 성공 응답이라 아래 두 검사(`-z "$TS_ISO"` · `date -u -d` 실패)가 **원리적으로
    #    못 잡고**, SCRAPED도 정상 증가한다 ⇒ `GHALivenessScrapeIncomplete`도 침묵한다. 이 잡은
    #    **상태가 없어서**(CronJob · 자기 과거를 읽지 않는다) 받은 값을 그대로 싣고, 값은 API의 EPOCH인데
    #    샘플 타임스탬프는 push 시각이라 **역행 값이 "가장 최근 샘플" 자리에 앉는다.**
    #    ⇒ 클램프는 **소비자 쪽**이 진다: r6 `GHAWorkflowStale` 좌변의 `max_over_time`이 그 역할이다.
    #    여기에 단조 클램프를 넣으려면 자기 과거를 vmsingle에서 **읽어와야** 하고(현재는 순수 push),
    #    그 읽기의 실패 모드에 "그럼 뭘 push하나"라는 새 결정이 붙는다 — 소비자 쪽 한 단어가 같은
    #    불변식을 더 싸게 산다. ⚠️ 크론 주기를 늘리면 그 흡수 여유(`floor(윈도 / push)`폴)가 줄어든다.
    #    ⇒ 전문·근거는 `docs/traps-detail.md`(SSOT) 「GitHub API는 낡은 스냅샷을 200으로 돌려준다 …」.
    #
    # ⚠️ POSIX sh(#!/bin/sh + set -eu, pipefail 없음) + readOnlyRootFilesystem: bash-ism·임시파일 불가.
    #    카운터는 `N=$((N+1))` 대입 형태만 — `: $((N++))`는 결과 0에서 non-zero를 반환해 set -e가 죽인다
    #    (digest-exporter가 같은 자리에서 배운 것).
    CURL_MAX_TIME="${CURL_MAX_TIME:-20}"
    API="${GITHUB_API:-https://api.github.com}"
    NOW=$(date +%s)
    OUT=""
    CONFIGURED=0
    SCRAPED=0
    # WORKFLOWS = "파일명=최대허용나이(초)" 공백 구분. 최대허용나이의 하한은 **둘 중 큰 쪽**이고
    # (① cron 주기 × 3 ② GitHub 스케줄러 지연 천장 21600s), 그 정합(감시 집합 == 스케줄 워크플로 집합 ·
    # maxage >= max(3주기, 천장))은 tests/gates/test_gha-liveness-exporter.bats가 **레포에서 계산해**
    # 강제한다. ⚠️ ②가 없으면 안 되는 이유(선언 cron은 실제 실행 간격의 대리 변수가 아니다)는 아래
    # WORKFLOWS env 선언 옆 주석이 SSOT다 — 예산을 조정하기 전에 그쪽을 반드시 읽어라.
    for entry in $WORKFLOWS; do
      WF="${entry%%=*}"; MAXAGE="${entry#*=}"
      CONFIGURED=$((CONFIGURED+1))
      # 마지막 **성공** run 1건. per_page=1이라 응답이 작다(rate limit·메모리 양쪽에 유리).
      BODY=$(curl -fsS --max-time "$CURL_MAX_TIME" \
        -H 'Accept: application/vnd.github+json' \
        "$API/repos/$REPO/actions/workflows/$WF/runs?status=success&per_page=1" 2>/dev/null || true)
      # ⚠️ `.*` 탐욕 매치 금지 — grep -o로 **첫** 필드만 꺼낸다.
      # ⚠️ **콜론 뒤 공백을 반드시 허용한다** — GitHub API는 `"run_started_at": "..."`처럼 공백을 넣는다
      #    (라이브 실측 2026-07-28: 공백 없는 정규식이 8종 전부 매치 0 → scraped=0이었다. 응답을 실제로
      #    보지 않고 "한 줄 압축 JSON"이라 가정한 것이 원인이다).
      TS_ISO=$(printf '%s' "$BODY" | grep -o '"run_started_at": *"[^"]*"' | head -1 | sed 's/.*"\([0-9][^"]*\)"$/\1/')
      if [ -z "$TS_ISO" ]; then
        # ★ 조용한 스킵 금지 — 어느 워크플로가 실패했는지 로그에 남아야 진단이 된다.
        #   ⚠️ 형식은 `key=value`로 쓴다(모드 C 린터의 exposition 추출기가 메트릭 라인으로 오인하지 않도록).
        echo "gha run lookup failed: workflow=$WF" >&2
        continue
      fi
      EPOCH=$(date -u -d "$TS_ISO" +%s 2>/dev/null || true)
      if [ -z "$EPOCH" ]; then
        echo "gha timestamp parse failed: workflow=$WF value=$TS_ISO" >&2
        continue
      fi
      # ⚠️ SCRAPED 증가는 **반드시 위 두 검사 뒤**다 — 앞에 두면 전건 실패에도 scraped==configured가 되어
      #    부분 고장이 영영 무성해진다(digest-exporter가 같은 자리에서 배운 것).
      SCRAPED=$((SCRAPED+1))
      OUT="${OUT}gha_workflow_last_success_timestamp{workflow=\"$WF\"} ${EPOCH} ${NOW}000\n"
      # 예산을 **메트릭으로 함께** 싣는다. 룰이 워크플로마다 다른 임계값을 하드코딩하지 않아도 되고
      # (주기가 10분~1주로 두 자릿수 배 차이다), 예산이 바뀌면 룰 수정 없이 따라온다.
      OUT="${OUT}gha_workflow_max_age_seconds{workflow=\"$WF\"} ${MAXAGE} ${NOW}000\n"
    done
    # 수집 카운트는 **bare 시리즈**(라벨 0) — 룰이 on()/ignoring() 없이 1:1 스칼라 비교를 하므로
    # 한쪽에만 라벨이 붙으면 매치가 통째로 사라져 알림이 조용히 죽는다.
    OUT="${OUT}gha_liveness_configured ${CONFIGURED}\n"
    OUT="${OUT}gha_liveness_scraped ${SCRAPED}\n"
    # ★★ 하트비트는 **페이로드의 마지막 줄**이다 — 순서가 곧 fail-closed 계약이다.
    #   /api/v1/import/prometheus는 스트리밍 인입이라 요청이 중도 절단되면 **읽은 접두부만** 적재된다.
    #   하트비트가 앞에 있으면 "하트비트는 적재 / 나머지는 유실"이 가능해져 두 알림이 모두 무성해진다.
    #   마지막에 두면 절단은 항상 하트비트부터 잃으므로 Stale 발화로 fail-closed가 복원된다.
    #   의미론은 **"push 경로 생존"이지 "수집 성공"이 아니다** — GitHub API가 전건 실패해도 이 줄은 나간다.
    #   그래야 Stale이 GitHub 장애를 "push 사망"으로 오귀속하지 않는다(역할 분리).
    TS=$(date +%s)
    OUT="${OUT}gha_liveness_last_success_timestamp ${TS}\n"
    printf "%b" "$OUT" | curl -fsS --data-binary @- --max-time "$CURL_MAX_TIME" 'http://vmsingle:8428/api/v1/import/prometheus' || echo "vmsingle push failed (exit $?)" >&2
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: gha-liveness-exporter }
spec:
  # ⚠️ 변경 시 셋을 함께 보라(모드 C 하한 · rate limit 상한 · 부트스트랩 부등식):
  #   · 하한: push 주기 ≤ 룰의 rollup 윈도(r6 GHAWorkflowStale [3h])
  #   · 상한: 8 워크플로 × (60/주기시간) ≤ 60 req/hr — */30이면 16 req/hr
  #   · 부트스트랩: 첫 하트비트 ≤ cron(1800s) + ADS(120s) + 파드 예산(60s) = 1980s < GHALivenessExporterStale
  #                 임계(5400s). 최초 배포에 거짓 페이지가 나지 않는다.
  schedule: "*/30 * * * *"
  # digest-exporter와 같은 이유로 Replace다 — activeDeadlineSeconds는 이미 실행 중인 Job에 소급 적용되지
  # 않으므로, Forbid이면 구(무제한) Job이 살아 있을 때 새(제한된) Job이 계속 스킵돼 지연 상한이 무너진다.
  # 잡은 멱등이라(조회 + push) 중도 종료로 잃는 것이 없다.
  concurrencyPolicy: Replace
  # ⚠️ CronJobFlapping(core.yaml)의 **관측 창**이다 — 기본값 1이면 "최근 창에 N회 실패"를 원리적으로
  #    셀 수 없어 이 워크로드가 그 알림에서 통째로 빠진다(무성). 이 exporter는 주기 1800s에 하트비트
  #    임계가 5400s(3주기)라 교대 실패가 하트비트로도 안 잡히는 사각지대였다.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # 정상 실행은 수 초다. 행(hung) 잡이 슬롯을 무한 점유하는 경로를 차단해 부트스트랩 부등식을 강제한다.
      # 인-데드라인 예산: POD_START(60s) + 8×CURL_MAX_TIME(20s) = 220s > 120s 이므로 **전건 타임아웃이면
      # 데드라인에 걸린다** — 그건 의도다(그 상태는 GitHub 도달 불가라 어차피 scraped=0으로 알린다).
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: { app.kubernetes.io/name: gha-liveness-exporter } # observability egress netpol 셀렉터
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false # curl만 — k8s API 미사용
          securityContext: { runAsNonRoot: true, runAsUser: 65532 }
          containers:
            # ⚠️ digest-exporter와 **같은 이미지 참조**를 의도적으로 재사용한다(curl + GNU date + grep이
            #    전부 있다). 새 이미지를 들이면 소유권 회계(policy/image-ownership.json)에 항목이 하나
            #    늘고 메모리 원장·핀 갱신 대상도 늘어난다. 같은 `repo:tag@digest`를 쓰면 G2의
            #    "같은 태그는 같은 digest" 불변식이 두 파일을 **함께** 묶어 주는 이득까지 있다
            #    (한쪽만 bump하면 그 가드가 red를 낸다).
            - name: gha-liveness-exporter
              image: ghcr.io/ukyi-app/skopeo:alpine@sha256:a28a72e4a8950f5c70586ddb3d2c45058b68737d5d7a3122380991fde820ca3d
              command: ["/bin/sh", "/script/run.sh"]
              env:
                - name: REPO
                  value: "ukyi-app/homelab"
                # "워크플로파일=최대허용나이(초)" — 나이 예산의 하한은 **둘 중 큰 쪽**이고, 감시 집합은
                # 레포의 스케줄 워크플로 **전건**이어야 한다. 셋 다 tests/gates/test_gha-liveness-exporter.bats가
                # 워크플로 파일에서 **계산해** 강제한다 — 하드코딩 목록이 레포와 어긋나는 클래스(티켓 07 D-1)를
                # 여기서 되풀이하지 않기 위해서다.
                #   ① cron 주기의 3배 (단발 유실 흡수) — 긴 주기에서 지배적
                #   ② GitHub 스케줄러 지연 천장 21600s(6h) — 짧은 주기에서 지배적
                # ★ ②가 필요한 이유: **선언 cron은 실제 실행 간격의 대리 변수가 아니다.** GitHub은 `*/10`을
                #   10분마다 실행하지 않고, `*/10`과 `*/30`의 실측 도달 간격 분포가 사실상 같다(하한 ~49분).
                #   ①만 있으면 짧은 주기 워크플로가 상시 오탐이 된다 — 그때 ①은 초록이라 통과가 오탐을
                #   예고하지 못한다(기준량이 현상과 무관하면 그렇다). 천장의 실측 근거는 게이트 테스트가 SSOT.
                - name: WORKFLOWS
                  value: >-
                    bump-poll.yaml=21600
                    tf-reconcile.yaml=21600
                    pr-sweeper.yaml=21600
                    dns-drift.yaml=86400
                    audit.yaml=345600
                    contract-drift.yaml=2419200
                    credential-expiry.yaml=2419200
                    renovate.yaml=2419200
              resources:
                requests: { cpu: 20m, memory: 32Mi }
                limits: { memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: script, mountPath: /script }
          volumes:
            - { name: script, configMap: { name: gha-liveness-exporter-script } }
