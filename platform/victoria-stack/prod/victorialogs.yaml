apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/name: victorialogs }
spec:
  selector: { app.kubernetes.io/name: victorialogs }
  ports: [{ name: http, port: 9428, targetPort: 9428 }]
---
# W3 관측 로그 저장소 bulk-ssd 이전(메타갭 캠페인 Task 14, 컷오버 2026-07-08 STS delete-orphan
# 재생성) — vmsingle(Task 13)과 동일 시퀀스(F2). 로그는 보존 요구가 낮아 데이터 이전 없이
# 빈 볼륨 재축적(retention 14d, owner 결정). 절차는 runbooks/observability-bootstrap.md §5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vlogs-bulk
  labels: { app.kubernetes.io/name: victorialogs }
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: bulk-ssd
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victorialogs
  labels: { app.kubernetes.io/name: victorialogs }
spec:
  serviceName: victorialogs
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: victorialogs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: victorialogs }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9428" } # 자기관측 vl_rows_ingested 등
    spec:
      automountServiceAccountToken: false # k8s API 미사용(로그 저장) — SA 토큰 마운트 금지(메타갭 ⑤ W2-C)
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: victorialogs
          # v1.51+는 plain 태그 스킴(구 -victorialogs suffix 폐기). LogsQL filter-pipe breaking(foo|bar)
          # 은 우리 committed 쿼리 무영향(대시보드=PromQL, Explore 임시질의만 LogsQL). forward-compat.
          image: victoriametrics/victoria-logs:v1.51.0@sha256:e16dd33a95623cc21730cf5285344ed9f97419eeaff7d24b039c135beb85ee7e
          args:
            - --storageDataPath=/vlogs
            - --retentionPeriod=14d
            # ⚠️ 이 값은 **자기 볼륨 선언(위 PVC 10Gi)보다 작아야** 한다 — tools/check-disk-caps.ts가 강제.
            #    이전 값 15GB는 10Gi(=10.74e9 B)의 **139.7%**였다: 같은 파일이 "이 볼륨은 10Gi"와
            #    "내 데이터가 15e9 B 될 때까지 축출 안 함"이라는 모순된 두 숫자를 말하고 있었다.
            #    ⚠️ 단위: GB=10⁹ · Gi=2³⁰ — 접미사만 보면 15GB < 10Gi로 잘못 읽힌다.
            # 8GB = 74.5% (선례 vmagent 450MiB/512Mi = 87.9%보다 보수적).
            # ★ **동작 변화 0**: 실측 사용량 208MiB로 이 상한의 1/38이고, 축출은 전부 아래 retentionPeriod가
            #   한다(라이브 로그가 파티션 삭제 사유를 14d로 귀속). 이 변경은 순수 **선언 정정**이다.
            # ⚠️ 반대 방향(PVC를 16Gi로 상향)을 택하지 않은 이유: PVC requests.storage는 **축소 불가**
            #   (확장 전용)라 되돌릴 수 없고, 이미 실사용의 49배인 선언을 더 부풀리는 순환 논리다.
            - --retention.maxDiskSpaceUsageBytes=8GB
            - --memory.allowedPercent=60
            - --httpListenAddr=:9428
          env:
            - { name: GOMEMLIMIT, value: "230MiB" } # 256Mi의 약 90%
            # GOMAXPROCS 핀 — 노드 코어 수만큼 P를 띄우지 않도록 기준선(Mac 6코어)에 묶는 **위생 조치**다.
            # ⚠️ **이것은 OOM의 원인이 아니었다**(2026-08-14 반증). 핀을 넣자 vector의 워커 스레드는
            #    15→8로 줄었지만 **커널 OOM 기록의 anon-rss는 그대로였다**(vector 325MiB · vlogs 129MiB).
            #    코어 수를 원인으로 지목했던 최초 진단은 틀렸다 — 아래 limit 주석이 실제 원인이다.
            - { name: GOMAXPROCS, value: "6" }
          ports: [{ name: http, containerPort: 9428 }]
          resources:
            # ⚠️ **128Mi로는 이 인제스션 작업집합이 안 들어간다** (2026-08-14 NUC 실측, 2시간에 16회
            #    OOMKilled). 오진하기 쉬운 자리라 기제를 적어 둔다:
            #    기동 로그가 `system memory limit 134217728 bytes`(=128Mi)를 **정확히 감지**하고
            #    `-memory.allowedPercent=60`으로 캐시를 80530636 bytes(80.5MB)로 제한한다 —
            #    즉 cgroup 오감지가 아니다. 남는 47.5MB 안에 Go 힙 + 인제스션 버퍼 + 비-힙(mmap된
            #    part·스택)이 전부 들어가야 하는데 그게 안 된다. 커널 OOM 기록의 anon-rss는
            #    매번 ~129MiB로 평탄했다(누수가 아니라 작업집합).
            #    ⚠️ `GOMEMLIMIT`은 **힙 소프트 리밋**이라 이것을 못 막는다 — 115MiB가 걸린 채 죽었다.
            #    ⚠️ 저장량 문제도 아니다: 같은 시점 storage는 smallPartRows 110427 / 1.9MB뿐이었다.
            # 256Mi = 실측 OOM 지점(129MiB)의 약 2배. allowedPercent 60 → 캐시 154MB · 여유 102MB.
            # ⬜ **재기준선 숙제**: 이 값은 "OOM을 멈추는 안전한 상한"이지 right-size가 아니다.
            #    G4 부하가 걷힌 뒤 steady working_set을 재측정해 회수할 것(원장 산문의 옵션 (a)).
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 9428 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: vlogs, mountPath: /vlogs }]
      volumes:
        - name: vlogs
          persistentVolumeClaim: { claimName: vlogs-bulk }
