apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules-r7
  labels: { vmalert-rule: "true" }
data:
  r7.yaml: |
    groups:
      - name: meta
        rules:
          # ── 알림의 알림(meta-observability 03) — 기존 4표면이 못 보는 세 축만 담당한다 ─────────
          # VmalertUnhealthy(평가·전송 에러)·AlertmanagerTelegramFailing(전송 실패)·TargetDown
          # (스크레이프 단절)·Watchdog deadman(파이프라인 전멸)은 전부 "기계가 고장났다"를 본다.
          # 여기 세 룰은 "기계는 도는데 **알림이 일을 못 한다**"를 본다: for:를 못 채우고 되도는
          # 만성 flapping(라이브 실증: ContainerMemoryNearLimit{container="vmagent"} 195리셋/24h,
          # 알림 0) · remoteWrite만 죽는 부분 장애(ALERTS 기반 관측 전체의 fail-open) · 억제가
          # 알림을 장기간 삼키는 무성.
          # 라벨 규약: disk·unit 라벨 금지(alertmanager inhibit 2·3번의 equal 축 — 빈 매칭은
          # `=~ ".+"` 한정이 막지만 실수로 달면 억제 사정권에 들어간다). severity: warning 통일.
          # e2e: 이 파일은 record가 없고 ALERTS류를 **픽스처로 주입**해 replay하므로(04 하네스)
          # rulesDelay 파생기의 record-체인 판정과 무관하게 PLAIN 1s가 정확하다(설계 spec).

          # 룰별 만성 flapping — ALERTS_FOR_STATE의 값은 그 알림이 pending/firing으로 활성화된
          # 시각(activeAt)이다(라이브 실측: 값=타임스탬프). 조건이 for:를 못 채우고 되돌면 activeAt이
          # 갱신되므로 **값 변경 횟수 = pending 리셋 횟수** — "for: 룰 51종 중 누구도 자기 리셋을
          # 관측하지 않는다"는 갭의 직접 신호다. changes()는 시계열 값 변경만 세므로 상시 firing
          # (activeAt 불변)은 0이고, 시리즈가 사라졌다 재등장해도 재등장 구간의 변경만 센다.
          # 임계 6/6h: 라이브 top(vmagent 195/24h ≈ 49/6h)은 즉발, 정상 단발 해소·재발(glances
          # 3/24h)은 침묵. for: 30m — 창 축적형이라 순간 스파이크가 없고, 평가 노이즈만 거른다.
          # 셀렉터 제외: Watchdog(상시 firing — homepage 위젯 선례) + 메타 3종 자신(양성 피드백 —
          # 메타 알림이 flap하면 자기 리셋을 자기 임계로 세는 루프). 게이트가 네 이름을 강제한다.
          # (모드 A/B/C/D 전부 비대상 — changes는 denylist 메트릭이 아니고, ALERTS류는 vmalert
          #  평가 30s 주기 remoteWrite라 룩백 300s 안이며, time() 비교가 없다 — 조사 결론.)
          - alert: AlertRuleFlapping
            expr: |
              changes(ALERTS_FOR_STATE{alertname!~"Watchdog|AlertRuleFlapping|AlertPipelineWriteStale|AlertSuppressionProlonged"}[6h]) >= 6
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "알림 룰이 만성 flapping — 6시간에 6회 이상 pending 리셋"
              description: "{{ $labels.alertname }}이(가) for: 지속 조건을 못 채우고 6시간 동안 {{ $value }}회 활성화를 되풀이했습니다 — 조건이 임계 근처에서 진동 중인데 알림은 영구 무발화입니다. 대상 지표의 임계·for:를 재설계하거나 원인(리소스 진동 등)을 제거하세요."

          # remoteWrite 부분 장애 — vmalert가 평가는 계속하는데 ALERTS 되쓰기만 죽으면, 위
          # AlertRuleFlapping을 포함한 ALERTS 기반 관측 전체가 **조용히 무측정**이 된다(fail-open).
          # Watchdog은 상시 firing이라 ALERTS{Watchdog}의 마지막 샘플 시각이 파이프 생존의 정확한
          # 프록시다(라이브 실측: time()-timestamp() = 41s — 평가 30s 주기). 임계 900s = 주기의
          # 30배(재시작·일시 정체 흡수). vmalert 전체 다운은 이 룰도 함께 죽지만 그 축은
          # TargetDown + 오프노드 deadman(healthchecks.io — ping 부재 페이징)의 소관이다(경계).
          # ⚠️ absent 가지 없음(의도): 첫 배포 전 ALERTS 무이력 오발화 방지 — 시리즈가 있는데
          #   낡는 것이 이 룰의 표적이고, 시리즈 자체의 소멸은 max()가 빈 벡터 = 무발화로 접히며
          #   그 상태(파이프 전멸)는 deadman이 잡는다.
          - alert: AlertPipelineWriteStale
            expr: |
              (time() - max(timestamp(ALERTS{alertname="Watchdog"}))) > 900
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "vmalert의 ALERTS 되쓰기가 15분 이상 정체"
              description: "상시 발화하는 Watchdog의 ALERTS 샘플이 900초 이상 갱신되지 않았습니다 — vmalert remoteWrite 부분 장애로 ALERTS 기반 메타 관측(AlertRuleFlapping 등)이 무측정 상태입니다. vmalert 로그와 vmalert_remotewrite_errors_total을 확인하세요."

          # 억제 장기화 — inhibit 3건은 warning을 무기한 삼킬 수 있는데 그 억제를 관측하는 신호가
          # 없었다(suppressed 계열 소비 레포 전역 0 — 조사). alertmanager_alerts{state="suppressed"}
          # 게이지(스크레이프 30s — pod-annotations, 라이브 실재 확인)가 24시간 내내 1 이상이면
          # "무언가가 하루 넘게 사람 눈에 안 닿고 있다"는 뜻이다 — 억제 자체는 정상 동작이라
          # 이 룰은 오류가 아니라 장기화의 관측이다(warning). min_over_time의 시리즈-국소 창은
          # 파드 재시작(instance 갈림)에도 의도에 부합한다: 새 시리즈가 그 구간 내내 >0이면 발화.
          - alert: AlertSuppressionProlonged
            expr: |
              min_over_time(alertmanager_alerts{state="suppressed"}[24h]) > 0
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "억제된 알림이 24시간 이상 지속"
              description: "Alertmanager inhibit 규칙에 삼켜진 알림이 24시간 내내 1건 이상입니다({{ $value }}건) — critical이 장기 미해소인 채 warning들이 무성일 가능성이 큽니다. amtool 또는 UI에서 suppressed 목록을 확인하세요."
