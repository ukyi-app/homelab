apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules-core
  labels: { vmalert-rule: "true" }
data:
  core.yaml: |
    groups:
      - name: infra
        rules:
          - alert: TargetDown
            expr: up == 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "스크레이프 타깃 {{ $labels.job }}/{{ $labels.instance }} 다운"
              description: "vmagent 타깃이 5분간 도달 불가 상태입니다."
          - alert: NodeMemoryHigh
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.92
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "VM 메모리 사용률 92% 초과"
              description: "노드 메모리 압박 — eviction 임계치에 근접했습니다."
          # 노드-레벨 압박(kubelet condition) — OOM/디스크/PID 고갈의 노드 신호, eviction 선행 지표.
          # 단일 노드라 한 워크로드의 unbounded 자원 증가가 이웃 eviction으로 번진다. hostPath PV 4종이
          # 쿼터 없는 공유 fs(내장 SSD 실용량 224G)를 써 DiskPressure가 현실적 위험. status="true"==1로 발화
          # (메트릭은 condition×status 라벨에 0/1 값 — 라이브 확인). NodeMemoryHigh(92% 추세)의 사후/보강.
          - alert: NodePressure
            expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "노드 압박: {{ $labels.node }} {{ $labels.condition }}"
              description: "kubelet이 {{ $labels.condition }}를 보고합니다 — eviction 임박. 자원(메모리/디스크/PID) 소비자를 확인하세요. PVC 포화는 node_filesystem_avail_bytes(/)·StandardSSDFilling도 함께 보세요."
          # 파드 eviction 발생(사후) — 노드 압박으로 kubelet이 축출. NodePressure가 선행 경보.
          # kube_pod_status_reason는 honor_labels로 실제 ns/pod 라벨 보유(라이브 확인 — KSM clobber 아님).
          - alert: PodEvicted
            expr: kube_pod_status_reason{reason="Evicted"} == 1
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "파드 eviction: {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "노드 압박으로 파드가 축출됐습니다 — 원인 자원(디스크/메모리)을 확인하세요. hostPath PV 포화 가능."
          # ⚠️ 좌변의 max by(...) 서브쿼리는 필수다(instance 라벨 불안정 — PodCrashLooping :111과 동일 계열).
          # kube_pod_container_status_restarts_total은 KSM이 k8s API restartCount에서 재파생하는 상태-파생
          # 카운터라 KSM 프로세스 재시작에도 값이 0으로 리셋되지 않는다. KSM 파드 IP가 바뀌면(instance 라벨)
          # 시계열 정체성이 갈려 VM increase()가 새 시계열 첫 샘플(=누적 재시작수)을 "0에서 증가"로 오독한다.
          # 그러면 과거 OOMKilled 이력이 남은 **건강한** 파드에서 좌변>0 & 우변 가드=1로 조인 매치 → 오발화.
          # uid를 보존해야 파드 재생성(새 incarnation, restartCount 0 리셋)의 카운터 리셋 처리가 유지된다.
          - alert: PodOOMKilled
            expr: increase(max by (namespace,pod,container,uid) (kube_pod_container_status_restarts_total)[15m:1m]) > 0 and on(namespace,pod) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "OOMKill 발생: {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "컨테이너가 메모리 limit에 도달했습니다 — 메모리 원장 예산을 확인하세요."
          # 선제(leading) 메모리 경보 — PodOOMKilled(사후)의 짝. **회수 불가 메모리**가 limit의 85%를
          # 10분 넘으면 OOM 전에 발화(vector·homepage류 만성 과소 limit 조기 포착).
          # ⚠️ 분자는 usage에서 **파일 LRU 두 축만** 뺀 값이다. 두 오답이 있고 둘 다 라이브에서 겪었다:
          #  ① **working_set을 쓰면 안 된다** — 커널 정의가 working_set = memory.current − inactive_file
          #     이라 active_file(활성 clean page cache)이 분자에 그대로 실린다. 회수 가능한 캐시가 활성으로
          #     남아 있기만 하면 실요구량이 전혀 늘지 않아도 임계를 넘는다. 라이브 확정(2026-08-31 glances):
          #     anon이 20일간 76.6Mi로 불변인데 clean 캐시 40.9Mi가 charge되자 working_set만 81→113Mi로
          #     계단 상승해 88.3%로 발화했고, 같은 시점 cgroup memory.events는 max=0·oom_kill=0으로 limit에
          #     닿은 적조차 없었다. 옛 주석은 "max_usage만 피하면 page cache가 빠진다"고 적었는데 그 전제가
          #     틀렸다 — working_set도 정도가 덜할 뿐 같은 오염이다.
          #  ② **container_memory_cache를 빼도 안 된다** — 그것은 cgroup v2의 memory.stat:file이고
          #     tmpfs·shared memory를 **포함**한다. 이 호스트는 swap이 0이라(infra/k3s-bootstrap/host-config.sh)
          #     shmem은 회수될 수 없는데 통째로 빠진다. 라이브 database/pg-1(postgres shared_buffers)이
          #     file 120Mi 중 shmem 38Mi를 그렇게 잃어 7.6%가 3.9%로 보고됐다 — shared memory로 limit을
          #     채우는 컨테이너는 0%에 가깝게 평가돼 OOM 전까지 무성이 된다.
          #  ⇒ total_inactive_file + total_active_file만 빼면 파일 LRU의 회수 가능분만 빠지고
          #     anon + shmem + slab + kernel_stack이 남는다 — 그것이 커널이 회수할 수 없는 몫이고
          #     OOM을 실제로 결정하는 것도 그쪽이다. (라이브 대조: glances 67.0% 침묵 유지 / postgres 7.6%.)
          #    게이트: tests/gates/vmalert-memory-nearlimit-firing-e2e.sh
          #           (L1=캐시 오염 락 · L2=anon 참양성 · L2b=shmem 참양성 · L3=하네스 이빨).
          # limit 미설정 컨테이너는 분모 시리즈가 없어 매칭 0 → 자동 제외.
          # system ns는 PodCrashLooping과 동일하게 제외. 발화 시 원장에서 해당 행 limit 상향을 검토.
          # ⚠️ 분모는 **두 KSM 계열의 or**다(2026-09-01). 네이티브 사이드카(`restartPolicy: Always`인
          #    initContainer — CNPG의 plugin-barman-cloud가 그렇다)의 limit을 KSM은
          #    `kube_pod_init_container_resource_limits`로 내보내므로, container 계열만 보면 그 컨테이너는
          #    **limit이 있어도 영원히 분모가 없어 무성**이다. 라이브 확인(pg-1): container 계열에는
          #    `postgres`만, init 계열에는 `bootstrap-controller`만 있다. 한쪽만 보면 캡을 씌우는 순간
          #    "무캡·무알림"이 "캡·무알림·조용한 OOMKill"로 바뀐다.
          #    `or`는 좌변에 없는 시리즈만 우변에서 채우므로, 양쪽에 다 있는 컨테이너는 container 계열이
          #    이긴다(일반 컨테이너의 판정은 종전과 동일하다).
          - alert: ContainerMemoryNearLimit
            expr: |
              (max by (namespace, pod, container) (container_memory_usage_bytes{container!="", namespace!~"kube-system|kube-public|kube-node-lease"})
                - max by (namespace, pod, container) (container_memory_total_inactive_file_bytes{container!="", namespace!~"kube-system|kube-public|kube-node-lease"})
                - max by (namespace, pod, container) (container_memory_total_active_file_bytes{container!="", namespace!~"kube-system|kube-public|kube-node-lease"}))
                / (max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
                   or max by (namespace, pod, container) (kube_pod_init_container_resource_limits{resource="memory"}))
                > 0.85
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "컨테이너 메모리 limit 근접: {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}"
              description: "회수 불가 메모리(anon+shmem+slab — 회수 가능한 파일 캐시 제외)가 메모리 limit의 85%를 10분 초과 — OOM 임박. 메모리 원장에서 해당 행 limit 상향을 검토하세요."
          # Notifier 자기관측 (R8 보강): Telegram 전송이 실패하면 발화.
          # ⚠️ Watchdog 커버리지 경계 — Watchdog는 "vmalert→Alertmanager 평가 파이프라인이
          #    살아있음"만 증명하고(healthchecks.io의 off-node dead-man's-switch가 그 부재를 페이징),
          #    Alertmanager가 Telegram으로 보내는 마지막 홉, 즉 자기 자신의 전송 실패는 감지하지 못한다.
          #    이 알림이 (부분) 전송실패는 메운다. ⚠️ 한계(의도적 수용): Telegram이 전면 장애면
          #    이 알림 자체도 미도달(자기참조) — off-node 스위치는 *파이프라인 생존*만 증명하지 Telegram
          #    전송은 증명하지 않는다. 전면 장애의 백스톱은 TSDB의 이 메트릭(Grafana)·GitHub 워크플로
          #    실패 알림이며, 완전 독립 비-Telegram 채널은 단일운영자 홈랩에 과설계라 v1 범위 밖.
          - alert: AlertmanagerTelegramFailing
            expr: increase(alertmanager_notifications_failed_total{integration="telegram"}[15m]) > 0
            for: 0m
            labels: { severity: warning }
            annotations:
              summary: "Alertmanager → Telegram 전송 실패 발생"
              description: "최근 15분간 telegram integration의 notifications_failed_total이 증가했다 — HTML parse 오류(escape 누락)·봇 토큰·chat_id·네트워크를 확인하라. 이 알림 자체도 같은 Telegram 경로를 타므로 전면 장애 시엔 미도달할 수 있다 — 그 경우 신호는 이 메트릭(Grafana 대시보드)·GitHub 워크플로 실패 알림이다(off-node 스위치는 pipeline 생존만 증명)."
          # deadmanswitch-relay 단독다운 in-band — relay는 busybox nc라 /metrics 없음·미scrape이나,
          # AM이 Watchdog를 relay:9095/ping webhook으로 보내므로 relay 다운 시 AM webhook 전송이 실패한다.
          # AM은 up이라 이 알림을 Telegram으로 전달 가능 — off-node deadman(healthchecks.io) 윈도보다 빠르다.
          - alert: DeadmanswitchRelayUnreachable
            expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "deadmanswitch-relay 도달 불가(AM webhook 전송 실패)"
              description: "Alertmanager가 deadmanswitch-relay(:9095/ping) webhook 전송에 실패합니다 — relay 다운/네트워크 가능. off-node deadman이 페이징하기 전 in-band 조기 신호입니다(relay가 healthchecks.io ping을 못 보내면 곧 off-node도 발화)."
          # 단일 인스턴스 pg 클러스터(HA 없음)의 생존 — CNPG instance manager의 up 게이지로 판정.
          # cnpg_collector_up은 pg-1에서 직접 scrape돼 라벨이 정확하다(namespace=database,pod=pg-1).
          # ⚠️ kube_pod_status_ready{namespace="database"}는 쓰지 말 것 — pod-annotations scrape가
          # honor_labels 없이 KSM의 namespace/pod를 KSM 파드(observability)로 덮어써 0매치가 되고,
          # absent() 가드가 정상 DB에도 오발화한다(라이브 검증된 함정). != 1은 exporter가 떠 있으나
          # unhealthy인 경우, absent()는 파드 소멸/미스케줄(scrape 단절) 시 fail-closed로 페이징.
          - alert: PostgresClusterDown
            expr: |
              max(cnpg_collector_up{namespace="database"}) != 1
              or absent(cnpg_collector_up{namespace="database"})
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: "PostgreSQL 클러스터 다운(Ready 인스턴스 0)"
              description: "database/pg가 3분 이상 Ready가 아닙니다 — 단일 인스턴스라 전 앱이 의존하는 DB가 중단된 상태입니다. CrashLoop/OOM/Pending/PVC를 확인하세요. 백업 staleness 알림(R2BackupStale 등)은 27시간 뒤에야 발화하므로 이 알림이 1차 페이징입니다."
          # LAN DNS 생존 — R7 이후 AdGuard는 **집 안 모든 기기**의 유일한 리졸버다(pg보다 폭이 넓다).
          # ⚠️ 라우터(NETGEAR Orbi RBR350)에 보조 DNS 1.1.1.1이 설정돼 있으나 **실측상 발동하지 않는다**
          #    (2026-08-18 드릴: AdGuard 파드 삭제 후 15초 타임아웃 프로브 6건 전부 무응답, FALLBACK 0건).
          #    즉 이 Deployment가 0이면 폴백 없이 **집 전체 DNS가 끊긴다.**
          # ⚠️ 기존 WorkloadUnavailable(T+10m·warning)이 이미 덮지만 제목이 "워크로드 불가용"이라
          #    owner가 "집이 끊겼다"로 못 읽는다. 이 알림은 그 창을 T+1m·critical로 좁히고 제목을 바꾼다.
          #    (WorkloadUnavailable은 그대로 둔다 — 이쪽은 Available 컨디션, 저쪽은 ready 레플리카로 축이 다르다.)
          # ⚠️ `for: 60s`는 의도적이다 — 정상 롤아웃 공백이 실측 약 5초(created→Ready)라 일상 재시작에는
          #    발화하지 않는다. 60초 넘게 0이면 그건 롤아웃이 아니라 사고다.
          # ⚠️ 메트릭 선택: kube_endpoint_address 계열은 백엔드가 0이 되면 **시리즈가 사라져**
          #    vmagent의 --promscrape.noStaleMarkers와 겹쳐 최대 5분 지연된다. replicas_ready는 값이
          #    1→0으로 **반전**할 뿐 시리즈가 남아 staleness를 타지 않는다(라이브 실측: namespace=edge ·
          #    deployment=adguard 라벨이 honor_labels로 실제값이다 — pod 라벨만 KSM 파드로 덮인다).
          # absent()는 PostgresClusterDown과 같은 fail-closed 규약 — Deployment 소멸/KSM 단절도 페이징.
          - alert: LanDnsPathDown
            expr: |
              kube_deployment_status_replicas_ready{namespace="edge", deployment="adguard"} == 0
              or absent(kube_deployment_status_replicas_ready{namespace="edge", deployment="adguard"})
            for: 60s
            labels: { severity: critical }
            annotations:
              summary: "집 LAN DNS 끊김 — AdGuard 백엔드 0"
              description: >-
                edge/adguard가 60초 이상 Ready 0입니다 — **집 안 모든 기기의 DNS가 멈춘 상태**입니다.
                라우터 보조 DNS(1.1.1.1)는 실측상 발동하지 않으므로 폴백이 없습니다.
                30초 판별(IP 리터럴만 — 이름해석이 죽었으므로):
                `dig @192.168.117.15 +time=3 +tries=1 zzz.doubleclick.net` →
                `0.0.0.0`=정상 · NXDOMAIN=1.1.1.1 경유(차단 없음) · 무응답=AdGuard 죽음.
                이어서 `kubectl -n edge get pods -l app=adguard`(ssh는 tailscale IP라 DNS 없이 붙습니다).
                우회: 사고 대응 기기는 DNS가 `192.168.117.15,94.140.14.14`로 상시 고정돼 있어 별도 조작이
                필요 없습니다(2순위도 AdGuard 공개 DNS라 차단은 유지되고 split-horizon만 상실).
                런북 `docs/runbooks/lan-dns.md` §4-2b.
                ⚠️ 노드 재부팅 중에는 vmalert도 함께 다운이라 이 알림이 원리적으로 발화하지 못합니다.
          # 비-OOM CrashLoop 백스톱(OOM은 PodOOMKilled가 커버) — config/이미지풀/panic 반복 재시작.
          # 블랙리스트(시스템 ns만 제외) — 화이트리스트는 신규 PSA ns(cache·sealed-secrets)를 흘렸다(회귀).
          # honor_labels(#20)로 kube_* namespace가 실제값이라 블랙리스트가 모든 워크로드 ns를 자동 포함.
          # ⚠️ max by(...) 서브쿼리는 필수 — rollup **이전에** instance를 벗긴다(라이브 검증된 함정).
          # 호스트 재부팅이면 KSM 파드 IP가 바뀌어 instance 라벨이 갈리고, 상태-파생(비-리셋) 카운터라
          # 새 시계열 첫 샘플이 누적 재시작수(예 9)로 등장한다 → raw increase()는 이를 "15분간 9회"로 오독해
          # 재시작 3회 초과 이력이 있는 모든 파드에 오발화했다(07-02·07-07·07-08·07-09 4회 재발).
          # by 목록에 uid 보존 필수 — 빼면 서로 다른 파드 incarnation이 병합돼 카운터 리셋 처리가 깨진다.
          # (프로세스-로컬 카운터인 alertmanager_*/vmagent_*/vmalert_*는 재시작 시 0 리셋이라 이 처리 불요.)
          - alert: PodCrashLooping
            expr: increase(max by (namespace,pod,container,uid) (kube_pod_container_status_restarts_total{namespace!~"kube-system|kube-public|kube-node-lease"})[15m:1m]) > 3
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "파드 재시작 반복: {{ $labels.namespace }}/{{ $labels.pod }}"
              description: "컨테이너가 15분간 3회 초과 재시작했습니다(CrashLoop) — OOM이 아니면(OOM은 PodOOMKilled가 커버) config/이미지/probe를 확인하세요."
          # 로그 수집(Vector→VictoriaLogs) 정체 — root 미실행 등으로 조용히 0이 되던 사일런트 실패모드(검증됨).
          # VL self-scrape 주석 필요(이 변경에 포함). for:30m로 scrape 셋업 윈도의 absent() 전이를 흡수.
          - alert: LogIngestionStalled
            expr: |
              sum(rate(vl_rows_ingested_total{type="elasticsearch_bulk"}[15m])) == 0
              or absent(vl_rows_ingested_total{type="elasticsearch_bulk"})
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "로그 수집 정체(Vector→VictoriaLogs 0행)"
              description: "elasticsearch_bulk 수집률이 0이거나 메트릭이 없습니다 — vector 경로 단절(예: root 미실행) 가능. VL self-scrape·vector 파드를 확인하세요."
          # vmagent remoteWrite 실패/드롭 — 메트릭이 TSDB에 안 들어가 다른 알림이 조용히 무력화될 수 있다.
          - alert: VmagentRemoteWriteDropping
            expr: |
              increase(vmagent_remotewrite_packets_dropped_total[15m]) > 0
              or increase(vmagent_remotewrite_errors_total[15m]) > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "vmagent remoteWrite 드롭/실패"
              description: "vmagent가 샘플을 드롭하거나 remoteWrite에 실패합니다 — 메트릭 유실로 알림 평가가 부정확해질 수 있습니다."
          # vmagent 버퍼 채워짐(leading) — vmsingle이 느림/backpressure(write가 천천히 통과)일 때 큐가
          # maxDiskUsagePerURL 캡에 근접. 드롭 전 조기 경고(드롭은 VmagentRemoteWriteDropping = 2티어).
          # ⚠️ 커버리지 경계(F5): 이 메트릭(vmagent self-metric)도 remoteWrite로 vmsingle에 들어가 vmalert가
          #    질의한다 — vmsingle write가 전면 실패하면 pending 메트릭도 vmagent 큐에 갇혀 vmsingle에 못 도달,
          #    이 알림은 그 케이스엔 침묵한다(vmsingle 전면다운 = TargetDown{job~vmsingle}+deadman이 커버).
          #    즉 "vmsingle 느림/부분열화"에 leading하고 "write 전면다운"엔 무력(의도적 경계). emptyDir라 재시작 시 큐 휘발.
          - alert: VmagentBufferFilling
            expr: sum(vmagent_remotewrite_pending_data_bytes) > 330000000   # ≈315Mi(450Mi 캡의 70%)
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "vmagent remoteWrite 버퍼 채워짐(vmsingle 느림/backpressure — 드롭 임박)"
              description: "vmagent 디스크 큐가 maxDiskUsagePerURL 캡에 근접 — vmsingle write가 느려져(backpressure) 적체 중. 곧 oldest drop(VmagentRemoteWriteDropping)으로 메트릭 유실. vmsingle 부하/디스크를 확인하세요. ⚠️ vmsingle write 전면다운 시엔 이 메트릭도 버퍼에 갇혀 미발화(그 케이스는 TargetDown(vmsingle)+deadman) — 이 알림은 부분열화(느림)용입니다. emptyDir 버퍼라 vmagent 재시작 시 큐 휘발."
          # vector backpressure — sink(vlogs)이 입력을 못 따라가면 utilization이 1에 근접(부분 드롭/적체 전조).
          # vector internal_metrics→prometheus_exporter로 노출된 vector_utilization 사용(sink 2종: vlogs·prometheus).
          - alert: VectorBackpressure
            expr: max(vector_utilization{component_kind="sink"}) > 0.9
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "vector sink backpressure(utilization>0.9 10분 — 로그 적체/드롭 위험)"
              description: "vector sink가 10분간 utilization>0.9 — 입력을 못 따라가 버퍼 적체/부분 드롭 위험(LogIngestionStalled는 전면 0만 잡음, 이건 부분열화). VictoriaLogs(vlogs sink) 부하/디스크를 확인하세요. vector_utilization 기반."
          # vmalert 자기관측 — 룰 평가/notifier/remoteWrite 에러(알림 엔진 자체 고장). Watchdog는 평가 생존만 증명.
          - alert: VmalertUnhealthy
            expr: |
              increase(vmalert_alerting_rules_errors_total[15m]) > 0
              or increase(vmalert_alerts_send_errors_total[15m]) > 0
              or increase(vmalert_remotewrite_errors_total[15m]) > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "vmalert 룰/알림 전송 에러"
              description: "vmalert가 룰 평가 또는 Alertmanager 전송에 실패합니다 — 알림 파이프라인 자체가 손상됐을 수 있습니다."
          # 일반 Job 실패 백스톱 — 전용 staleness 알림이 없는 Job(예: files ns Job)의 실패를 잡는다.
          # 블랙리스트(시스템 ns만 제외) — 화이트리스트는 신규 ns(files 등)를 흘렸다(PodCrashLooping :108과 동일 회귀).
          # honor_labels(#20)로 kube_job_* namespace가 실제값이라 블랙리스트가 모든 워크로드 ns를 자동 포함한다.
          # 백업 CronJob류(전용 staleness 보유)는 job_name으로 제외(화이트리스트 회귀 금지).
          # ★★ `unless` 절이 없으면 이 룰은 **해소된 과거 실패를 영구히** 발화한다(라이브 2026-07-26~30).
          #    `kube_job_failed`는 Job **오브젝트가 존재하는 한** 계속 1이다 — 시간 개념이 없다. 그 오브젝트의
          #    수명은 `failedJobsHistoryLimit`이 지배하는데 그 회수는 **뒤이은 실패가 더 쌓여야만** 일어난다.
          #    즉 **정상 운영(= 이후 전부 성공)일수록 실패 Job이 영원히 남는다**(클러스터의 CronJob 전부
          #    `ttlSecondsAfterFinished`가 없어 회수 경로도 없다). adguard-rewrite-reconciler가 재부팅 직후
          #    DNS 미준비로 **1회** 실패한 뒤 `*/10`으로 약 430회 성공했는데 이 알림이 **3일 넘게 연속
          #    firing**했다. `for: 15m`은 "실패가 15분 지속됐다"가 아니라 "실패 Job 오브젝트가 15분 존재했다"만
          #    증명한다 — 주석의 문장과 실제 의미가 갈라지던 지점이다.
          # ★ 억제 조건 = **그 실패 Job이 시작한 뒤에 소유 CronJob이 성공했다**(= 정기 작업이 자가 복구됐다).
          #    시간 창(`time() - start_time < N`)이 아니라 후속 성공을 쓰는 이유: 창은 **미해결 실패도** N초 뒤
          #    조용해져 진짜 고장을 놓친다(특히 재시도가 없는 단발 Job). 후속 성공은 해소를 **증명**한다.
          #    ⚠️ `owner_kind="CronJob"`으로 좁히는 것이 핵심이다 — 단발 Job에는 억제 재료(소유 CronJob의
          #      마지막 성공)가 원리적으로 없으므로 기존 백스톱이 그대로 남아야 한다(게이트 L4가 락한다 —
          #      픽스처가 억제 재료를 **전부 갖춘 채** owner_kind만 다르게 두므로 이 필터를 지우면 red다).
          #    ⚠️ CronJob이 한 번도 성공한 적 없으면 우변이 빈 벡터라 아무것도 지우지 못한다 = fail-closed.
          #    ⚠️ 조인 키가 두 단계인 이유: `kube_job_owner`가 job_name↔owner_name을 잇고(group_left),
          #      `kube_cronjob_status_last_successful_time`은 `cronjob` 라벨만 가지므로 label_replace로
          #      owner_name 축에 올려야 매칭된다. 한 CronJob에 실패 Job이 여럿일 수 있어 many-to-one이다.
          #    ⚠️ 세 피연산자 모두 `max by (...)`로 **사전 집계**한다(모드 B 규율). raw 셀렉터끼리 on() 산술
          #      조인을 하면 KSM 시리즈가 잠깐이라도 겹칠 때(재시작 중 두 인스턴스·instance 라벨 churn)
          #      many-to-one이 many-to-many가 되어 **422로 룰 평가가 통째로 죽는다** — 알림이 틀리는 게
          #      아니라 사라진다. `tests/test_alert_rules.bats`(모드 B)가 이 형태를 강제한다.
          #    ⚠️ 억제는 실패 **빈도**를 보지 않는다. CronJob 주기 P가 `for:`(900s)보다 짧으면 실패 Job은
          #      최대 P초 만에 억제되므로 `for:`를 **원리적으로 채우지 못한다** → 실패↔성공이 교대하는
          #      만성 flapping을 이 룰은 못 본다. 그 축은 아래 **CronJobFlapping**이 담당한다(상보 관계 —
          #      "지금 고장인가" ↔ "자주 깨지는가"). 연속 2회 이상 실패는 여전히 이 룰이 발화한다.
          #    회귀 게이트: tests/gates/vmalert-jobfailed-firing-e2e.sh — 억제 절·`owner_kind` 필터·
          #      조인 키 단위(job)·창 밖 미래 타임스탬프 거부를 각각 별개 레그가 문다.
          - alert: KubeJobFailed
            expr: |
              kube_job_failed{condition="true", namespace!~"kube-system|kube-public|kube-node-lease", job_name!~"cnpg-local-basebackup.*|pg-dump-hedge-r2.*|pg-restore-drill.*"} > 0
              unless on (namespace, job_name) (
                (
                  max by (namespace, job_name) (kube_job_status_start_time)
                  * on (namespace, job_name) group_left (owner_name)
                    max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
                )
                < on (namespace, owner_name) group_left ()
                max by (namespace, owner_name) (
                  label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.+)")
                )
              )
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Job 실패: {{ $labels.namespace }}/{{ $labels.job_name }}"
              description: "Job이 실패한 뒤 15분이 지나도록 **복구되지 않았습니다** — 전용 staleness 알림이 없는 정기 작업의 실패입니다. CronJob 소유 Job은 그 실패 이후 한 번이라도 성공하면 자동으로 해소되므로, 이 알림이 살아 있다는 것은 마지막 성공이 이 실패보다 앞선다는 뜻입니다(단발 Job은 해소 재료가 없어 계속 발화합니다)."
          # ★★ 위 KubeJobFailed 억제가 **구조적으로 삼키는 영역**을 잡는 짝 알림이다(S-6 후속).
          #    CronJob 주기 P가 위 룰의 `for:`(900s)보다 짧으면 실패 Job은 최대 P초 만에 억제되므로
          #    `for:`를 **원리적으로 채우지 못한다** → 실패↔성공이 교대하는 만성 flapping은 영구 무성이다.
          #    라이브 사각지대: adguard-rewrite-reconciler(P=600, 하트비트 임계 1800=3주기)와
          #    gha-liveness-exporter(P=1800, 임계 5400=3주기). 전자는 *.home split-horizon rewrite가
          #    절반의 시간 stale인데 모든 알림이 초록이었다. (digest-exporter는 임계가 1.5주기라 잡힌다.)
          # ★ 왜 성공 기반 지표로 못 닫는가(기각한 대안): 교대 실패에서 `time() - last_success`는 주기가
          #    일정한 **톱니파**다. 임계를 어디 두든 그 위에 머무는 구간이 P보다 짧아 `for:`를 못 채우고,
          #    P 아래로 낮추면 정상 동작에서도 매 주기 발화한다 — 단발 miss와 지속 flapping을 가르는
          #    성분이 그 신호에 없다. KSM에 `kube_cronjob_status_last_failed_time`도 없다(실측).
          #    ⇒ 실패를 **사건으로 세는 것**이 유일한 경로다.
          # ★ 관측 창은 `failedJobsHistoryLimit`다 — 임계 2를 세려면 그 값이 **2 이상**이어야 한다.
          #    digest-exporter·gha-liveness-exporter가 1이었고 이 작업에서 2로 올렸다. 이 전제는
          #    tests/gates/test_cronjob-flapping.bats가 룰 임계와 각 CronJob spec을 **레포에서 계산해**
          #    강제한다(하드코딩 목록이 레포와 어긋나는 클래스를 되풀이하지 않는다).
          # ★★ 세는 대상은 **"실패했다가 복구된"** 실행뿐이다(마지막 `and` 절 = KubeJobFailed 억제 조건과
          #    동일한 부등식). 그래서 두 룰은 같은 신호 위에서 **정확히 상보적**이다:
          #      KubeJobFailed  = 해소되지 **않은** 실패가 있다        → "지금 고장인가"
          #      CronJobFlapping = 해소**된** 실패가 창 안에 N회 있다   → "자주 깨지는가"
          #    ⚠️ 이 절이 없으면 **연속 미해소 실패에서 두 알림이 동시에 발화**한다. Alertmanager가
          #      alertname으로 그룹핑하므로 텔레그램 알림이 2건 가고, 알림 노이즈를 줄이려던 작업이
          #      새 노이즈를 만든다(적대적 리뷰 R-2가 지목). 상보성은 회귀 레그가 락한다.
          # ★ 창(2h)의 하한은 **`2 × 주기 + for`**다 — 교대 실패는 실패 간격이 **2주기**이므로, 창이 그보다
          #    좁으면 두 번째 실패가 나타나는 바로 그 순간 첫 번째가 창 밖으로 밀려 count가 2에 **영원히
          #    도달하지 못한다**(적대적 리뷰 R-1: 창 1h + gha-liveness 주기 1800s에서 실제로 그랬다 —
          #    실패 간격 3600s가 창 3600s와 정확히 같아 이 알림이 그 워크로드를 원리적으로 못 봤다).
          #    현행 하한: gha-liveness(1800s) → 2×1800+900 = 4500s < 7200s ✓. 이 부등식은
          #    tests/gates/test_cronjob-flapping.bats가 대상 CronJob마다 레포에서 계산해 강제한다.
          # ★ **주기 > 창인 저빈도 CronJob은 대상 밖**이다(창 안에 2회가 물리적으로 불가능 — 일 1회
          #    백업류는 전용 staleness 알림이 지킨다).
          # ★ 단발 실패는 이 룰 소관이 아니다(임계 2) — 그건 KubeJobFailed가 보고 후속 성공에 해소된다.
          #    회귀 게이트 L7이 같은 픽스처로 역할 분리를 증명한다(flapping 발화 ↔ KubeJobFailed 침묵).
          - alert: CronJobFlapping
            expr: |
              count by (namespace, owner_name) (
                max by (namespace, job_name) (kube_job_failed{condition="true", namespace!~"kube-system|kube-public|kube-node-lease"} == 1)
                * on (namespace, job_name) group_left (owner_name)
                  max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
                and on (namespace, job_name) (
                  (time() - max by (namespace, job_name) (kube_job_status_start_time)) < 7200
                )
                and on (namespace, job_name) (
                  (
                    max by (namespace, job_name) (kube_job_status_start_time)
                    * on (namespace, job_name) group_left (owner_name)
                      max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
                  )
                  < on (namespace, owner_name) group_left ()
                  max by (namespace, owner_name) (
                    label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.+)")
                  )
                )
              ) >= 2
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "CronJob 반복 실패: {{ $labels.namespace }}/{{ $labels.owner_name }}"
              description: "최근 2시간 안에 **실패했다가 복구된** 실행이 2회 이상입니다 — 매번 다음 주기에 되살아나더라도 자주 깨지고 있습니다. KubeJobFailed는 실패마다 후속 성공에 억제되므로 이 상태를 원리적으로 볼 수 없습니다(주기가 그 룰의 for:보다 짧을 때). 실패 원인이 간헐적 의존성(DNS·네트워크·레지스트리)인지 확인하세요. 관측 창은 해당 CronJob의 failedJobsHistoryLimit이며, 그 값이 2 미만이면 이 알림은 그 워크로드를 볼 수 없습니다."
          # 워크로드-불가용(NotReady) — Deployment Available=False. 구독 라벨 없는 플랫폼 컴포넌트
          # (files·adguard·homepage)의 1차 실패모드(재시작 없는 NotReady)는 PodCrashLooping·TargetDown·
          # ArgoCD on-health-degraded 어디에도 안 잡히던 공백(M13). Available 조건은 KSM이 Deployment에만
          # 노출하고 honor_labels로 namespace가 실제값 → 시스템 ns 블랙리스트로 전 워크로드 커버.
          # status="false"==1이 not-available(condition×status 매트릭스). files /readyz 저하(스토리지)도 여기서 페이징.
          - alert: WorkloadUnavailable
            expr: kube_deployment_status_condition{condition="Available", status="false", namespace!~"kube-system|kube-public|kube-node-lease"} == 1
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "워크로드 불가용: {{ $labels.namespace }}/{{ $labels.deployment }}"
              description: "Deployment가 10분 이상 Available=False입니다(NotReady 파드가 minAvailable 미달) — 재시작이 없어 CrashLoop/OOM 알림에 안 잡히는 실패모드입니다. files는 /readyz 스토리지 저하, 그 외는 probe/스케줄/이미지를 확인하세요."
      - name: deadmanswitch
        rules:
          - alert: Watchdog
            expr: vector(1)
            labels: { severity: none }
            annotations:
              summary: "Watchdog: 알림 파이프라인 정상 동작 중."
              description: "항상 발화하는 이 알림은 vmalert→Alertmanager→deadmanswitch(webhook)→healthchecks.io 경로의 생존만 증명합니다(healthchecks.io에서 이 알림의 부재가 곧 page). ⚠️ Telegram 전송은 증명하지 않는다 — Watchdog는 deadmanswitch로만 라우팅됨."
