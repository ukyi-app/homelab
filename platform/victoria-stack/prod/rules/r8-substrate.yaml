apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules-r8
  labels: { vmalert-rule: "true" }
data:
  r8.yaml: |
    groups:
      - name: substrate
        rules:
          # ── 기판 핀 ↔ 라이브 드리프트의 **주기** 신호 (ADR-0007 결정 2 형태) ────────────────────
          # 병: `infra/k3s-bootstrap/versions.env`와 `storage/local-path-provisioner.yaml`은
          # `SSOT: seed-only`다 — 핀은 **재구축 목표값이지 현재 라이브 값이 아니고**, 적용자는
          # owner-local `k3s-install.sh`/`apply-storage.sh`뿐이다(ArgoCD·워크플로 소비자 0건).
          # 그 규약의 대조자는 `verify-cluster.sh` [6][10][11] 셋인데 **owner가 손으로 돌릴 때만 돈다.**
          # 한편 Renovate는 주 1회 핀을 올린다 → 상주 신호가 없으면 "핀은 목표값"이라는 규약이
          # 조용히 **영구 드리프트**가 된다. 실측 2026-09-03: 라이브 k3s `v1.36.2+k3s1` vs 핀
          # `v1.36.3+k3s1` · provisioner `v0.0.36` vs `v0.0.37` — 어느 것도 신호를 내지 않았다.
          #
          # ★ 그래서 이 두 룰은 **머지 직후 실제로 발화하는 것이 정상이다**(오늘 라이브가 핀보다 낡았다).
          #   해소는 owner가 `make up`(또는 `apply-storage.sh` + `k3s-install.sh`)으로 수렴할 때다.
          #
          # ⚠️ `for: 24h`는 핀 bump PR 머지 → owner 재수렴 사이의 **정상 지연**을 흡수하는 값이다.
          #    짧게 잡으면 Renovate PR을 머지할 때마다 페이징이 되어 알림 피로가 되고, 그러면 규약이
          #    아니라 알림이 꺼진다. severity도 같은 이유로 warning이다 — 이건 고장이 아니라 거리다.
          #
          # ⚠️ **helper digest([11] 축)는 여기 없다.** `LOCAL_PATH_HELPER_IMAGE`는 provisioner
          #    ConfigMap의 `data` 안 문자열이고 그 이미지는 mkdir/rm 하는 **일시 파드**로만 뜬다 —
          #    KSM은 ConfigMap `data` 값을 메트릭으로 내보내지 않고, 일시 파드는 스크레이프 주기에
          #    잡히지 않는다. 그 축은 `verify-cluster.sh` [11]의 손 실행으로 남는다(런북 참조).
          #
          # ⚠️ 룰 안의 두 리터럴은 손 사본이 아니라 **등식으로 잠겨 있다** —
          #    `tests/gates/test_vmalert-config.bats`가 versions.env의 `K3S_VERSION`,
          #    `infra/k3s-bootstrap/storage/local-path-provisioner.yaml`의 이미지 태그와 대조한다.
          #    그리고 Renovate가 이 파일을 versions.env와 **같은 customManager**로 매치하므로
          #    (renovate.json의 두 customManager `managerFilePatterns`에 이 파일이 있다) 핀 bump PR이
          #    두 자리를 함께 올린다 — 안 그러면 그 PR이 등식 bats에서 red가 된다.
          #    ⚠️ 다만 **storage 매니페스트의 태그는 그 매니저 밖이다**(일부러 — 넣으면 그 파일의
          #    tag-only 참조가 renovate 소유로 읽혀 `policy/image-ownership.json`의 무소유 선언이
          #    죽은 선언으로 red가 된다. 실측 2026-09-03). 그 자리(매니페스트 ↔ versions.env)는
          #    `test_06-storage-manifests.bats`가 지고 owner가 손으로 맞춘다 — 알려진 잔여다.
          #
          # ⚠️ KSM `--resources` 화이트리스트에 `nodes`·`pods`가 **둘 다** 있어야 이 두 시리즈가 존재한다
          #    (`kube-state-metrics.yaml`의 args ↔ ClusterRole 등식 — test_automount.bats가 강제).
          #    2026-09-03 실측으로 둘 다 있다(변경 불필요).
          - alert: SubstrateK3sPinDrift
            # kube_node_info의 `kubelet_version`은 k3s 릴리스 태그 그대로다
            # (라이브 실측 2026-09-03: `kubelet_version="v1.36.2+k3s1"`).
            expr: |
              kube_node_info{kubelet_version!="v1.36.3+k3s1"}
            for: 24h
            labels: { severity: warning }
            annotations:
              summary: "k3s 라이브 버전이 핀과 갈렸다: {{ $labels.node }} = {{ $labels.kubelet_version }}"
              description: "노드의 kubelet 버전이 `infra/k3s-bootstrap/versions.env`의 `K3S_VERSION` 핀과 다릅니다. 이 핀은 **재구축 목표값**이라 갈렸다는 것 자체가 고장은 아니지만, 닫지 않으면 재구축/DR에서 오늘 검증하지 않은 버전으로 올라갑니다. 수렴은 owner-local입니다: `cd infra/k3s-bootstrap && ./k3s-install.sh` 후 `./verify-cluster.sh`([6]이 이 축입니다). ⚠️ 단일 노드라 짧은 apiserver 다운을 동반하니 백업 CronJob 창을 피하세요. 절차 전문은 런북 `docs/runbooks/host-substrate.md`. 핀 bump 직후라면 24시간 안에 수렴하면 이 알림은 저절로 해소됩니다."
          - alert: SubstrateProvisionerPinDrift
            # `image_spec`은 **매니페스트에 적힌 문자열 그대로**이고 `image`는 레지스트리 접두가 붙는다
            # (라이브 실측 2026-09-03: image_spec="rancher/local-path-provisioner:v0.0.36" ·
            #  image="docker.io/rancher/local-path-provisioner:v0.0.36"). 등식 대상은 전자다 —
            # 후자를 쓰면 리터럴에 `docker.io/`를 손으로 붙여야 하고 그 접두가 상류 규약에 매인다.
            expr: |
              kube_pod_container_info{namespace="local-path-storage", container="local-path-provisioner", image_spec!="rancher/local-path-provisioner:v0.0.37"}
            for: 24h
            labels: { severity: warning }
            annotations:
              summary: "local-path-provisioner 라이브 이미지가 핀과 갈렸다: {{ $labels.pod }} = {{ $labels.image_spec }}"
              description: "local-path-provisioner 파드의 이미지가 `infra/k3s-bootstrap/storage/local-path-provisioner.yaml`의 태그 핀과 다릅니다(핀의 freshness 소유자는 `versions.env`의 `LOCAL_PATH_PROVISIONER_VERSION`). 수렴은 owner-local이고 재실행 안전합니다: `cd infra/k3s-bootstrap && ./apply-storage.sh` 후 `./verify-cluster.sh`([10]이 이 축입니다). ⚠️ helper 이미지 digest([11])는 이 알림이 **보지 못합니다** — ConfigMap data 안 문자열이라 KSM에 없습니다. 같은 재수렴에서 함께 적용되지만 확인은 [11]의 손 실행뿐입니다. 절차 전문은 런북 `docs/runbooks/host-substrate.md`."
