apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules-r4
  labels: { vmalert-rule: "true" }
data:
  r4.yaml: |
    groups:
      - name: storage-backup
        rules:
          # 디스크 포화 = PVC 포화: 모든 PV가 hostPath(local-path provisioner)라 per-PVC 쿼터·kubelet_volume_stats가
          # 원천 부재다(hostPath는 MetricsProvider 미구현 → kubelet volume stats 영구 0건 — 라이브 검증). standard SC
          # PVC(pg-1 PGDATA/WAL·adguard·vmsingle·vlogs)는 전부 루트 fs '/'(btrfs /dev/vdb1, ~224GiB 실측)를 쿼터 없이 공유하므로
          # '/' 포화 = 모든 standard PVC 동시 위험. node_filesystem 절대값으로 3티어(조기 warning/추세/critical) 감시한다.
          # mountpoint="/"는 정확일치 — '/run/k3s/.../shm'·tmpfs·virtiofs(/mnt/mac) 노이즈를 배제하는 단일 btrfs series.
          # (bulk-ssd를 node_filesystem으로 직접 재지 않는 이유가 국면마다 다르다: OrbStack 시절엔 virtiofs
          #  /mnt/mac 하위라 VM node-exporter가 별도 series를 못 만들었고, **국면 A(D4 한시)에는 bulk가 루트 LV의
          #  bind 마운트라 애초에 같은 fs**다. 어느 쪽이든 in-cluster 신호는 du exporter의 statfs가 유일하다.
          #  국면 B(2TB M.2)에서는 /mnt/bulk가 진짜 별도 디바이스라 node_filesystem series가 생긴다 — 그때
          #  여기에 티어를 추가할 수 있다. 미마운트의 권위 backstop은 LocalBasebackupStale(27h)이
          #  아니라 **vmsingle-data-bulk가 bulk 위에 있다는 결합**이다: 미마운트면 TSDB가 kubelet이
          #  만든 root 0755 빈 디렉토리에 쓰지 못해 CrashLoop -> vmalert가 Watchdog을 평가하지 못함
          #  -> alertmanager deadmanswitch ping 단절 -> healthchecks.io가 약 4분 안에 페이징한다.
          #  LocalBasebackupStale(27h)은 그보다 하루 늦은 부수 신호일 뿐이다. 같은 이유로 in-cluster
          #  `absent(node_filesystem…{mountpoint="/mnt/bulk"})` 룰은 이 시나리오에서 **평가 주체가
          #  죽어** 발화하지 못한다 — 마운트-특정 신호를 원하면 오프-노드여야 한다.)
          - alert: StandardSSDWarning
            expr: |
              (node_filesystem_avail_bytes{mountpoint="/"}
               / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
            for: 15m
            labels: { severity: warning, disk: standard }
            annotations:
              summary: "내장 SSD 여유 공간 15% 미만(조기 경보)"
              description: "standard SC 백킹 fs(루트 /, btrfs ~224GiB)가 차오릅니다 — pg-1/WAL·vmsingle·vlogs·adguard PVC가 쿼터 없이 공유하므로 한 워크로드 폭증이 전체를 위협합니다. 최대 소비자(보통 CNPG WAL 적체 또는 vmsingle/vlogs retention)를 확인하세요."
          - alert: StandardSSDFilling
            expr: |
              (node_filesystem_avail_bytes{mountpoint="/"}
               / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
            for: 10m
            labels: { severity: critical, disk: standard }
            annotations:
              summary: "내장 SSD 여유 공간 10% 미만"
              description: "standard SC 디스크 여유 부족 — Postgres PGDATA/WAL과 관측 스택이 임박한 위험입니다. 즉시 최대 소비자를 정리하거나 retention을 낮추세요."
          - alert: StandardSSDFillingTrend
            expr: |
              predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 48*3600) < 0
               and (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.50
            for: 30m
            labels: { severity: warning, disk: standard }
            annotations:
              summary: "내장 SSD 48시간 내 포화 추세"
              description: "최근 6시간 기울기로 외삽하면 루트 fs 여유가 48시간 내 소진될 추세입니다(현재 여유 50% 미만) — 절대 임계(15%/10%) 도달 전 대응 창입니다. WALArchiveStalled가 동반 발화하면 WAL 적체가 원인일 가능성이 큽니다."
          # WAL 볼륨 충전 — per-PVC 포화의 유일한 직접 신호다. hostPath라 kubelet은 못 주지만 CNPG가 WAL 볼륨의
          # 논리 용량(value="volume_size"=10Gi PVC)과 현재 사용량(value="size")을 직접 export한다(라이브 검증).
          # disk:pgwal로 분리 라벨링 — 루트 fs critical(disk:standard)이 이 신호를 inhibit하면 안 된다(루트 fs 포화의
          # 원인이 WAL 적체일 때 가려지면 트리아지가 어려워진다). cnpg_collector_pg_wal은 deprecated된 backup/archive
          # 메트릭 계열이 아니라 살아있는 WAL-size collector다(인시던트 #13/#14와 무관).
          # ⚠️ 양변의 max by(namespace,pod)는 필수 — on()이 instance를 매칭키에서 빼는데 양변 raw 셀렉터엔
          # instance가 남아 있어, 재부팅으로 CNPG exporter 파드 IP가 바뀌면 구/신 시계열이 staleness(~5분)
          # 동안 공존해 (namespace,pod)당 2 시계열이 된다 → many-to-many → "duplicate time series on the
          # left side of /" HTTP 422 → 룰 평가 실패 → VmalertUnhealthy 오발화(라이브 검증). 사전 집계로
          # 그룹당 1 시계열을 보장해 1:1 매칭을 강제한다. pg는 단일 파드라 max는 항등이며, 다중이어도
          # filling(>0.70) 방향에선 보수적(더 큰 값 채택 → 참양성 유지). cf. ContainerMemoryNearLimit 선례.
          - alert: WALVolumeFilling
            expr: |
              (max by (namespace, pod) (cnpg_collector_pg_wal{value="size"})
               / on(namespace, pod) max by (namespace, pod) (cnpg_collector_pg_wal{value="volume_size"})) > 0.70
            for: 15m
            labels: { severity: warning, disk: pgwal }
            annotations:
              summary: "CNPG WAL 볼륨 70% 초과"
              description: "pg-1의 WAL 디렉토리가 WAL 볼륨(10Gi)의 70%를 넘었습니다 — 아카이빙 지연이나 checkpoint 문제로 WAL이 적체되는 신호입니다. hostPath라 쿼터 강제는 없으나, 계속 차면 루트 fs(StandardSSDFilling)와 RPO(WALArchiveStalled)를 위협합니다."
          # 백업 생존성: 로컬 CNPG base-backup CronJob(M4)은 매일 완료되어야 한다.
          - alert: LocalBasebackupStale
            expr: |
              (time() - max(kube_job_status_completion_time{job_name=~"cnpg-local-basebackup.*"})) > 100000
              or absent(kube_job_status_completion_time{job_name=~"cnpg-local-basebackup.*"})
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "로컬 base-backup이 stale(27시간 초과)이거나 누락됨"
              description: "복원 사본 2(로컬 외장 SSD, ~1.9T 실측)가 위험합니다 — 드라이브 미마운트 또는 CronJob 실패."
          # 백업 생존성: 가장 최근 R2 백업이 계속 갱신되어야 한다 (오프사이트 사본 3).
          # barman-cloud plugin이 채우는 메트릭을 읽는다 — in-tree cnpg_collector backup 게이지는
          # CNPG 1.27+plugin에서 deprecated라 항상 0이다(백업 정상이어도 영구 stale로 오발화).
          # 값 0(아직 백업 없음)은 time()-0이 거대해 fail-loud로 발화 — 의도된 fail-closed.
          - alert: R2BackupStale
            expr: |
              (time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)) > 100000
              or absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "R2 오프사이트 백업이 stale(27시간 초과)이거나 누락됨"
              description: "오프사이트 사본 3(Cloudflare R2)가 최신 백업을 만들지 못했습니다 — DR 사본이 노후화되고 있습니다."
          # 백업 생존성: R2로의 WAL 아카이빙이 오류를 내면 안 된다 (RPO ≈ 5분 목표).
          # pg_stat_archiver 타임스탬프를 비교한다 — in-tree cnpg_collector archive 게이지는
          # plugin 환경에서 export되지 않아(부재) 원식은 영원히 no-data였다.
          # absent() 가드: 스크레이프 전손 시(이번 인시던트의 실패모드) stall이 빈 벡터로 조용히
          # 묻히지 않고 페이징되도록. (완전히 wedge된 아카이버의 backstop은 R2BackupStale.)
          - alert: WALArchiveStalled
            expr: |
              cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
              or absent(cnpg_pg_stat_archiver_last_archived_time)
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "R2로의 WAL 아카이빙 정지(RPO 위험)"
              description: "마지막 실패 아카이브가 마지막 성공 아카이브보다 최신입니다 — 오프사이트 WAL 스트림이 끊겼고 5분 RPO 목표를 충족하지 못합니다."
          # 복원 drill 생존성: M4의 반복(주간) 복원 drill이 restore_drill_last_success_timestamp를
          # 단발 샘플로 vmsingle에 직접 import한다. instant query는 staleness 윈도(~분) 밖의 단발 샘플을
          # 못 봐서, bare absent()는 주간 push 직후 수 분을 빼면 항상 참이 된다(영구 오발화 — 라이브 확인).
          # 임계값(700000s=8.1일)보다 넓은 [10d] 윈도의 last_over_time으로 마지막 성공 push를 찾아 판정한다.
          - alert: CNPGRestoreDrillStale
            expr: |
              (time() - last_over_time(restore_drill_last_success_timestamp[10d])) > 700000
              or absent(last_over_time(restore_drill_last_success_timestamp[10d]))
            for: 30m
            # ⚠️ **severity는 owner 판단으로 warning에 둔다**(4h repeat). critical로 올리면
            #    repeat_interval이 1h가 되어 하루 24건이다 — 이 조건은 "데이터를 잃었다"가 아니라
            #    "복원이 미검증이다"이고, 그 값매김은 알림 피로와의 거래라 owner 몫이다.
            # 🔴 **산술 정정(2026-08-18)**: 이전 주석은 임계 8.1일을 "주간 실행 **2회** 실패 이후"라고
            #    적었으나 틀렸다. 주기가 7일이므로 700000s(=8.1019일)는 **1회 실패 + 약 26.4시간**에
            #    발화한다(for: 30m 포함 약 26.9시간). 같은 레포의 restore-drill-script.sh(약 5.9일간
            #    이미 발화) · restore-drill-cronjob.yaml · traps-detail.md는 모두 1회 기준으로 계산한다 —
            #    이 줄만 outlier였다. **즉시성은 이전 서술의 약 2배다.**
            # ✅ **재판정 종결(2026-08-20): warning 유지.** 위 정정된 산술(1회 실패 + 약 26.9시간) 위에서
            #    다시 내린 결론이다 — 이전 결론은 오염된 입력 위에 있었으므로 그대로 승계하지 않았다.
            #    근거: (a) 이 알림이 실질적 유일 채널인 것은 맞지만, 그 사실이 요구하는 것은 **누락 방지**이지
            #    반복 빈도가 아니다. 26.9시간이면 4h repeat로 하루 안에 여러 번 눈에 띈다. (b) 조건은
            #    "데이터를 잃었다"가 아니라 "복원이 미검증이다" — critical의 1h repeat(하루 24건)는
            #    알림 피로만 늘리고 대응 속도를 못 바꾼다(대응이 주간 drill 주기에 묶여 있다).
            # ⚠️ **레버를 혼동하지 마라.** 반복 빈도를 올리고 싶으면 `severity`가 아니라 이 알림 전용
            #    라우트의 `repeat_interval`이 정확한 레버다. severity를 critical로 올리면 alertmanager.yaml의
            #    `severity = critical` 라우트(repeat_interval 1h)를 **통째로** 상속받으므로, 빈도만이 아니라
            #    이 알림의 분류까지 바뀐다 — 원하는 것이 빈도뿐이라면 과잉이고 되돌리기도 어렵다.
            labels: { severity: warning }
            annotations:
              summary: "CNPG 복원 drill이 최근에 성공하지 못함"
              description: >-
                반복 R2 복원 drill(M4)이 최신 성공 timestamp를 푸시하지 못했습니다 — 유일하게 검증된 복원 경로가
                깨졌을 수 있습니다(R1). ⚠️ 이 알림이 **실질적으로 유일한 채널**입니다: 실패한 drill Job은
                in-band 무음입니다(KubeJobFailed가 `pg-restore-drill.*`를 명시 제외 + backoffLimit 0이라
                재시도도 없음). 남는 신호는 스크립트 자신의 Telegram FAIL(best-effort `|| true`)과 이것뿐입니다.
                확인 순서: (1) `kubectl -n database get job -l cnpg.io/job=restore-drill`로 최근 실행,
                (2) 그 파드 로그의 `[drill]` 줄 — 특히 `pre-flight`와 `첫 폴링에 이미 healthy`,
                (3) 고아 잔여 `kubectl -n database get cluster,pvc | grep pg-restore-drill`.
                ✅ 2026-08-18(PR #487)부터 이 drill은 **RPO까지 증명**합니다 — 라이브에 마커 1행을 INSERT하고
                pg_switch_wal 후 그 WAL이 아카이브되기를 기다린 뒤, 복구본에서 그 마커가 보여야 PASS입니다.
                따라서 FAIL은 "복구 경로가 깨졌다"뿐 아니라 **"아카이브가 뒤처졌다"**일 수도 있습니다 —
                로그의 MARKER_ID / MARKER_WAL / rpo attempt 줄로 구분하세요. PASS 본문의 "RPO N초"가
                실측 지연이며, RPO-WAIT-TIMEOUT 토큰은 아카이브가 대기 창 안에 못 따라온 것입니다(중단 아님).
                ⚠️ 이 문구는 #487 이전 판에서 "canary 행 수 비교는 상수라 RPO는 별개"라고 적고 있었습니다 —
                #487이 r4 룰을 함께 고치지 않아 낡은 채였고 2026-08-18에 정정했습니다.
          # 백업 생존성: 논리 백업(헤지) — pg_dump→R2 CronJob(매일 04:00)이 완료되어야 한다(복원 사본 4).
          # 나머지 3개 백업(로컬 base·R2 barman·복원 drill)은 감시되나 이 4번째만 무감시였다.
          - alert: PgDumpHedgeStale
            expr: |
              (time() - max(kube_job_status_completion_time{job_name=~"pg-dump-hedge-r2.*"})) > 100000
              or absent(kube_job_status_completion_time{job_name=~"pg-dump-hedge-r2.*"})
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "논리 백업(헤지)이 stale(27시간 초과)이거나 누락됨"
              description: "pg_dump 헤지 사본(복원 사본 4, R2 pgdump-nuc/)이 갱신되지 않았습니다 — barman 실패 시 최후 보루입니다. CronJob/연결을 확인하세요."
          # 백업 생존성: 공용 캐시(Valkey) 백업 CronJob(cache-backup, 매일 03:45 KST)이 완료돼야 한다.
          # pg 4사본과 달리 KubeJobFailed(존재-시-발화)만 있어 Job 오브젝트 소실/미스케줄 시 침묵(fail-open)이던
          # 비대칭 해소 — pg staleness 패턴 복제(absent 가드 fail-closed). 캐시는 LRU 휘발 티어라 warning.
          # ⚠️ absent 설계: cache-backup CronJob은 platform/cache/prod 상주 컴포넌트라 항상 존재하고, valkey
          #    인스턴스 0개여도 discover 루프가 0회 돌고 성공 완료해 completion_time을 갱신한다(backup-cronjob.yaml)
          #    → absent()는 CronJob 자체 소멸(=cache 컴포넌트 철거) 시에만 발화. 그 경우 이 룰도 제거한다
          #    (죽은 알림 금지 규약). 신규/DR 배포 첫 실행 전(03:45 KST 이전) 일시 absent는 pg 4룰과 동일 수용.
          - alert: CacheBackupStale
            expr: |
              (time() - max(kube_job_status_completion_time{job_name=~"cache-backup.*"})) > 100000
              or absent(kube_job_status_completion_time{job_name=~"cache-backup.*"})
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "캐시 백업이 stale(27시간 초과)이거나 누락됨"
              description: "공용 Valkey 백업(cache-backup CronJob → R2)이 갱신되지 않았습니다 — Job 오브젝트 소실/CronJob suspend/미스케줄 가능. last_success.json 신선도는 teardown 시점에만 검사되므로 이 룰이 상시 backstop입니다. 캐시는 LRU 휘발 티어라 warning."
          # files 오프-노드 백업 생존성(H2/M14): 백업 스크립트(scripts/backup-files-data.sh, 일1회)가
          # rsync 성공 시 files_backup_last_success_timestamp를 vmsingle에 단발 import한다. instant query는
          # staleness 윈도(~분) 밖의 단발 샘플을 못 봐 bare absent()가 영구 오발화하므로(CNPGRestoreDrillStale과
          # 동형), [10d] last_over_time으로 마지막 성공을 찾아 임계(100000s≈27.8시간 — 형제 일일 백업 4종과
          # 같은 주기의 1.157배. 산술 근거는 아래 「임계 정정(2026-08-20)」)로 판정.
          # 값 없음(첫 push 전)은 absent가로 fail-loud — 실행자 미enable/미실행을 페이징(백업 필수화 강제).
          #
          # ✅ 국면 A 한시 억제는 국면 B 전환(2026-08-26)과 함께 제거했다 — absent 가지가 다시 살아 있다.
          #   `tests/gates/test_files-backup-phase-a.bats`가 "창이 비면 억제 절도 없다"를 강제한다.
          #
          # 🔴 **임계 정정(2026-08-20)**: 이전 값 180000s는 주기(86400s)의 **2.083배**였는데,
          # 형제 일일 백업 4종(LocalBasebackup·R2Backup·PgDumpHedge·CacheBackup)은 전부 100000s
          # = **1.157배**다 — 이것만 아웃라이어였다. 대가는 **1회 실패의 완전 무성 + 페이지 T+50.5h**
          # 였다. 여유 계산: 성공↔성공 최악 간격 = OnCalendar(86400) + RandomizedDelaySec(1800)
          # + TimeoutStartSec(1800) = 90000s < 100000s(여유 2.8h) + `for: 30m`.
          # ⚠️ 그래도 **신선도는 원리적으로 주기보다 빨리 울 수 없다**(배수를 조여도 하한이 1주기다).
          # 1회 실패의 즉시 관측은 아래 `SystemdUnitFailed`가 맡는 **직교 축**이다 — 둘은 대체가 아니다.
          - alert: FilesBackupStale
            expr: |
              (time() - last_over_time(files_backup_last_success_timestamp[10d])) > 100000
              or absent(last_over_time(files_backup_last_success_timestamp[10d]))
            for: 30m
            labels: { severity: critical }
            annotations:
              summary: "files 오프-노드 백업이 stale(≈27.8시간 초과)이거나 없음"
              description: "files-data(비재생성 사용자 데이터)의 2차 매체 사본이 갱신되지 않았습니다 — 백업 실행자 미실행 또는 bulk 매체 미마운트. 매체 유실 시 전손 위험(R2 미사용). scripts/backup-files-data.sh와 그 실행자(systemd `files-data-backup.timer`)를 확인하세요."
          # ── 호스트 systemd 유닛 실패의 **즉시 채널** ────────────────────────────────────────
          # ★ 위 신선도 룰과 **직교 축**이다. 신선도는 "마지막 성공이 언제였나"만 알고, 원리적으로
          #   주기(1일)보다 빨리 울 수 없다 — 배수를 조여도 하한이 1주기라 **1회 실패의 즉시 관측이
          #   구조적으로 불가능**했다. `OnFailure=unit-failure-notify@%n.service`가 실패 즉시
          #   textfile collector 파일을 쓰고 이 룰이 그것을 중계한다.
          #   (digest-exporter의 하트비트 ↔ configured/scraped와 같은 직교 축 관용구.)
          # ★ **rollup이 없는 것이 옳다.** 이 메트릭은 push가 아니라 node-exporter가 파일에서 읽어
          #   내는 **스크레이프** 시계열이라, 파일이 있는 한 매 스크레이프마다 다시 나온다 — push
          #   주기 > instant 룩백으로 생기는 구멍(모드 C)이 원리적으로 없다. rollup을 씌우면 오히려
          #   해소가 윈도만큼 늦어진다.
          # ★ `absent()` 가드를 **의도적으로 달지 않는다**: 이 메트릭의 부재는 "실패가 없었다"와
          #   구별할 수 없다(정상 상태가 곧 부재다). 달면 24/7 오발화가 된다. 공급 경로 자체가 죽는
          #   경우(node-exporter 사망)는 `TargetDown` 소관이고, 백업이 아예 안 도는 경우는 위
          #   FilesBackupStale이 backstop이다 — 세 축이 서로를 덮는다.
          # ★ `< 7200`이 **자기 해소**를 만든다: 실패 2시간 뒤 resolved가 나간다(고쳤다는 뜻이 아니라
          #   "최근 실패가 아니다"라는 뜻이다). 유닛이 계속 실패하면 매 실행마다 값이 갱신돼 재발화한다.
          #   파일을 지우는 주체를 두지 않는 것도 의도다 — 그 주체의 실패가 새로운 무성 경로가 된다.
          # ⚠️ 이 룰은 레포 트리에 선언된 유닛만이 아니라 **`OnFailure=`가 달린 모든 호스트 유닛**을
          #   덮는다. 그 줄이 **없는** 유닛(apt-daily·fstrim·logrotate·unattended-upgrades 등)의
          #   전역 표면은 아래 `SystemdHostUnitFailed`(주기 스윕)가 덮는다 — 둘은 직교다.
          # 🔴 **어느 축도 `Restart=always` 유닛은 못 본다**(라이브 실측 2026-08-20): `k3s.service`는
          #   RestartUSec=5s · StartLimitIntervalUSec=10s · StartLimitBurst=5라 10초 창에 시도가 최대
          #   3회 — 시작 rate limit에 도달하지 못해 `failed`에 **진입하지 않는다**(계속 activating).
          #   그 축은 TargetDown/Watchdog/off-node deadman의 소관이고, systemd 축의 원리적 사각지대다.
          - alert: SystemdUnitFailed
            expr: |
              (time() - systemd_unit_last_failure_timestamp) < 7200
            for: 1m
            labels: { severity: critical }
            annotations:
              summary: "호스트 systemd 유닛 실패: {{ $labels.unit }}"
              description: "호스트 systemd oneshot 유닛이 failed로 끝났습니다 — `journalctl -u {{ $labels.unit }} -n 200`으로 원인을 보세요. 이 알림은 **실패 이벤트 기준**이라 2시간 뒤 자동 해소됩니다(고쳤다는 뜻이 아닙니다). 유닛이 계속 실패하면 매 실행마다 재발화하고, 실행 자체가 멈추면 해당 신선도 알림이 backstop입니다."
          # ── 호스트 systemd **전역** 스윕(주기 축) ────────────────────────────────────────
          # ★ 위 SystemdUnitFailed와 **직교하는 축**이다. 저쪽은 `OnFailure=` 한 줄이 달린 유닛만
          #   덮는 **이벤트** 채널(지연 0 · critical), 이쪽은 `systemctl list-units`를 5분마다 읽는
          #   **상태** 채널(전역 · 지연 ≤1주기)이다. 라이브 실측(2026-08-20): 로드 `.service` 64건 중
          #   `OnFailure=` 보유가 vendor 2건 + 레포 1건뿐 — 나머지가 이 스윕의 존재 이유다.
          # ★ **severity가 warning인 것이 설계다.** 어떤 유닛의 실패가 정말 critical이면 그 유닛
          #   파일에 `OnFailure=unit-failure-notify@%n.service` 한 줄을 넣어 위 축으로 승격한다.
          #   스윕은 폭(coverage), 저쪽은 깊이(즉시성·critical)를 맡는다.
          #   ⚠️ 승격은 **페이지를 늘리지 않는다** — alertmanager.yaml의 unit-scoped inhibit 규칙이
          #      같은 `unit`의 critical로 이 warning을 억제한다(같은 고장에 두 번 페이징하지 않는다).
          # ★ `type=~` 필터의 근거: 라이브 629건의 내역은 mount 225 · device 116 · scope 94 ·
          #   slice 52로 **487건이 kubelet/k3s 트랜지언트**다. `device`(udev 상태)·`scope`(컨테이너
          #   런타임 소유)·`slice`(cgroup)·`target`(항상 결과이지 원인이 아니다)은 호스트의 일이
          #   아니고 그 실패는 k8s 알림들의 소관이다. `mount`는 **남긴다** — `/mnt/bulk`가 그 타입이고
          #   국면 B의 핵심 스토리지다(kubelet subpath mount 실패는 13일 journal에 0건. 노이즈가
          #   관측되면 그때 `unit!~"var-lib-kubelet.+"`가 레버다 — 선제 allowlist는 썩는다).
          # ★ **`and on()` 신선도 게이트가 잔상의 역방향을 닫는다.** 스윕이 죽은 시점에 파일에 failed
          #   시리즈가 남아 있으면 textfile collector가 그것을 영원히 재발행해, 유닛을 고친 뒤에도
          #   이 알림이 **영구 발화**한다. 게이트가 하트비트 3600s를 넘기면 게이지를 버린다.
          #   ⚠️ 3600s는 SystemdSweepStale의 발화 시점(1800 + for 5m = 2100s)보다 **뒤**여야 한다 —
          #      그래야 상태 게이지가 꺼지기 전에 하트비트 알림이 먼저 켜져 **틈이 생기지 않는다.**
          #      tests/gates/test_systemd-failed-sweep.bats가 이 부등식을 강제한다.
          # ★ rollup 없음 — 스크레이프 시계열이라 모드 C 구멍이 원리적으로 없다. `max by`는 rollup이
          #   아니라 **집계**다: node-exporter 파드 재생성으로 instance/pod가 갈리면 같은 unit이 두
          #   시리즈가 되므로(「재부팅 IP churn」) 라벨을 벗겨 알림 identity를 안정시킨다.
          # ★ `absent()` 없음 — "지금 failed인 유닛이 없다"가 곧 이 시리즈의 부재(정상)다.
          #   **미실행**은 아래 SystemdSweepStale이 전담한다(하트비트 ⊥ 상태 게이지 관용구).
          - alert: SystemdHostUnitFailed
            expr: |
              max by (unit, type) (systemd_sweep_unit_failed{type=~"service|timer|socket|path|mount|automount"}) == 1
              and on() ((time() - max(last_over_time(systemd_sweep_last_success_timestamp[2h]))) < 3600)
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "호스트 systemd 유닛이 failed 상태: {{ $labels.unit }}"
              description: "주기 스윕(5분)이 failed 상태인 호스트 유닛을 발견했습니다 — `systemctl status {{ $labels.unit }}` · `journalctl -u {{ $labels.unit }} -n 200`. 고친 뒤에도 유닛은 failed로 남으므로 `systemctl reset-failed {{ $labels.unit }}`까지 해야 다음 스윕(≤5분)에 해소됩니다. 이 유닛의 실패가 즉시 페이징돼야 한다면 유닛 파일에 `OnFailure=unit-failure-notify@%n.service`를 넣어 critical 축으로 승격하세요. ⚠️ `Restart=always` 유닛은 이 축에 원리적으로 잡히지 않습니다(failed 상태에 진입하지 않음)."
          # ── 스윕 하트비트: **0건과 미실행의 구별** ───────────────────────────────────────
          # 🔴 이 알림의 존재 이유가 그 구별이다. textfile collector는 파일이 남아 있는 한 같은 값을
          #   **영원히 재발행**하므로 스윕이 죽어도 `systemd_sweep_units_failed 0`이 계속 나온다 —
          #   **시리즈의 존재는 생존을 증명하지 않는다.** 신선도를 값 안에 실은 타임스탬프만이 그것을
          #   증명한다. 생산자 쪽 짝은 스크립트의 3중 fail-closed다(열거가 붕괴하면 아무것도 쓰지 않고
          #   죽어 이 하트비트가 그 자리에 늙는다).
          # ★ `absent()` 가드는 여기 **필수**다 — 위 SystemdUnitFailed와 정반대 결정이다. 저쪽은
          #   이벤트 메트릭이라 부재가 곧 정상, 여기는 주기 게이지라 부재가 곧 드리프트다.
          #   이벤트 메트릭의 '부재=정상' 논거를 연속 게이지에 복사하지 마라.
          # ★ 모드 D: `in-cluster` + `impossible` → 화이트리스트가 `last_over_time`을 **요구**한다.
          #   `max_over_time`은 값의 전진 점프를 [2h] 래치해 스윕이 살아나도 알림이 안 꺼진다.
          # ★ 임계 1800s 산술: 최악 성공↔성공 간격 = OnCalendar(300) + AccuracySec(30) +
          #   RandomizedDelaySec(30) + TimeoutStartSec(60) = **420s**. 1800s는 4.3배로 노드
          #   재부팅(다운 + k3s/node-exporter 기동 ≈10분)을 페이지 없이 흡수한다.
          # ⚠️ 배선의 마지막 한 줄(`systemctl enable --now systemd-failed-sweep.timer`)을 잊으면
          #   이 알림이 그것을 잡는다 — host-config.sh는 유닛을 설치만 하고 enable하지 않는다(의도).
          - alert: SystemdSweepStale
            expr: |
              (time() - max(last_over_time(systemd_sweep_last_success_timestamp[2h]))) > 1800
              or absent(last_over_time(systemd_sweep_last_success_timestamp[2h]))
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "systemd 전역 실패 스윕 하트비트가 30분+ 침묵 — 호스트 실패 감시 실명 위험"
              description: "systemd-failed-sweep.timer(5분)가 textfile collector에 하트비트를 못 씁니다 — 타이머 미enable/미설치 · 스크립트 fail-closed(열거 붕괴) · textfile 디렉토리 소실. 이 값이 늙으면 SystemdHostUnitFailed의 '0건'은 관측이 아니라 잔상입니다. `systemctl status systemd-failed-sweep.timer systemd-failed-sweep.service`와 `/var/lib/node_exporter/textfile/systemd-failed-sweep.prom`의 mtime을 확인하세요. 배선: sudo infra/k3s-bootstrap/host-config.sh --apply 후 sudo systemctl enable --now systemd-failed-sweep.timer"
          # bulk 티어 용량: 호스트 df를 백업 잡이 함께 push(files_data_bulk_avail/size_bytes).
          #
          # ⚠️ **국면 A 이력(2026-08-17 · 실행자 갱신 2026-08-19 · 해소 국면 B 진입)**: 이 알림의 pusher는
          #   2026-08-19(#506)에 리눅스로 재작성돼 systemd 타이머(`files-data-backup.timer`)로 배선됐다.
          #   **국면 A 동안은** 그 타이머가 enable되지 않아 이 알림이 양변 빈 벡터로 무성이었고, 그 기간의
          #   유일한 생존 신호가 in-cluster 짝 `BulkStorageLow`(du exporter · absent 가드 착용 · 15%)였다.
          #   국면 B 진입으로 타이머가 배선돼 이 알림은 정상 판정 중이다 — 현행 국면의 권위는
          #   `infra/k3s-bootstrap/versions.env`(BULK_MIGRATION_WINDOW_UNTIL)다(수치·상태 복제 금지).
          #   ⚠️ `BulkStorageLow`를 지우거나 약화시키지 마라 — 두 신호는 여전히 서로의 대체가 아니다.
          #   여기 expr은 손대지 않는다(absent 가드를 안 다는 결정은 국면 B에서 여전히 옳다 — 중복 페이지).
          #   아래 rollup 논거는 실행자가 도는 국면(과거·미래) 모두에 유효하므로 그대로 둔다.
          #
          # ★ 양변 rollup은 필수다(맨 참조 금지 — 이게 이 알림이 죽어 있던 이유다). files_data_bulk_*의 pusher는
          #   호스트 systemd 타이머(files-data-backup.timer, scripts/backup-files-data.sh)라 **하루 1회**
          #   (OnCalendar=daily + RandomizedDelaySec=30min) 단발 push다. vmalert instant 질의 룩백은
          #   5m(-datasource.queryStep 기본)뿐이라, 맨 참조하면 시리즈가 하루 1440분 중 **5분만** 보인다
          #   → 30초 평가로 최대 11회 연속 참 → for: 30m이 요구하는 61회 연속에
          #   **구조적으로 도달 불가** → 외장 SSD가 꽉 차도 영원히 무발화(라이브 실측: 마지막 push 후 10.8h에
          #   맨 참조 = 빈 결과, last_over_time [3d] 비율 = 0.9991 — 데이터는 TSDB에 멀쩡히 있고 차이는 rollup뿐).
          #   전문·근거는 `docs/traps-detail.md`(SSOT)의 「push 주기 > instant 룩백 → 룰 시리즈 구멍 → 무발화」.
          #
          # ★ 윈도 [3d] 근거 — 하한: W ≥ 2×push(=2d) — push 1회 누락(백업 1일 스킵)에도 판독이 살아 있어야 한다.
          #   상한: W ≤ 7×push(=7d) — 매체 교체·언마운트 후 stale한 낮은 값이 무한 페이징하지 않도록 유계
          #   (유계 staleness 계약). 이 경계는 관측으로 닫히지 않으므로(둘 다 발화 레그를 통과시킨다) 회귀 게이트
          #   `tests/gates/vmalert-bulkssd-firing-e2e.sh`의 preflight가 `2×push ≤ W ≤ 7×push`를 산술로 강제한다.
          #   ⚠️ 이 알림은 **ratio/threshold**(값=수준)라 라벨-값 상태 게이지(r6 ImageDigestDrift)의 `W < for`
          #      상한 제약은 **적용되지 않는다**(그 룰의 W는 구 상태를 되살리는 래치라 for:보다 작아야 한다 —
          #      혼동 주의). 여기서 rollup이 되살리는 건 "마지막으로 측정된 여유율"이고, 그건 값 자체다.
          #
          # ★ absent() 가드를 **의도적으로 달지 않는다**: 실행자/push의 **전면** 실패(미실행·크래시·push 불가)는
          #   같은 스크립트가 함께 발행하는 files_backup_last_success_timestamp를 통해 위 FilesBackupStale
          #   (severity critical, absent 착용)이 fail-loud로 페이징한다. 여기 또 달면 동일 고장에 중복 페이지가 난다.
          #   ⚠️ **국면 A 동안은 그 backstop 논거가 성립하지 않았다** — FilesBackupStale의 absent 가지가
          #   한시 억제돼 있었기 때문이다. 그 기간의 bulk 결핍 신호는 `BulkStorageLow` 하나뿐이었다.
          #   (국면 B 진입으로 그 억제는 제거됐고 backstop 논거가 복귀했다 — 국면의 권위는 versions.env다.)
          #   ⚠️ **다만 그 백스톱은 부분 고장(값 오염)까지는 못 잡는다** — 정직한 한계이고, 여전히 그렇다.
          #   하트비트("실행자가 돌았다")와 용량("여유가 이만큼이다")은 서로 다른 명제라서, 전자가 참인 채로
          #   후자만 썩는 구간은 원리적으로 이 알림의 사각이다.
          #   ✅ **2026-08-19에 쓰는 쪽을 고쳤다**(backup-files-data.sh push_metrics): df 값이 숫자이고 size>0일
          #   때만 `files_data_bulk_{avail,size}_bytes` **2줄을 함께** 싣고, 파싱이 깨지면 **하트비트 1줄만**
          #   보내고 요란한 WARN을 낸다. 이전 판은 `${avail:-0}`/`${size:-0}`로 **0을 지어내** 이 알림이
          #   "여유 0%"로 **오귀속 페이지**를 내게 했다(진실은 "df가 실패했다"). 이제 그 경로는 닫혔다 —
          #   df가 깨지면 이 알림은 **울리지 않고**(시리즈가 안 들어온다) 로그의 WARN이 진실을 말한다.
          #   ⚠️ 그 대가는 **침묵**이다: 하트비트는 계속 나가므로 FilesBackupStale도 초록이고, "용량을 오래
          #   못 봤다"를 따로 우는 알림은 없다. 오귀속 페이지보다 낫다는 판단이지만 공짜는 아니다.
          #   ⚠️ 하트비트를 용량 옆으로 옮겨 **함께 참으면** 안 된다 — 백업은 실제로 성공했는데 df만 깨진
          #   경우에 FilesBackupStale이 거짓 red를 낸다(더 나쁜 오귀속이다).
          #   ⚠️ expr에 absent()나 `size > 0` 가드를 다는 우회도 여전히 금지 — 전자는 중복 페이지,
          #     후자는 **진짜 결핍(avail=0)** 까지 억제해 이 알림을 다시 죽인다.
          - alert: FilesBulkSSDLow
            expr: |
              (last_over_time(files_data_bulk_avail_bytes[3d])
                / last_over_time(files_data_bulk_size_bytes[3d])) < 0.10
            for: 30m
            labels: { severity: warning, disk: bulk }
            annotations:
              summary: "bulk 티어 여유 공간 10% 미만(호스트 df 판독)"
              description: "files-data·pg-basebackup-local이 공유하는 bulk 티어의 여유가 부족합니다 — files 쓰기 실패(/readyz NotReady) 및 로컬 base-backup 적체 위험. ⚠️ 매체는 국면에 따라 다르다: 국면 A(versions.env의 BULK_MIGRATION_WINDOW_UNTIL이 비어 있지 않으면 진행 중)에는 /mnt/bulk가 루트 LV의 bind 마운트라 **이 수치는 루트 파일시스템 여유와 같고**, 원인은 '외장 디스크'가 아니라 루트 포화다(StandardSSDWarning/Filling 동반 발화가 정상). 진짜 별도 2TB M.2는 국면 B부터다. 최대 소비자를 정리하세요."
          # per-PVC du exporter(pvc-du-exporter.yaml, 일 1회 05:00 KST) 생존 — pvc_du_last_success_timestamp를
          # 단발 push한다. instant query는 staleness 윈도(~분) 밖 단발 샘플을 못 보므로(CNPGRestoreDrillStale과
          # 동형) [3d] last_over_time으로 마지막 성공을 찾아 판정. 값 없음(첫 push 전)은 absent가로 fail-loud.
          - alert: PvcDuExporterStale
            expr: |
              (time() - last_over_time(pvc_du_last_success_timestamp[3d])) > 172800
              or absent(last_over_time(pvc_du_last_success_timestamp[3d]))
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "per-PVC 용량 수집이 48시간 이상 정체"
              description: "pvc-du-exporter CronJob이 pvc_dir_size_bytes/storage_tier_* 갱신에 실패했습니다 — bulk(virtiofs) 용량의 유일 in-cluster 신호가 소실됩니다(W3 선행). CronJob/마운트/경로를 확인하세요."
          # 외장 bulk-ssd의 in-cluster 용량 신호(W3 관측 데이터 이전의 선행 조건, F18) — du exporter가 파드
          # 내부 df로 티어 용량을 push한다. FilesBulkSSDLow(호스트 백업 타이머의 df push, <10%)와 물리 매체는
          # 같으나 ⚠️ 의도적 이원화(중복 아님): (a) 독립 liveness — 호스트 백업이 멈춰도(FilesBulkSSDLow capacity
          # 판독이 freeze) 이 in-cluster 신호는 생존, (b) 티어 스캔 무결성 증거(F20 — pvc_dir_size_bytes{tier="bulk"}
          # 동반)로 df 경로가 진짜 bulk 트리를 본다는 것을 증명. 15%로 FilesBulkSSDLow(10%)보다 먼저 발화(early).
          # 일 1회 push라 last_over_time [3d] 윈도 필수(instant staleness 함정).
          - alert: BulkStorageLow
            expr: |
              (last_over_time(storage_tier_avail_bytes{tier="bulk"}[3d])
                / last_over_time(storage_tier_size_bytes{tier="bulk"}[3d])) < 0.15
              or absent(last_over_time(storage_tier_avail_bytes{tier="bulk"}[3d]))
            for: 30m
            labels: { severity: warning, disk: bulk }
            annotations:
              summary: "bulk-ssd 티어 여유 15% 미만 또는 in-cluster 신호 소실"
              description: "du exporter가 본 bulk 티어 여유가 15% 미만이거나 storage_tier_avail_bytes{tier=bulk} 신호가 소실됐습니다 — W3에서 관측 TSDB가 bulk에 얹히므로 이전 착수 전 반드시 여유를 확인하세요(FilesBulkSSDLow의 in-cluster 짝). ⚠️ 국면 A(D4 한시 — versions.env의 BULK_MIGRATION_WINDOW_UNTIL이 비어 있지 않으면 진행 중) 동안 bulk는 루트 LV의 bind 마운트라 **이 수치는 루트 파일시스템 여유와 같습니다**. 그 기간에는 StandardSSDWarning/Filling과 같은 사건에 함께 발화하는 것이 정상이며, 원인은 '외장 디스크'가 아니라 루트 포화입니다."
          # grafana data emptyDir 사용률(meta-observability 02) — 정적 예산 게이트(측정 앵커,
          # test_grafana_plugin_budget.bats)가 못 보는 축: 태그 고정 상태에서 preinstall 자동갱신이
          # 페이로드를 키우는 성장(13.1.0→13.1.3 사이 +10.5%·zipkin 신규가 커밋 0건 — 실측). du
          # exporter의 지문 스캔(일 1회)이 push하는 실사용량을 선언 sizeLimit과 대조한다. 임계 0.67 =
          # 정적 마진 정책(MARGIN 3/2 = 1.5배)의 역수 반올림 — 이 선을 넘으면 마진이 무너지기 시작한
          # 것(원 사고는 0.997에서 kubelet eviction 루프). 임계↔마진 정책의 결박은
          # test_grafana_plugin_budget.bats가 정적으로 강제한다(리뷰 M7 — 한쪽만 바꾸면 red).
          # [3d] last_over_time은 일 1회 push의 모드 C 관례(위 룰들과 동일).
          # ⚠️ absent 절을 달지 않는다(의도) — 메트릭 부재는 grafana 미가동(exporter의 0건 미방출
          #   설계)일 수 있어, absent를 달면 grafana 다운을 "예산 부족"으로 **오귀속**한다(위
          #   DigestExporterStale의 오귀속 금지 규약과 동일). exporter 사망은 PvcDuExporterStale이,
          #   grafana 다운은 TargetDown이 잡는다 — 역할 분리.
          # ⚠️ 분모 536870912 = grafana.yaml data emptyDir sizeLimit(512Mi)의 바이트 리터럴 — 두 값의
          #   일치는 test_grafana_plugin_budget.bats가 정적으로 결박한다(선언만 바꾸면 그 게이트가 red).
          # (disk 라벨을 달지 않는다 — alertmanager inhibit 2번(disk 축)의 사정권 밖 유지, spec 결정.)
          - alert: GrafanaPluginBudgetLow
            expr: |
              (last_over_time(grafana_data_dir_size_bytes[3d]) / 536870912) > 0.67
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "grafana 플러그인 페이로드가 emptyDir 예산의 67%를 초과"
              description: "grafana data emptyDir 실사용량(du exporter 지문 스캔)이 선언 sizeLimit(512Mi)의 66%를 넘었습니다 — 정적 마진 1.5배가 무너지기 시작한 것입니다(원 사고는 99.7%에서 eviction 루프). preinstall 자동갱신 성장이 원인일 수 있으니 test_grafana_plugin_budget.bats 헤더의 재측정 절차를 돌고 sizeLimit 상향(768Mi 후보)을 검토하세요."
          # 지문 스캔 자기관측 — grafana_data_dir_size_bytes는 지문 0건에서 **의도적 미방출**이고
          # (grafana 미가동 오귀속 방지), 위 GrafanaPluginBudgetLow는 absent 절이 없다. 그 둘에
          # 초록 하트비트까지 겹치면 지문 붕괴(grafana.db 파일명 변경·emptyDir→PVC 전환·kubelet
          # 레이아웃 변화)가 **영구 무성**이 된다 — 죽은 알림 클래스의 생산자 쪽 변종(01 리뷰 H2,
          # 린터는 룰 expr만 봐 원리적으로 못 잡는다). 그래서 매치 수 게이지는 무조건 방출되고,
          # 여기서 0의 지속을 페이징한다. grafana 자체 다운이면 TargetDown류와 동반 발화가 정상.
          # ⚠️ absent 가지는 "exporter가 돌았다"(하트비트 실재)에 조건화한다(리뷰 M8) — 무조건
          #   absent면 첫 배포 후 du 크론이 돌기 전(최대 24h)에 오발화한다. AlertPipelineWriteStale의
          #   absent 거부 규약과 같은 뿌리의 반대 해법: 여기는 게이지 소실 자체가 표적이라 absent가
          #   필요하고, 조건화가 무이력 구간만 걷어낸다. for 30m은 de-flap(e2e 발화 레그가 잰다).
          - alert: GrafanaDuFingerprintLost
            expr: |
              last_over_time(grafana_du_fingerprint_matches[3d]) == 0
              or (absent(last_over_time(grafana_du_fingerprint_matches[3d]))
                  and on() (last_over_time(pvc_du_last_success_timestamp[3d]) > 0))
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "grafana emptyDir 지문 스캔이 대상을 찾지 못함"
              description: "du exporter의 grafana.db 지문 매치가 0건(또는 게이지 자체 소실)입니다 — GrafanaPluginBudgetLow가 무측정 상태입니다. grafana 미가동이면 동반 알림을, 가동 중이면 DB 파일명/볼륨 변경·kubelet 경로를 확인하세요."

          # ★ digest-exporter 자기관측(감시견의 감시견) — ImageDigestDrift(r6)의 **먹이 공급선**이 죽으면
          #   그 알림이 조용히 실명한다(ghcr_latest_digest 시리즈가 끊긴 뒤 [15m] 윈도가 만료되면 좌변이 빈
          #   벡터 → 드리프트가 있어도 무발화). exporter의 조용한 실패 3모드(크론 미실행·push 실패·파드 기동
          #   실패)는 전부 **초록 Job(exit 0)** 이라 KubeJobFailed가 원리적으로 못 잡는다.
          #   → exporter가 같은 curl 페이로드에 하트비트(digest_exporter_last_success_timestamp)를 함께 싣고,
          #     그 침묵을 여기서 페이징한다. 하트비트 의미론은 **"push 경로 생존"이지 "수집 성공"이 아니다**
          #     (skopeo 전건 실패에도 하트비트는 나간다 — 수집 실패는 별개 알림의 소관, 역할 분리).
          #
          # ★ 왜 별도 alertname인가: 감시 대상 룰(ImageDigestDrift)에 per-rule absent()를 덧붙이면 exporter
          #   사망을 "이미지 불일치"로 **오귀속**한다(잘못된 원인 페이지 + TargetDown 중복) — 레포 규약이자
          #   tests/gates/test_vmalert-config.bats가 강제하는 사항.
          #
          # ★ rollup [2h] 필수 — 10분 크론 push(600s) > vmalert instant 룩백(5m)이라 맨 참조는 매 주기 시야에서
          #   사라져 for: pending이 영구 리셋된다(모드 C — ImageDigestDrift가 라이브 60일 무발화였던 바로 그
          #   함정). absent도 반드시 absent(last_over_time(...)) 형태여야 한다(맨 absent()는 같은 이유로 무력).
          #   ⚠️ 윈도 **상한은 없다** — 타임스탬프-값 하트비트에서 윈도는 "마지막 하트비트를 어디까지 뒤질까"라는
          #   탐색 지평일 뿐이다. r6 ImageDigestDrift의 `W < for:` 상한은 **라벨-값 상태 게이지 전용**이며 여기
          #   복사하면 누락 내성만 잃는다(docs/traps-detail.md 「rollup 윈도 상한 — 상태 게이지 vs 하트비트 비대칭」).
          #
          # ★ T=900s · for:15m 분할이 load-bearing하다(총 30분 = 발화 시각 T0+30분은 고정):
          #   for(900s) > **강제된** 최악 첫 하트비트 지연 840s = cron(600s) + activeDeadlineSeconds(180s)
          #   + 컨트롤러 여유(60s) → 최초 배포 시 이력이 없어 absent가 즉시 pending에 들어가도 첫 하트비트가
          #   반드시 for: 안에 도착해 리셋된다 → **롤아웃이 원인인 거짓 페이지가 구조적으로 불가능**하다.
          #   그 840s 상한은 추정이 아니라 digest-exporter.yaml이 매니페스트로 강제한다(concurrencyPolicy:
          #   Replace + activeDeadlineSeconds + skopeo/curl 타임아웃). 누가 크론을 늘리거나 데드라인을 키우면
          #   tests/gates/vmalert-digest-stale-firing-e2e.sh의 preflight가 exit 2로 먼저 죽는다.
          #   누락 내성은 분할과 무관 — 어느 분할이든 30분 연속 staleness(=3주기 누락)에서만 발화한다(플랩 없음).
          - alert: DigestExporterStale
            expr: |
              (time() - last_over_time(digest_exporter_last_success_timestamp[2h])) > 900
              or absent(last_over_time(digest_exporter_last_success_timestamp[2h]))
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "digest-exporter 하트비트가 30분+ 침묵 — ImageDigestDrift 실명 위험"
              description: "digest-exporter CronJob(*/10)이 vmsingle에 하트비트를 못 보냅니다 — 크론 미실행/파드 기동 실패/push 경로 장애. ghcr_latest_digest 공급이 끊기면 ImageDigestDrift가 조용히 실명해(기록 룰 [15m] 윈도 만료) 이미지 드리프트를 놓칩니다. Job 로그와 vmsingle 도달성을 확인하세요."
          # ★ digest-exporter 수집 카운트(US2) — 하트비트와 **직교하는 축**이다. 하트비트(위)는 "push 경로
          #   생존"만 증명하므로, push는 살아 있는데 앱 일부(또는 전부)의 skopeo 조회가 실패하는 **부분 고장**
          #   (GHCR 장애·ghcr-read 토큰 만료)은 여전히 조용하다 — run.sh가 `[ -z "$DIGEST" ] && continue`로 그
          #   앱을 스킵할 뿐이라 해당 앱이 ImageDigestDrift 감시에서 **소리 없이 빠진다**. exporter가 같은
          #   페이로드에 configured(설정 앱 수)/scraped(수집 성공 수)를 함께 싣고 그 격차를 여기서 페이징한다.
          #
          # ★ bare끼리의 1:1 매치라 on()/ignoring()이 **불필요**하다(쓰면 모드 B — raw 피연산자 422 위험).
          #   양변 모두 rollup 필수: 10분 push(600s) > vmalert instant 룩백(5m)이라 한쪽만 맨 참조여도 그 변이
          #   주기 후반에 사라져 비교가 통째로 빈 벡터가 된다(모드 C — 조용한 무발화).
          #
          # ★ absent() 가드를 **의도적으로 달지 않는다**: 전면 침묵(크론 미실행·push 사망)은 바로 위
          #   DigestExporterStale이 이미 fail-closed로 잡는다. 여기 또 달면 같은 고장에 두 번 페이징한다
          #   (FilesBulkSSDLow가 명시적으로 거부한 패턴).
          #
          # ★ **zero-app은 의도된 공백이다**(owner 결정 ④ — "왜 안 잡히지"로 헤매지 말 것): 마지막 앱을
          #   teardown하면 APPS가 빈 문자열이 되어 configured=0·scraped=0이 push되고, `0 < 0`은 거짓이라 이
          #   알림은 **침묵한다**. 앱이 0개면 감시할 대상 자체가 없으므로 그것이 정답이다 — `<`를 `<=`로 바꾸거나
          #   `configured == 0` 가드를 덧붙이지 마라(둘 다 vmalert-digest-stale-firing-e2e.sh의 L6에서 죽는다).
          #
          # ★ for: 30m = 3주기 관용 — 단발 GHCR 블립(레지스트리 순간 5xx·네트워크 flap)을 흡수한다. 부트스트랩엔
          #   무관하다(absent 가지가 없어 두 시리즈가 없는 동안 expr이 빈 벡터 → 무발화 = 설계상).
          - alert: DigestExporterScrapeIncomplete
            expr: |
              last_over_time(digest_exporter_apps_scraped[2h])
                < last_over_time(digest_exporter_apps_configured[2h])
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "digest-exporter가 설정된 앱 중 일부의 digest 수집에 실패"
              description: "digest-exporter가 APPS에 설정된 앱 수보다 적은 수만 GHCR에서 digest를 가져왔습니다 — GHCR 장애이거나 ghcr-read 토큰이 만료됐을 가능성이 큽니다. 수집에서 빠진 앱은 ImageDigestDrift 감시가 조용히 실명하므로(그 앱만 시리즈가 끊깁니다) 이미지 드리프트를 놓칩니다. CronJob 로그에서 실패한 앱과 skopeo 오류를 확인하고 ghcr-read 자격을 점검하세요."
          # adguard *.home rewrite 셀프힐 리컨실러(메타갭 ① W2-A) 생존 — 리컨실러가 10분마다
          # adguard_rewrite_reconcile_timestamp를 push한다. 침묵(30분+ = 3주기 누락)이면 *.home 드리프트가
          # 무방비가 되므로 페이징. 10분 주기 push라 last_over_time[2h] 윈도 + absent가 fail-closed(push-metric 함정).
          # (도메인은 스토리지 아님이나 push-metric staleness 패턴상 r4에 함께 둔다 — CNPGRestoreDrillStale과 동형.)
          - alert: AdGuardRewriteReconcilerStale
            expr: |
              (time() - last_over_time(adguard_rewrite_reconcile_timestamp[2h])) > 1800
              or absent(last_over_time(adguard_rewrite_reconcile_timestamp[2h]))
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "adguard rewrite 리컨실러가 30분+ 침묵 — *.home 드리프트 무방비"
              description: "adguard-rewrite-reconciler CronJob이 하트비트를 못 보냅니다 — traefik-ts IP 변경/DR 재구축 시 *.home.ukyi.app이 죽은 IP로 해석될 위험. CronJob/RBAC/AdGuard 자격을 확인하세요."
          # 통지 분리(F13): DNS 변이 파드엔 발송 자격 0. 실제 수렴(FIXED=1)이 있었을 때만 리컨실러가 fix
          # 타임스탬프를 push하고, 이 info 룰이 alertmanager→telegram으로 중계한다(발송 자격은 alertmanager에만).
          # F19: no-op 런은 fix 샘플을 안 써서 last_over_time이 직전 fix로 유지 — 20분 창 후 자동 해소.
          # ⚠️ drift-fix 이벤트당 telegram 2건(ℹ️ 정보 발화 + 20분 후 🔵 해소, send_resolved). 드리프트는 DR/proxy
          # 재등록 등 IP 변경 시에만이라 저빈도 → 전용 send_resolved:false receiver(telegram 템플릿 40줄 중복) 대신 수용.
          - alert: AdGuardRewriteDriftFixed
            expr: |
              (time() - last_over_time(adguard_rewrite_last_fix_timestamp[2h])) < 1200
              and last_over_time(adguard_rewrite_last_fix_timestamp[2h]) > 0
            labels: { severity: info }
            annotations:
              summary: "adguard *.home rewrite 드리프트가 자동 수렴됨"
              description: "리컨실러가 traefik-ts 실 IP로 rewrite를 복구했습니다 — DR 재구축/IP 변경이 있었는지 확인하세요."
          # ── 시드 대조(ADR-0007 결정 2) ────────────────────────────────────────────────────────
          # adguard 본체 설정의 SSOT는 **라이브**다(사람이 UI에서 만지는 것이 실사용). git의 ConfigMap은
          # initContainer `cp -n`이 쓰는 첫 부팅 시드일 뿐이라, "시드가 라이브와 다르다"는 결함이 아니라
          # **재구축 시 되돌아갈 거리**다 → severity는 warning이고 처방은 "시드를 라이브에 맞춰 갱신"이다.
          # 라이브를 git으로 되돌리는 수렴은 하지 않는다(그 방향이 ADR이 명시적으로 기각한 것이다).
          # ⚠️ 이름 표기는 `AdGuard*` 하나다(제품 표기 그대로 — 2026-09-03 통일). 형제 두 룰이 쓰던 구
          #    표기 `Adguard*`는 남아 있지 않다. `tests/gates/test_vmalert-config.bats`의 표기 레인이
          #    룰 파일 전수에서 이 전칭을 문다 — 새 알림을 `Adguard*`로 적으면 그 레인이 red다.
          # ⚠️ rollup 함수 선택이 의미의 전부다. 이건 **값-게이지**(0/1)이고 시리즈 정체성(section 라벨)은
          #    고정이라 `last_over_time`이 최신 샘플을 돌려준다 → 드리프트가 해소되면 즉시 0이 되어 래치가
          #    없다. `max_over_time`이면 해소된 1이 윈도(2h)만큼 부활해 `for: 1h`를 넘겨 영구 오발화한다
          #    (「rollup 윈도 상한 — 상태 게이지 vs 하트비트 비대칭」의 상태-게이지 쪽).
          # ⚠️ 윈도 [2h] ≥ push 주기 10분 — 맨 참조면 매 주기 후반에 시리즈가 vmalert 눈에서 사라져
          #    `for:` pending이 리셋된다(모드 C).
          - alert: AdGuardSeedDrift
            expr: |
              last_over_time(adguard_seed_drift[2h]) > 0
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "adguard 시드가 라이브 설정과 갈렸다: {{ $labels.section }}"
              description: "git의 adguard ConfigMap(`platform/adguard/prod/adguardhome.yaml`) 중 `{{ $labels.section }}` 절이 라이브 AdGuard 설정과 다릅니다. 이 ConfigMap은 첫 부팅 `cp -n` 시드라 라이브가 권위이고, 지금 당장 고장난 것은 없습니다 — 문제는 **DR 재구축 시 여기 적힌 값으로 되돌아간다**는 것입니다(ADR-0007 결정 2). 처방은 시드를 라이브에 맞춰 갱신하는 것입니다: `kubectl -n edge port-forward svc/adguard-ui 8080:80` 후 해당 control 엔드포인트(dns_info · querylog/config · stats/config)의 값을 읽어 시드에 반영하고 PR로 머지하세요. 라이브를 시드 값으로 되돌리지 마세요. ⚠️ **단 두 섹션은 처방이 반대입니다** — `dns.ratelimit`과 `dns.use_private_ptr_resolvers`는 시드 값이 사고(#493 — ratelimit 20에서 40건 중 20건 무응답 · PTR 포워딩으로 에러의 78%가 로그 오염)를 닫은 값이라, 여기서 갈렸다면 **라이브를 시드 값(100 / false)으로 되돌리세요**. 시드를 라이브에 맞추는 PR은 `platform/adguard/prod/test_adguard_querylog.bats`에서 red가 납니다."
          # 대조 스텝 자신의 생존 — 리컨실러 하트비트(AdGuardRewriteReconcilerStale)와 **별개 축**이다.
          # 대조는 실패해도 잡을 죽이지 않으므로(실패 격리) KubeJobFailed·리컨실러 하트비트 어느 것도
          # 그 침묵을 잡지 못한다. 관측 실패(API 불가·응답 형태 변경·시드 파싱 실패)는 게이지 1이 아니라
          # **아무 push 없음**으로 표현되므로, 이 부재 알림이 그 tri-state의 세 번째 값을 읽는 유일한 눈이다.
          # 10분 주기 push라 last_over_time[2h] 윈도 + absent가 fail-closed. 임계 1800s = 3주기 누락.
          - alert: AdGuardSeedDriftCheckStale
            expr: |
              (time() - last_over_time(adguard_seed_drift_checked_timestamp_seconds[2h])) > 1800
              or absent(last_over_time(adguard_seed_drift_checked_timestamp_seconds[2h]))
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "adguard 시드 대조가 30분+ 침묵 — 시드 드리프트가 무관측"
              description: "adguard-rewrite-reconciler의 시드 대조 스텝이 하트비트를 못 보냅니다. 대조는 rewrite 수렴과 실패 격리돼 있어 잡은 초록일 수 있습니다 — 파드 로그의 `시드 대조 실패` 줄을 보세요(AdGuard control API 불가 · 응답 형태 변경 · /seed 마운트 부재 · 시드 파싱 실패). 이 침묵 동안 AdGuardSeedDrift는 원리적으로 발화하지 못합니다."
