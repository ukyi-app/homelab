apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-state-metrics }
# ⚠️ **`configmaps`·`secrets`를 다시 넣지 마라**(2026-09-02 제거 — 상류 기본 ClusterRole의 복사본이었다).
#    k8s의 `list secrets`는 메타데이터가 아니라 **Secret data 전체**를 돌려주므로, 이 SA 토큰 하나로
#    sops-age·sealed-secrets sealing key·cloudflared 토큰·pg-superuser·ghcr-pull이 한 번에 열린다
#    (sealing key는 git에 있는 전 SealedSecret의 영구 복호화 능력으로 승격된다).
#    그런데 이 레포는 `kube_secret_*`/`kube_configmap_*`를 **어디서도 쓰지 않는다**(레포 전역 grep 0건 —
#    실사용 kube_* 접두는 pod/job/cronjob/deployment/statefulset/node/endpoint 계열뿐). 즉 순수 노출면이었다.
# ⚠️ 이 목록과 아래 Deployment의 `--resources=`는 **같은 집합이어야 한다**. 한쪽만 지우면 KSM reflector가
#    403 실패를 영구 로깅한다(반대로 ClusterRole에만 남은 grant는 요청조차 안 하는 죽은 권한이다 —
#    serviceaccounts·replicationcontrollers·limitranges·horizontalpodautoscalers·poddisruptionbudgets·
#    volumeattachments가 그랬고 같은 커밋에서 정리했다).
#    가드: platform/victoria-stack/prod/test_automount.bats(부재 단언 + 양성 대조 + 두 목록의 등식)
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "resourcequotas", "persistentvolumeclaims", "persistentvolumes", "namespaces", "endpoints"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: observability }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kube-state-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      # ⚠️ automountServiceAccountToken을 false로 바꾸지 마라 — 이 워크로드의 존재 이유가 k8s API를
      #    읽어 오브젝트 상태를 메트릭으로 내보내는 것이다(kube_* 전 계열의 유일한 생산자).
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1@sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
          args: ["--port=8080", "--telemetry-port=8081", "--resources=cronjobs,daemonsets,deployments,endpoints,jobs,namespaces,nodes,persistentvolumeclaims,persistentvolumes,pods,replicasets,resourcequotas,services,statefulsets,storageclasses"]
          env:
            - { name: GOMEMLIMIT, value: "57MiB" }
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry, containerPort: 8081 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            # right-size 2026-09-01: A′ peak 34.1Mi(14일, 파드-세대 붕괴, 30초 해상도) × 2.0x = 80Mi(2.35x).
            limits: { memory: 80Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports:
    - { name: http-metrics, port: 8080, targetPort: 8080 }
