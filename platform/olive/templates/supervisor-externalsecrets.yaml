{{- /*
감독이 받는 비밀 둘. 값은 Infisical에만 있다. 실행기에는 모델 자격 Secret을 붙이지 않는다(실행마다 감독이 연결로 하나만 넘긴다).
복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다.

켜기 전 사람 작업(값은 어디에도 출력하지 않는다):
  1. Infisical /olive/supervisor/INSTRUCTION_SIGNING_KEY: 올리브 전용 Ed25519 개인 키(PKCS#8 PEM). 짝 공개 키는 실행기에 준다.
  2. Infisical /olive/supervisor/<supervisor.registry.key>: 실행기 등록표 문서(D-63·D-70, 공개 키와 맡은 일, 판 번호). 비밀은 아니지만
     관리자가 Infisical에 적기로 정했다(D-63). 문서의 environment는 supervisor.registry.environment와 같아야 한다.
  3. Infisical /bot-accounts/<supervisor.account.name>/CLAUDE_CODE_OAUTH_TOKEN: 올리브 전용으로 발급한 구독 장기 토큰(accounts.md §6.2·§6.4).
     VM(homelab-dev)에는 실제 토큰을 넣지 않고 같은 모양의 가짜 문자열을 둔다(platform/root/templates/sandbox.yaml 주석과 같은 이유).
키가 하나라도 없으면 그 ExternalSecret이 Ready=False(Degraded)라 olive Application이 wave 1에서 멈추고 Deployment wave(2)로 넘어가지 않는다.
함정: 매핑은 spec.data 항목으로만 둔다. 계정 관리 CLI(accounts.md §7)가 remoteRef.key로 매핑을 판정할 자리다.
wave 1: 같은 Application의 store(wave 0)가 Ready가 된 뒤, Deployment(wave 2)보다 먼저 Secret이 있어야 볼륨이 붙는다.
Secret의 수명(두 ExternalSecret 공통, ESO ownership-deletion-policy 문서):
  creationPolicy Owner: Secret에 ownerReference가 달려, ExternalSecret이 지워지면(prune 포함) Secret도 Kubernetes GC로 지워진다.
  deletionPolicy Retain: Infisical 쪽 원본 키가 없어졌을 때 Secret을 지우지 않고 마지막 값을 둔다(ExternalSecret은 SecretSyncedError).
  ExternalSecret 삭제 뒤 Secret을 남기는 설정이 아니다.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $t := include "olive.supervisorTarget" . | fromYaml }}
{{- $account := required "supervisor.account.name is required (account alias under Infisical /bot-accounts/<name>)" .Values.supervisor.account.name }}
{{- /* 빈 값은 templates/supervisor-deployment.yaml의 required가 렌더를 멈춘다. 여기서 막지 않는 이유: 이 파일이 Deployment보다 먼저 렌더돼 image.digest 같은 앞선 원인을 가린다. */}}
{{- $registryKey := .Values.supervisor.registry.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: olive-signing-key
  namespace: {{ $t.namespace }}
  labels:
    {{- include "olive.labels" $t | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-olive
  target:
    name: olive-signing-key
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /olive/supervisor/<키>. Secret 키 = Infisical 키. 감독이 읽는 파일 이름은 볼륨 items가 정한다(templates/supervisor-deployment.yaml).
    - secretKey: {{ .Values.supervisor.signingKey.key }}
      remoteRef:
        key: {{ .Values.supervisor.signingKey.key }}
---
# 실행기 등록표. 상대 키라 store의 secretsPath(/olive/supervisor) 아래만 읽는다. 파일 이름은 볼륨 items가 정한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: olive-registry
  namespace: {{ $t.namespace }}
  labels:
    {{- include "olive.labels" $t | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-olive
  target:
    name: olive-registry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # quote: 키 이름이 TRUE·NULL이어도 문자열로 남게 한다(볼륨 items의 key와 같은 이유).
    - secretKey: {{ $registryKey | quote }}
      remoteRef:
        key: {{ $registryKey | quote }}
---
# 고정 계정 하나(O09 할 일 8). 계정별 원본 경로에서 이 계정의 것만 옮긴다(accounts.md §6.2). 절대 키라 store의 secretsPath를 쓰지 않는다.
# 계정을 바꾸면 Secret 이름이 바뀌어 옛 계정의 값을 읽을 일이 없다. 옛 ExternalSecret이 prune되면 옛 Secret도 함께 GC된다(creationPolicy Owner).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: olive-account-{{ $account }}
  namespace: {{ $t.namespace }}
  labels:
    {{- include "olive.labels" $t | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-olive
  target:
    name: olive-account-{{ $account }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: {{ .Values.supervisor.account.key }}
      remoteRef:
        key: /bot-accounts/{{ $account }}/{{ .Values.supervisor.account.key }}
{{- end }}
