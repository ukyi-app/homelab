{{- /*
역할별 작업자 실행기(D-37, supervisor.md §9.2). targets.yaml의 kind executor인 줄마다 하나. 실행기는 감독에 먼저 붙어
연결을 유지하고(D-55) 듣는 포트가 없다. 모델 자격 Secret을 붙이지 않는다. 자격은 실행마다 감독이 그 연결로 하나만 넘긴다.
명령·이미지·볼륨·argv·환경을 지시에서 받지 않으므로 역할은 이 파드의 env OLIVE_ROLE(targets.yaml roles)로만 정해진다.

파드는 컨테이너 둘이다(D-100). 제어 executor(uid 65532)가 TLS·저장소·대리 소켓을 쥐고, 역할 role(uid·gid 10002, D-103)은
대리(olive-agent)가 PID 1이라 그 아래에서 역할 프로그램을 띄운다(D-102). 둘 사이의 길은 agent-link 폴더의 경로 유닉스 소켓 하나다.
경계는 마운트와 PID 공간이다. 비밀·PVC 볼륨은 executor에만 붙이고 shareProcessNamespace를 두지 않는다. 한 파드라 네트워크 공간은
같다: 역할 쪽에서도 감독 주소에 닿지만 mTLS 키가 executor에만 있어 감독이 받지 않는다. CI(tools/ci/olive.ts olive-executor-split)가 렌더에서 본다.
env 이름은 ukyi-app/olive README "작업자 실행기 진입점"의 환경 표와 같다. 이 차트가 아직 그 환경을 다 주지 않아(효과 서명 키,
역할 프로필, 인스턴스, 정책 revision) 실행기는 감독에 붙기 전에 정한 코드로 끝난다.
*/}}
{{- $sup := include "olive.supervisorTarget" . | fromYaml }}
{{- $trust := include "olive.trustEnabled" . }}
{{- range (include "olive.targets" . | fromYaml).items }}
{{- if eq .kind "executor" }}
{{- $values := index $.Values.executors .id }}
{{- $tlsSecret := include "olive.tlsSecretName" (dict "root" $ "tls" $values.tls) }}
{{- $role := index .roles 0 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .deployment }}
  namespace: {{ .namespace }}
  labels:
    {{- include "olive.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Git 값은 늘 0이다(D-38, 감독과 같은 이유). 켜는 것은 CLI이고 targets.yaml의 start가 true인 대상만 켠다.
  replicas: 0
  # 한 파드씩(B-07 작업자 1). RollingUpdate면 교체 중 두 파드가 함께 떠 olive-limits ResourceQuota에 걸린다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "olive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olive.labels" . | nindent 8 }}
    spec:
      {{- include "olive.podSecurity" . | nindent 6 }}
      # 대리 실행 파일을 agent-bin에 놓는다(D-103). 제어와 같은 olive.image라 대리와 실행기가 늘 같은 판이다.
      # 이미지가 distroless라 셸·cp가 없어 설치는 bun 진입점이 한다(원본 /opt/olive/olive-agent → /opt/olive-agent/olive-agent).
      # 함정: 그 진입점이 없는 옛 olive digest면 init이 Module not found로 끝나 파드가 뜨지 않는다. 켜는 PR의 digest에 둘 다 있어야 한다.
      initContainers:
        - name: olive-init
          image: {{ include "olive.image" $ }}
          command: ["bun", "src/main/agent-install.ts"]
          {{- include "olive.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $values.init.resources | nindent 12 }}
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/olive-agent
      containers:
        - name: executor
          image: {{ include "olive.image" $ }}
          command: ["bun", "src/main/executor.ts"]
          env:
            # v1 역할 이름이다. 대상 id(reader 등)를 넘기면 실행기가 81로 끝난다.
            - name: OLIVE_ROLE
              value: {{ $role | quote }}
            # 감독의 고정 Service 주소. DNS 없이 붙는다(templates/networkpolicy-executors.yaml).
            - name: OLIVE_SUPERVISOR_ADDR
              value: {{ printf "%s:%d" $.Values.supervisor.clusterIP (int $.Values.supervisor.port) | quote }}
            # 주소가 IP라 TLS에서 확인할 이름을 따로 준다. 감독 인증서의 이름과 같아야 한다(인증서 작업).
            - name: OLIVE_SUPERVISOR_SERVER_NAME
              value: {{ printf "supervisor.%s.svc" $sup.namespace | quote }}
            # 감독 인증서의 URI SAN. 감독 Certificate와 같은 helper(olive.pki.uri)에서 읽어 값이 한 곳에서만 정해진다.
            - name: OLIVE_SUPERVISOR_URI
              value: {{ include "olive.pki.uri" $sup | quote }}
            # 볼륨 바로 아래가 아니라 그 아래 store를 준다. local-path는 볼륨 폴더를 0777로 만들고, 실행기(ExecutorStore.open)는
            # 없는 폴더만 0700으로 만든다. 이 경로를 바꾸면 빈 폴더라 새 저장소 ID가 생긴다(D-75 재등록).
            - name: OLIVE_STORE_DIR
              value: {{ printf "%s/store" $values.store.mountPath | quote }}
            {{- if $tlsSecret }}
            - name: OLIVE_TLS_DIR
              value: {{ $values.tls.mountPath | quote }}
            {{- end }}
            {{- if $trust }}
            - name: OLIVE_TRUST_DIR
              value: /run/olive/trust
            {{- end }}
            # 대리가 붙는 소켓. 실행기가 이 경로에서 듣고 역할 컨테이너가 같은 경로로 붙는다(두 컨테이너의 agent-link 마운트 아래).
            - name: OLIVE_AGENT_SOCKET
              value: /run/olive/agent/agent.sock
          # 프로브는 두지 않는다. 실행기는 듣는 포트가 없고(D-55) 건강 확인 방식은 아직 정하지 않았다(spec.md §5.3).
          {{- include "olive.containerSecurity" . | nindent 10 }}
          resources:
            {{- include "olive.resources" (dict "root" $ "target" .) | nindent 12 }}
          volumeMounts:
            {{- if $tlsSecret }}
            - name: tls
              mountPath: {{ $values.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $trust }}
            - name: trust
              mountPath: /run/olive/trust
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
            # 실행기가 소켓을 만드는 자리라 쓰기다(지난 기동의 소켓을 지우고 새로 bind한다).
            - name: agent-link
              mountPath: /run/olive/agent
            # 상태 저장소는 이 실행기(제어) 컨테이너에만 붙인다. 다른 uid의 역할 컨테이너(D-100)에 붙이지 않는다
            # (모델이 저장소 ID·nonce·영수증을 고치지 못하게). CI(tools/ci/olive.ts olive-executor-store)가 컨테이너 이름으로 본다.
            - name: store
              mountPath: {{ $values.store.mountPath }}
        # 역할 컨테이너. 프로브·lifecycle·ports를 두지 않는다(D-74: kubelet이 이 컨테이너 안에서 무엇도 실행하지 않게).
        # 함정: 대리는 Bun 런타임째 컴파일한 glibc 동적 링크 파일이라 역할 이미지는 glibc 계열이어야 한다(D-107). musl 이미지면 exec부터 실패한다.
        - name: role
          image: {{ include "olive.roleImage" (dict "root" $ "role" $role) }}
          command: ["/opt/olive-agent/olive-agent"]
          env:
            - name: OLIVE_AGENT_SOCKET
              value: /run/olive/agent/agent.sock
            # 대리 안의 Bun과 glibc 로더가 대리 코드보다 먼저 읽는 이름이다. 쿠버네티스는 이미지 ENV를 물려주므로 빈 값으로 덮는다
            # (빈 값이면 대리가 그대로 뜬다). 값이 있으면 BUN_OPTIONS는 대리 전에 다른 코드를 돌리거나 판만 찍고 끝내고, BUN_BE_BUN은
            # 대리 대신 bun으로 돌고, LD_PRELOAD는 다른 라이브러리를 먼저 싣는다.
            # 함정: BUN_JSC_*는 빈 값이면 bun이 1로 끝나 덮을 수 없다. 그래서 역할 이미지의 ENV에 BUN_·LD_로 시작하는 이름과
            # NODE_CHANNEL_FD가 없어야 한다(values.yaml roleImages 주석). 이 차트의 CI는 렌더만 보므로 이미지 ENV는 고를 때 확인한다.
            - name: BUN_OPTIONS
              value: ""
            - name: BUN_BE_BUN
              value: ""
            - name: LD_PRELOAD
              value: ""
          securityContext:
            runAsUser: 10002
            runAsGroup: 10002
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $values.role.resources | nindent 12 }}
          volumeMounts:
            - name: agent-bin
              mountPath: /opt/olive-agent
              readOnly: true
            - name: agent-link
              mountPath: /run/olive/agent
              readOnly: true
            - name: role-tmp
              mountPath: /tmp
      volumes:
        {{- if $tlsSecret }}
        # 0444: 실행기 파드에는 fsGroup이 없어 0440이면 uid 65532가 읽지 못한다. 넓어지는 것은 같은 컨테이너의 다른 uid뿐인데
        # 이 볼륨은 executor에만 붙고 그 안의 uid는 65532 하나다.
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 0444
            {{- if $.Values.pki.enabled }}
            # ca.crt를 빼고 붙인다. 신뢰 기준은 ConfigMap olive-trust 하나다(templates/pki-trust.yaml).
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            {{- end }}
        {{- end }}
        {{- if $trust }}
        - name: trust
          configMap:
            name: olive-trust
            defaultMode: 0444
        {{- end }}
        # 제어 컨테이너의 /tmp. 실행마다의 HOME·작업 공간은 역할 쪽(role-tmp)이라 작게 둔다 [가정].
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # 역할 컨테이너의 /tmp. 실행마다 빈 HOME·작업 공간을 만들 자리. 모델 CLI의 임시 사용량을 아직 몰라 512Mi [가정]이다.
        # 넘으면 kubelet이 파드를 쫓아낸다. 제어의 /tmp와 나누는 이유: 같은 폴더면 역할 쪽이 제어의 임시 파일을 읽거나 바꿀 수 있다.
        - name: role-tmp
          emptyDir:
            sizeLimit: 512Mi
        # 대리 실행 파일(약 104MiB) 자리. 디스크 매체다: medium Memory면 그 크기가 메모리 상한에 든다.
        # 256Mi는 다시 설치할 때 옛 파일과 임시 파일이 함께 있는 동안을 덮는다.
        - name: agent-bin
          emptyDir:
            sizeLimit: 256Mi
        # 소켓 파일 하나만 두는 자리.
        - name: agent-link
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: store
          persistentVolumeClaim:
            claimName: executor-store
{{- end }}
{{- end }}
