{{- /*
감독 전용 store(spec.md §7 권한 표: 감독만 계정 묶음과 서명 키를 받는다)와 작업자 실행기마다의 store(D-73: 효과 서명 키 하나).
모두 다른 store와 같은 identity로 같은 프로젝트를 읽고, 쓰는 ns(conditions)와 기본 폴더만 다르다. store마다 conditions가 ns 하나라
감독 store로 실행기 ns에, 한 실행기의 store로 다른 실행기 ns에 ExternalSecret을 만들면 거부된다(감독 ns용 비밀 연결을 실행기에 열지 않는다).
Free 플랜에는 경로 RBAC가 없어 secretsPath는 경계가 아니다(설계 C.6.3). 절대 키(/로 시작)는 secretsPath를 무시하고 프로젝트의 어느
폴더든 읽는다. 다른 경로 차단은 ExternalSecret이 Git PR로만 생기는 것과 CI(tools/ci/olive.ts olive-executor-key: 실행기 ns의
ExternalSecret은 자기 store만, 상대 키만)에 기댄다. provider 블록은 templates/_helpers.tpl olive.storeProvider다.

켜기 전 사람 작업: Infisical(운영 homelab/prod, VM homelab-dev/dev)에 폴더 /olive/supervisor와 실행기마다 /olive/executors/<인스턴스>를
만든다. Ready는 secretsPath 폴더가 있어야 True다. 없으면 그 store와 그 ExternalSecret이 Degraded라 olive Application이 그 wave에서
멈춘다(root는 막지 않는다: olive가 root의 마지막 wave다, platform/root/templates/olive.yaml).
*/}}
{{- $projectSlug := required "infisical.projectSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.projectSlug }}
{{- $environmentSlug := required "infisical.environmentSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.environmentSlug }}
{{- if .Values.externalSecrets.enabled }}
{{- $t := include "olive.supervisorTarget" . | fromYaml }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-olive
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    {{- include "olive.storeProvider" (dict "projectSlug" $projectSlug "environmentSlug" $environmentSlug "path" "/olive/supervisor") | nindent 4 }}
  conditions:
    # 감독 ns 하나. 다른 store(infisical-platform·infisical-apps·infisical-sandbox)의 conditions에는 olive ns가 없다.
    - namespaces:
        - {{ $t.namespace }}
{{- range (include "olive.targets" . | fromYaml).items }}
{{- if eq .kind "executor" }}
---
# 실행기 하나 전용(D-73). 폴더는 인스턴스 이름(templates/_helpers.tpl olive.instance)이고 그 안의 키는 EFFECT_SIGNING_KEY 하나다.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "olive.effectKey.store" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    {{- include "olive.storeProvider" (dict "projectSlug" $projectSlug "environmentSlug" $environmentSlug "path" (include "olive.effectKey.path" .)) | nindent 4 }}
  conditions:
    # 이 실행기 ns 하나. 감독 store(infisical-olive)의 conditions에는 실행기 ns가 없다.
    - namespaces:
        - {{ .namespace }}
{{- end }}
{{- end }}
{{- end }}
