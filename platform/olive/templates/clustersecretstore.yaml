{{- /*
감독 전용 store(spec.md §7 권한 표: 감독만 계정 묶음과 서명 키를 받는다). 다른 store와 같은 identity로 같은 프로젝트를 읽고,
쓰는 ns(conditions)와 기본 폴더만 다르다. 실행기 ns는 conditions에 없어 이 store로 ExternalSecret을 만들어도 거부된다.
Free 플랜에는 경로 RBAC가 없어 secretsPath는 경계가 아니다(설계 C.6.3). 다른 경로 차단은 ExternalSecret이 Git PR로만 생기는 것에 기댄다.
provider 블록은 platform/sandbox/templates/_helpers.tpl sandbox.storeProvider와 같은 모양이다(차트가 달라 helper를 함께 쓰지 못한다).
그쪽(hostAPI, 부트스트랩 Secret, expandSecretReferences)을 바꾸면 여기도 바꾼다.

켜기 전 사람 작업: Infisical(운영 homelab/prod, VM homelab-dev/dev)에 폴더 /olive/supervisor를 만든다. Ready는 secretsPath 폴더가
있어야 True다. 없으면 이 store와 아래 ExternalSecret이 Degraded라 olive Application이 그 wave에서 멈춘다(root는 막지 않는다:
olive가 root의 마지막 wave다, platform/root/templates/olive.yaml).
*/}}
{{- $projectSlug := required "infisical.projectSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.projectSlug }}
{{- $environmentSlug := required "infisical.environmentSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.environmentSlug }}
{{- if .Values.externalSecrets.enabled }}
{{- $t := include "olive.supervisorTarget" . | fromYaml }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-olive
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: {{ $projectSlug | quote }}
        environmentSlug: {{ $environmentSlug | quote }}
        secretsPath: /olive/supervisor
        expandSecretReferences: false
  conditions:
    # 감독 ns 하나. 다른 store(infisical-platform·infisical-apps·infisical-sandbox)의 conditions에는 olive ns가 없다.
    - namespaces:
        - {{ $t.namespace }}
{{- end }}
