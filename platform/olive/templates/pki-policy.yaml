{{- /*
올리브 발급 기관으로 가는 요청의 경계. ClusterIssuer는 요청한 네임스페이스와 SAN을 대조하지 않으므로 API 서버에서 막는다.
ValidatingAdmissionPolicy는 API 서버 내장 기능이라 새 구성 요소가 없고, ingress-shim이 대신 만드는 Certificate도 같은 검사를 지난다.

막는 것: 올리브 실행 네임스페이스 밖의 Certificate·CertificateRequest, CA 요청, 이 차트가 선언한 모양과 다른 Certificate.
막지 못하는 것:
  CertificateRequest의 SAN. CSR이 base64 DER이라 CEL로 읽지 못한다. 올리브 네임스페이스 안에서 직접 만든 요청의 SAN은 이 정책이 보지 않는다.
  같은 CA Secret을 가리키는 다른 이름의 Issuer·ClusterIssuer. issuerRef 이름으로 판정한다. 만들려면 cert-manager 네임스페이스 쓰기나 클러스터 권한이 든다.
  클러스터 관리자와 Application을 고칠 수 있는 주체. 이 정책을 지울 수 있다.

matchConditions: 이름이 olive-internal로 시작하는 발급 기관만 본다. 다른 인증서(Barman plugin TLS 등)는 평가하지 않는다.
함정: failurePolicy Fail이라 식의 오류가 요청을 거절한다. matchConditions의 has() 가드를 빼면 올리브와 무관한 인증서까지 막을 수 있다.
wave -1: 발급 기관(wave 0)이 생기기 전에 경계가 먼저 있어야 한다.
*/}}
{{- if .Values.pki.enabled }}
{{- $namespaces := list }}
{{- $shapes := list }}
{{- range (include "olive.targets" . | fromYaml).items }}
{{- $namespaces = append $namespaces (.namespace | quote) }}
{{- $dns := "!has(object.spec.dnsNames)" }}
{{- if eq .kind "supervisor" }}
{{- $dns = printf "has(object.spec.dnsNames) && object.spec.dnsNames == [%s]" (include "olive.pki.dnsName" . | quote) }}
{{- end }}
{{- $shapes = append $shapes (printf "(request.namespace == %s && has(object.spec.uris) && object.spec.uris == [%s] && %s && has(object.spec.usages) && object.spec.usages == [\"digital signature\", %s])" (.namespace | quote) (include "olive.pki.uri" . | quote) $dns (include "olive.pki.usage" . | quote)) }}
{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: olive-internal-issuer-scope
  labels:
    {{- include "olive.pki.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["certificates", "certificaterequests"]
  matchConditions:
    - name: uses-olive-issuer
      expression: {{ `has(object.spec.issuerRef) && has(object.spec.issuerRef.name) && object.spec.issuerRef.name.startsWith("olive-internal")` | quote }}
  validations:
    - expression: {{ printf "request.namespace in [%s]" (join ", " $namespaces) | quote }}
      message: olive issuers accept requests only from olive namespaces
    - expression: {{ `!has(object.spec.isCA) || !object.spec.isCA` | quote }}
      message: olive issuers do not issue CA certificates
    - expression: {{ printf "request.kind.kind != \"Certificate\" || (!has(object.spec.commonName) && !has(object.spec.ipAddresses) && !has(object.spec.emailAddresses) && !has(object.spec.otherNames) && (%s))" (join " || " $shapes) | quote }}
      message: olive leaf certificates must match the identity declared for their namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: olive-internal-issuer-scope
  labels:
    {{- include "olive.pki.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  policyName: olive-internal-issuer-scope
  validationActions: ["Deny"]
{{- end }}
