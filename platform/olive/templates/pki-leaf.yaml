{{- /*
이 차트가 선언한 파드의 인증서(targets.yaml에서 declaredBy가 platform/olive인 줄마다 하나). 세션·작성·현관의 인증서는 그 티켓이 자기 대상을 선언할 때 더한다.
감독은 서버 용도만, 실행기는 클라이언트 용도만 받는다(D-55: 실행기가 감독에 먼저 붙는다). 실행기 인증서로 감독 행세를 하지 못하게 한다.
dnsNames는 실행기의 OLIVE_SUPERVISOR_SERVER_NAME과 같아야 한다(templates/executor-deployments.yaml).
rotationPolicy Always: 갱신마다 새 개인 키를 만든다. 발급 기관과 달리 leaf는 갱신해도 신뢰 기준이 바뀌지 않는다.
issuerRef는 지금 서명하는 세대의 ClusterIssuer다. activeGeneration을 바꾸면 세 leaf가 새 세대로 다시 발급된다(templates/pki-ca.yaml).
wave 1: 발급 기관(wave 0) 뒤, Deployment(wave 2) 앞. 발급되지 않으면 Deployment까지 가지 않는다.
*/}}
{{- if .Values.pki.enabled }}
{{- $leaf := .Values.pki.leaf }}
{{- $issuer := include "olive.pki.issuerName" .Values.pki.ca.activeGeneration }}
{{- range (include "olive.targets" . | fromYaml).items }}
{{- $tls := ternary $.Values.supervisor.tls (index $.Values.executors .id).tls (eq .kind "supervisor") }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: olive-tls
  namespace: {{ .namespace }}
  labels:
    {{- include "olive.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: {{ include "olive.tlsSecretName" (dict "root" $ "tls" $tls) }}
  duration: {{ printf "%dh" (int $leaf.durationHours) }}
  renewBefore: {{ printf "%dh" (int $leaf.renewBeforeHours) }}
  privateKey:
    algorithm: ECDSA
    size: 256
    encoding: PKCS8
    rotationPolicy: Always
  usages:
    - digital signature
    - {{ include "olive.pki.usage" . }}
  uris:
    - {{ include "olive.pki.uri" . }}
  {{- if eq .kind "supervisor" }}
  dnsNames:
    - {{ include "olive.pki.dnsName" . }}
  {{- end }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: {{ $issuer }}
{{- end }}
{{- end }}
