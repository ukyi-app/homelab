{{- /*
대상마다 전용 SA 하나. 토큰을 자동으로 붙이지 않고 이 차트는 이 SA에 Role·RoleBinding·ClusterRoleBinding을 하나도 주지 않는다
(D-37: 감독에게 Kubernetes 쓰기 권한이 없다, 실행기에는 클러스터 자격이 없다). default SA를 쓰지 않는 이유: 다른 차트가 ns의
default에 묶는 바인딩을 더해도 이 파드에 번지지 않게 한다.
*/}}
{{- range (include "olive.targets" . | fromYaml).items }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .kind }}
  namespace: {{ .namespace }}
  labels:
    {{- include "olive.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
