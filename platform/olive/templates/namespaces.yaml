{{- /*
올리브 네임스페이스와 PSA 라벨. platform/namespaces(늘 켜진 Application)가 아니라 이 차트가 만든다.
이유: root에서 이 구성 요소를 끈 동안 클러스터에 빈 네임스페이스도 생기지 않게 한다. 거기 두면 꺼 둔 채 병합해도 셋이 생긴다.
봇 자리의 시험 ns(platform/bot-slot/templates/probe.yaml)와 같은 방식이다. CreateNamespace가 아니라 PSA 라벨을 직접 단다.
restricted: 감독·실행기는 비root, 읽기 전용 루트, capability 없음, seccomp RuntimeDefault만 쓴다(D-54).
Prune=false,Delete=false: 장부 PVC와 Secret이 ns와 함께 지워지지 않게 한다. 이 차트에서 빠지거나 Application이 지워져도 ns는 남는다.
ns가 남아도 감독 Secret은 자기 ExternalSecret이 지워지면 함께 GC된다(templates/supervisor-externalsecrets.yaml 머리 주석).
*/}}
{{- range (include "olive.targets" . | fromYaml).items }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .namespace }}
  labels:
    app.kubernetes.io/part-of: olive
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # 같은 Application 안의 ns 리소스보다 먼저.
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
