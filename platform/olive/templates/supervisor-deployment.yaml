{{- /*
감독(D-37, supervisor.md §1.1·§8). 모델이 아닌 프로세스이고 hc·Kubernetes 자격이 없다. 장부(SQLite)를 혼자 쓴다.
env 이름·꼴·파일 이름은 ukyi-app/olive의 감독 진입점(src/main/supervisor.ts, README "감독 진입점 › 환경")이 정한다. 진입점은 열한 개가
모두 있고 비지 않아야 뜬다(없거나 틀리면 91). env·마운트·볼륨과 감독 ns의 ExternalSecret은 CI(tools/ci/olive.ts olive-supervisor-env)가 정확한 표와 대조한다.
배정 값 셋(OLIVE_ACCOUNT_NAME·OLIVE_ACCOUNT_REVISION·OLIVE_PROFILE_REVISIONS)은 없어도 뜨지만 그때 배정이 보류되고, 꼴이 틀리면 91이다.
기대 프로필 revision과 실행기 역할 프로필의 대조는 olive-role-profile이 본다.
시험 값 둘(OLIVE_TEST_JOBS·OLIVE_TEST_FRONTDOOR)은 켤 때만 렌더하고 olive-test-values가 본다. 관리 소켓의 조건은 olive-supervisor-admin이 본다.
*/}}
{{- $t := include "olive.supervisorTarget" . | fromYaml }}
{{- $tls := .Values.supervisor.tls }}
{{- $tlsSecret := include "olive.tlsSecretName" (dict "root" . "tls" $tls) }}
{{- $trust := include "olive.trustEnabled" . }}
{{- $account := required "supervisor.account.name is required (account alias under Infisical /bot-accounts/<name>)" .Values.supervisor.account.name }}
{{- /* 결과 폴더(OLIVE_RESULT_DIR) 자리는 예약이다. 장부를 그 자리나 그 아래에 두면 같은 컨테이너에 같은 mountPath가 둘이라 쿠버네티스가 파드를 거부하거나 한쪽이 가려진다. */}}
{{- $resultDir := "/var/lib/olive-results" }}
{{- $ledgerDir := .Values.supervisor.ledger.mountPath }}
{{- /* 결과 폴더는 장부 PVC의 이 하위 폴더다. 감독의 결과 마운트(subPath)와 init의 OLIVE_RESULT_DIR이 이 값 하나에서 나와야 같은 폴더를 본다. */}}
{{- $resultSubPath := "results" }}
{{- $test := .Values.supervisor.test }}
{{- /* 감독은 OLIVE_TEST_JOBS가 on이 아닌데 대역이 on이면 운영 값으로 보고 91로 끝난다(D-109). 파드를 띄우기 전에 렌더에서 멈춘다. */}}
{{- if and $test.frontDoor (not $test.jobs) }}
{{- fail "supervisor.test.frontDoor needs supervisor.test.jobs: the supervisor reads a front-door double without test jobs as production values and exits 91" }}
{{- end }}
{{- if or (eq (trimSuffix "/" $ledgerDir) $resultDir) (hasPrefix (printf "%s/" $resultDir) $ledgerDir) }}
{{- fail (printf "supervisor.ledger.mountPath %s collides with the reserved result directory %s (OLIVE_RESULT_DIR mount); pick another path under /var/lib/" $ledgerDir $resultDir) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $t.deployment }}
  namespace: {{ $t.namespace }}
  labels:
    {{- include "olive.labels" $t | nindent 4 }}
  annotations:
    # 장부 PVC와 같은 wave(templates/supervisor-pvc.yaml 주석).
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Git 값은 늘 0이다(D-38). 켜고 끄기는 관리자 CLI가 하고, 이 칸은 root의 ignoreDifferences(/spec/replicas)로 Argo CD가
  # 되돌리지 않는다(platform/root/templates/olive.yaml). 빈 클러스터에서 다시 만들면 꺼진 채 시작한다.
  replicas: 0
  # 장부는 단일 작성자다(S-04). RollingUpdate면 교체 중 두 파드가 같은 RWO 볼륨의 SQLite를 함께 열려 하고,
  # olive-limits ResourceQuota가 두 번째 파드를 막아 교체가 멈춘다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "olive.selectorLabels" $t | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olive.labels" $t | nindent 8 }}
    spec:
      {{- include "olive.podSecurity" $t | nindent 6 }}
      initContainers:
        # 결과 폴더를 감독 uid 소유·0700으로 맞춘다(D-177, olive src/main/result-dir-init.ts). kubelet은 subPath 폴더가 없을 때만
        # root 소유·볼륨 뿌리의 모드(local-path는 0777)로 만들고 있으면 그대로 쓴다. 그래서 감독 컨테이너가 뜨기 전에 이 컨테이너가 만들어 둔다.
        # 함정: 폴더가 이미 root 소유(kubelet이 만든 것)면 이 uid로 고칠 수 없어 98로 끝나고 파드가 Init:Error에 멈춘다. 관리자가 일회성 파드로 바로잡는다.
        # Secret·토큰·/tmp를 붙이지 않는다. 감독 전용 Secret을 받는 컨테이너는 감독 하나이고, 감독 /tmp(관리 소켓 자리)는 다른 컨테이너와 나누지 않는다.
        # 이 진입점은 /tmp에 쓰지 않는다. 이 컨테이너의 모양은 CI olive-supervisor-env의 init 표가 고정한다.
        - name: result-dir
          image: {{ include "olive.image" . }}
          command: ["bun", "src/main/result-dir-init.ts"]
          env:
            # 이 컨테이너에서 보이는 결과 폴더 경로다. 감독의 OLIVE_RESULT_DIR과 같은 폴더이고 마운트 자리가 달라 값만 다르다.
            # 진입점은 정규화된 절대 경로만 받으므로(아니면 91) 장부 경로를 clean으로 맞춘다.
            - name: OLIVE_RESULT_DIR
              value: {{ printf "%s/%s" (clean $ledgerDir) $resultSubPath | quote }}
          {{- include "olive.containerSecurity" . | nindent 10 }}
          # 감독과 같은 값이다. 파드의 실효 limits는 max(일반 컨테이너 합, 가장 큰 init)라 olive-limits(감독 limits)가 그대로 맞는다.
          resources:
            {{- include "olive.resources" (dict "root" . "target" $t) | nindent 12 }}
          volumeMounts:
            # PVC 뿌리를 쓰기로(subPath 없이) 붙인다. 뿌리에 써야 results를 만들 수 있다. 장부 파일에도 닿지만 감독과 같은 이미지·uid의 고정 명령이다.
            - name: ledger
              mountPath: {{ $ledgerDir }}
      containers:
        - name: supervisor
          image: {{ include "olive.image" . }}
          command: ["bun", "src/main/supervisor.ts"]
          # 실행기가 붙는 포트. 이미지에는 듣는 포트가 적혀 있지 않아 env로 준다.
          ports:
            - name: control
              containerPort: {{ .Values.supervisor.port }}
              protocol: TCP
          env:
            - name: OLIVE_SUPERVISOR_PORT
              value: {{ .Values.supervisor.port | quote }}
            # 장부 디렉터리(PVC). DB 오류나 디스크 부족이면 새 실행은 0건이다(§8).
            - name: OLIVE_LEDGER_DIR
              value: {{ .Values.supervisor.ledger.mountPath | quote }}
            # 지시 서명 키 파일이 든 디렉터리. 파일 이름은 진입점이 supervisor-signing.key로 정해 아래 signing 볼륨의 items가 맞춘다.
            - name: OLIVE_SIGNING_KEY_DIR
              value: /run/olive/signing
            # 계정 묶음 디렉터리. 계정마다 하위 디렉터리 <별칭>/<키 이름> 파일이다(지금은 고정 계정 하나).
            - name: OLIVE_ACCOUNTS_DIR
              value: /run/olive/accounts
            # 정책 판 번호(values.yaml policy.revision). 실행기와 같은 helper라 값이 한 곳에서만 정해진다.
            # 현관(apps/homelab-bot)도 같은 값을 받아야 하는데 그 차트에는 아직 자리가 없다. 그 자리와 CI 대조는 현관 차트 PR이 더한다.
            - name: OLIVE_POLICY_REVISION
              value: {{ include "olive.policyRevision" . | quote }}
            # TLS·신뢰 폴더는 볼륨이 없어도 늘 준다. 진입점에는 필수라 빼면 91이고, 주면 파일이 없어 92로 끝난다(재료가 없다는 원인이 코드에 남는다).
            - name: OLIVE_TLS_DIR
              value: {{ $tls.mountPath | quote }}
            - name: OLIVE_TRUST_DIR
              value: /run/olive/trust
            # 실행기 등록표(D-63·D-70) 문서 파일. Infisical 키를 registry 볼륨의 items가 이 이름으로 붙인다.
            - name: OLIVE_REGISTRY_FILE
              value: /run/olive/registry/registry.json
            # 등록표 문서의 environment와 글자 그대로 같아야 한다. 다르면 등록표 전체가 거절돼 기동이 93으로 끝난다.
            - name: OLIVE_ENVIRONMENT
              value: {{ required "supervisor.registry.environment is required (cluster name the registry document's environment must equal; keep components.olive off until then)" .Values.supervisor.registry.environment | quote }}
            # 등록표와 배정이 함께 쓰는 대상 표. targets.yaml의 kind executor 줄에서만 만든다(olive.supervisorTargetsJson).
            - name: OLIVE_TARGETS
              value: {{ include "olive.supervisorTargetsJson" . | quote }}
            # 결과 보관 폴더. 진입점은 마지막 경로 요소만 lstat으로 보고 만들지 않는다. 그래서 장부 PVC의 하위 폴더를 subPath로
            # 따로 붙인다: 폴더는 위 init(result-dir)이 감독 uid·0700으로 먼저 만들고, 마운트 자리라 링크가 아니며, 상위(/var/lib)는 이미지의 폴더다.
            - name: OLIVE_RESULT_DIR
              value: {{ $resultDir }}
            # 고정 계정의 별칭(D-126). 아래 account 마운트와 같은 값이라 배정이 고른 계정의 자격 파일이 그 폴더에 있다.
            - name: OLIVE_ACCOUNT_NAME
              value: {{ $account | quote }}
            {{- /* 계정 자격의 판(D-111). 비면 렌더하지 않는다. 감독은 없음과 빈 값을 같은 "판 모름"으로 읽는다(자격 참조를 만들지 않아 새 실행 0). */}}
            {{- with .Values.supervisor.account.revision }}
            - name: OLIVE_ACCOUNT_REVISION
              value: {{ . | quote }}
            {{- end }}
            # 역할별 기대 프로필 revision(JSON 객체). 실행기 파드가 받는 역할 프로필과 같은 helper에서 만든다(templates/_helpers.tpl).
            - name: OLIVE_PROFILE_REVISIONS
              value: {{ include "olive.profileRevisionsJson" . | quote }}
            {{- /* 시험 값(values.yaml supervisor.test). 감독은 "on"만 켬으로 읽고 on·off 밖의 값은 91이라 값은 늘 "on"이다. */}}
            {{- if $test.jobs }}
            - name: OLIVE_TEST_JOBS
              value: "on"
            {{- end }}
            {{- if $test.frontDoor }}
            - name: OLIVE_TEST_FRONTDOOR
              value: "on"
            {{- end }}
          # 프로브는 두지 않는다. 건강 확인 포트는 아직 정하지 않았다(spec.md §5.3 "같은 파드의 공유 통로"). 감독 코드가 생긴 뒤 더한다.
          # 관리 통로(homelab olive)는 이 컨테이너에 exec로 들어와 /tmp/olive-admin.sock(0600)에 붙는다. 그래서 command를 셸로 감싸지 않고
          # (소켓 권한은 bind 때의 umask로 정해진다. 런타임 기본 022를 바꾸지 않는다), uid는 파드 값 하나로 둔다(CI olive-supervisor-admin).
          {{- include "olive.containerSecurity" . | nindent 10 }}
          resources:
            {{- include "olive.resources" (dict "root" . "target" $t) | nindent 12 }}
          volumeMounts:
            - name: ledger
              mountPath: {{ .Values.supervisor.ledger.mountPath }}
            # 같은 PVC의 하위 폴더 results를 따로 붙인다(장부 폴더 안의 폴더지만 장부는 자기 파일 이름만 본다, olive src/ledger/ledger.md).
            # 함정: 장부 PVC를 잃으면 결과 본문도 함께 잃는다(같은 볼륨). 볼륨을 나눌지는 정하지 않았다(D-78이 보관소의 자리를 정하지 않음).
            - name: ledger
              mountPath: {{ $resultDir }}
              subPath: {{ $resultSubPath }}
            - name: registry
              mountPath: /run/olive/registry
              readOnly: true
            - name: signing
              mountPath: /run/olive/signing
              readOnly: true
            - name: account
              mountPath: /run/olive/accounts/{{ $account }}
              readOnly: true
            {{- if $tlsSecret }}
            - name: tls
              mountPath: {{ $tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $trust }}
            - name: trust
              mountPath: /run/olive/trust
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ledger
          persistentVolumeClaim:
            claimName: ledger
        # Secret 볼륨은 subPath로 붙이지 않는다. subPath면 kubelet이 갱신을 반영하지 않아 키·토큰 교체가 파드 재시작까지 안 보인다.
        # optional을 두지 않는다(기본 false): 없으면 FailedMount로 컨테이너 생성 전에 멈춰 원인이 이벤트에 바로 보인다.
        # 모드는 십진으로 적는다(288 = 0440, 292 = 0444). 8진 표기는 쿠버네티스(YAML 1.1)와 CI의 Bun(YAML 1.2)이 다른 수로 읽는다.
        - name: signing
          secret:
            secretName: olive-signing-key
            defaultMode: 288
            # Secret 키(= Infisical 키 이름)와 진입점이 읽는 파일 이름이 달라 여기서 잇는다.
            items:
              - key: {{ .Values.supervisor.signingKey.key }}
                path: supervisor-signing.key
        - name: registry
          secret:
            secretName: olive-registry
            defaultMode: 288
            # quote: TRUE·NULL 같은 키 이름이 YAML 불리언·null로 읽히지 않게 한다.
            items:
              - key: {{ required "supervisor.registry.key is required (Infisical key name of the executor registry under /olive/supervisor, D-63; keep components.olive off until then)" .Values.supervisor.registry.key | quote }}
                path: registry.json
        - name: account
          secret:
            secretName: olive-account-{{ $account }}
            defaultMode: 288
        {{- if $tlsSecret }}
        - name: tls
          secret:
            secretName: {{ $tlsSecret }}
            defaultMode: 288
            {{- if .Values.pki.enabled }}
            # ca.crt를 빼고 붙인다. 신뢰 기준은 ConfigMap olive-trust 하나다(templates/pki-trust.yaml).
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            {{- end }}
        {{- end }}
        {{- if $trust }}
        - name: trust
          configMap:
            name: olive-trust
            defaultMode: 292
        {{- end }}
        # 이미지가 쓰는 유일한 자리(D-54). SQLite 임시 파일도 여기다. 크기는 [가정]이다. 넘으면 kubelet이 파드를 쫓아낸다.
        # 관리 소켓 /tmp/olive-admin.sock도 여기 생긴다. 읽기 전용으로 붙이거나 다른 컨테이너와 나누지 않는다(듣지 못하면 상태 조회가 늘 1이고,
        # 같은 볼륨을 붙인 컨테이너는 소켓에 닿는다). 이 마운트·볼륨은 CI olive-supervisor-env의 표가 고정한다.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
