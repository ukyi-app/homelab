{{- /*
파드가 상대를 확인하는 기준(공개 값). 사람이 검토한 PR로만 바뀌도록 Git 값에서 만든다. leaf Secret의 ca.crt는 파드에 붙이지 않는다.
실행기에는 감독의 지시 검증 공개 키도 함께 준다. 감독은 그 키가 필요 없어 받지 않는다.
wave 1: Deployment(wave 2)보다 먼저 있어야 볼륨이 붙는다.
*/}}
{{- if include "olive.trustEnabled" . }}
{{- range (include "olive.targets" . | fromYaml).items }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: olive-trust
  namespace: {{ .namespace }}
  labels:
    {{- include "olive.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  ca-bundle.pem: {{ $.Values.pki.trustBundlePem | quote }}
  {{- if and (eq .kind "executor") $.Values.supervisor.signingKey.publicKeyPem }}
  supervisor-signing.pub: {{ $.Values.supervisor.signingKey.publicKeyPem | quote }}
  {{- end }}
{{- end }}
{{- end }}
