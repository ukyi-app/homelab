{{- /*
작업자 실행기의 효과 서명 개인 키(D-73·D-100). 실행기마다 하나. 값은 Infisical에만 있다. 키는 제어 컨테이너(executor)에만 붙는다
(templates/executor-deployments.yaml). 복구 스위치가 끄면(externalSecrets.enabled: false) 내지 않는다. 같은 이름 Secret은 손으로 만든다.

켜기 전 사람 작업(값은 어디에도 출력하지 않는다):
  1. 실행기(인스턴스)마다 올리브 전용 Ed25519 키쌍을 따로 만든다. 개인 키(PKCS#8 PEM)는 Infisical /olive/executors/<인스턴스>/EFFECT_SIGNING_KEY에 둔다.
  2. 짝 공개 키는 감독 등록표(D-63)의 그 실행기 행에 적는다. 이 차트는 공개 키를 다루지 않는다.
키가 없으면 그 ExternalSecret이 Ready=False(Degraded)라 olive Application이 wave 1에서 멈추고 Deployment wave(2)로 넘어가지 않는다.
함정: remoteRef.key는 상대 키(store의 secretsPath 아래)만 쓴다. 절대 키는 secretsPath를 무시하고 감독 폴더까지 읽는다(Free 플랜에는
경로 RBAC가 없다). CI(tools/ci/olive.ts olive-executor-key)가 실행기 ns의 ExternalSecret마다 본다.
Secret의 수명은 감독 ExternalSecret과 같다(templates/supervisor-externalsecrets.yaml 머리 주석: Owner·Retain).
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- range (include "olive.targets" . | fromYaml).items }}
{{- if eq .kind "executor" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "olive.effectKey.secretName" . }}
  namespace: {{ .namespace }}
  labels:
    {{- include "olive.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ include "olive.effectKey.store" . }}
  target:
    name: {{ include "olive.effectKey.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /olive/executors/<인스턴스>/<키>. Secret 키 = Infisical 키 = 실행기가 읽는 파일 이름.
    - secretKey: {{ include "olive.effectKey.key" . }}
      remoteRef:
        key: {{ include "olive.effectKey.key" . }}
{{- end }}
{{- end }}
{{- end }}
