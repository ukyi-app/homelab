# infisical은 root가 cluster.infisical에서 넘긴다. 여기는 빈 자리만 둔다(templates/clustersecretstore.yaml의 required).
infisical:
  projectSlug: ""
  environmentSlug: ""

# 감독과 실행기가 함께 쓰는 이미지 하나(D-54). 역할은 command로 고른다(templates/_helpers.tpl olive.pod).
# ukyi-app/olive main 빌드(app-build)가 GHCR에 올린 digest만 쓰고 사람 PR로만 바꾼다. 실행기는 모델 자격을 받으므로
# apps/의 digest 자동 병합 경로에 넣지 않는다(설계 C.4.4·C.4.7, platform/sandbox worker.image와 같은 이유).
# 빈 값이면 렌더가 실패한다(templates/_helpers.tpl olive.image). 켜는 PR이 실제 digest를 넣고, 그 전에는 root에서 꺼 둔다.
# 이미지 계약(ukyi-app/olive README "이미지 계약"): 비root uid·gid 65532, 루트 파일시스템 읽기 전용 전제, 듣는 포트를 이미지에
# 적지 않음, 역할을 고르지 않으면 64·아직 구현되지 않은 역할은 69로 끝남. 루트가 읽기 전용이라 쓰기는 컨테이너마다 붙인 볼륨에만
# 한다: 감독은 /tmp와 장부 PVC, 실행기 제어는 /tmp·소켓 폴더(agent-link)·저장소 PVC, init은 /opt/olive-agent(대리 설치).
# 작업자 실행기의 init(olive-init)도 이 이미지다. 이 이미지에 든 대리(/opt/olive/olive-agent)를 역할 컨테이너에 놓는다(D-103).
image:
  repository: ghcr.io/ukyi-app/olive
  digest: ""

# 작업자 실행기 역할 컨테이너의 이미지(D-103 역할별 이미지). 키는 v1 역할 이름(targets.yaml role)이다. 대상 id가 아니다.
# 출처(누가 빌드하고 서명을 어떻게 확인하는지)는 정하지 않았다. 빈 값이면 렌더가 실패한다(templates/_helpers.tpl olive.roleImage).
# 켜는 PR이 실제 값을 넣고, 그 전에는 root에서 꺼 둔다. 시험 값은 ci/enabled.yaml과 tools/ci/olive.ts RENDER_FILL의 가짜다.
# 고를 때의 조건(차트 CI는 렌더만 봐서 이미지 안은 확인하지 못한다. 고르는 PR이 이미지 설정을 확인해 PR에 적는다):
#   - glibc 계열(데비안·우분투·distroless)이다. 대리가 glibc 동적 링크 파일이라 musl 이미지에서는 exec부터 실패한다(D-107).
#   - 이미지 ENV에 BUN_·LD_로 시작하는 이름과 NODE_CHANNEL_FD가 없다. 대리 안의 Bun과 glibc 로더가 대리 코드보다 먼저 읽는다.
#     BUN_OPTIONS·BUN_BE_BUN·LD_PRELOAD는 차트가 빈 값으로 덮지만, BUN_JSC_*는 빈 값이면 bun이 1로 끝나 덮을 수 없다.
#   - uid·gid 10002로 돌 수 있다(차트가 runAsUser·runAsGroup을 준다). 루트 파일시스템은 읽기 전용이고 쓰기는 /tmp만이다.
roleImages:
  diagnosis:
    repository: ""
    digest: ""
  isolated_reader:
    repository: ""
    digest: ""

# 정책 판 번호(D-72·D-108). 감독과 모든 작업자 실행기의 env OLIVE_POLICY_REVISION이 이 값 하나에서 렌더된다. 사람 PR로만 바꾼다.
# 비면 렌더가 실패한다(templates/_helpers.tpl olive.policyRevision). 켜는 PR이 값을 넣고, 그 전에는 root에서 꺼 둔다.
# 꼴은 계약 v1 revision(^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$, values.schema.json). 시험 값은 ci/enabled.yaml과 tools/ci/olive.ts RENDER_FILL의 가짜다.
# 무엇의 변경이 판 번호를 올리는지는 정하지 않았다(켜기 전 점검표).
# 함정: 현관(apps/homelab-bot)도 같은 값을 받아야 하는데 그 차트에는 아직 자리가 없다. 그 자리와 두 값의 CI 대조는 현관 차트 PR이 더한다.
# 함정: 켠 뒤 값을 바꾸면 감독·실행기 파드가 다시 뜨고, 현관이 같은 값을 받을 때까지 새 일이 멈춘다(어긋나면 닫히는 쪽).
policy:
  revision: ""

# 감독(ns olive-control). 장부·계정·지시 서명 키를 쥐고 hc와 Kubernetes 자격이 없다(D-37).
supervisor:
  # 실행기가 붙는 포트(D-55: 실행기가 감독에 먼저 붙어 연결을 유지한다). mTLS 연결이라 HTTPS 관례의 8443을 쓴다.
  # 이미지가 듣는 포트를 정하지 않으므로 env OLIVE_SUPERVISOR_PORT로 넘긴다.
  port: 8443
  # Service supervisor의 고정 주소. 실행기는 DNS 없이 이 주소로 붙는다(templates/networkpolicy-executors.yaml 머리 주석).
  # 서비스 대역(10.43.0.0/16)의 정적 구간(앞 256개)에서 고른다. 10.43.0.1(kubernetes)·10.43.0.10(kube-dns)·
  # 10.43.0.28(sandbox egress 프록시)과 겹치면 Service 생성이 실패하므로 values.schema.json이 그 셋을 거부한다.
  # 바꾸면 실행기 env(OLIVE_SUPERVISOR_ADDR)가 함께 바뀐다. 이미 뜬 실행기는 다시 떠야 새 주소를 읽는다.
  clusterIP: 10.43.0.29
  # S-09 출발점(감독 0.5 CPU·0.75GB, supervisor.md §11). 같은 값이 olive-control의 ResourceQuota(limits 합)가 된다.
  # cpu limit을 두는 이유: 그 ResourceQuota가 limits.cpu를 세면 cpu limit 없는 파드는 거부된다.
  # requests는 대기 중 Bun 프로세스 하나와 SQLite 기준의 [가정]이다. 실측이 쌓이면 맞춘다.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # 장부(S-04: SQLite 파일 하나, 감독 하나만 쓴다, supervisor.md §8). templates/supervisor-pvc.yaml 머리 주석.
  ledger:
    # local-retain: 이 저장소의 로컬 영속 볼륨(adguard, vmsingle, 영속 Valkey와 같다). 노드 이름 같은 클러스터 값이 필요 없다.
    storageClassName: local-retain
    # 장부에는 원문과 자격 값을 넣지 않는다(§8). 실행·계정·장애 색인의 메타데이터라 MB 단위로 본다. WAL 여유를 둔 1Gi다.
    # local-path는 크기를 강제하지 않는다. 실제 상한은 노드 루트 파일시스템이다.
    size: 1Gi
    mountPath: /var/lib/olive
  # 지시 서명 키(Ed25519 개인 키, PEM). Infisical 폴더 /olive/supervisor의 키 이름 = Secret 키 = 감독이 읽는 파일 이름.
  # publicKeyPem: 짝 공개 키(PEM). 실행기가 지시를 검증하는 기준이고 pki.trustBundlePem과 같은 ConfigMap으로 실행기에만 붙는다.
  # 감독과의 연결로 받지 않고 Git에 고정하는 이유: 발급 기관 키가 새도 가짜 감독이 자기 공개 키를 건네 지시를 위조하지 못한다.
  # 비면 실행기에 검증 키가 없고, 실행기 코드는 시작을 거부해야 한다.
  # 함정: 개인 키가 클러스터(Infisical 환경)마다 달라 이 파일에 값을 넣지 않는다. root의 values-<클러스터>.yaml cluster.olive가 넘긴다.
  signingKey:
    key: INSTRUCTION_SIGNING_KEY
    publicKeyPem: ""
  # 고정 모델 계정 하나(O09 할 일 8: 자리만, 순서·전환은 O17). accounts.md §6.2대로 계정별 원본 경로 /bot-accounts/<name>에서
  # 이 계정의 것만 감독 네임스페이스로 옮긴다. 공용 경로로 복사하지 않는다.
  # name이 비면 렌더가 실패한다. 켜는 PR이 계정 별칭(예: claude-work)을 넣는다.
  account:
    name: ""
    key: CLAUDE_CODE_OAUTH_TOKEN
  # 감독 포트로 들어올 수 있는 네임스페이스 가운데 이 차트가 만들지 않는 것(세션 olive-session, 작성 sandbox, 현관 app-homelab-bot).
  # 이 차트의 실행기 네임스페이스(targets.yaml의 kind executor)는 자동으로 들어간다. 지금 비운 이유: 그쪽 클라이언트가 아직 없고,
  # 열어 두면 붙을 코드가 생기기 전에 길부터 생긴다. 각 티켓(O10, O13, O08)의 PR이 자기 이름을 더한다.
  extraClientNamespaces: []
  # mTLS 인증서 Secret. pki.enabled면 이름은 olive-tls로 고정이고 여기는 비워 둔다(cert-manager가 쓰는 출력이라 다른 Secret을 덮지 못하게 한다).
  # pki를 끈 채 미리 만든 Secret을 읽을 때만 이름을 적는다. 둘 다 아니면 볼륨을 붙이지 않는다.
  # pki.enabled면 mountPath는 /run/olive/tls만 받는다. 서명 키·계정·신뢰 볼륨의 경로와 겹치면 파드가 만들어지지 않거나 파일이 가려진다.
  tls:
    secretName: ""
    mountPath: /run/olive/tls

# 올리브 내부 인증서(D-58, templates/pki-ca.yaml·pki-leaf.yaml·pki-trust.yaml). 아래 수명·보관 자리·신원 규칙은 관리자가 배포 PR에서 고르는 안이다.
# 기본이 false인 이유: 안이 정해지기 전에 root에서 올리브를 켜도 발급 기관이 생기지 않게 하고, 켜는 PR이 이 값을 직접 바꾸게 한다.
# 함정: false로 root에서 켜면 파드에 신뢰 묶음이 없고, tls.secretName도 비어 있으면 인증서도 없다. 감독·실행기 코드는 그 상태에서 시작을 거부해야 한다.
# 함정: true면 cert-manager가 세 네임스페이스의 Secret olive-tls에 쓴다. 같은 이름의 Secret을 다른 주체가 공급하고 있으면 둘이 같은 Secret을 덮어쓴다.
pki:
  enabled: false
  ca:
    # 살아 있는 발급 기관의 세대 목록과 지금 서명하는 세대.
    # 함정: 이 두 값은 모든 클러스터가 함께 읽는다. 한 클러스터의 세대를 옮기는 PR이 다른 클러스터의 leaf도 그 번호의 발급 기관으로 다시 발급하고,
    # 목록에서 뺀 세대의 발급 리소스도 함께 지운다.
    # 함정: 운영과 VM의 root는 같은 main과 같은 스위치를 읽는다. 클러스터마다 켜짐과 세대 값을 따로 줄 수 있다는 것을 두 root의 렌더로 보이기 전까지
    # 이 main을 읽는 root에서 pki.enabled를 켜지 않는다. 최초 발급의 검증은 이 main을 읽지 않는 독립된 시험 환경에서 하고, 켜는 일은 그 뒤의 활성화 PR이 맡는다.
    # 함정: 한 번 쓴 세대 번호를 다시 쓰지 않는다. 남은 Secret의 키가 재사용된다(templates/pki-ca.yaml).
    generations: [1]
    activeGeneration: 1
    # 10년, 만료 1년 전 갱신. 갱신은 같은 키를 쓴다(rotationPolicy Never).
    # 같은 세대의 Secret이 보존돼 키와 subject가 그대로일 때만 이미 나간 leaf와 고정한 옛 묶음이 계속 맞는다.
    # 이 조합의 양방향 검증은 재지 않았다(미확인). 고정한 옛 인증서가 만료되기 전에 새 묶음을 모든 프로세스에 적용한다.
    durationHours: 87600
    renewBeforeHours: 8760
  # 30일, 만료 10일 전 갱신. 폐기 목록이 없어 수명이 곧 유출 피해의 상한이다.
  # 10일은 예정된 갱신 시점에 남은 여유다. 갱신이 이미 실패하던 중에 NUC가 멈췄다면 복구할 시간은 그보다 짧다.
  # leaf 수명이 ca.renewBeforeHours보다 짧아야 렌더가 된다. 정상 갱신 때의 여유일 뿐 실제 발급 기관의 남은 기간을 보장하지 않는다.
  leaf:
    durationHours: 720
    renewBeforeHours: 240
  # 상대를 확인할 발급 기관 인증서(PEM, 공개 값). 여러 장이면 이어 붙인다.
  # leaf Secret의 ca.crt를 쓰지 않는 이유: 갱신 때 검토 없이 바뀌므로 신뢰 기준이 사람의 PR을 거치지 않고 움직인다.
  # 함정: 발급 기관이 클러스터마다 따로 만들어져 이 파일에 값을 넣지 않는다. root의 values-<클러스터>.yaml cluster.olive가 넘긴다.
  # 발급 기관이 생겨야 얻는 값이라 최초 발급의 전제가 아니다. 발급을 확인한 뒤 그 클러스터의 값을 넣는 PR로 넣는다.
  # 비면 ConfigMap과 볼륨이 생기지 않고, 감독·실행기 코드는 시작을 거부해야 한다.
  trustBundlePem: ""

# 역할별 작업자 실행기. 키는 targets.yaml의 id다(kind executor인 줄마다 하나 있어야 렌더된다).
# S-09의 "도는 작업 2 CPU·4GB"는 한 번에 하나 도는 작업자(B-07 작업자 1)의 몫이다. 진단·읽기에 그 절반씩을 줘서,
# 감독의 대기열이 깨져 둘이 함께 돌아도 합이 그 몫을 넘지 않는다. 가장 무거운 작성·검증(sandbox)은 이 차트 밖이다.
# 옛 대화 작업자(Claude CLI 하나)의 실측 working set 최고는 약 163MiB였다(platform/sandbox worker 주석). 진단은 격리 셸이 더해진다.
# 파드는 컨테이너 둘이다(D-100). resources는 제어(executor), role.resources는 역할 컨테이너, init.resources는 대리 설치(olive-init)다.
# 제어와 역할 limits의 합이 각 네임스페이스의 ResourceQuota가 된다(templates/resourcequota.yaml). 합은 1 CPU·2Gi다.
# 나눈 몫은 [가정]이다: 제어는 대기 중인 Bun 프로세스 하나라 작게 두고, 모델 CLI와 도구가 도는 역할 쪽에 나머지를 준다.
# limits는 CPU 정수 또는 m, 메모리 Mi·Gi만 받는다(values.schema.json). 합을 템플릿이 계산하기 때문이다.
# init은 실효 limits에 들지 않게 제어+역할 합보다 작게 둔다. 대리(약 104MiB)를 1MiB씩 읽어 해시하지만 복사의 페이지 캐시가
# 이 컨테이너의 메모리로 세어져 여유를 둔 256Mi다 [가정].
# store: 실행기 상태 저장소(D-75: 실행기 인스턴스마다 전용 로컬 PVC). 저장소 ID·정지 세대·실행 기록·영수증·nonce가 든다.
# 잃으면 같은 실행기로 이어지지 못하고 다시 등록하기 전까지 배정이 0이다. templates/executor-pvc.yaml 머리 주석.
#   storageClassName: 감독 장부와 같은 local-retain(values.schema.json이 이 값만 받는다. 올리브 격리 검사의 허용 클래스와 같다).
#   size: 작은 메타데이터 파일과 nonce마다 빈 파일 하나라 MB 단위로 본다 [가정]. local-path는 크기를 강제하지 않는다.
#   mountPath: 볼륨을 붙이는 곳. 실행기에 주는 저장소 경로(OLIVE_STORE_DIR)는 그 아래 store다(templates/executor-deployments.yaml).
# tls: 감독 tls와 같다. pki를 끄고 Secret을 직접 줄 때 mountPath가 제어의 다른 마운트(/tmp, /run/olive/agent, /run/olive/trust,
#   /run/olive/effect-signing, store.mountPath)나 /opt/olive-agent와 같거나 포개지면 렌더가 멈춘다(templates/_helpers.tpl olive.executorTlsPath).
# 효과 서명 키·인스턴스 이름은 값이 아니다. 인스턴스는 대상 id, 키는 Infisical /olive/executors/<인스턴스>/EFFECT_SIGNING_KEY다
# (templates/_helpers.tpl olive.instance·olive.effectKey.*).
executors:
  diagnosis:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
    role:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 900m
          memory: 1792Mi
    init:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
    tls:
      secretName: ""
      mountPath: /run/olive/tls
    store:
      storageClassName: local-retain
      size: 256Mi
      mountPath: /var/lib/olive-executor
  reader:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi
    role:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 900m
          memory: 1792Mi
    init:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 256Mi
    tls:
      secretName: ""
      mountPath: /run/olive/tls
    store:
      storageClassName: local-retain
      size: 256Mi
      mountPath: /var/lib/olive-executor

# 복구 스위치(설계 C.6.4 "클러스터 유실 + Infisical 장애"). root가 cluster.restore.externalSecrets: false일 때만 false로 넘긴다.
# 끄면 이 차트의 ExternalSecret과 Store를 내지 않는다. 같은 이름의 Secret은 사람이 손으로 만든다(restore.md 3절 U40).
externalSecrets:
  enabled: true
