# infisical은 root가 cluster.infisical에서 넘긴다. 여기는 빈 자리만 둔다(templates/clustersecretstore.yaml의 required).
infisical:
  projectSlug: ""
  environmentSlug: ""

# 감독과 실행기가 함께 쓰는 이미지 하나(D-54). 역할은 command로 고른다(templates/_helpers.tpl olive.pod).
# ukyi-app/olive main 빌드(app-build)가 GHCR에 올린 digest만 쓰고 사람 PR로만 바꾼다. 실행기는 모델 자격을 받으므로
# apps/의 digest 자동 병합 경로에 넣지 않는다(설계 C.4.4·C.4.7, platform/sandbox worker.image와 같은 이유).
# 빈 값이면 렌더가 실패한다(templates/_helpers.tpl olive.image). 켜는 PR이 실제 digest를 넣고, 그 전에는 root에서 꺼 둔다.
# 이미지 계약(ukyi-app/olive README "이미지 계약"): 비root uid·gid 65532, 루트 파일시스템 읽기 전용 전제, 쓰기는 /tmp만,
# 듣는 포트를 이미지에 적지 않음, 역할을 고르지 않으면 64·아직 구현되지 않은 역할은 69로 끝남.
image:
  repository: ghcr.io/ukyi-app/olive
  digest: ""

# 감독(ns olive-control). 장부·계정·지시 서명 키를 쥐고 hc와 Kubernetes 자격이 없다(D-37).
supervisor:
  # 실행기가 붙는 포트(D-55: 실행기가 감독에 먼저 붙어 연결을 유지한다). mTLS 연결이라 HTTPS 관례의 8443을 쓴다.
  # 이미지가 듣는 포트를 정하지 않으므로 env OLIVE_SUPERVISOR_PORT로 넘긴다.
  port: 8443
  # Service supervisor의 고정 주소. 실행기는 DNS 없이 이 주소로 붙는다(templates/networkpolicy-executors.yaml 머리 주석).
  # 서비스 대역(10.43.0.0/16)의 정적 구간(앞 256개)에서 고른다. 10.43.0.1(kubernetes)·10.43.0.10(kube-dns)·
  # 10.43.0.28(sandbox egress 프록시)과 겹치면 Service 생성이 실패하므로 values.schema.json이 그 셋을 거부한다.
  # 바꾸면 실행기 env(OLIVE_SUPERVISOR_ADDR)가 함께 바뀐다. 이미 뜬 실행기는 다시 떠야 새 주소를 읽는다.
  clusterIP: 10.43.0.29
  # S-09 출발점(감독 0.5 CPU·0.75GB, supervisor.md §11). 같은 값이 olive-control의 ResourceQuota(limits 합)가 된다.
  # cpu limit을 두는 이유: 그 ResourceQuota가 limits.cpu를 세면 cpu limit 없는 파드는 거부된다.
  # requests는 대기 중 Bun 프로세스 하나와 SQLite 기준의 [가정]이다. 실측이 쌓이면 맞춘다.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 768Mi
  # 장부(S-04: SQLite 파일 하나, 감독 하나만 쓴다, supervisor.md §8). templates/supervisor-pvc.yaml 머리 주석.
  ledger:
    # local-retain: 이 저장소의 로컬 영속 볼륨(adguard, vmsingle, 영속 Valkey와 같다). 노드 이름 같은 클러스터 값이 필요 없다.
    storageClassName: local-retain
    # 장부에는 원문과 자격 값을 넣지 않는다(§8). 실행·계정·장애 색인의 메타데이터라 MB 단위로 본다. WAL 여유를 둔 1Gi다.
    # local-path는 크기를 강제하지 않는다. 실제 상한은 노드 루트 파일시스템이다.
    size: 1Gi
    mountPath: /var/lib/olive
  # 지시 서명 키(Ed25519 개인 키, PEM). Infisical 폴더 /olive/supervisor의 키 이름 = Secret 키 = 감독이 읽는 파일 이름.
  # publicKeyPem: 짝 공개 키(PEM). 실행기가 지시를 검증하는 기준이고 pki.trustBundlePem과 같은 ConfigMap으로 실행기에만 붙는다.
  # 감독과의 연결로 받지 않고 Git에 고정하는 이유: 발급 기관 키가 새도 가짜 감독이 자기 공개 키를 건네 지시를 위조하지 못한다.
  # 비면 실행기에 검증 키가 없고, 실행기 코드는 시작을 거부해야 한다. 켜는 PR이 실제 값을 넣는다.
  signingKey:
    key: INSTRUCTION_SIGNING_KEY
    publicKeyPem: ""
  # 고정 모델 계정 하나(O09 할 일 8: 자리만, 순서·전환은 O17). accounts.md §6.2대로 계정별 원본 경로 /bot-accounts/<name>에서
  # 이 계정의 것만 감독 네임스페이스로 옮긴다. 공용 경로로 복사하지 않는다.
  # name이 비면 렌더가 실패한다. 켜는 PR이 계정 별칭(예: claude-work)을 넣는다.
  account:
    name: ""
    key: CLAUDE_CODE_OAUTH_TOKEN
  # 감독 포트로 들어올 수 있는 네임스페이스 가운데 이 차트가 만들지 않는 것(세션 olive-session, 작성 sandbox, 현관 app-homelab-bot).
  # 이 차트의 실행기 네임스페이스(targets.yaml의 kind executor)는 자동으로 들어간다. 지금 비운 이유: 그쪽 클라이언트가 아직 없고,
  # 열어 두면 붙을 코드가 생기기 전에 길부터 생긴다. 각 티켓(O10, O13, O08)의 PR이 자기 이름을 더한다.
  extraClientNamespaces: []
  # mTLS 인증서 Secret. 비어 있고 pki.enabled면 olive-tls를 쓴다. 둘 다 아니면 볼륨을 붙이지 않는다.
  tls:
    secretName: ""
    mountPath: /run/olive/tls

# 올리브 내부 인증서(D-58, templates/pki-ca.yaml·pki-leaf.yaml·pki-trust.yaml). 아래 수명·보관 자리·신원 규칙은 관리자가 배포 PR에서 고르는 안이다.
# 기본이 false인 이유: 안이 정해지기 전에 root에서 올리브를 켜도 발급 기관이 생기지 않게 하고, 켜는 PR이 이 값을 직접 바꾸게 한다.
# 함정: false로 root에서 켜면 파드에 인증서도 신뢰 묶음도 없다. 감독·실행기 코드는 그 상태에서 시작을 거부해야 한다.
pki:
  enabled: false
  ca:
    # 살아 있는 발급 기관의 세대 목록과 지금 서명하는 세대. 교체할 때만 둘이 된다(docs/runbooks-public/rotate.md 3i).
    generations: [1]
    activeGeneration: 1
    # 10년, 만료 1년 전 갱신. 갱신은 같은 키를 쓰므로(rotationPolicy Never) 이미 나간 leaf와 고정한 신뢰 묶음이 계속 맞는다.
    durationHours: 87600
    renewBeforeHours: 8760
  # 30일, 만료 10일 전 갱신. 폐기 목록이 없어 수명이 곧 유출 피해의 상한이고, 10일은 NUC가 멈췄을 때 갱신을 다시 시도할 여유다.
  # cert-manager는 발급 기관보다 오래 사는 leaf를 막지 않는다. 그래서 leaf 수명이 ca.renewBeforeHours보다 짧아야 렌더가 된다.
  leaf:
    durationHours: 720
    renewBeforeHours: 240
  # 상대를 확인할 발급 기관 인증서(PEM, 공개 값). 교체 중에는 옛·새 두 장을 이어 붙인다.
  # leaf Secret의 ca.crt를 쓰지 않는 이유: 갱신 때 검토 없이 바뀌므로 신뢰 기준이 사람의 PR을 거치지 않고 움직인다.
  # 발급 기관은 클러스터에서 처음 만들어지므로 켜는 순서는 pki.enabled → 발급 확인 → 이 값을 넣는 PR이다.
  # 비면 ConfigMap과 볼륨이 생기지 않고, 감독·실행기 코드는 시작을 거부해야 한다.
  trustBundlePem: ""

# 역할별 작업자 실행기. 키는 targets.yaml의 id다(kind executor인 줄마다 하나 있어야 렌더된다).
# S-09의 "도는 작업 2 CPU·4GB"는 한 번에 하나 도는 작업자(B-07 작업자 1)의 몫이다. 진단·읽기에 그 절반씩을 줘서,
# 감독의 대기열이 깨져 둘이 함께 돌아도 합이 그 몫을 넘지 않는다. 가장 무거운 작성·검증(sandbox)은 이 차트 밖이다.
# 옛 대화 작업자(Claude CLI 하나)의 실측 working set 최고는 약 163MiB였다(platform/sandbox worker 주석). 진단은 격리 셸이 더해진다.
# 같은 값이 각 네임스페이스의 ResourceQuota(limits 합)가 된다.
executors:
  diagnosis:
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        cpu: "1"
        memory: 2Gi
    tls:
      secretName: ""
      mountPath: /run/olive/tls
  reader:
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        cpu: "1"
        memory: 2Gi
    tls:
      secretName: ""
      mountPath: /run/olive/tls

# 복구 스위치(설계 C.6.4 "클러스터 유실 + Infisical 장애"). root가 cluster.restore.externalSecrets: false일 때만 false로 넘긴다.
# 끄면 이 차트의 ExternalSecret과 Store를 내지 않는다. 같은 이름의 Secret은 사람이 손으로 만든다(restore.md 3절 U40).
externalSecrets:
  enabled: true
