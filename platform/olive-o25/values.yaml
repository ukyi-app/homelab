# O25 시험 파드의 값. 켜고 끄는 스위치는 여기가 아니라 platform/root/values.yaml의 components.oliveO25.enabled다(기본 꺼짐).
#
# 되돌리기(검증이 끝나면):
#   1. 끄는 PR: components.oliveO25.enabled를 false로 되돌린다. root Application이 olive-o25 Application을 지우고,
#      그 Application의 resources-finalizer가 시험 ns와 안의 것을 함께 지운다(platform/root/templates/olive-o25.yaml).
#   2. 확인: kubectl get application -n argocd olive-o25 와 kubectl get namespace olive-o25-test 가 둘 다 NotFound.
#   3. 치우는 PR: platform/olive-o25/, platform/root/templates/olive-o25.yaml, values.yaml의 oliveO25 블록,
#      tools/olive-o25/, tools/ci/fixtures/platform/olive-o25/를 같은 PR에서 지운다. fixture만 남으면 CI가 그 fixture의
#      차트를 찾지 못해 실패한다. 2를 확인하기 전에 지우지 않는다.

# 파드에 넣는 hc. O02와 같은 고정 파일이다(platform/olive-o02/values.yaml의 같은 값과 같은 근거). 세 값은 함께 바꾼다.
hc:
  version: "0.1.21"
  url: https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz
  sha256: 78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1

# 제어 컨테이너의 전체 재시작 규칙(templates/session.yaml).
# enabled: false는 "규칙 누락" 시험 변형이다. 실행기는 첫 세대에서 일부러 전체 재시작을 요청해 규칙이 실렸는지 스스로 확인하므로
# (files/control.sh), 규칙이 없으면 실행기만 다시 떠 시작을 거부하고 CrashLoopBackOff에 머문다. 자격은 한 번도 나가지 않는다.
# exitCode는 실행기 스크립트가 환경변수 O25_RESTART_CODE로 같은 값을 받는다. 다른 이유로 끝나는 코드(1, 2, 126, 127, 137 등)와 겹치지 않게 고른다.
restartRule:
  enabled: true
  exitCode: 86

# 본체 자리 프로그램. 본체 PID 1(o25.py body-init)이 자격을 받고 중계에 붙은 뒤 pty에서 띄운다.
#   variant: shell   command의 대화형 셸. 중계로 셸 명령을 보내는 단계(relay·false-exit·plant·body-term)는 이 변형에서만 돈다.
#   variant: claude  아래 claude 핀의 고정 파일 /opt/claude/claude를 인자 없이 띄운다(command는 쓰지 않는다). 셸 단계는 거절되고
#                    claude-ui 단계만 돈다. 두 변형은 Recreate로 서로 다른 파드다(새 파드 UID·새 볼륨·새 장부).
body:
  variant: claude
  command: ["/bin/bash", "-i"]

# claude 변형의 Claude Code. 공식 배포처의 버전별 고정 파일이다(GPG 서명된 manifest.json의 platforms.linux-x64-musl).
# 지금 본체 이미지(netshoot, Alpine·musl)에서 도는 musl 배포본이다. glibc 배포본(linux-x64)은 이 이미지에서 돌지 않는다.
# version·url·sha256·size는 함께 바꾼다. 받는 쪽은 fetch-hc init(templates/session.yaml), 실행 전 대조는 본체 PID 1이다.
# memoryLimit은 claude 변형의 본체 상한이다(bodyLimits.memoryLimit 대신 쓴다. 첫 화면 리허설을 512Mi에서 했다).
claude:
  version: "2.1.325"
  url: https://downloads.claude.ai/claude-code-releases/2.1.325/linux-x64-musl/claude
  sha256: a5e3bd36dce97db0429705aa5c3573eea346a77938a89104b9c28fce409b20cd
  size: 352201992
  memoryLimit: 512Mi

# 컨테이너 상한. 본체에 따로 상한을 두어 본체의 메모리 초과가 제어 쪽을 죽이지 않게 한다(반박 검토 §2.4).
control:
  cpuLimit: 500m
  memoryLimit: 256Mi
bodyLimits:
  cpuLimit: 500m
  memoryLimit: 256Mi
