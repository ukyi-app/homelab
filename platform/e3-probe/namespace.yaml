# 시험 ns. app-* 이름이라 ClusterSecretStore infisical-apps의 conditions에 맞는다(설계 E3 동등 절차).
# platform/namespaces에 두지 않는다. 거기는 플랫폼 구성 요소 ns 목록이고 Prune=false라 시험 뒤에도 남는다.
# 앱 ns는 ApplicationSet apps가 만들고(T10), 봇 시험 ns도 봇 자리 차트가 스스로 선언한다(T08b). 같은 방식으로
# 이 Application이 소유해, 정리 PR이 Application을 지우면 ns째 함께 지워진다(root 템플릿의 finalizer).
# PSA는 앱 ns와 같은 restricted다(설계 B.8 E4 "앱 ns restricted").
apiVersion: v1
kind: Namespace
metadata:
  name: app-e3-probe
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
