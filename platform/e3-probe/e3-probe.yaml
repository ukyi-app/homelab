# 시험 ExternalSecret 1개와 Deployment 1개(설계 E3 "E3의 동등 절차"). 공유 차트(설계 C.4.5)가 낼 모양을 손으로 쓴다.
# 시나리오 6·7의 손 PR은 이 파일을 고친다:
# - 시나리오 6·7의 "새 키" PR: 아래 data[]와 env에 Infisical에 없는 키를 한 줄씩 더한다.
# - 시나리오 7의 "digest만" PR: Deployment의 image digest만 바꾼다(대체 digest는 image 줄 주석).
#
# 두 리소스에 sync-wave를 붙이지 않는다. ExternalSecret이 앞 wave면 그것이 Degraded일 때 Argo CD가 Deployment를
# 적용하지 않아, 시나리오 6이 보려는 "새 파드 CreateContainerConfigError, 옛 파드 Ready"가 생기지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e3-probe
  namespace: app-e3-probe
spec:
  # 설계 C.6.2의 앱 ExternalSecret과 같은 주기. 즉시 갱신은 annotation으로 한다(설계 C.6.5).
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-apps
  target:
    name: e3-probe
    # Secret은 이 ExternalSecret 하나가 소유한다. 지우면 Secret도 GC된다(설계 C.6.2).
    creationPolicy: Owner
    # Infisical에서 키가 사라져도 Secret을 지우지 않고 동기화 실패로 멈춘다. Delete·Merge는 빠진 키를 조용히
    # 건너뛴다(설계 B.8 E3). 기본값이지만 규칙이라 적는다.
    deletionPolicy: Retain
  # 키는 하나씩 적는다. dataFrom·find는 쓰지 않는다. 키가 없을 때 실패가 보이지 않는다(설계 C.6.1).
  data:
    - secretKey: PROBE_VALUE
      remoteRef:
        # store의 secretsPath(/apps)에 이어 붙는 상대 경로다. Infisical의 /apps/e3-probe/PROBE_VALUE를 읽는다.
        # /로 시작하는 절대 경로는 secretsPath를 무시하므로 앱 키는 상대 경로로 쓴다(U06, provider 문서).
        key: e3-probe/PROBE_VALUE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e3-probe
  namespace: app-e3-probe
  labels:
    app: e3-probe
spec:
  replicas: 1
  # 시나리오 6·7은 새 파드가 실패해도 옛 파드가 Ready로 남아야 한다. 그래서 옛 파드를 먼저 내리지 않게 고정한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      # 설계 시나리오 7 명령(kubectl -n app-e3-probe delete pod -l app=e3-probe)이 이 라벨을 쓴다. selector는 불변이다.
      app: e3-probe
  template:
    metadata:
      labels:
        app: e3-probe
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          # busybox 1.38.0-musl(멀티 아키텍처 index digest, 2026-10-20 Docker Hub에서 확인). 시나리오 7의
          # digest만 바꾸는 PR로 같은 버전 musl 변형이 됐다. 원래 glibc 변형:
          # sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          image: docker.io/library/busybox@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
          command: ["sleep", "2147483647"]
          env:
            # 키마다 secretKeyRef로 넣고 optional을 적지 않는다(기본 false). Secret에 키가 없으면 새 파드가
            # CreateContainerConfigError로 시작하지 않는다. envFrom은 빠진 키를 알리지 않고 파드를 띄운다(설계 C.4.5).
            # env Secret 값은 파드를 다시 만들어야 바뀐다. 회전 절차의 마지막에 rollout restart(설계 B.8 E3).
            - name: PROBE_VALUE
              valueFrom:
                secretKeyRef:
                  name: e3-probe
                  key: PROBE_VALUE
          # 값이 비어 있지 않을 때만 Ready다. 값은 출력하지 않는다.
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$PROBE_VALUE\""]
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
