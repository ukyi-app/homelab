{{- /*
자리: appset-apps. 맡은 티켓 T10, wave 0(설계 C.3.1). ApplicationSet apps(platform/appsets/apps, 작은 Helm 차트).
AppProject apps는 project-apps.yaml(wave -11)이라 ApplicationSet보다 먼저 있다.
클러스터 값 cluster.tailscale.prefix를 넘긴다. 앱 내부 Ingress 이름의 접두다(운영 "", VM "vm-").
켜기: values.yaml의 components.appsetApps.enabled.
이 Application에 resources-finalizer를 붙이지 않는다. ApplicationSet이 지워지면 생성된 앱 Application이 모두
cascade로 지워지기 때문이다(앱 Application에는 ApplicationSet이 resources-finalizer를 붙인다). 끄면 ApplicationSet이 남는다.
*/}}
{{- $ts := .Values.cluster.tailscale | default dict }}
{{- if not (hasKey $ts "prefix") }}
{{- fail "cluster.tailscale.prefix is missing in values-<cluster>.yaml (prod \"\", vm \"vm-\")" }}
{{- end }}
{{- if .Values.components.appsetApps.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appset-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/appsets/apps
    helm:
      valuesObject:
        tailscale:
          prefix: {{ $ts.prefix | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
