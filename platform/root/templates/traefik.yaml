{{- /*
traefik: 공개 HTTP 라우팅. 맡은 티켓 T08a, wave -5(설계 C.3.1, C.3.4).
cloudflared가 http://traefik.traefik.svc:80 으로 보낸 요청을 Ingress host로 나눈다. 모르는 host는 404다.
Service는 ClusterIP라 LAN·tailnet에서 직접 닿지 않는다. Ingress class traefik 하나, 엔트리포인트 web 하나.
Gateway API·내부 TLS 리스너·IngressRoute CRD는 쓰지 않는다(설계 A.4 8번).
켜기: values.yaml의 components.traefik.enabled. 꺼져 있으면 아무것도 렌더하지 않는다.
*/}}
{{- if .Values.components.traefik.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    # 차트 42.0.0(Traefik v3.7.14)은 2026-10-20 기준 최신(U14). 42의 깨지는 변경(Kubernetes 1.30 이상,
    # Traefik Hub Secret 권한, 투명성 로그)은 이 구성에 해당하지 않는다.
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.0.0
    helm:
      # Traefik CRD(IngressRoute 등)는 쓰지 않으므로 설치하지 않는다. 아래 kubernetesCRD provider도 끈다.
      skipCrds: true
      valuesObject:
        deployment:
          replicas: 1
        service:
          type: ClusterIP
        ports:
          # TLS는 Cloudflare 가장자리에서 끝난다. 터널 안쪽은 평문 HTTP 하나다.
          # 라우터가 기본으로 web에만 붙게 한다. 차트의 websecure 엔트리포인트를 없애려면 값에 null을 넣어야 하는데,
          # Application valuesObject의 null은 root sync에서 지워져(merge patch의 null은 키 삭제) selfHeal이 계속 다시 넣는다.
          # 그래서 websecure는 Service에 내지 않고 라우터도 붙지 않게만 둔다.
          web:
            asDefault: true
          websecure:
            expose:
              default: false
        providers:
          kubernetesCRD:
            enabled: false
          kubernetesIngress:
            # 기본값 true. Ingress status에 Service 주소를 적어야 Argo CD Ingress health가 Healthy가 된다.
            # 비어 있으면 앱 Application이 Progressing에 머문다.
            publishedService:
              enabled: true
        # 차트 기본값은 Gateway·GatewayClass를 만든다. Gateway API CRD가 없고 쓰지도 않는다.
        # 옛 구성은 Gateway CRD wave 순서로 17시간 교착했다(설계 P22).
        gateway:
          enabled: false
        gatewayClass:
          enabled: false
        ingressClass:
          enabled: true
          # 기본 class가 되면 class를 안 적은 Ingress까지 공개 경로에 올라탄다. 공유 차트가 늘 class를 적는다.
          isDefaultClass: false
          name: traefik
        log:
          format: json
          level: INFO
        # JSON 접근 로그를 stdout으로. 수집은 T08b(관측).
        accessLog:
          enabled: true
          format: json
        # serviceAccount.name을 지정하면 차트가 SA를 만들지 않는다(설계 P22 함정). 기본 이름을 쓴다.
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          # 옛 실측 최대 25Mi의 약 4배(설계 P22). GOMEMLIMIT은 차트가 limits.memory에서 만든다.
          limits:
            memory: 96Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
