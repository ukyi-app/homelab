{{- /*
observability: T08b, wave -4(설계 C.3.1). 메트릭·로그·경보 스택(설계 C.3.7).
source 둘을 한 Application으로 묶는다: platform/observability/stack(kustomize. 룰·알림 템플릿의 {{ }}가 Helm과
부딪히지 않게)과 platform/observability/ingress(Grafana 내부 Ingress. 클러스터 접두를 valuesObject로 받는다).
켜기: values.yaml의 components.observability.enabled. 켜기 전에 Infisical에 /platform/alerting·/platform/observability
키를 넣는다. 키가 없으면 ExternalSecret이 Degraded라 이 Application도 Degraded이고 root가 뒤 wave를 기다린다.
*/}}
{{- if .Values.components.observability.enabled }}
{{- $ts := .Values.cluster.tailscale | default dict }}
{{- /* 운영 접두는 빈 문자열이라 required를 쓸 수 없다. 키가 있는지로 확인한다. */}}
{{- if not (hasKey $ts "prefix") }}
{{- fail "cluster.tailscale.prefix is missing in values-<cluster>.yaml (prod \"\", vm \"vm-\")" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  sources:
    - repoURL: {{ include "homelab.repoURL" . }}
      targetRevision: main
      path: platform/observability/stack
    - repoURL: {{ include "homelab.repoURL" . }}
      targetRevision: main
      path: platform/observability/ingress
      helm:
        valuesObject:
          tailscale:
            prefix: {{ $ts.prefix | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
