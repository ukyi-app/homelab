{{- /*
자리: appset-data. 맡은 티켓 T11, wave 0(설계 C.3.1). ApplicationSet data(platform/appsets/data, 작은 Helm 차트).
AppProject data는 project-data.yaml(wave -11)이라 ApplicationSet보다 먼저 있다.
클러스터 값 cluster.backup.bucket을 넘긴다. 영속 Valkey 백업이 쓰는 R2 버킷이다(운영 homelab-backups, VM 전용 버킷, E8).
같은 키를 CNPG ObjectStore도 읽는다(t11-cnpg). 값 파일 블록은 그쪽 PR이 더한다.
켜기: values.yaml의 components.appsetData.enabled.
이 Application에 resources-finalizer를 붙이지 않는다. ApplicationSet이 지워지면 생성된 데이터 Application이 cascade로
지워진다(데이터 리소스 자체는 보호 주석으로 남지만 지울 이유가 없다). 끄면 ApplicationSet이 남는다.
*/}}
{{- if .Values.components.appsetData.enabled }}
{{- $bucket := ((.Values.cluster.backup | default dict).bucket) | default "" }}
{{- if not $bucket }}
{{- fail "cluster.backup.bucket is missing in values-<cluster>.yaml (prod homelab-backups, vm 전용 버킷)" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: appset-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/appsets/data
    helm:
      valuesObject:
        backup:
          bucket: {{ $bucket | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
