{{- /*
olive-o25: 올리브 계획 O25의 임시 시험 파드(본체를 같은 세션 파드의 다른 uid 컨테이너로 떼는 구조, D-47). 원본 platform/olive-o25, ns olive-o25-test.
켜기: values.yaml의 components.oliveO25.enabled(기본 false). 꺼져 있으면 아무것도 렌더하지 않는다. 클러스터 값은 받지 않는다.
모델 자격·시크릿·SA 토큰이 없다. ExternalSecret이 없어 복구 스위치도 받지 않는다.

wave 1: 맨 뒤 wave(봇 자리·go와 같다). 시험 파드가 뜨지 못해도(hc 내려받기 실패, 규칙 누락 변형의 CrashLoopBackOff) 다른 구성 요소를 막지 않는다.

resources-finalizer를 붙인다(platform/root/templates/olive-o02.yaml과 같은 이유). 끄면 Application 삭제가 시험 ns와 안의 것의 삭제로 번진다.
함정: ns 삭제가 끝나지 않으면 Application이 Terminating으로 남는다. 그때는 kubectl get all -n olive-o25-test로 남은 것을 본다.

VM: components는 운영과 VM이 함께 쓴다. VM 클러스터가 떠 있을 때 켜면 VM에도 같은 파드가 뜬다.
*/}}
{{- if .Values.components.oliveO25.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: olive-o25
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/olive-o25
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
