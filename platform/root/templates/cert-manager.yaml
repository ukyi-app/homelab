{{- /*
자리: cert-manager. 맡은 티켓 T08a, wave -7(설계 C.3.1). 클러스터 안 인증서만(Barman plugin TLS).
켜기: values.yaml의 components.certManager.enabled를 true로 바꾼다. 꺼져 있으면 아무것도 렌더하지 않는다.
source와 destination은 자리표시다. 맡은 티켓이 정한다(외부 Helm 차트면 chart와 고정 semver, _helpers.tpl).
*/}}
{{- if .Values.components.certManager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
