{{- /*
cert-manager: 클러스터 안 인증서만(Barman plugin TLS, T11이 쓴다). 맡은 티켓 T08a, wave -7(설계 C.3.1).
DNS-01용 Cloudflare 토큰과 ClusterIssuer는 두지 않는다(D-08). 공개 인증서는 Cloudflare가, 내부 UI는 Tailscale이 낸다.
켜기: values.yaml의 components.certManager.enabled. 꺼져 있으면 아무것도 렌더하지 않는다.
외부 차트 하나라 platform/cert-manager 디렉터리는 없다(external-secrets operator와 같은 방식).
*/}}
{{- if .Values.components.certManager.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    # v1.21.2는 2026-10-20 기준 최신 안정판(charts.jetstack.io index, U14).
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        # CRD를 차트 템플릿으로 설치한다. crds.keep 기본값(true)이라 차트를 지워도 CRD와 인증서는 남는다.
        crds:
          enabled: true
        # 이미지는 digest로 고정한다(quay.io/jetstack, v1.21.2 멀티 아키텍처 index, 2026-10-20 확인).
        # 차트는 tag와 digest를 함께 렌더하고 pull은 digest로만 한다.
        image:
          digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
        acmesolver:
          image:
            digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
        # 설치 직후 API 확인 Job은 Helm post-install 훅이라 Argo CD에서는 PostSync 훅이 된다.
        # webhook이 늦게 뜨면 sync를 실패로 남기므로 끄고, 준비 확인은 Deployment health와 시험 Certificate로 한다.
        startupapicheck:
          enabled: false
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        webhook:
          image:
            digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        cainjector:
          image:
            digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # CRD가 커서 client-side apply의 last-applied 주석 한도(256KB)를 넘을 수 있다.
      - ServerSideApply=true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
