# AppProject apps(설계 C.3.3 AppProject 표). ApplicationSet apps가 만드는 앱 Application이 쓴다.
# T07이 표대로 미리 두었고, T10이 Namespace 허용과 ReplicaSet·Pod를 더했다(설계 C.3.3 표 갱신).
# ApplicationSet 템플릿의 project는 고정값이어야 한다. 값으로 열면 앱 등록이 이 경계를 고를 수 있다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-11"
spec:
  description: App deployments from ApplicationSet apps
  sourceRepos:
    - https://github.com/ukyi-app/homelab
  destinations:
    - server: https://kubernetes.default.svc
      namespace: app-*
  # cluster-scoped는 Namespace app-* 하나만. ApplicationSet apps가 CreateNamespace와 managedNamespaceMetadata로
  # 앱 ns를 만들고, Argo CD는 그 Namespace도 프로젝트 허용을 검사한다. 없으면 매 sync가
  # "resource :Namespace is not permitted in project apps"로 실패한다(v3.5.5 gitops-engine sync_context.go의
  # autoCreateNamespace가 권한 검사 앞에 Namespace 작업을 넣는다. T10 조사). name은 glob이다(v3.5.5부터 지원).
  # 다른 cluster-scoped kind는 목록에 없어 모두 거부된다.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
      name: app-*
  # Secret은 목록에 없다. 앱 Secret은 ExternalSecret으로 ESO가 만든다.
  # ReplicaSet·Pod는 차트가 만들지 않지만 넣는다. 이 목록은 UI 리소스 트리도 거른다. 빠지면 Deployment·Job 아래가
  # 안 보이고 Argo CD의 파드 로그도 못 본다(옛 projects.yaml:23-24, v3.5.5 appcontroller.go의 트리 필터).
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: external-secrets.io
      kind: ExternalSecret
    - group: batch
      kind: Job
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: policy
      kind: PodDisruptionBudget
    - group: apps
      kind: ReplicaSet
    - group: ""
      kind: Pod
