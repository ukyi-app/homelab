{{- /*
cloudflared: 원격 관리 터널 커넥터. 맡은 티켓 T08a, wave -5(설계 C.3.1, C.3.4). 원본 platform/cloudflared.
터널·ingress 규칙·DNS는 infra/cloudflare(Terraform)에 있다. 토큰은 Infisical /platform/cloudflared → ESO.
켜기: values.yaml의 components.cloudflared.enabled. 터널을 Terraform으로 만들고 토큰을 Infisical에 넣은 뒤 켠다.
토큰 없이 켜면 ExternalSecret이 SecretSyncedError라 root가 이 wave에서 멈춘다.
*/}}
{{- if .Values.components.cloudflared.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
