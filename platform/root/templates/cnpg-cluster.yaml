{{- /*
cnpg-cluster: 공유 Cluster pg, ObjectStore, ScheduledBackup, R2 자격, database ns NetworkPolicy. wave -3(설계 C.3.1).
클러스터 값 cluster.backup.bucket과 cluster.cnpg(serverName, 복구 때만 recoverySource)를 받는다(platform/cnpg/cluster).
켜기 전에 Infisical /platform/backup의 R2 키 셋이 있어야 한다. 없으면 ExternalSecret이 Degraded라 이 Application이
멈추고, root가 뒤 wave(sandbox, ApplicationSet, 봇 자리)를 기다린다.
selfHeal을 켠 채 둔다(D-05). 빈 NUC 복구는 root apply 전에 복구 PR을 병합하는 순서로 한다(설계 C.6.4).
*/}}
{{- if .Values.components.cnpgCluster.enabled }}
{{- $backup := .Values.cluster.backup | default dict }}
{{- $cnpg := .Values.cluster.cnpg | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/cnpg/cluster
    helm:
      valuesObject:
        backup:
          bucket: {{ required "cluster.backup.bucket is required in values-<cluster>.yaml" $backup.bucket | quote }}
        cnpg:
          serverName: {{ required "cluster.cnpg.serverName is required in values-<cluster>.yaml" $cnpg.serverName | quote }}
          {{- with $cnpg.recoverySource }}
          recoverySource:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with include "homelab.externalSecretsValues" . }}{{ . | nindent 8 }}{{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  # homelab db restore-check가 Cluster pg에 결과를 남기는 annotation 두 키(cli core kubectl.ts). Git에는 초기값을
  # 두지 않는다. 두 키만 jsonPointers로 빼서 selfHeal·sync가 지우지도, OutOfSync로 보지도 않게 한다(~1은 키 안의 /).
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: pg
      namespace: database
      jsonPointers:
        - /metadata/annotations/homelab.ukyi.app~1restore-check-last
        - /metadata/annotations/homelab.ukyi.app~1restore-check-pass
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # 함정: ignoreDifferences는 diff만 가린다. 이 옵션이 없으면 다른 이유의 sync가 Git 매니페스트대로 덮어쓸 수 있다.
    # 이 옵션은 위 ignoreDifferences에 든 필드만 sync에서 빼므로
    # 다른 리소스와 다른 필드의 sync 동작에는 영향이 없다(Argo CD sync-options 문서). 처음 만드는 리소스에는 적용되지 않는다.
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
