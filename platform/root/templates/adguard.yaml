{{- /*
adguard: T08a, wave -5(설계 C.3.1). LAN :53 DNS와 Tailscale 관리 UI.
켜기: values.yaml의 components.adguard.enabled를 true로 바꾼다. 꺼져 있으면 아무것도 렌더하지 않는다.
*/}}
{{- if .Values.components.adguard.enabled }}
{{- $tailscale := .Values.cluster.tailscale | default dict }}
{{- /* 운영의 빈 접두는 유효하다. 값에 required를 걸면 운영도 실패하므로 키 존재 여부를 검사한다. */}}
{{- $_ := required "cluster.tailscale.prefix is missing in values-<cluster>.yaml" (ternary "present" "" (hasKey $tailscale "prefix")) }}
{{- if not (kindIs "string" $tailscale.prefix) }}
{{- fail "cluster.tailscale.prefix must be a string" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/adguard
    helm:
      valuesObject:
        tailscale:
          prefix: {{ $tailscale.prefix | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
