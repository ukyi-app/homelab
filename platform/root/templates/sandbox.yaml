{{- /*
sandbox: 격리 작업 공간(ns sandbox)과 허용 목록 egress 프록시(ns egress). 맡은 티켓 T08b, wave -2(설계 C.3.1, C.8).
두 ns에 걸쳐 destination.namespace를 비운다. 리소스마다 metadata.namespace를 적는다.
켜기: values.yaml의 components.sandbox.enabled. 클러스터 값 cluster.infisical을 받는다(작업자 전용 store infisical-sandbox).

켜기 전 사람 작업: Infisical(운영 homelab/prod, VM homelab-dev/dev)에 폴더 /apps/homelab-bot/worker와 시험 키 WORKER_PROBE.
없으면 store가 Ready=False(Degraded)라 root가 이 wave에서 멈추고 뒤 wave(appset-apps·appset-data, bot-slot, go)가 적용되지 않는다.
*/}}
{{- if .Values.components.sandbox.enabled }}
{{- $infisical := .Values.cluster.infisical | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/sandbox
    helm:
      valuesObject:
        infisical:
          projectSlug: {{ required "cluster.infisical.projectSlug is missing in values-<cluster>.yaml" $infisical.projectSlug | quote }}
          environmentSlug: {{ required "cluster.infisical.environmentSlug is missing in values-<cluster>.yaml" $infisical.environmentSlug | quote }}
        {{- with include "homelab.externalSecretsValues" . }}{{ . | nindent 8 }}{{- end }}
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
