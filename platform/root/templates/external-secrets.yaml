{{- /*
자리: external-secrets. 맡은 티켓 T09(설계 C.3.1). ESO operator는 wave -8, ClusterSecretStore는 wave -7이다.
둘을 다른 Application으로 나눠, root가 operator(webhook 포함)의 Healthy를 기다린 뒤 Store를 만들게 한다.
Store는 operator가 Ready로 만든다. 같은 wave에 두면 그 주체가 앞 wave에 없어 교착할 수 있다(설계 C.3.3 wave 규칙).
켜기: values.yaml의 components.externalSecrets.enabled를 true로 바꾼다. 꺼져 있으면 아무것도 렌더하지 않는다.
source와 destination은 자리표시다. T09가 정한다(외부 Helm 차트면 chart와 고정 semver, _helpers.tpl).
Store가 읽을 Infisical 프로젝트·환경은 클러스터 값(cluster.infisical)으로 받는다(E8 VM 격리 1·2번).
*/}}
{{- if .Values.components.externalSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/external-secrets/operator
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/external-secrets/stores
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
