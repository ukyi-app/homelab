{{- /*
external-secrets: ESO operator(wave -8)와 ClusterSecretStore(wave -7). 맡은 티켓 T09(설계 C.3.1, C.6).
둘을 다른 Application으로 나눠, root가 operator(webhook 포함)의 Healthy를 기다린 뒤 Store를 만들게 한다.
Store는 operator가 Ready로 만든다. 같은 wave에 두면 그 주체가 앞 wave에 없어 교착할 수 있다(설계 C.3.3 wave 규칙).
켜기: values.yaml의 components.externalSecrets.enabled. 꺼져 있으면 아무것도 렌더하지 않는다.
Store가 읽을 Infisical 프로젝트·환경은 클러스터 값(cluster.infisical)으로 받는다(E8 VM 격리 1·2번).
*/}}
{{- if .Values.components.externalSecrets.enabled }}
{{- $infisical := .Values.cluster.infisical | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    # 공식 차트. ESO는 최신 minor 하나만 지원하고 2~3주마다 새 minor가 나온다(설계 B.8 E3, D-18 갱신 대상).
    # v2.10.0 미만으로 내리지 않는다(#6821 수정, 설계 C.6.1).
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.13.0
    helm:
      valuesObject:
        # CRD는 차트 templates/crds에 있어 일반 리소스로 렌더된다(차트 crds/ 디렉터리가 아님).
        # 그래서 Argo CD helm 렌더에서 빠지지 않는다. v1beta1은 차트 기본값대로 served가 아니다.
        installCRDs: true
        # webhook 인증서는 차트의 cert-controller가 스스로 만든다. cert-manager(T08a, wave -7)에 기대지 않는다.
        # 기대면 ESO(-8)가 더 뒤 wave의 cert-manager를 기다려 교착한다.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ClusterSecretStore·SecretStore CRD가 각각 약 700KB라 client-side apply의 last-applied 주석 한도(256KB)를 넘는다.
      - ServerSideApply=true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    repoURL: {{ include "homelab.repoURL" . }}
    targetRevision: main
    path: platform/external-secrets   # 디렉터리는 설계 C.1 이름. operator는 외부 차트라 이 디렉터리에는 Store 차트만 있다
    helm:
      # 클러스터 값은 이 두 키만 넘긴다. 시크릿 키 이름은 클러스터마다 바꾸지 않는다(E8 VM 격리 1번).
      valuesObject:
        infisical:
          projectSlug: {{ required "cluster.infisical.projectSlug is missing in values-<cluster>.yaml" $infisical.projectSlug | quote }}
          environmentSlug: {{ required "cluster.infisical.environmentSlug is missing in values-<cluster>.yaml" $infisical.environmentSlug | quote }}
  destination:
    server: https://kubernetes.default.svc
    # namespace를 적지 않는다. ClusterSecretStore는 cluster-scoped다.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      {{- include "homelab.retry" . | nindent 6 }}
{{- end }}
