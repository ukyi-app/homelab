# 시나리오 13의 검증 VM 클러스터 값(E8 VM 격리 1번). root-vm.yaml이 helm.valueFiles로 읽는다.
# values-prod.yaml과 키 모양이 같다. VM 격리 값(접두, Infisical 프로젝트·환경, 버킷, serverName)이 운영과 다른지는
# root 렌더가 단언한다(templates/cluster-check.yaml). 복구 시험 때 바꾸는 값과 순서는 restore.md 3절의 VM 시험 줄이다.
# VM은 운영이 쓰는 외부 상태(Infisical 운영 값, 백업 prefix, tailnet 이름, 공개 터널, 감시 체크)에 쓰지 않는다.
cluster:
  name: vm

  # VM은 homelab-dev / dev만 읽는다(identity eso-homelab-dev, E8 VM 격리 2번).
  # 이 값이 실수로 운영 프로젝트를 가리켜도 eso-homelab-dev는 homelab에 들지 않아 거부된다(설계 C.6.3).
  infisical:
    projectSlug: ukyi-homelab-dev
    environmentSlug: dev

  # 접두 vm-(예: vm-argocd, operator 기기 이름 vm-tailscale-operator, E8 VM 격리 4번).
  tailscale:
    prefix: vm-

  # VM 전용 버킷. 운영 버킷에 쓰지 않는다. 사람이 시나리오 13 전에 이 이름으로 만들고 VM 폐기 때 지운다.
  # 이 버킷 전용 R&W 토큰은 homelab-dev /platform/backup에 운영과 같은 키 이름으로 둔다(ESO가 r2-backup으로 만든다).
  backup:
    bucket: homelab-backups-vm

  # serverName pg-vm-<YYYYMMDD>(복구 PR이 시험 날짜로 바꾼다). 복구 PR은 recoverySource에 운영 serverName,
  # bucket homelab-backups, credentialsSecret r2-source-readonly(root apply 전에 손으로 넣는 운영 버킷 읽기 전용 자격)를
  # 넣는다. bucket을 빠뜨리면 VM 버킷을, credentialsSecret을 빠뜨리면 VM 자격(r2-backup)을 써서 복구가 원본을 못 읽는다.
  # 정리 PR이 recoverySource를 지운다(시나리오 13, E8 VM 격리 3번, 설계 C.6.4, restore.md 3절).
  cnpg:
    serverName: pg-vm-20261029

  # T16b D8(values-prod.yaml 주석). host/clusters/vm.env의 NODE_IP/32(libvirt NAT 예약 주소)이고 ci가 대조한다.
  # 라이브 VM과는 대조하지 않았다. VM에 root를 적용할 때 default/kubernetes EndpointSlice 주소와 같은지 본다.
  kubernetesApi:
    endpointCIDRs:
      - 192.168.122.10/32

  # 원장 PV(values-prod.yaml 주석). VM에는 운영 SSD가 없어 비운다. 비면 bot-slot이 PV·StorageClass를 만들지 않아
  # 원장을 쓰는 봇의 PVC(data/homelab-bot)는 Pending이고 봇 파드도 뜨지 않는다. VM에서 봇을 띄우려면 VM 디스크의 합성 원장
  # 경로를 정해 여기에 nodeName(host/clusters/vm.env의 NODE_NAME)과 path를 넣는다(그 경로 준비는 VM 호스트에서).
  deletionLedger: {}

  # 봇 작업 레인 볼륨의 노드(values-prod.yaml 주석). 원장과 달리 VM에도 둔다. task.enabled는 운영과 VM이 함께 쓴다.
  taskStateVolume:
    nodeName: vm-node

  # R08 수신 경로(values-prod.yaml 주석). VM은 끈다. 사용자 승인이 운영뿐이고 templates/cluster-check.yaml이 VM에서 켜면 렌더를 막는다.
  r08:
    enabled: false

  # 올리브(values-prod.yaml 주석, D-116). VM이 먼저 켜고 인증서를 처음 발급하는 클러스터다. 두 enabled는
  # tools/ci/olive.ts OLIVE_CLUSTER_STATE의 vm 줄과 같아야 한다. 세대 번호는 운영과 따로 센다.
  # 공개 값 둘은 VM 발급 기관과 VM 감독 키에서 읽은 값만 넣는다. 운영 값을 옮겨 적지 않는다. 비어 있는 동안 파드를 켜지 않는다(rotate.md 3i).
  # registryEnvironment(values-prod.yaml 주석): vm이다(D-125). 감독은 시험 현관 대역을 OLIVE_ENVIRONMENT가 이 이름과 글자까지 같을 때만 받고
  #   (ukyi-app/olive의 상수), CI(tools/ci/olive.ts olive-test-values)도 대역을 켠 렌더에서 vm이 아니면 거절한다. 바꾸면 대역이 꺼진다.
  #   VM Infisical의 등록표 문서 environment도 같은 vm이어야 한다(다르면 감독이 등록표를 적용하지 않는다).
  # test(values-prod.yaml 주석): 시험 값을 켤 수 있는 유일한 클러스터다. frontDoor는 jobs와 함께만 켠다
  #   (jobs 없이 켜면 감독이 91로 끝나 root 렌더가 먼저 멈춘다). 함정: 대역을 켠 장부를 나중에 실제 현관과 쓰지 않는다.
  # roleImages·roleProfiles(values-prod.yaml 주석): T1의 모델 없는 고정 프로그램(D-118). 공개 glibc 이미지 debian:trixie-slim(13.8-slim과
  #   같은 digest, 2026-11-23 빌드)의 /bin/sh가 정해진 결과 JSON 한 줄을 찍고 끝난다. digest는 다중 아키텍처 목록의 것이고 linux/amd64를 담는다.
  #   그 이미지 설정은 ENV가 PATH 하나(BUN_·LD_·NODE_CHANNEL_FD 없음), USER 없음이라 차트의 uid·gid 10002로 돈다(2026-11-26 레지스트리에서 읽음).
  #   두 역할이 같은 이미지·같은 revision이다. 감독은 기대 revision을 하나만 쓴다(platform/olive/values.yaml roleProfiles 함정).
  #   함정: VM 계정 Secret의 가짜 토큰은 아래 글(program·cwd·argv·env 값)과 결과 JSON에 들어 있지 않은 값으로 둔다. 들어 있으면 실행기가
  #   띄우기를 거절하거나 결과를 실패로 바꾼다. 결과 role은 그 실행기의 역할이다.
  #   함정: 시험 전용 값이다. 운영 값에 옮겨 적지 않는다(운영은 모델 CLI가 든 역할 이미지와 실제 프로필, O11·O12).
  olive:
    enabled: true
    pki:
      enabled: true
      generations: [1]
      activeGeneration: 1
    trustBundlePem: |
      -----BEGIN CERTIFICATE-----
      MIIBgjCCASigAwIBAgIUZJ1ioENhysDOIpmF4yKuozfgeBswCgYIKoZIzj0EAwIw
      HzEdMBsGA1UEAxMUb2xpdmUtaW50ZXJuYWwtY2EtZzEwHhcNMjYxMTI2MDc1NjMy
      WhcNMzYxMTIzMDc1NjMyWjAfMR0wGwYDVQQDExRvbGl2ZS1pbnRlcm5hbC1jYS1n
      MTBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABCITD4NSjr699bmjYQlh8O4CoBZ0
      3Vt61IgWosAeNs5SNcPBXCJw3NHBm3SRRnP738RFwRBd5Jiuh8TzBp6VXJGjQjBA
      MA4GA1UdDwEB/wQEAwIBBjAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBRa4ErB
      MKnuWmLvoXlph8B44BBPMjAKBggqhkjOPQQDAgNIADBFAiAmzeMiN/+GW6XNDACT
      KIZh2hZqmtHoGi11sB04vwY55gIhAKsE/R1cnoPSrdFXAclU7Cd6m3mZBtcFxAUs
      fmEVKhrc
      -----END CERTIFICATE-----
    supervisorSigningPublicKeyPem: |
      -----BEGIN PUBLIC KEY-----
      MCowBQYDK2VwAyEABoVC9JDkYQIcd7gDjE4C4FZJkuGsGP+hkC3XPwmLPPI=
      -----END PUBLIC KEY-----
    registryEnvironment: vm
    test:
      jobs: true
      frontDoor: true
    roleImages:
      diagnosis:
        repository: docker.io/library/debian
        digest: sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
      isolated_reader:
        repository: docker.io/library/debian
        digest: sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0
    roleProfiles:
      diagnosis:
        revision: t1-fixed-1
        program: /bin/sh
        argv: ["-c", "printf '%s\\n' \"$FIXED_RESULT\""]
        cwd: /tmp
        env:
          FIXED_RESULT: '{"role":"diagnosis","outcome":"completed","summary":"T1 고정 시험 프로그램의 결과(모델 없음, D-118)","items":[],"refs":[]}'
        credentialEnv: CLAUDE_CODE_OAUTH_TOKEN
      isolated_reader:
        revision: t1-fixed-1
        program: /bin/sh
        argv: ["-c", "printf '%s\\n' \"$FIXED_RESULT\""]
        cwd: /tmp
        env:
          FIXED_RESULT: '{"role":"isolated_reader","outcome":"completed","summary":"T1 고정 시험 프로그램의 결과(모델 없음, D-118)","items":[],"refs":[]}'
        credentialEnv: CLAUDE_CODE_OAUTH_TOKEN

  # 복구 동안 이 클러스터에서만 앱과 영속 Valkey를 멈춘다(restore.md 3절, 설계 C.6.4). 평소에는 빈 값이다.
  # apps/·data/의 values는 운영과 VM이 함께 읽어, VM 복구 PR이 거기에 suspended·running을 적으면 운영 앱도 멈춘다.
  # 그래서 VM은 이 값으로 주입한다(사용자 결정). ApplicationSet apps·data가 이 앱에만 값을 덮어쓴다.
  # - suspendedApps: 앱 이름 목록. 그 앱에 suspended: true(replicas 0, 마이그레이션 Job 없음). 앱 차트 1.1.0부터라
  #   1.0.0 앱을 넣으면 VM 렌더가 schema로 실패한다.
  # - valkey: 앱 이름 → stopped(running: false, 1절 1단계) 또는 restoreMode(running: true + restoreMode: true, 1절 3단계).
  #   영속 Valkey(valkey.persistent: true)인 앱만. 항목을 지우면 data values 그대로다(1절 5단계).
  # - externalSecrets: false(따옴표 없이)면 Store와 모든 ExternalSecret을 렌더하지 않는다(클러스터 유실 + Infisical 장애, U40).
  #   ESO operator는 남고 같은 이름 Secret은 손으로 만든다. 앱 차트 1.2.0·데이터 차트 1.1.0 미만 앱이 있으면 ci render가
  #   그 앱을 적고 실패한다(먼저 올린다). 평소에는 키를 두지 않는다(없으면 켬). 순서는 restore.md 3절 U40.
  # 앱 이름 오타는 조용히 아무 앱도 멈추지 않으므로 ci가 apps/<앱>·data/<앱>이 있는지 본다(tools/ci/render.ts).
  restore:
    suspendedApps: []
    valkey: {}
