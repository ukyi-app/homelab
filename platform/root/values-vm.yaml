# 시나리오 13의 검증 VM 클러스터 값(E8 VM 격리 1번). root-vm.yaml이 helm.valueFiles로 읽는다.
# values-prod.yaml과 키 모양이 같다. 아래 빈 값은 T13의 VM 준비 PR에서 채운다(그 전에 root-vm.yaml을 apply하지 않는다).
# VM은 운영이 쓰는 외부 상태(Infisical 운영 값, 백업 prefix, tailnet 이름, 공개 터널, 감시 체크)에 쓰지 않는다.
cluster:
  name: vm

  # VM은 homelab-dev / dev만 읽는다(identity eso-homelab-dev, E8 VM 격리 2번).
  # 이 값이 실수로 운영 프로젝트를 가리켜도 eso-homelab-dev는 homelab에 들지 않아 거부된다(설계 C.6.3).
  infisical:
    projectSlug: ukyi-homelab-dev
    environmentSlug: dev

  # 접두 vm-(예: vm-argocd, operator 기기 이름 vm-tailscale-operator, E8 VM 격리 4번). T08a가 키를 만들며 채웠다.
  tailscale:
    prefix: vm-

  # VM 전용 버킷. 운영 버킷에 쓰지 않는다. 버킷은 T13이 만들고 이름을 확정한다(지금은 자리값).
  # 값이 비면 cnpg-cluster 렌더가 실패해 CI가 막으므로 같은 모양의 자리값을 둔다.
  backup:
    bucket: homelab-backups-vm

  # serverName pg-vm-<YYYYMMDD>(T13이 시험 날짜로 바꾼다). 복구 시험 때 recoverySource에 운영 serverName,
  # bucket homelab-backups, credentialsSecret(손으로 넣는 R2 읽기 전용 자격)을 넣는다(시나리오 13, E8 VM 격리 3번, 설계 C.6.4).
  cnpg:
    serverName: pg-vm-20261023
