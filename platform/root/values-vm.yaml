# 시나리오 13의 검증 VM 클러스터 값(E8 VM 격리 1번). root-vm.yaml이 helm.valueFiles로 읽는다.
# values-prod.yaml과 키 모양이 같다. VM 격리 값(접두, Infisical 프로젝트·환경, 버킷, serverName)이 운영과 다른지는
# root 렌더가 단언한다(templates/cluster-check.yaml). 복구 시험 때 바꾸는 값과 순서는 restore.md 3절의 VM 시험 줄이다.
# VM은 운영이 쓰는 외부 상태(Infisical 운영 값, 백업 prefix, tailnet 이름, 공개 터널, 감시 체크)에 쓰지 않는다.
cluster:
  name: vm

  # VM은 homelab-dev / dev만 읽는다(identity eso-homelab-dev, E8 VM 격리 2번).
  # 이 값이 실수로 운영 프로젝트를 가리켜도 eso-homelab-dev는 homelab에 들지 않아 거부된다(설계 C.6.3).
  infisical:
    projectSlug: ukyi-homelab-dev
    environmentSlug: dev

  # 접두 vm-(예: vm-argocd, operator 기기 이름 vm-tailscale-operator, E8 VM 격리 4번). T08a가 키를 만들며 채웠다.
  tailscale:
    prefix: vm-

  # VM 전용 버킷. 운영 버킷에 쓰지 않는다. 사람이 시나리오 13 전에 이 이름으로 만들고 VM 폐기 때 지운다.
  # 이 버킷 전용 R&W 토큰은 homelab-dev /platform/backup에 운영과 같은 키 이름으로 둔다(ESO가 r2-backup으로 만든다).
  backup:
    bucket: homelab-backups-vm

  # serverName pg-vm-<YYYYMMDD>(복구 PR이 시험 날짜로 바꾼다). 복구 PR은 recoverySource에 운영 serverName,
  # bucket homelab-backups, credentialsSecret r2-source-readonly(root apply 전에 손으로 넣는 운영 버킷 읽기 전용 자격)를
  # 넣는다. bucket을 빠뜨리면 VM 버킷을, credentialsSecret을 빠뜨리면 VM 자격(r2-backup)을 써서 복구가 원본을 못 읽는다.
  # 정리 PR이 recoverySource를 지운다(시나리오 13, E8 VM 격리 3번, 설계 C.6.4, restore.md 3절).
  cnpg:
    serverName: pg-vm-20261027
    recoverySource:
      serverName: pg-20261023
      bucket: homelab-backups
      credentialsSecret: r2-source-readonly

  # 복구 동안 이 클러스터에서만 앱과 영속 Valkey를 멈춘다(restore.md 3절, 설계 C.6.4). 평소에는 빈 값이다.
  # apps/·data/의 values는 운영과 VM이 함께 읽어, VM 복구 PR이 거기에 suspended·running을 적으면 운영 앱도 멈춘다.
  # 그래서 VM은 이 값으로 주입한다(사용자 결정 2026-10-26). ApplicationSet apps·data가 이 앱에만 값을 덮어쓴다.
  # - suspendedApps: 앱 이름 목록. 그 앱에 suspended: true(replicas 0, 마이그레이션 Job 없음). 앱 차트 1.1.0부터라
  #   1.0.0 앱을 넣으면 VM 렌더가 schema로 실패한다.
  # - valkey: 앱 이름 → stopped(running: false, 1절 1단계) 또는 restoreMode(running: true + restoreMode: true, 1절 3단계).
  #   영속 Valkey(valkey.persistent: true)인 앱만. 항목을 지우면 data values 그대로다(1절 5단계).
  # 이름 오타는 조용히 아무 앱도 멈추지 않으므로 ci가 apps/<앱>·data/<앱>이 있는지 본다(tools/ci/render.ts).
  restore:
    suspendedApps: []
    valkey: {}
