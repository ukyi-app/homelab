# Traefik 차트는 serviceAccount.name을 '지정하면' SA를 생성하지 않는다(기존 SA 가정) —
# 라이브에서 'serviceaccount traefik not found'로 파드 생성 거부 확인. 여기서 명시 소유한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - tcproutes
      - tlsroutes
      - referencegrants
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
      - tcproutes/status
      - tlsroutes/status
    verbs: ["update", "patch"]
  # ⚠️ secrets가 여기 없다고 해서 Traefik이 Secret을 못 읽는 것이 아니다. 차트가 만드는 ClusterRole
  # `traefik-gateway`(values-traefik.yaml `rbac.enabled: true`, namespaced=false)가 secrets
  # get/list/watch를 **클러스터 전역**으로 부여하고 SA `traefik`에 바인딩한다 — gateway.yaml의
  # `web-internal-tls` 리스너가 참조하는 `home-wildcard-tls`가 그 권한을 실제로 소비한다.
  # 좁히는 레버는 `rbac.namespaced`뿐인데 kubernetesGateway provider는 ClusterRole을 요구해
  # (차트 values.yaml 주석) 비목표다. 즉 이 파일의 ClusterRole은 차트 ClusterRole의 부분집합이라
  # 권한 효과가 없다 — 이 파일의 실효 역할은 SA를 선행 wave(-8)에 세우는 것이다.
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-gateway-api
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-gateway-api
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: gateway
