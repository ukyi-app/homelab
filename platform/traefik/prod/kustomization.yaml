apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway # traefik-prod Application의 권위 있는(authoritative) 대상 namespace
# Gateway API standard 채널, 버전 고정. 재벤더링 방법:
#   curl -sL https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml \
#     -o platform/traefik/prod/gateway-api-crds.yaml
resources:
  - gateway-api-crds.yaml
  - rbac-gateway.yaml
  - gateway.yaml
  - gatewayclass.yaml
  - whoami-smoke.yaml
  - cert-issuer.yaml # *.home.ukyi.app 와일드카드 (internal HTTPS)

generators:
  - helmrelease.yaml
  - secret-generator.yaml # cloudflare-api-token (cert-manager DNS-01)

# ⚠️ **Gateway API CRD는 그 인스턴스보다 먼저 등록돼야 한다.**
#    `gatewayclass.yaml`·`gateway.yaml`·`rbac-gateway.yaml`은 wave -8인데 CRD 번들은 annotation이
#    없어 기본 wave 0이었다 → GatewayClass가 CRD보다 **8 wave 먼저** apply되어
#    `resource mapping not found for kind "GatewayClass" — ensure CRDs are installed first`로
#    SyncFailed → ArgoCD가 wave -8에서 멈추므로 **wave 0의 CRD는 영원히 apply되지 않는다**.
#    (2026-08-14 NUC 콜드스타트 실측. `#460`·`#461`과 같은 클래스의 교착이다 —
#     "의존 대상이 의존자보다 늦은 wave"가 자기 자신을 기다리는 구조를 만든다.)
# ⚠️ 라이브 Mac에서는 드러나지 않는다 — CRD가 이미 등록돼 있어 순서가 문제될 일이 없다.
# ⚠️ CRD 번들 파일(`gateway-api-crds.yaml`)은 **upstream 재벤더링 대상**이라 직접 편집하지 않는다.
#    위 주석의 curl 명령으로 갱신해도 이 patch가 계속 wave를 붙인다.
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "-9"
