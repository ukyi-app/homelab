# 2026-07-06 결정: traefik(gateway ns) egress default-deny NetworkPolicy 미적용 —
#   백엔드가 동적(전 내부 라우트 대상)이라 allowlist 유지비가 높고, crown-jewel(db/cache)은 대상측
#   ingress default-deny가 gateway ns를 배제해 이미 보호된다. 재검토 조건: 멀티테넌트화 또는 gateway ns의
#   신뢰경계 변화.
# ⚠️ wave 2 — **Gateway는 이 컴포넌트에서 가장 늦게 온다.** ArgoCD는 Gateway에 health check가
#    있어 `Programmed=True`가 될 때까지 그 wave에서 대기하는데, Programmed를 채우는 주체가 둘 다
#    wave 0이기 때문이다:
#      1. traefik 컨트롤러(Helm 차트 Deployment) — 없으면 `Programmed=Unknown Pending: Waiting for controller`
#      2. `home-wildcard-tls` Secret(cert-issuer.yaml의 Certificate 발급물) — 없으면 아래
#         web-internal-tls 리스너의 certificateRefs가 풀리지 않아 Programmed가 서지 않는다
#    Gateway를 그 둘보다 앞 wave에 두면 ArgoCD가 Gateway health를 기다리며 멈추고,
#    **그 둘은 영원히 apply되지 않는다** — 자기 자신을 기다리는 교착이다(2026-08-14 NUC 실측:
#    17시간 `waiting for healthy state of gateway.networking.k8s.io/Gateway/homelab`).
#    ⚠️ 라이브 Mac에서는 원리적으로 안 보인다 — 컨트롤러도 cert도 이미 있어 순서가 무의미하다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: traefik
  listeners:
    - name: web-public
      protocol: HTTP
      port: 8000
      hostname: "*.ukyi.app"
      allowedRoutes:
        namespaces: { from: All }
    # ⚠️ 실사용 라우트 0 — 내부 인입은 tailscale traefik-ts(:443)→websecure(:8443)=web-internal-tls만
    #    거친다. 문서를 따라 HTTPRoute를 이 평문(HTTP:8000) 리스너에 붙이면 내부 host에 도달하지 못한다
    #    (web-internal-tls를 쓸 것). 리스너 자체는 명시성/이력 위해 유지(제거는 별도 결정).
    - name: web-internal
      protocol: HTTP
      port: 8000
      hostname: "*.home.ukyi.app"
      allowedRoutes:
        namespaces: { from: All }
    # internal HTTPS: tailscale 프록시가 TCP passthrough(:443)로 보내면 여기서 와일드카드
    # cert(home-wildcard-tls, cert-issuer.yaml)로 TLS 종단한다. 8443 = Traefik websecure 엔트리포인트.
    - name: web-internal-tls
      protocol: HTTPS
      port: 8443
      hostname: "*.home.ukyi.app"
      tls:
        mode: Terminate
        certificateRefs:
          # group ""는 서버 주입 기본값이지만 명시 — atomic 리스트라 미기재 시 영구 OutOfSync.
          - { group: "", kind: Secret, name: home-wildcard-tls }
      allowedRoutes:
        namespaces: { from: All }
