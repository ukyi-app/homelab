{{- /*
Infisical ClusterSecretStore 두 개(설계 C.6, C.6.3). 둘 다 identity eso-homelab(VM은 eso-homelab-dev)의
Universal Auth 자격 하나로 같은 프로젝트를 읽고, 쓰는 ns(conditions)와 기본 폴더(secretsPath)만 다르다.

경계: Free에는 경로 RBAC가 없어 identity는 프로젝트 전체를 읽는다. secretsPath는 보안 경계가 아니다.
remoteRef.key가 /로 시작하면 secretsPath를 무시한다(ESO Infisical provider 문서). 그래서 다른 경로 차단은
ExternalSecret이 Git PR(사람 승인)과 공유 차트로만 생기는 것에 기댄다(설계 C.6.3).

Ready: ESO가 5분마다(controller --store-requeue-interval 기본값) Universal Auth 로그인 뒤 secretsPath 폴더 목록을
읽어 본다. 폴더가 없으면 Infisical이 404(SecretPathNotFound)를 내 Ready=False다. 그래서 각 클러스터가 읽는
프로젝트·환경(운영 homelab/prod, VM homelab-dev/dev)에 /platform과 /apps 폴더가 먼저 있어야 한다.
Argo CD 내장 health(ClusterSecretStore/health.lua)는 Ready=True일 때만 Healthy, Ready=False면 Degraded다.
덮어쓰지 않는다. Store가 Degraded면 root가 뒤 wave로 넘어가지 않는 것이 맞다.
*/}}
{{- $projectSlug := required "infisical.projectSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.projectSlug }}
{{- $environmentSlug := required "infisical.environmentSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.environmentSlug }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-platform
spec:
  provider:
    {{- include "stores.provider" (dict "projectSlug" $projectSlug "environmentSlug" $environmentSlug "secretsPath" "/platform") | nindent 4 }}
  conditions:
    # 플랫폼 ns만(설계 C.6 그림). 이름을 하나씩 적는다. 목록은 platform/namespaces/namespaces.yaml과 같게 두되 둘을 뺀다.
    # - sandbox: 작업자 ns다. 작업자 전용 store infisical-sandbox(T08b)만 쓴다(설계 C.8).
    # - database: AppProject data가 ExternalSecret을 만들 수 있는 ns라 앱 store 쪽이다(설계 C.6 그림, C.3.3 AppProject).
    #   CNPG 백업 키(/platform/backup)를 database ns에 어느 store로 넣을지는 T11이 정한다.
    # 플랫폼 ns를 더하면 여기에도 더한다. 빠지면 그 ns의 ExternalSecret이 conditions 거부로 동기화되지 않는다.
    - namespaces:
        - argocd
        - external-secrets
        - cert-manager
        - cnpg-system
        - traefik
        - cloudflared
        - tailscale
        - adguard
        - go
        - observability
        - egress
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-apps
spec:
  provider:
    {{- include "stores.provider" (dict "projectSlug" $projectSlug "environmentSlug" $environmentSlug "secretsPath" "/apps") | nindent 4 }}
  conditions:
    # app-* ns와 database ns만(설계 C.6 그림). conditions의 항목과 그 안의 namespaces·namespaceRegexes는 하나라도
    # 맞으면 허용이다(OR, ESO v2.13.0 client_manager.go).
    # ESO는 정규식을 regexp.MatchString으로 맞춰 앞뒤를 고정하지 않는다. ^와 $가 없으면 "foo-app-bar"도 맞는다.
    - namespaceRegexes:
        - ^app-[a-z0-9-]+$
      namespaces:
        - database
