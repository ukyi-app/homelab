# Argo CD 로컬 계정 owner의 비밀번호(사용자 결정 2026-10-19, T07 → T09). argocd-cm의 accounts.owner(login)와 짝이다.
# Infisical homelab/prod(VM은 homelab-dev/dev)의 /platform/argocd에 사람이 bcrypt 해시와 시각을 넣는다. 원문은 넣지 않는다.
#
# 이 Application(external-secrets-stores, wave -7)에 두는 이유: argocd Application(wave -10)에 두면 ESO CRD(wave -8)보다
# 먼저 적용돼 빈 클러스터에서 sync가 실패하고 root가 거기서 멈춘다. 여기서는 아래 wave 1로 같은 Application 안의
# ClusterSecretStore(wave 0)가 Ready가 된 뒤에 만든다.
# 키가 Infisical에 없으면 SecretSyncedError로 Degraded가 되고 root가 뒤 wave로 넘어가지 않는다. VM은 homelab-dev에도
# 같은 두 키가 있어야 한다(설계 E8 "homelab-dev 키 채우기").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-owner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    # argocd-secret은 install.yaml이 만들고 Argo CD 서버가 server.secretkey 등을 넣는다. Owner로 만들면 그 키들을
    # 지우고 덮어쓰므로 Merge로 이 두 키만 더한다. Merge는 Secret이 없으면 만들지 않고 기다린다.
    # platform/argocd kustomization에서 argocd-secret을 patch하지 않는 것과 짝이다(그쪽 주석).
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    # Argo CD는 bcrypt 해시만 받는다. 비밀번호를 바꾸면 MTIME도 함께 바꾼다. 그 시각 전에 발급된 세션 토큰이 무효가 된다.
    - secretKey: accounts.owner.password
      remoteRef:
        key: argocd/OWNER_PASSWORD_BCRYPT
    - secretKey: accounts.owner.passwordMtime
      remoteRef:
        key: argocd/OWNER_PASSWORD_MTIME
