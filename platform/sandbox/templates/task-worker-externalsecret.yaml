{{- /* 복구 스위치가 끄면 내지 않는다. 같은 이름 Secret은 손으로 만든다(restore.md 3.1). */}}
{{- if and .Values.task.enabled .Values.externalSecrets.enabled }}
{{- $name := include "sandbox.taskCredentialSecret" . }}
# 작업 레인 모델 자격 하나(설계 C.8). 대화·리뷰 토큰을 함께 가져오지 않는다. 작업 파드에서 샌 토큰으로 대화 레인까지 잃지 않으려는 분리다.
# 키가 Infisical에 없으면 Ready=False(Degraded)라 root가 sandbox wave(-2)에서 멈춘다. 켜기 전에 넣는다(values.yaml task).
# wave 1: store(wave 0) 뒤, Deployment(wave 2) 앞. Secret이 먼저 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # 원격 키와 Secret 키가 다르다. 작업자는 worker와 같은 파일 이름을 읽는다(worker.profile.credentialKey).
    - secretKey: {{ .Values.worker.profile.credentialKey }}
      remoteRef:
        key: {{ .Values.task.remoteCredentialKey }}
{{- end }}
