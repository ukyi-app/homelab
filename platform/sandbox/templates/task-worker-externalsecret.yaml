{{- /* 복구 스위치가 끄면 내지 않는다. 같은 이름 Secret은 손으로 만든다(restore.md 3.1). */}}
{{- if and .Values.task.enabled .Values.externalSecrets.enabled }}
{{- $name := include "sandbox.taskCredentialSecret" . }}
{{- $profile := .Values.worker.profile }}
# 작업 레인 모델 자격(설계 C.8). 대화·리뷰 레인의 토큰·API 키를 함께 가져오지 않는다. 작업 파드에서 샌 자격으로 대화 레인까지
# 잃지 않으려는 분리다. 원격 키는 레인 전용(task.remoteCredentialKey·task.remoteApiKey)이고 Secret 키·파일 이름은 worker와 같다.
# 방식 표시(methods.marker)만 두 레인이 같은 원격 키 하나를 읽는다. 계정 전환은 두 레인을 함께 바꾼다(homelab bot account use).
# 두 방식 자리와 방식 표시가 함께 있고 작업자가 표시가 고른 자격 하나만 실행 env에 넣는 규칙, spec.data로만 매핑하는 함정은
# worker-externalsecret.yaml 머리 주석과 같다.
# 키가 하나라도 Infisical에 없으면 Ready=False(Degraded)라 root가 sandbox wave(-2)에서 멈춘다. 켜기 전에 넣는다(values.yaml task).
# wave 1: store(wave 0) 뒤, Deployment(wave 2) 앞. Secret이 먼저 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # 원격 키와 Secret 키가 다르다. 작업자는 worker와 같은 파일 이름을 읽는다(worker.profile).
    - secretKey: {{ $profile.credentialKey }}
      remoteRef:
        key: {{ .Values.task.remoteCredentialKey }}
    {{- with $profile.methods }}
    - secretKey: {{ .apiKey }}
      remoteRef:
        key: {{ $.Values.task.remoteApiKey }}
    - secretKey: {{ .marker }}
      remoteRef:
        key: {{ .marker }}
    {{- end }}
{{- end }}
