{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
{{- $profile := .Values.worker.profile }}
{{- $name := include "sandbox.workerCredentialSecret" . }}
# 작업자의 모델 자격 하나(설계 C.8, D-14 변경). 키 이름은 values.yaml worker.profile.credentialKey 하나에서 나와 작업자 env
# WORKER_CREDENTIAL_KEY와 어긋날 수 없다. 다른 프로필의 자격(예: CODEX_AUTH_JSON)은 함께 가져오지 않는다(자격 둘을 동시에 두지 않는다).
# Claude 구독 토큰(env-static): 작업자가 실행마다 이 Secret 파일을 다시 읽는다. 값이 바뀌면 kubelet이 볼륨을 갱신한 뒤
# 다음 실행부터 새 값이다(파드 재시작 없음, 재시드 절차 없음). 영속 공간에 복사하지 않는다.
# 키가 Infisical에 없으면 이 ExternalSecret이 Ready=False(Degraded)라 root가 sandbox wave(-2)에서 멈춘다.
# /apps/homelab-bot/worker 폴더를 지우면 store까지 Degraded다. 폴더는 지우지 않는다.
# store는 infisical-sandbox 하나다. 다른 store를 가리키면 conditions가 거부한다(sandbox가 그 목록에 없다).
# wave 1: 같은 Application의 store(wave 0)가 Ready가 된 뒤. Deployment(wave 2)보다 먼저 Secret이 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /apps/homelab-bot/worker/<credentialKey>. 값은 출력하지 않는다(sha256sum만).
    - secretKey: {{ $profile.credentialKey }}
      remoteRef:
        key: {{ $profile.credentialKey }}
{{- end }}
