{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
{{- $profile := .Values.worker.profile }}
{{- $name := include "sandbox.workerCredentialSecret" . }}
# 작업자의 모델 자격(설계 C.8, D-14). 키 이름은 values.yaml worker.profile 하나에서 나와 작업자 env WORKER_CREDENTIAL_KEY와
# 봇 프로필 표의 파일 이름과 어긋날 수 없다. 다른 프로필의 자격(예: CODEX_AUTH_JSON)은 함께 가져오지 않는다.
# Claude 프로필(profile.methods가 있음)은 이 Secret에 두 인증 방식의 자리와 방식 표시가 함께 있다: 구독 토큰(credentialKey),
# API 키(methods.apiKey), 방식 표시(methods.marker, subscription 또는 api). 작업자(봇 src/credentials.ts MethodEnvCredential)는
# 실행마다 표시가 고른 자격 하나만 실행 env에 넣고, 안 쓰는 방식의 자리는 Infisical에서 unset이다. 표시와 자격이 맞지 않으면
# 실행하지 않는다. 표시 파일이 없으면 구독으로 본다.
# 함정: 키를 Infisical에서 지우지 않는다. 안 쓰는 자리도 키가 있어야 이 ExternalSecret이 Ready다(homelab bot account use가 unset으로 비운다).
# 함정: 매핑은 spec.data 항목으로만 둔다. homelab bot account use는 spec.data의 remoteRef.key만 판정하고, dataFrom이나
# template data가 있으면 매핑을 모른다며 아무것도 쓰지 않는다.
# 자격 값이 바뀌면 kubelet이 볼륨을 갱신한 뒤 다음 실행부터 새 값이다(파드 재시작 없음, 재시드 절차 없음). 영속 공간에 복사하지 않는다.
# 키가 하나라도 Infisical에 없으면 이 ExternalSecret이 Ready=False(Degraded)라 root가 sandbox wave(-2)에서 멈춘다.
# /apps/homelab-bot/worker 폴더를 지우면 store까지 Degraded다. 폴더는 지우지 않는다.
# store는 infisical-sandbox 하나다. 다른 store를 가리키면 conditions가 거부한다(sandbox가 그 목록에 없다).
# wave 1: 같은 Application의 store(wave 0)가 Ready가 된 뒤. Deployment(wave 2)보다 먼저 Secret이 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: {{ $name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /apps/homelab-bot/worker/<키>. Secret 키 = Infisical 키 = 작업자가 읽는 파일 이름. 값은 출력하지 않는다(sha256sum만).
    - secretKey: {{ $profile.credentialKey }}
      remoteRef:
        key: {{ $profile.credentialKey }}
    {{- with $profile.methods }}
    - secretKey: {{ .apiKey }}
      remoteRef:
        key: {{ .apiKey }}
    - secretKey: {{ .marker }}
      remoteRef:
        key: {{ .marker }}
    {{- end }}
{{- end }}
