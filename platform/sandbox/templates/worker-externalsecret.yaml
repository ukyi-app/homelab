# 작업자의 모델 자격 시드(설계 C.8, D-14). 이 티켓은 모양 확인용 시험 키 하나만 받는다(값은 사람이 Infisical에 넣는다).
# 실제 인증 시드(auth.json)의 키는 T16b가 E9에서 더하거나 바꾼다. 작업자는 CODEX_HOME에 파일이 없을 때만 시드를 복사한다.
# store는 infisical-sandbox 하나다. 다른 store를 가리키면 conditions가 거부한다(sandbox가 그 목록에 없다).
# wave 1: 같은 Application의 store(wave 0)가 Ready가 된 뒤. Deployment(wave 2)보다 먼저 Secret이 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-seed
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: worker-seed
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /apps/homelab-bot/worker/WORKER_PROBE. 시험 값이라 비밀이 아니어도 값은 출력하지 않는다(sha256sum만).
    - secretKey: WORKER_PROBE
      remoteRef:
        key: WORKER_PROBE
