{{- /* 복구 스위치가 끄면(externalSecrets.enabled: false, values.yaml) 내지 않는다. 같은 이름 Secret은 손으로 만든다. */}}
{{- if .Values.externalSecrets.enabled }}
# 작업자의 모델 자격 시드(설계 C.8, D-14). 사람이 봇 전용 계정으로 로그인한 auth.json을 Infisical에 넣는다(T16b H2).
# 작업자는 CODEX_HOME(PVC)에 auth.json이 없을 때만 복사한다. 그 뒤 갱신본은 PVC에만 있고 이 값은 옛 사본이 된다.
# 재시드: Secret이 새 값으로 바뀐 것(sha256sum)을 본 뒤 PVC의 auth.json을 지우고 파드를 다시 만든다. 순서가 바뀌면 옛 시드가 복사된다.
# 키가 Infisical에 없으면 이 ExternalSecret이 Ready=False(Degraded)라 root가 sandbox wave(-2)에서 멈춘다.
# /apps/homelab-bot/worker 폴더를 지우면 store까지 Degraded다. 폴더는 지우지 않는다.
# store는 infisical-sandbox 하나다. 다른 store를 가리키면 conditions가 거부한다(sandbox가 그 목록에 없다).
# wave 1: 같은 Application의 store(wave 0)가 Ready가 된 뒤. Deployment(wave 2)보다 먼저 Secret이 있어야 볼륨이 붙는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-seed
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-sandbox
  target:
    name: worker-seed
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 이 ExternalSecret의 라벨·주석(Argo CD tracking-id 포함)이 Secret에 복사된다(설계 B.8 E3).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    # /apps/homelab-bot/worker/CODEX_AUTH_JSON. 키 이름은 작업자 env WORKER_SEED_KEY와 같아야 한다. 값은 출력하지 않는다(sha256sum만).
    - secretKey: CODEX_AUTH_JSON
      remoteRef:
        key: CODEX_AUTH_JSON
{{- end }}
