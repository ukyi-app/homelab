{{- /*
대화·리뷰 작업자(설계 C.8 격리 행, D-14, D-15). 본 컨테이너는 봇 이미지의 작업자 진입점이다(이미지는 values.yaml worker.image).
init 방화벽은 _helpers.tpl sandbox.egressFirewall이다. 작업 레인 작업자는 task-worker-deployment.yaml이다.
*/}}
{{- $proxy := printf "http://%s:%d" .Values.proxy.clusterIP (int .Values.proxy.port) }}
{{- $profile := .Values.worker.profile }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: sandbox
  labels:
    {{- include "sandbox.workerLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # 작업은 직렬 하나다(D-14 조건 3). RollingUpdate면 교체 중 두 파드가 함께 떠 같은 구독 자격으로 실행이 겹치고,
  # 같은 PVC(nonce 저장소, Codex 프로필이면 auth.json)를 두 파드가 쓴다. 값은 0 또는 1이다(values.yaml worker.replicas).
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sandbox.workerLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sandbox.workerLabels" . | nindent 8 }}
    spec:
      # SA 토큰을 붙이지 않고 sandbox:default에 RBAC를 주지 않는다. API 서버로 가는 길(10.43.0.1, 노드 IP:6443)도 init 규칙이 막는다.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # 자격 Secret 볼륨(0440)을 본 컨테이너 사용자가 그룹으로 읽게 한다.
        fsGroup: 10001
      initContainers:
        {{- include "sandbox.egressFirewall" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ .Values.worker.image }}
          # 이미지 기본 CMD는 게시 서버다. ENTRYPOINT가 비어 있어 이 command가 그대로 돈다(작업 디렉터리는 이미지의 /app).
          # 기동: 프로필 선택 → 실행기 --version 확인 → 자격 읽기 확인 → nonce 저장소 → 8080. 어느 단계든 실패하면
          # 값 없이 사유 코드 한 줄만 남기고 종료 1이다(예: profile_unsupported, credential_missing, credential_invalid).
          # 종료 1이 반복되면 CrashLoop → Deployment Degraded → root가 sandbox wave(-2)에서 멈춘다.
          command: ["node", "dist/src/worker-main.js"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 이름 해석은 프록시가 한다(U29). 작업자는 대문자 HTTPS_PROXY·NO_PROXY만 읽어 모델 CLI 프로세스에만 넘긴다(모델 셸에는 안 넘김).
            # claude CLI는 DNS 없는 파드에서 HTTPS_PROXY만으로 붙는다(S12 첫 대화, 프록시 CONNECT api.anthropic.com:443 200).
            # 소문자 변수는 읽는 쪽이 없어 두지 않는다. HTTP_PROXY는 두지 않는다. 프록시가 평문 HTTP를 거부한다.
            - name: HTTPS_PROXY
              value: {{ $proxy | quote }}
            # loopback은 프록시를 거치지 않는다. 없으면 127.0.0.1로 가는 HTTPS 요청이 프록시에서 거부된다.
            - name: NO_PROXY
              value: 127.0.0.1,localhost
            # 실행기 프로필 세 값(values.yaml worker.profile). 봇 표에 없는 조합이면 profile_unsupported로 기동하지 못한다.
            - name: WORKER_EXECUTOR
              value: {{ $profile.executor | quote }}
            - name: WORKER_MODEL
              value: {{ $profile.model | quote }}
            # 자격은 <WORKER_CREDENTIAL_DIR>/<WORKER_CREDENTIAL_KEY> 파일(아래 credential 볼륨, 키 이름은 Infisical 그대로)이다.
            # Claude 프로필은 같은 디렉터리의 방식 표시·API 키 파일(worker.profile.methods)도 읽는다. 그 이름은 봇 프로필 표에 고정돼
            # env로 넘기지 않는다. 실행마다 다시 읽어 표시가 고른 자격 하나만 그 실행의 claude 자식 env에 넣는다. 파일·argv·로그·PVC에 쓰지 않는다.
            - name: WORKER_CREDENTIAL_DIR
              value: /run/worker-credential
            - name: WORKER_CREDENTIAL_KEY
              value: {{ $profile.credentialKey | quote }}
            {{- if eq $profile.executor "codex" }}
            # Codex 프로필만 읽는다(봇 requiredEnv). 갱신한 auth.json이 PVC에 남는다. 시드는 없을 때만 복사한다(D-14).
            - name: CODEX_HOME
              value: /codex-home
            {{- end }}
            # 쓴 capability nonce(62초 보관). 파드를 다시 만들어도 재사용을 막으려고 PVC 안 별도 디렉터리에 둔다(D3).
            # PVC 이름·마운트(codex-home, /codex-home)는 프로필과 상관없이 그대로 둔다. 이름을 바꾸면 PV를 손으로 다시 묶어야 한다
            # (templates/worker-pvc.yaml). Codex 프로필에서 CODEX_HOME 자체를 nonce 자리로 주면 작업자가 거부한다.
            - name: WORKER_NONCE_DIR
              value: /codex-home/.homelab-worker/nonces
            - name: WORKER_CONTROL_PUBLIC_KEY
              value: {{ .Values.worker.controlPublicKey | quote }}
          # /readyz는 자격이 쓸 수 있는 모양일 때만 200이다(모델 호출 없음). Claude는 방식 표시(없으면 구독)가 고른 자격 파일이
          # 인쇄 가능한 ASCII 한 줄(공백 없이 16~8192자, unset 아님)이고 표시가 subscription·api 중 하나일 때, Codex는 PVC에
          # auth.json(일반 파일)일 때다. 실행 기록을 지우지 못한 동안도 503이다.
          # kubelet 프로브는 노드에서 오므로 NetworkPolicy에 막히지 않는다(설계 B.8). 응답 패킷은 init 규칙의 ESTABLISHED로 나간다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          # 이미지 USER(65532)를 덮는다. 이미지 파일은 root 소유·누구나 읽기라 uid가 달라도 돈다.
          # PVC(local-path, hostPath)는 fsGroup이 적용되지 않는다. 폴더가 0777로 만들어져 쓸 수 있다. 저장소 클래스를 바꾸면 다시 본다.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: codex-home
              mountPath: /codex-home
            - name: credential
              mountPath: /run/worker-credential
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # 로컬 podman 실측(봇 f08bc9f 이미지, claude 프로필, 기동 때 claude --version 포함): 대기 중 cgroup 35MiB.
          # 대화 실행 중(claude CLI 자식 프로세스): S12 첫 대화 3회(운영)에서 working set 최고 약 163MiB(vmsingle 수집 간격
          # 사이의 순간 최고는 못 본다). 표본이 적어 limit 1Gi는 그대로 둔다. 넘으면 컨테이너가 OOM으로 재시작되고,
          # 반복되면 CrashLoop로 위와 같이 root가 멈춘다. 시범 운영 실측이 쌓이면 줄인다.
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: codex-home
          persistentVolumeClaim:
            claimName: codex-home
        # 모델 자격 Secret 하나. optional을 두지 않는다(기본 false): Claude 토큰은 대신할 사본이 없어(PVC에 복사하지 않는다) 없으면
        # 어차피 작업자가 credential_missing으로 종료 1 → CrashLoop다. false면 파드가 FailedMount(Secret 없음)로 컨테이너 생성 전에
        # 멈춰 원인이 이벤트에 바로 보인다. 평소에는 ExternalSecret(wave 1)이 Ready여야 이 Deployment(wave 2)로 넘어오고,
        # 복구 스위치를 끈 동안은 restore.md 3.1 4)가 root apply 전에 같은 이름으로 만든다.
        # subPath로 붙이지 않는다. subPath면 kubelet이 Secret 갱신을 반영하지 않아 토큰 교체가 파드 재시작까지 안 보인다.
        - name: credential
          secret:
            secretName: {{ include "sandbox.workerCredentialSecret" . }}
            defaultMode: 0440
        # 실행마다 빈 HOME·CLAUDE_CONFIG_DIR·작업 공간을 만들고 끝나면 지운다. 기동 때 버전 확인 디렉터리도 여기다.
        # 대화 실행의 임시 사용량을 아직 몰라(S12) 256Mi [가정]. 넘으면 kubelet이 파드를 쫓아낸다.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: firewall-run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
