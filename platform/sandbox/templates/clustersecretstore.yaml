{{- /*
작업자 전용 store(설계 C.8 격리 행). 다른 store와 같은 identity로 같은 프로젝트를 읽고, 쓰는 ns와 기본 폴더만 다르다.
Ready는 secretsPath 폴더가 Infisical에 있어야 True다(platform/external-secrets/templates/clustersecretstores.yaml 머리 주석).
폴더가 없으면 Degraded이고 이 Application(wave -2)에서 root가 멈춘다. 켜기 전에 사람이 /apps/homelab-bot/worker와 시험 키를 만든다.
*/}}
{{- $projectSlug := required "infisical.projectSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.projectSlug }}
{{- $environmentSlug := required "infisical.environmentSlug is required (root passes cluster.infisical via valuesObject)" .Values.infisical.environmentSlug }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    {{- include "sandbox.storeProvider" (dict "projectSlug" $projectSlug "environmentSlug" $environmentSlug "secretsPath" "/apps/homelab-bot/worker") | nindent 4 }}
  conditions:
    # sandbox 하나. 다른 store(infisical-platform·infisical-apps)의 conditions에는 sandbox가 없어 작업자 ns는 이 store만 쓴다.
    - namespaces:
        - sandbox
