# 작업자 전용 영속 공간(D-14, D3). 쓴 capability nonce(.homelab-worker/nonces, 62초 보관)를 파드 재생성 사이에 남긴다.
# Claude 프로필(지금)은 자격을 여기 두지 않는다(토큰은 Secret 볼륨에서 실행마다 읽는다). Codex 프로필이면 CODEX_HOME이 되어
# Codex가 갱신한 auth.json도 여기 남는다(ESO 한 방향 전달로는 갱신본을 못 지킨다). 이름 codex-home은 프로필과 상관없이 그대로 둔다.
# local-retain: PVC·Application이 지워져도 노드의 폴더가 남는다. 다시 붙이려면 PV를 손으로 다시 묶는다.
# 1Gi: nonce 기록과 (Codex면) 수 KB의 auth.json뿐이다. 대화 레인은 세션 기록을 남기지 않는다.
# 차면 nonce 기록이 실패한다(기동 때면 작업자가 뜨지 못한다).
# 백업하지 않는다: Codex 프로필이면 살아 있는 구독 자격이 여기 있어 R2 백업으로 옮기면 노출 면이 늘어난다(설계 C.8, S219).
# wave는 작업자 Deployment와 같아야 한다. local-retain은 WaitForFirstConsumer라 파드가 생겨야 Bound가 되는데,
# 앞 wave에 두면 Argo CD가 Pending(Progressing)인 PVC를 기다리며 Deployment wave로 넘어가지 않는다(첫 배포 실측).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codex-home
  namespace: sandbox
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # worker.replicas가 0이면 이 PVC를 쓸 파드가 없어, 빈 클러스터(재구축·새 VM)에서는 Pending(Progressing)으로 남는다. 그 health가
    # sandbox Application health에 합쳐지면 root가 sandbox wave(-2)에서 멈춘다. ignore-healthcheck는 이 리소스의 health만
    # Application 합산에서 뺀다(Argo CD v3.5.5 controller/health.go). 1이면 붙이지 않아 평소 판정(Pending이면 Progressing)을 둔다.
    # 이미 Bound인 클러스터에서는 Healthy라 붙어도 결과가 같다.
    # 함정: sandbox 자체 sync가 Pending PVC를 기다리지 않는 것은 이 PVC가 마지막 wave(2)라서다. gitops-engine은 마지막 wave를
    # 적용하면 health를 기다리지 않고 sync를 끝내고(v3.5.5 gitops-engine/pkg/sync/sync_context.go), 이 주석은 sync 대기에는
    # 쓰이지 않는다. 더 뒤 wave를 더하면 replicas 0인 빈 클러스터에서 sync가 이 PVC에서 멈춘다.
    {{- if eq (int .Values.worker.replicas) 0 }}
    argocd.argoproj.io/ignore-healthcheck: "true"
    {{- end }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-retain
  resources:
    requests:
      storage: 1Gi
