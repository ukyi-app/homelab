# 봇 → 작업자 작업 전달(D-15). 들어오는 허용은 bot-slot Application의 sandbox ingress 정책이 연다.
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: sandbox
  labels:
    {{- include "sandbox.workerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sandbox.workerLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
