# infisical은 root가 cluster.infisical에서 넘긴다. 여기는 빈 자리만 둔다(templates/clustersecretstore.yaml의 required).
infisical:
  projectSlug: ""
  environmentSlug: ""

proxy:
  # 작업자는 DNS 없이 이 주소로만 나간다(설계 C.8). 서비스 대역(10.43.0.0/16)의 정적 구간(앞 256개)에서 고른다.
  # 동적 할당은 이 구간을 마지막에야 쓰므로, 빈 클러스터에서 앞 wave Service가 먼저 이 주소를 가져가 생성이 실패할 일이 적다.
  # 10.43.0.1(kubernetes)·10.43.0.10(kube-dns)과 겹치면 Service 생성이 실패한다(values.schema.json이 둘을 거부한다). 바꾸면 작업자 init 규칙과 HTTPS_PROXY가 함께 바뀐다.
  clusterIP: 10.43.0.28
  port: 3128
  # CONNECT 443으로 허용하는 이름. 정확한 이름만 쓴다. 앞에 점을 붙이면 하위 도메인 전체가 열린다(.github.com은 github.com도 연다).
  # github.com·api.github.com·gist.github.com과 그 밖의 *.github.com은 넣지 않는다(D-15. values.schema.json이 막는다).
  # 실제 허용 목록은 이 목록 + worker.profile.egressHosts(모델 실행기가 쓰는 이름)다. 둘 다 같은 schema 규칙을 받는다.
  # 프록시(Envoy)는 CONNECT 이름과 터널 안 TLS SNI를 둘 다 그 목록과 맞춘다(templates/proxy-configmap.yaml).
  # 남는 위험: SNI는 허용 이름이고 TLS 안 HTTP Host만 다른 요청은 못 본다. CDN 뒤 이름을 더할 때는 그 CDN이
  # SNI·Host 불일치를 거부하는지 본다(lab 실측: registry.npmjs.org 앞 Cloudflare는 403. npm은 아래 이유로 넣지 않는다).
  allowedDomains:
    # 작업자 코드 읽기. public 저장소 압축본만 받는다(D-15).
    - codeload.github.com
    # 패키지 레지스트리. 받기와 게시가 다른 호스트인 것만 둔다(설계 C.8 "남는 위험(쓰기 유출)").
    # npm(registry.npmjs.org)은 받기와 게시가 같은 호스트라 넣지 않는다. 작업 입력의 npm 토큰으로 auth.json을
    # 게시할 수 있다. PyPI 게시는 upload.pypi.org라 열리지 않는다.
    - pypi.org
    - files.pythonhosted.org
    # 모델 API·구독 인증 호스트는 여기 두지 않는다. 프로필과 함께 바뀌므로 worker.profile.egressHosts에 둔다.

# 작업자(templates/worker-deployment.yaml). 봇 이미지 하나를 게시 서버와 함께 쓰고 command만 작업자 진입점으로 바꾼다(T16b D2).
worker:
  # main 빌드(app-build)가 GHCR에 올린 digest만 쓴다. 로컬 빌드 digest는 CI 빌드와 다르다.
  # 사람 PR로만 바꾼다(D2). 게시 서버는 apps/homelab-bot/image.yaml 자동 병합으로 따라가지만, 모델 자격을 든 sandbox까지
  # 자동 경로를 넓히지 않는다(설계 C.4.4·C.4.7). 작업자 요청 계약(version)을 바꾸는 봇 PR은 이 값을 바꾸는 PR과 짝으로 낸다.
  # 지금 값: 봇 main 02f5f3f 빌드(게시 서버 apps/homelab-bot/image.yaml과 같은 digest). 대화·리뷰 요청 계약 v1·v2를 받고(동료 봇 C02)
  # 응답에 한도 정보 칸을 싣는다(C03). 작업자 출력의 제안 동작 ID에 review_request(C30)·change_amend(C27)가 있고, 대화 지시문에
  # 답장 대상 글·세션 연결 설명(C18 3a·3b)과 "할 수 있는 일"의 변경 PR 수정(확인 버튼을 거치는 실행, C36 F-10)이 있다.
  # 대화 신뢰 문맥은 namespace·deployment를 싣지 않고, 서비스·명령 목록을 답에 옮기지 않고 owner를 "관리자"로 부르라는 답 규칙이
  # 있다(봇 #156). 방식 선택이 실린 새 판 요청(대화 v3, 리뷰 v2, 변경 자체 리뷰 v2)과 GET /v1/contracts도 받지만(C39) 게시 서버가
  # 아직 새 판을 보내지 않아 지금 요청은 옛 판 그대로 돈다. 이 값은 task.image보다 앞선 digest다(작업 레인은 36c96b6 그대로).
  # 자격은 실행마다 방식 표시가 고른다(C23, 아래 profile.methods).
  # 미게시 변경 리뷰 경로 /v1/change-review는 요청 머리 x-change-review-rate-limit: 1이 있을 때만 응답에 한도 정보 칸을 싣는다
  # (C36 F-1. 게시 서버가 결제 멈춤·풀리는 시각을 기록한다). 머리가 없는 옛 게시 서버에는 칸을 빼서 strict 스키마와 엇갈리지 않는다.
  # 그 경로는 게시 서버의 CHANGE_PR_ENABLED가 꺼져 있으면 쓰이지 않는다. 일반 리뷰 레인은 그대로다.
  # 이 파드는 RuntimeDefault라 이미지의 bwrap을 쓰지 않는다.
  # 되돌릴 때 순서(이 값만 되돌리든 이 PR 전체를 되돌리든 같다):
  #   1. 진행 중인 변경 자체 리뷰를 끝낸 뒤 되돌린다. 자체 리뷰 결과는 PVC(nonce 옆 change-review/)에 남아 파드를 다시 만들어도
  #      회수 경로가 읽는데, 이 이미지가 저장한 한도 칸 든 결과를 그 전 작업자의 strict 스키마가 읽지 못해 결과를 잃는다.
  #   2. 게시 서버보다 이 값을 먼저 되돌린다. 게시 서버만 옛 판이면 이 작업자의 새 제안 ID·한도 칸 응답을 strict 스키마가 거부한다
  #      (자체 리뷰의 한도 칸만은 요청 머리로 협상해 어느 쪽이 먼저여도 된다).
  #   3. 4df0a4f보다 앞(방식 표시 전) 이미지로 갈 때만: 방식 표시가 api면 먼저 homelab bot account use <구독 계정> --apply로 구독에
  #      돌린다. 그 작업자는 구독 토큰 파일만 읽는데 api 방식이면 그 자리가 unset이라 기동하지 못한다(종료 1 → root가 wave -2에서 멈춤).
  # 빌드 증명은 gh attestation verify로 대조했다(서명 워크플로 homelab app-build.yaml@app-build-v1.0.1, 원본 build.yaml@refs/heads/main
  # 02f5f3f, GitHub 호스트 runner).
  image: ghcr.io/ukyi-app/homelab-bot@sha256:431ee00b324e7b63bd22f6d472992306f1eaa44946a9172f0bd4316a2dbe3ccc
  # 게시 서버의 실행 요청 서명을 확인하는 Ed25519 공개 키(SPKI PEM). 비밀이 아니다(D3). 짝 개인 키는 Infisical의 게시 서버 키
  # WORKER_CONTROL_PRIVATE_KEY다. 둘이 어긋나면 작업자가 모든 실행 요청을 403으로 거부하니 회전은 두 값을 함께 바꾼다.
  # 모양이 틀리면 작업자가 기동하지 못해(종료 1) sandbox가 Degraded가 되므로 values.schema.json이 Ed25519 공개 키 모양만 받는다.
  controlPublicKey: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEA48/F2Z0cCfqLbEGfQY3aoDWCRtgzFLLsY9kskMFFqRs=
    -----END PUBLIC KEY-----
  # 실행기 프로필(D-14). 실행기·모델·자격·egress를 여기 한곳에서 고른다. 작업자 env(WORKER_EXECUTOR·WORKER_MODEL·
  # WORKER_CREDENTIAL_KEY), 자격 ExternalSecret·Secret(worker-credential-<id>), 프록시 허용 이름이 모두 이 블록에서 나온다.
  # 봇 이미지의 프로필 표(봇 src/executor-profiles.ts PROFILES)에 있는 조합만 values.schema.json이 받는다. 틀린 조합은 작업자가
  # profile_unsupported로 기동하지 못해 root가 wave -2에서 멈추므로 렌더에서 막는다.
  # 바꾸는 법(표에 이미 있는 프로필끼리, 예: Codex로):
  #   1. Infisical /apps/homelab-bot/worker에 새 credentialKey 값을 먼저 넣는다(운영은 실제 자격, VM homelab-dev는 같은 모양의 가짜).
  #      없으면 새 ExternalSecret이 Degraded라 root가 wave -2에서 멈춘다.
  #   2. 이 블록과 restore.md 3.1 4)의 canary(자격 모양을 따른다)를 같은 PR에서 바꾼다. Secret 이름이 함께 바뀌어 옛 자격을
  #      읽을 일이 없고, 옛 ExternalSecret은 Argo CD prune이, 그 Secret은 소유자 삭제로 Kubernetes가 지운다.
  # 표에 없는 실행기·인증 방식(OpenCode 등)은 봇 이미지(어댑터·표)가 먼저다. 그 digest·이 블록·schema를 한 PR로 바꾼다.
  # Claude 구독과 API 크레딧 사이의 전환은 이 블록을 바꾸지 않는다. 방식 표시(methods.marker) 값이 실행마다 고른다(아래 methods).
  profile:
    # 봇 표의 프로필 id. Secret 이름에 들어간다. 이름은 구독이지만 API 크레딧 방식도 이 프로필이 맡는다(봇 src/executor-profiles.ts).
    # 바꾸면 Secret 이름이 바뀌어 homelab bot account use가 찾는 이름(worker-credential-claude-subscription)과 어긋난다.
    id: claude-subscription
    # WORKER_EXECUTOR
    executor: claude
    # WORKER_MODEL. Claude는 전체 모델 ID만 받는다(별칭 opus, [1m]은 작업자가 거부). 실행마다 CLI가 알린 모델과 대조한다.
    model: claude-opus-5-5
    # Infisical 키 이름 = Secret 키 = 작업자가 읽는 파일 이름(WORKER_CREDENTIAL_KEY). 프로필을 고르는 키이고 구독 장기 토큰 자리다.
    credentialKey: CLAUDE_CODE_OAUTH_TOKEN
    # 실행마다 인증 방식을 고르는 두 파일(Infisical 키 = Secret 키 = 파일 이름, credentialKey와 같은 디렉터리). 작업자가 읽는 이름은
    # 봇 프로필 표(PROFILES의 methods: METHOD_FILE·API_KEY_FILE)에 고정돼 env로 넘기지 않는다. 그래서 values.schema.json이 글자를
    # 고정한다. Codex 프로필에는 없다(null).
    #   marker: 방식 표시. subscription이면 credentialKey, api면 apiKey만 실행 env에 넣는다. 파일이 없으면 구독으로 본다.
    #   apiKey: Claude Console API 키 자리. 안 쓰면 unset(구독 토큰 자리도 API 방식이면 unset).
    # 이 두 키와 task.remoteApiKey가 Infisical /apps/homelab-bot/worker에 먼저 있어야 한다. 하나라도 없으면 두 ExternalSecret이
    # Degraded라 root가 wave -2에서 멈춘다. 운영은 homelab bot account add <이름>(구독, 레인마다 setup-token)과
    # homelab bot account use <이름> --apply가 방식 표시 subscription과 두 API 키 자리 unset을 쓴다(rotate.md 3e).
    # homelab secret set은 이 폴더(/apps/<앱> 아래 하위 폴더)와 16자 미만 값(subscription·unset)을 받지 않아 쓸 수 없다.
    # VM homelab-dev도 같은 세 키가 먼저 있어야 한다: 방식 표시는 subscription, 두 API 키 자리는 unset(bootstrap.md 2.2 vm 1단계).
    methods:
      marker: CLAUDE_AUTH_METHOD
      apiKey: ANTHROPIC_API_KEY
    # 이 실행기가 프록시로 나가는 이름(proxy.allowedDomains에 더해진다). OAuth 교환·갱신 후보(platform.claude.com·claude.ai)는
    # 열지 않는다. S12 첫 대화(실행 3회)에서 작업자는 api.anthropic.com에만 나갔고 프록시 거부는 0건이었다.
    # API 크레딧 방식도 모델 요청은 api.anthropic.com이다(Claude Code 네트워크 문서: claude.ai·platform.claude.com은 구독 로그인·OAuth,
    # Datadog 호스트는 작업자가 끄는 원격 측정). API 방식의 실제 프록시 로그는 아직 보지 않았다(S5).
    # 나중에 거부 로그가 필요를 보이면 그 근거와 함께 더한다.
    egressHosts:
      - api.anthropic.com

# 작업 레인 작업자(templates/task-worker-*.yaml, 설계 C.8 "작업자 파드 둘"). prod와 vm이 이 값 하나를 함께 쓴다.
# 클러스터마다 전제가 둘이다. 하나라도 빠지면 그 클러스터의 root가 sandbox wave(-2)에서 멈춘다(새 노드·새 VM도 같다):
#   1. 노드마다 sudo host/install.sh --cluster <이름> --sandbox-profiles와 --task-state-volume. 프로필이나 볼륨이 없으면 파드가 뜨지 않는다.
#   2. Infisical /apps/homelab-bot/worker에 task.remoteCredentialKey·task.remoteApiKey와 방식 표시(worker.profile.methods.marker)가
#      있어야 한다. 운영은 작업 레인 전용 setup-token과 API 키 자리(안 쓰면 unset), VM homelab-dev는 같은 모양의 가짜
#      (docs/runbooks-public/bootstrap.md 2.2 vm 1단계).
# 이 키가 없는 옛 내보내기로는 restore.md 3.1 4)가 missing으로 멈춘다(recovery-assets.md). 끄는 PR은 restore.md 3.1의 개수를 함께 되돌린다.
task:
  enabled: true
  # 작업 레인 코드가 든 main 빌드 digest. 사람 PR로만 바꾼다(worker.image와 같은 이유). 이 줄 하나만 바꾸면 worker를 건드리지 않고
  # 작업 레인 이미지를 올린다. 작업 레인 코드가 없는 이미지는 WORKER_LANES를 읽지 않아 대화·리뷰 작업자로 뜬다.
  # 지금 값: 봇 main 36c96b6 빌드. 630c48d의 v2 작업 계약·무자격 검증 실행기·시작 표식, 응답 한도
  # 정보 칸(동료 봇 C03), 변경 작성 지시문 change-v2(확인할 것·선택지 질문·수정 차례 입력, C25)에 더해, 턴 번호 상한을 프로토콜
  # 한계로 넓혔고(C19: 한도·인증 대기 턴은 게시 서버가 턴 예산에서 뺀다) amendment.pullNumber null인 게시 전 고치기 입력(C31)을 받는다.
  # intake가 알리는 판 목록은 task-v1, change-v2다. 자격은 worker와 같이 실행마다 방식 표시가 고른다(C23).
  # 작업 레인 코드(task-worker·executor-claude-task)는 4df0a4f 빌드와 같다. C36의 작업자 쪽 변화(대화 지시문, 변경 자체 리뷰)는
  # 대화·리뷰 작업자(worker)에서만 돈다. worker.image는 02f5f3f로 앞서 있어 두 레인의 digest가 다르다.
  # 되돌릴 때는 worker.image와 같은 순서다(게시 서버보다 먼저, 4df0a4f보다 앞이면 방식 표시가 api일 때 구독으로 먼저). 9b067e9 이하
  # 이미지는 턴 번호 17 이상인 작업(한도·인증 대기를 거친 작업)과 pullNumber null 고치기 입력을 거부한다. 새 판을 쓰기 시작한 뒤 이
  # 값만 되돌리면 저장된 새 판 결과를 읽지 못하므로 진행 중 변경 턴을 끝낸 뒤 되돌린다. CLI 버전(package.json·lock·Dockerfile)과 작업
  # 레인 settings·인자 생성 코드(taskSettings·taskArgs)는 630c48d와 같아 SEC-02 2단계를 잰 5fb4a20과 같다(실행 env의 자격 변수
  # 이름만 방식 표시로 고른다).
  # 빌드 증명은 gh attestation verify로 대조했다(서명 워크플로 homelab app-build.yaml@app-build-v1.0.1, 원본 build.yaml@refs/heads/main
  # 36c96b6, GitHub 호스트 runner).
  image: ghcr.io/ukyi-app/homelab-bot@sha256:37e91af6113545aa9c6989606db6c6117b2824af6997828e7a75d7e134c49723
  # Infisical 키 이름. Secret 키와 파일 이름은 worker.profile.credentialKey·methods.apiKey 그대로다(봇 프로필 표가 그 이름을 읽는다).
  # 키를 레인마다 나눠 한 레인의 토큰·API 키만 교체·철회한다. 두 레인의 자격을 한 Secret에 모으지 않는다.
  # 방식 표시는 레인마다 나누지 않는다(두 레인이 methods.marker 하나를 읽는다. 계정 전환은 두 레인을 함께 바꾼다).
  remoteCredentialKey: CLAUDE_CODE_OAUTH_TOKEN_TASK
  remoteApiKey: ANTHROPIC_API_KEY_TASK
  # 고정 크기 볼륨이 있는 노드(PV nodeAffinity). 클러스터 값이라 여기는 빈 자리고, root가 cluster.taskStateVolume.nodeName을 넘긴다.
  # 운영 노드 이름을 기본값으로 두면 VM 파드가 어느 노드에도 뜨지 못한다.
  nodeName: ""

# 복구 스위치(설계 C.6.4 "클러스터 유실 + Infisical 장애"). root가 cluster.restore.externalSecrets: false일 때만 false로 넘긴다.
