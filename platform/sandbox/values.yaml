# infisical은 root가 cluster.infisical에서 넘긴다. 여기는 빈 자리만 둔다(templates/clustersecretstore.yaml의 required).
infisical:
  projectSlug: ""
  environmentSlug: ""

proxy:
  # 작업자는 DNS 없이 이 주소로만 나간다(설계 C.8). 서비스 대역(10.43.0.0/16)의 정적 구간(앞 256개)에서 고른다.
  # 동적 할당은 이 구간을 마지막에야 쓰므로, 빈 클러스터에서 앞 wave Service가 먼저 이 주소를 가져가 생성이 실패할 일이 적다.
  # 10.43.0.1(kubernetes)·10.43.0.10(kube-dns)과 겹치면 Service 생성이 실패한다(values.schema.json이 둘을 거부한다). 바꾸면 작업자 init 규칙과 HTTPS_PROXY가 함께 바뀐다.
  clusterIP: 10.43.0.28
  port: 3128
  # CONNECT 443으로 허용하는 이름. 정확한 이름만 쓴다. 앞에 점을 붙이면 하위 도메인 전체가 열린다(.github.com은 github.com도 연다).
  # github.com·api.github.com·gist.github.com과 그 밖의 *.github.com은 넣지 않는다(D-15. values.schema.json이 막는다).
  # 실제 허용 목록은 이 목록 + worker.profile.egressHosts(모델 실행기가 쓰는 이름)다. 둘 다 같은 schema 규칙을 받는다.
  # 프록시(Envoy)는 CONNECT 이름과 터널 안 TLS SNI를 둘 다 그 목록과 맞춘다(templates/proxy-configmap.yaml).
  # 남는 위험: SNI는 허용 이름이고 TLS 안 HTTP Host만 다른 요청은 못 본다. CDN 뒤 이름을 더할 때는 그 CDN이
  # SNI·Host 불일치를 거부하는지 본다(lab 실측: registry.npmjs.org 앞 Cloudflare는 403. npm은 아래 이유로 넣지 않는다).
  allowedDomains:
    # 작업자 코드 읽기. public 저장소 압축본만 받는다(D-15).
    - codeload.github.com
    # 패키지 레지스트리. 받기와 게시가 다른 호스트인 것만 둔다(설계 C.8 "남는 위험(쓰기 유출)").
    # npm(registry.npmjs.org)은 받기와 게시가 같은 호스트라 넣지 않는다. 작업 입력의 npm 토큰으로 auth.json을
    # 게시할 수 있다. PyPI 게시는 upload.pypi.org라 열리지 않는다.
    - pypi.org
    - files.pythonhosted.org
    # 모델 API·구독 인증 호스트는 여기 두지 않는다. 프로필과 함께 바뀌므로 worker.profile.egressHosts에 둔다.

# 작업자(templates/worker-deployment.yaml). 봇 이미지 하나를 게시 서버와 함께 쓰고 command만 작업자 진입점으로 바꾼다(T16b D2).
worker:
  # main 빌드(app-build)가 GHCR에 올린 digest만 쓴다. 로컬 빌드 digest는 CI 빌드와 다르다.
  # 사람 PR로만 바꾼다(D2). 게시 서버는 apps/homelab-bot/image.yaml 자동 병합으로 따라가지만, 모델 자격을 든 sandbox까지
  # 자동 경로를 넓히지 않는다(설계 C.4.4·C.4.7). 작업자 요청 계약(version)을 바꾸는 봇 PR은 이 값을 바꾸는 PR과 짝으로 낸다.
  # 지금 값: 봇 main d4c8bda 빌드. 리뷰 레인과 미게시 변경 리뷰 경로 /v1/change-review가 들어 있다. 경로는 게시 서버의 CHANGE_PR_ENABLED가
  # 꺼져 있으면 쓰이지 않는다. 이 파드는 RuntimeDefault라 이미지의 bwrap을 쓰지 않는다. 빌드 증명은 gh attestation verify로 대조했다
  # (서명 워크플로 homelab app-build.yaml@app-build-v1.0.1, 원본 build.yaml@refs/heads/main d4c8bda, GitHub 호스트 runner).
  image: ghcr.io/ukyi-app/homelab-bot@sha256:b3331339d5b157dd1fa0b3b9941f9094918335d9cdc4ea9e8e91eed87cd9803d
  # 게시 서버의 실행 요청 서명을 확인하는 Ed25519 공개 키(SPKI PEM). 비밀이 아니다(D3). 짝 개인 키는 Infisical의 게시 서버 키
  # WORKER_CONTROL_PRIVATE_KEY다. 둘이 어긋나면 작업자가 모든 실행 요청을 403으로 거부하니 회전은 두 값을 함께 바꾼다.
  # 모양이 틀리면 작업자가 기동하지 못해(종료 1) sandbox가 Degraded가 되므로 values.schema.json이 Ed25519 공개 키 모양만 받는다.
  controlPublicKey: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEA48/F2Z0cCfqLbEGfQY3aoDWCRtgzFLLsY9kskMFFqRs=
    -----END PUBLIC KEY-----
  # 실행기 프로필(D-14). 실행기·모델·자격·egress를 여기 한곳에서 고른다. 작업자 env(WORKER_EXECUTOR·WORKER_MODEL·
  # WORKER_CREDENTIAL_KEY), 자격 ExternalSecret·Secret(worker-credential-<id>), 프록시 허용 이름이 모두 이 블록에서 나온다.
  # 봇 이미지의 프로필 표(봇 src/executor-profiles.ts PROFILES)에 있는 조합만 values.schema.json이 받는다. 틀린 조합은 작업자가
  # profile_unsupported로 기동하지 못해 root가 wave -2에서 멈추므로 렌더에서 막는다.
  # 바꾸는 법(표에 이미 있는 프로필끼리, 예: Codex로):
  #   1. Infisical /apps/homelab-bot/worker에 새 credentialKey 값을 먼저 넣는다(운영은 실제 자격, VM homelab-dev는 같은 모양의 가짜).
  #      없으면 새 ExternalSecret이 Degraded라 root가 wave -2에서 멈춘다.
  #   2. 이 블록과 restore.md 3.1 4)의 canary(자격 모양을 따른다)를 같은 PR에서 바꾼다. Secret 이름이 함께 바뀌어 옛 자격을
  #      읽을 일이 없고, 옛 ExternalSecret은 Argo CD prune이, 그 Secret은 소유자 삭제로 Kubernetes가 지운다.
  # 표에 없는 실행기·인증 방식(OpenCode, Claude API 키 등)은 봇 이미지(어댑터·표)가 먼저다. 그 digest·이 블록·schema를 한 PR로 바꾼다.
  profile:
    # 봇 표의 프로필 id. Secret 이름에 들어간다.
    id: claude-subscription
    # WORKER_EXECUTOR
    executor: claude
    # WORKER_MODEL. Claude는 전체 모델 ID만 받는다(별칭 opus, [1m]은 작업자가 거부). 실행마다 CLI가 알린 모델과 대조한다.
    model: claude-opus-5-5
    # Infisical 키 이름 = Secret 키 = 작업자가 읽는 파일 이름(WORKER_CREDENTIAL_KEY). 인증 방식을 뜻한다(구독 장기 토큰).
    credentialKey: CLAUDE_CODE_OAUTH_TOKEN
    # 이 실행기가 프록시로 나가는 이름(proxy.allowedDomains에 더해진다). OAuth 교환·갱신 후보(platform.claude.com·claude.ai)는
    # 열지 않는다. S12 첫 대화(실행 3회)에서 작업자는 api.anthropic.com에만 나갔고 프록시 거부는 0건이었다.
    # 나중에 거부 로그가 필요를 보이면 그 근거와 함께 더한다.
    egressHosts:
      - api.anthropic.com

# 작업 레인 작업자(templates/task-worker-*.yaml, 설계 C.8 "작업자 파드 둘"). prod와 vm이 이 값 하나를 함께 쓴다.
# 클러스터마다 전제가 둘이다. 하나라도 빠지면 그 클러스터의 root가 sandbox wave(-2)에서 멈춘다(새 노드·새 VM도 같다):
#   1. 노드마다 sudo host/install.sh --cluster <이름> --sandbox-profiles와 --task-state-volume. 프로필이나 볼륨이 없으면 파드가 뜨지 않는다.
#   2. Infisical /apps/homelab-bot/worker에 task.remoteCredentialKey가 있어야 한다. 운영은 작업 레인 전용 setup-token,
#      VM homelab-dev는 같은 모양의 가짜(docs/runbooks-public/bootstrap.md 2.2 vm 1단계).
# 이 키가 없는 옛 내보내기로는 restore.md 3.1 4)가 missing으로 멈춘다(recovery-assets.md). 끄는 PR은 restore.md 3.1의 개수를 함께 되돌린다.
task:
  enabled: true
  # 작업 레인 코드가 든 main 빌드 digest. 사람 PR로만 바꾼다(worker.image와 같은 이유). 이 줄 하나만 바꾸면 worker를 건드리지 않고
  # 작업 레인 이미지를 올린다. 작업 레인 코드가 없는 이미지는 WORKER_LANES를 읽지 않아 대화·리뷰 작업자로 뜬다.
  # 지금 값: 봇 main 630c48d 빌드. v2 작업 계약과 무자격 검증 실행기(고정 Bun 1.4.3, /opt/verifier)에, 검증 실행기가 bwrap 준비
  # 실패를 시험 실패가 아니라 not_run(sandbox_unavailable)으로 가르는 시작 표식(봇 #92, T28)이 더해졌다. CLI 버전과 작업 레인
  # settings 생성 코드는 SEC-02 2단계를 잰 5fb4a20과 같다. 빌드 증명은 gh attestation verify로 대조했다(서명 워크플로 homelab
  # app-build.yaml@app-build-v1.0.1, 원본 build.yaml@refs/heads/main 630c48d, GitHub 호스트 runner).
  image: ghcr.io/ukyi-app/homelab-bot@sha256:ff5d453eaf10c374e4e94649d9761bf839025dd90f3fbe3abe9918b35bf4101e
  # Infisical 키 이름. Secret 키와 파일 이름은 worker.profile.credentialKey 그대로다(봇 프로필 표가 그 이름을 읽는다).
  # 키를 레인마다 나눠 한 레인의 토큰만 교체·철회한다. 두 토큰을 한 Secret에 모으지 않는다.
  remoteCredentialKey: CLAUDE_CODE_OAUTH_TOKEN_TASK
  # 고정 크기 볼륨이 있는 노드(PV nodeAffinity). 클러스터 값이라 여기는 빈 자리고, root가 cluster.taskStateVolume.nodeName을 넘긴다.
  # 운영 노드 이름을 기본값으로 두면 VM 파드가 어느 노드에도 뜨지 못한다.
  nodeName: ""

# 복구 스위치(설계 C.6.4 "클러스터 유실 + Infisical 장애"). root가 cluster.restore.externalSecrets: false일 때만 false로 넘긴다.
# 끄면 이 차트의 ExternalSecret(과 Store)을 내지 않는다. 같은 이름의 Secret은 사람이 손으로 만든다(restore.md 3절 U40).
externalSecrets:
  enabled: true
