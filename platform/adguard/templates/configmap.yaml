# 시드는 빈 PVC에만 cp -n으로 복사한다. 이후 설정의 원본은 AdGuard가 쓰는 PVC 파일이다.
# UI에서 바꾼 설정 중 재구축에도 남길 값은 이 시드에 반영한다. 시드 변경은 라이브 설정을 바꾸지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: adguard-config
  namespace: adguard
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:3000
    dns:
      bind_hosts: ["0.0.0.0"]
      port: 53
      upstream_dns:
        - https://dns.cloudflare.com/dns-query
        - https://dns.quad9.net/dns-query
      bootstrap_dns: ["1.1.1.1", "9.9.9.9"]
      upstream_mode: load_balance
      # 빈 PTR 목록만 두면 기본값 true가 /etc/resolv.conf(CoreDNS)로 보내 오류를 쌓는다.
      # 공유기를 지정하면 모르는 PTR이 AdGuard로 돌아올 수 있다. 전달을 끄고 NXDOMAIN으로 답한다.
      # 대가: 사설 클라이언트는 이름 대신 IP로 보인다. VM도 운영 공유기에 질의하지 않는다.
      local_ptr_upstreams: []
      use_private_ptr_resolvers: false
      # 끈다. servicelb를 거치면 공유기 경유 LAN 질의는 10.42.0.1(cni0), tailnet 질의는 svclb 파드 IP로 보여
      # 집 전체가 /24 버킷 하나를 함께 쓰고, 공유기 주소 예외는 맞는 일이 없다(U32, 2026-10-21).
      # 파드 IP 예외는 재시작마다 바뀌어 조용히 깨진다. :53은 LAN과 tailnet에만 열려 있다.
      ratelimit: 0
    filtering:
      protection_enabled: true
      filtering_enabled: true
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
    user_rules: []
    # 옛 실측 28.5 MB/일 × 7일 × 2(현재 파일 + 회전본) = 약 399 MB, 381 MiB(1Gi의 37.2%).
    # 나머지 약 643 MiB는 필터·통계·성장 여유다. 크기 상한이 아니므로 실제 점유는 계속 확인한다.
    querylog:
      enabled: true
      file_enabled: true
      interval: 7d
      size_memory: 1000
    statistics:
      enabled: true
      interval: 1d
    schema_version: 34
