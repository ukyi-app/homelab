apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-auth
  namespace: adguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-platform
  target:
    name: adguard-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    # template이 없으면 ESO가 ES의 Argo CD tracking 주석까지 Secret으로 복사한다.
    # Merge는 아래 data[]의 두 키를 유지한다(platform/external-secrets/templates/argocd-owner.yaml).
    template:
      engineVersion: v2
      mergePolicy: Merge
  data:
    - secretKey: ADGUARD_ADMIN_USER
      remoteRef:
        key: adguard/ADGUARD_ADMIN_USER
    - secretKey: ADGUARD_ADMIN_PASSWORD_BCRYPT
      remoteRef:
        key: adguard/ADGUARD_ADMIN_PASSWORD_BCRYPT
