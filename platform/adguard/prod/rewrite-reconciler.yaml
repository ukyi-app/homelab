# adguard *.home rewrite 셀프힐 리컨실러(메타갭 ① W2-A) — split-horizon rewrite(`*.home.ukyi.app → traefik-ts
# tailscale IP`)가 DR 재구축/proxy 재등록으로 stale이 되면 tailscale·LAN 양쪽에서 *.home이 죽은 IP로 해석된다
# (AdGuard split-horizon rewrite DR stale 함정). 이 CronJob이 10분마다 traefik-ts svc의 실 LB IP를 apiserver로
# 읽어 AdGuard rewrite를 수렴시킨다. 통지는 발송 자격 없이 메트릭→vmalert→alertmanager 경유(F13).
#
# ⚠️ F13(발송 자격 분리): 이 파드는 DNS 변이 권한 + AdGuard 자격 + SA 토큰을 가진 링치핀 변이자다. 인터넷
#    egress(0.0.0.0/0:443)를 주면 침해 시 텔레그램/HTTP로 자격을 직결 유출할 수 있어, 전용 netpol로
#    apiserver(노드서브넷:6443)·adguard-ui(:3000)·vmsingle(:8428)·DNS(:53)만 허용하고 인터넷 직결 egress는 0으로 둔다.
#    (⚠️ 잔여: DNS(:53) 허용은 CoreDNS 재귀 경유 exfil(DNS 터널링)을 이론상 남긴다 — 느리고 시끄럽고 공격자
#     인프라 필요라 수용. 애초에 발송 자격을 이 파드에 두지 않음 — 통지는 메트릭→vmalert→alertmanager 경유.)
# ⚠️ F6(중첩/무한대기 금지): concurrencyPolicy Forbid + activeDeadline 120 + startingDeadline 300 + backoffLimit 0.
# ⚠️ F7(비원자성 회피): AdGuard v0.107.45+ 원자적 /control/rewrite/update로 stale→want 교체(delete→add 갭 없음)
#    + read-back 재조회 통과 후에만 성공 하트비트.
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rewrite-reconciler, namespace: edge }
automountServiceAccountToken: true # apiserver로 traefik-ts svc를 읽으므로 SA 토큰 필요(du-exporter와 반대).
---
# === 전용 default-deny egress: 리컨실러의 모든 egress 거부(아래 allow가 최소만 재개방) ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rewrite-reconciler-default-deny-egress
  namespace: edge
spec:
  podSelector:
    matchLabels: { app: rewrite-reconciler }
  policyTypes: [Egress]
---
# === allow egress: apiserver(노드서브넷) + adguard-ui + vmsingle + DNS만 — 인터넷 egress 없음(F13) ===
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rewrite-reconciler-allow-egress
  namespace: edge
spec:
  podSelector:
    matchLabels: { app: rewrite-reconciler }
  policyTypes: [Egress]
  egress:
    - to: # DNS — adguard-ui/vmsingle/kubernetes.default 해석(CoreDNS)
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: # apiserver — kube-router가 ClusterIP(10.43.0.1:443)를 노드 InternalIP:6443으로 DNAT하고 netpol은
          # DNAT 후 dest를 평가하므로 ClusterIP가 아니라 노드서브넷:6443을 허용(NetworkPolicy egress apiserver 함정).
        - ipBlock: { cidr: 192.168.117.0/24 } # NUC LAN 서브넷(노드 InternalIP 192.168.117.15, wlo1)
      ports: [{ protocol: TCP, port: 6443 }]
    - to: # adguard-ui(같은 ns) — /control/rewrite/*. svc port 80 → targetPort 3000(DNAT 후 targetPort 평가 함정)
        - podSelector: { matchLabels: { app: adguard } }
      ports: [{ protocol: TCP, port: 3000 }]
    - to: # vmsingle import(observability) — 하트비트/fix 메트릭 push
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: vmsingle } }
      ports: [{ protocol: TCP, port: 8428 }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguard-rewrite-reconciler
  namespace: edge
  labels: { app: rewrite-reconciler }
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid    # 중첩 실행 금지 — stale have/want로 이중 변이(플래핑) 차단(F6)
  startingDeadlineSeconds: 300 # 스케줄 밀림 시 오래된 잡 기동 포기(다음 주기에 맡김)
  successfulJobsHistoryLimit: 1
  # ⚠️ CronJobFlapping(core.yaml)의 관측 창이다. **임계+1**이어야 한다 — 임계와 같으면 새 실패가
  #    도착하는 순간 가장 오래된 '해소된' 실패가 회수돼 count가 임계 아래로 떨어지고, 그 리셋이
  #    `for:`를 채우기 전에 매번 일어나 **영구 무발화**가 된다(적대적 리뷰 r2가 실측 지목).
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0          # 재시도 없이 다음 주기 — staleness 알림이 침묵을 잡는다
      activeDeadlineSeconds: 150 # 주기(600s)의 1/4 — 행 걸림 방지(DNS 대기 30 + 지연 2×50 = 130 편입)
      template:
        metadata:
          labels: { app: rewrite-reconciler }
        spec:
          restartPolicy: Never
          serviceAccountName: rewrite-reconciler
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reconciler
              # digest 핀: pgdump-hedge-cronjob.yaml과 동일 값(curl+sed 보유 — 라이브 확인). 의도적 커밋으로만 갱신.
              image: ghcr.io/ukyi-app/pg-tools:18-rclone@sha256:154b0e77f4e677d69605aa3abf76cc3061635e24cedbf617155e5179ccabcd45
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              env:
                - { name: HOME, value: /tmp } # readOnlyRootFilesystem 하 curl 임시 경로
                - { name: ADGUARD_USER, value: ukkiee } # username은 비밀 아님 — 평문(deployment inject-auth AGH_USER 동일 규약)
              envFrom:
                - secretRef: { name: adguard-api-creds } # ADGUARD_PASSWORD 평문(basic auth) — Task 6 봉인, 텔레그램 자격 없음
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # F6: 모든 네트워크 호출 바운드 + 재시도 2등급(followup-sweep 01 — curl 7.71+ 필요:
                  # --retry-all-errors 7.71·--retry-max-time 7.32, pg-tools는 bookworm 기반 7.88 — 베이스
                  # 단언은 test_rewrite_reconciler.bats).
                  # ⚠️ DNS(exit 6)는 man의 transient 목록 밖이지만 curl이 **이미 재시도한다**(pg-tools
                  #   파드 실측 2026-08-27: plain --retry와 --retry-all-errors의 시도 수 동일). 2026-07-26
                  #   사고(vmalert-adguard-rewrite-firing-e2e.sh 헤더의 exit 6 — 파드 Error 후 다음 주기
                  #   자가복구, staleness 임계 1800s=3주기가 단발 흡수)의 병은 재시도 부재가 아니라
                  #   **재시도 창 6초**(retry 3×delay 2 고정 지연 — 즉시 실패 클래스는 6초가 전부)였다.
                  # 처방 두 축: ① 창 확대 — READ retry 6·delay 3(즉시 실패 창 18s — 사고 갭 ~3s 여유)
                  #   + retry-max-time 30 상한. ② --retry-all-errors(READ만) — 실델타는 TLS(35)·전송
                  #   리셋(55/56)·부분 전송(18)·목록 밖 5xx다. 부작용: READ는 4xx도 재시도한다(즉시
                  #   실패라 지연 ~수 초·로그 7배 — 자격 회전 사고 시 AdGuard 측 rate-limit 가능성은
                  #   미확인 추정). 메트릭 push도 READ 등급 — 게이지 재전송은 멱등(vmsingle ingest).
                  # WRITE(변이 — rewrite add/update): --retry-all-errors를 주지 않는다. ⚠️ 단 curl 기본
                  #   transient(타임아웃 28·408/429/5xx)는 --retry가 **항상** 재시도한다 — "적용됐는데
                  #   응답만 20s+ 지연" 창에서 add 중복 위험이 잔존하고, 그 감지는 list_answer의 중복
                  #   카운트가 진다(아래). connrefused는 커넥션 수립 전 실패라 언제나 안전.
                  # 재시도 예산: 양 등급 모두 retry-max-time 30이 상한 — 호출당 최악 ≈ 30+20=50s.
                  #   DNS pre-flight 최대 대기(DNS_WAIT_MAX=30, 아래) + 지연 2개(READ/WRITE 조합 무관)
                  #   = 30+2×50=130 < 150s 데드라인. CoreDNS 롤링은 상관 장애라 READ 4곳을 동시에
                  #   때릴 수 있다 — 3개+ 동시 지연은 DeadlineExceeded→다음 주기 수용(staleness 알림
                  #   소관). 산술 증인은 test_rewrite_reconciler.bats.
                  CURL_READ="curl -fsS --connect-timeout 5 --max-time 20 --retry 6 --retry-delay 3 --retry-connrefused --retry-all-errors --retry-max-time 30"
                  CURL_WRITE="curl -fsS --connect-timeout 5 --max-time 20 --retry 3 --retry-delay 2 --retry-connrefused --retry-max-time 30"
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  APISERVER="https://kubernetes.default.svc"
                  TOKEN=$(cat $SA/token)
                  AG="http://adguard-ui.edge.svc"
                  DOMAIN='*.home.ukyi.app'
                  AUTH="${ADGUARD_USER}:${ADGUARD_PASSWORD}"
                  # F6 보강(#547): 부팅 직후 CoreDNS 기동 전에 스케줄되면 curl이 6(Could not resolve host)으로
                  # 죽는다(라이브 확인 — 호스트 부팅 21초 뒤 실행분이 이 코드로 Failed). ⚠️ #547 당시 주석은
                  # "--retry가 이름 해석 실패를 전이적으로 취급하지 않는다"를 근거로 삼았으나 파드 실측
                  # (2026-08-27, 위 F6 주석)이 반증 — 재시도는 되지만, 부팅 급 장기 부재(수십 초)는 어떤
                  # 재시도 창으로도 덮기 애매하고 명시 대기가 판정도 명확하다(rc 6만 대기 — 그 외(연결거부
                  # 7 포함)는 해석이 된 것이라 즉시 통과). 정상 경로 비용은 프로브 1회(~ms).
                  # 프로브는 재시도 없는 rc 판별용이라 세 번째 등급(PROBE)이다 — 판별이 목적이라 -f도
                  # --retry도 주지 않는다. 최악 DNS_WAIT_MAX초는 아래 데드라인 산술에 편입된다.
                  DNS_WAIT_MAX=30
                  CURL_PROBE="curl -s --connect-timeout 2 --max-time 3"
                  dns_wait=0
                  while [ "$dns_wait" -lt "$DNS_WAIT_MAX" ]; do
                    rc=0; $CURL_PROBE -o /dev/null "$AG/" || rc=$?
                    if [ "$rc" -ne 6 ]; then break; fi
                    dns_wait=$((dns_wait + 1)); sleep 1
                  done
                  # 1) want = traefik-ts LB tailscale IP (apiserver로 svc 조회 — status.loadBalancer.ingress[].ip)
                  want=$($CURL_READ --cacert $SA/ca.crt -H "Authorization: Bearer $TOKEN" \
                    "$APISERVER/api/v1/namespaces/gateway/services/traefik-ts" \
                    | sed -n 's/.*"ip"[[:space:]]*:[[:space:]]*"\([0-9.]*\)".*/\1/p')
                  want=${want%%$'\n'*}   # 첫 매치만(다중 라인 방어) — `| head`의 SIGPIPE+pipefail 141 회피
                  [ -n "$want" ] || { echo "traefik-ts LB IP 추출 실패"; exit 1; }
                  # 2) have = AdGuard 현재 *.home rewrite answer
                  list_answer() {
                    # local 미사용(local var=$(...)는 종료코드를 삼켜 set -e를 무력화 — bash 함정). pipefail로 curl 실패 전파.
                    # answer 캡처는 [^"]*(IP뿐 아니라 hostname/CNAME 등 비-IPv4도) — [0-9.]*면 비-IPv4 answer를
                    # 못 봐 have=빈값→ADD가 중복 rewrite를 만든다(적대 리뷰 LOW). 비-IPv4면 have≠want로 update(PUT) 수렴.
                    raw=$($CURL_READ -u "$AUTH" "$AG/control/rewrite/list")
                    # 중복 감지 — WRITE의 잔존 재시도 창(타임아웃·5xx)이 add를 중복시키면 아래 첫-매치
                    # 반환이 그 사실을 가리므로, 여기서 도메인 매치 수를 세어 1 초과를 red로 만든다
                    # (awk는 0건에도 rc 0 — grep -c류의 열거 붕괴 함정 회피).
                    n=$(printf '%s' "$raw" | awk -F'"domain":"\\*\\.home\\.ukyi\\.app"' '{ c += NF - 1 } END { print c + 0 }')
                    [ "$n" -le 1 ] || { echo "rewrite 중복 ${n}건(*.home) — 변이 재시도 잔재 의심, 수동 정리 필요" >&2; exit 1; }
                    out=$(printf '%s' "$raw" \
                      | sed -n 's/.*"domain":"\*.home.ukyi.app","answer":"\([^"]*\)".*/\1/p')
                    printf '%s' "${out%%$'\n'*}"   # 첫 매치만 — head 파이프 SIGPIPE 회피
                  }
                  have=$(list_answer)
                  FIXED=0
                  if [ "$have" != "$want" ]; then
                    if [ -z "$have" ]; then
                      # rewrite 부재 → 추가
                      $CURL_WRITE -u "$AUTH" -H 'Content-Type: application/json' \
                        -d "{\"domain\":\"${DOMAIN}\",\"answer\":\"${want}\"}" "$AG/control/rewrite/add"
                    else
                      # F7: 원자적 교체(delete→add 갭 없음) — v0.107.45+ /control/rewrite/update.
                      # ★AdGuard는 update를 PUT으로만 등록(rewritehttp.go:150) — -X PUT 없으면 curl -d가 POST를
                      #   보내 405로 매번 실패해 stale 교정이 불능(적대 리뷰 HIGH). add는 POST가 맞으므로 무변경.
                      $CURL_WRITE -X PUT -u "$AUTH" -H 'Content-Type: application/json' \
                        -d "{\"target\":{\"domain\":\"${DOMAIN}\",\"answer\":\"${have}\"},\"update\":{\"domain\":\"${DOMAIN}\",\"answer\":\"${want}\"}}" \
                        "$AG/control/rewrite/update"
                    fi
                    FIXED=1
                    # ⚠️ 텔레그램 직접 발송 금지(F13) — 통지는 아래 fix 메트릭 → vmalert 룰 → alertmanager 경유.
                  fi
                  # 3) read-back 검증(F7) — 실제 라이브 상태가 want인지 재조회로 확인한 뒤에만 성공 하트비트.
                  now=$(list_answer)
                  [ "$now" = "$want" ] || { echo "read-back 불일치: now=${now} want=${want}"; exit 1; }
                  # 4) 성공 하트비트 + fix 표시 — read-back 통과 시에만. F19: fix 타임스탬프는 FIXED=1일 때만(희소 샘플, 0 금지).
                  { printf 'adguard_rewrite_reconcile_timestamp %s\n' "$(date +%s)"
                    if [ "$FIXED" = 1 ]; then printf 'adguard_rewrite_last_fix_timestamp %s\n' "$(date +%s)"; fi
                  } | $CURL_READ --data-binary @- "http://vmsingle.observability.svc:8428/api/v1/import/prometheus"
                  echo "done: have=${have:-<none>} want=${want} fixed=${FIXED}"
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
