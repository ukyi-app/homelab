apiVersion: v1
kind: ConfigMap
metadata: { name: adguard-config, namespace: edge }
data:
  AdGuardHome.yaml: |
    http:
      address: 0.0.0.0:3000
    dns:
      bind_hosts: ["0.0.0.0"]
      port: 53
      upstream_dns:
        - https://dns.cloudflare.com/dns-query   # DoH 업스트림
        - https://dns.quad9.net/dns-query
      bootstrap_dns: ["1.1.1.1", "9.9.9.9"]
      upstream_mode: load_balance
      # 🔴 사설 역방향(PTR) 조회를 포워딩하지 않는다 — R7이 만든 로그 오염을 닫는다.
      #    AdGuard는 `use_private_ptr_resolvers: true`(기본값)이고 `local_ptr_upstreams`가 비면
      #    **파드의 /etc/resolv.conf**를 사설 PTR 업스트림으로 쓴다. 그 값이 클러스터 CoreDNS
      #    (`10.43.0.10`)인데 CoreDNS는 192.168.x 역방향을 서빙하지 않아 전건 `connection refused`가 난다.
      #    실측 2026-08-18: 최근 10분 에러 18건 중 **14건(78%)이 이 PTR 실패**였다
      #    (`18.117.168.192.in-addr.arpa` PTR · `lb._dns-sd._udp.…` 등 LAN 기기의 역방향·Bonjour 질의).
      #    ⚠️ R7 이전에는 LAN 기기가 AdGuard를 안 써서 이 질의가 도착하지 않았다 — **R7이 만든 부작용이다.**
      #    실질 피해는 작으나(역방향은 best-effort, 정방향 해석은 무영향) 로그의 대부분을 차지해
      #    **진짜 에러를 가린다.** false면 AdGuard가 스스로 NXDOMAIN 처리하고 포워딩하지 않는다.
      #    대가: 질의 로그에서 클라이언트가 이름 대신 IP로 보인다(수용).
      #    ⚠️ `local_ptr_upstreams: [192.168.117.1]`(라우터)로 가는 선택지는 기각했다 —
      #       역방향 조회가 실제로 동작하는 대신 PTR 경로에 라우터 의존이 생기고, 라우터가 모르는 PTR을
      #       다시 AdGuard로 포워딩하면 루프 위험이 있다. 이 홈랩은 라우터 의존을 줄이는 방향이다(#494).
      use_private_ptr_resolvers: false
      # 🔴 레이트리밋 — R7(LAN DNS 전환) 이후 기본값 20이 집 전체를 조인다.
      #    라우터(Orbi RBR350)가 클라이언트에게 광고할 DNS를 따로 못 정하는 기종이라(런북 §2 "경우 B")
      #    **집 전체 질의가 라우터 IP 하나로 도착**한다. 게다가 ratelimit_subnet_len_ipv4 기본값이 24라
      #    LAN 전체가 한 버킷이다 → 실측 2026-08-18: 40건 동시 질의 중 **정확히 20건이 무응답**,
      #    30 q/s에서 4/30, 50 q/s에서 15/50이 버려졌다(AdGuard는 이 드롭을 로그에 남기지도 않는다).
      #    ⚠️ 차단이 "새는" 것이 아니라 질의가 **실패**한다 — 같은 실측에서 차단 누수는 0건이었다
      #       (라우터가 보조 1.1.1.1로 넘어가는 문턱이 높다). 증상은 페이지 로드 지연·간헐 실패다.
      #    R7 이전에는 LAN 기기가 AdGuard를 안 써서 이 버킷이 비어 있었다 — R7이 만든 문제다.
      ratelimit: 100
      # 라우터는 경우 B에서 **LAN의 유일한 DNS 클라이언트**다. 여기가 조여지면 집 전체가 함께 조여지므로
      # 예외로 둔다. 기기별 직접 질의(tailnet 100.x 등)에는 위 100/s가 그대로 적용된다.
      ratelimit_whitelist:
        - 192.168.117.1
    filtering:
      rewrites:
        # split-horizon: 모든 *.home 이름 → Traefik tailscale 디바이스(gateway/traefik-ts LB)의 tailscale IP.
        # Traefik이 :443에서 와일드카드 cert로 TLS 종단하므로 valid HTTPS로 접근된다.
        # ⚠️ 이 IP는 traefik-ts tailscale 디바이스 IP다. DR 재구축으로 디바이스가 재등록되면(예: homelab→
        #    homelab-1) IP가 바뀌어 stale이 된다 — 그러면 tailscale/LAN 양쪽에서 *.home.ukyi.app이 죽은 IP로
        #    연결돼 전부 실패한다(.ts.net MagicDNS 경로엔 안 드러남).
        #    ✅ 셀프힐(메타갭 ① W2-A): adguard-rewrite-reconciler CronJob이 10분마다 traefik-ts 실 LB IP로 이 rewrite를
        #    자동 수렴한다(rewrite-reconciler.yaml) — 재구축/IP 변경 시 수동 갱신 불요. 리컨실러 침묵 시
        #    AdguardRewriteReconcilerStale가 페이징하고, 그때만 `kubectl -n gateway get svc traefik-ts`의 IP로 수동 갱신한다
        #    (cp -n 시드라 라이브 PVC의 AdGuardHome.yaml도 함께 고쳐 재시작해야 반영).
        - domain: "*.home.ukyi.app"
          answer: "100.120.85.39" # traefik-ts tailscale 디바이스 IP (2026-06-22 tailscale 전용 ns 이전으로 proxy 재등록 → 갱신)
      protection_enabled: true
    filters:
      - enabled: true
        url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
        name: AdGuard DNS filter
        id: 1
    # ── 질의 로그 보존 — **디스크 예산이 걸린 설정이다** ──────────────────────────────────────────
    # ⚠️ 라이브 실측(2026-07-29): 이 절이 시드에 **없어서** AdGuard 기본값이 적용됐고, 라이브는
    #    interval 30d였다. 증가율 ~28.5MB/일 → 정상상태 = 현재 파일 + 회전본 ≈ **1.7GB**로
    #    PVC 선언(1Gi)을 **구조적으로** 초과했다(실측 1.2GB = 115%).
    #    AdGuard는 `querylog.json` + 회전본 `querylog.json.1` 둘을 유지하므로 실제 점유는
    #    **interval 분량의 약 2배**다 — 이 2배를 빼먹으면 예산이 절반으로 잘못 잡힌다.
    # 14d → 약 399MB × 2 = **~798MB / 1Gi (78%)**.
    # ⚠️ 시드는 **첫 부팅 전용**이다(`cp -n`). 이 값을 바꿔도 **라이브에는 반영되지 않는다** —
    #    라이브 PVC의 conf/AdGuardHome.yaml을 함께 고치고 재시작해야 한다(같은 파일 위 rewrite 주석과 동일).
    #    여기 적는 이유는 **DR 재구축**이다: 이 절이 없으면 재구축된 AdGuard가 기본값으로 되돌아간다.
    querylog:
      enabled: true
      file_enabled: true
      interval: 14d
      size_memory: 1000
    statistics:
      enabled: true
      interval: 1d
    schema_version: 27
