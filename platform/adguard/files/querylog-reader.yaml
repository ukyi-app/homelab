# AdGuard 질의 로그 리더(vector) 설정. 클라이언트 IP별 마지막 질의 시각 하나만 지표로 낸다.
# 도메인 이름 등 나머지 필드는 remap에서 버린다. 질의 로그를 VictoriaLogs로 보내지 않는다(개인정보).
data_dir: /var/lib/vector
sources:
  querylog:
    type: file
    # 회전본(querylog.json.1)은 넣지 않는다. 옛 항목을 나중에 읽으면 게이지가 과거 시각으로 되돌아간다.
    include: [/querylog/data/querylog.json]
    # 매 시작마다 파일 처음부터 읽어 게이지를 다시 만든다. 게이지는 다시 읽어도 값이 같다.
    # 체크포인트에서 이어 읽으면 재시작 뒤 tailnet 항목이 새로 올 때까지 게이지가 없어 오경보가 난다.
    read_from: beginning
    ignore_checkpoints: true
transforms:
  last_query:
    type: remap
    inputs: [querylog]
    # 형식이 맞지 않는 줄은 버린다. 오류 메시지에 줄 내용이 남지 않게 원문을 다루는 함수는 결과만 쓴다.
    drop_on_error: true
    source: |
      entry = object!(parse_json!(.message))
      ts = parse_timestamp!(string!(entry.T), format: "%+")
      . = {
        "client": string!(entry.IP),
        "ts": to_float(to_unix_timestamp(ts, unit: "milliseconds")) / 1000.0
      }
  metric:
    type: log_to_metric
    inputs: [last_query]
    metrics:
      - type: gauge
        field: ts
        namespace: adguard_querylog
        name: last_query_timestamp_seconds
        tags:
          client: "{{ client }}"
sinks:
  metrics:
    type: prometheus_exporter
    inputs: [metric]
    address: 0.0.0.0:9598
    # 기본은 마지막 갱신 시각을 샘플 타임스탬프로 붙인다. 그러면 몇 분 갱신이 없는 게이지가 조회 룩백 밖으로
    # 밀려 사라지고, 경보가 svclb 시작 시각으로 대신 비교해 오경보가 난다(0.60.0 로컬 실행으로 확인).
    suppress_timestamp: true
    # 이 시간 동안 다시 보이지 않은 시계열을 지운다(기본 60초면 질의가 뜸한 tailnet 시계열이 사라진다).
    # 짧으면 파일이 오래 멈췄을 때 게이지가 모두 사라져 이탈 경보가 해소된 것처럼 보인다. 0(만료 없음)이면
    # 재시작마다 바뀌는 옛 svclb IP 시계열이 끝없이 쌓인다. 30일(2592000초)로 둔다.
    flush_period_secs: 2592000
