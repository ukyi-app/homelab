apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-vmsingle
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
      ports:
        - { protocol: TCP, port: 8428 }
---
# ★ apiserver egress (F5) — scoped ipBlock만. to 없는 포트온리/광역 금지.
# kube-router가 ClusterIP(10.43.0.1:443)를 apiserver endpoint(노드 InternalIP:6443)로 DNAT하고,
# netpol egress는 DNAT '후' dest를 평가하므로 ClusterIP가 아니라 노드 서브넷:6443을 허용해야 한다.
# (10.43.0.1/32로는 자동발견이 Connection refused로 막혀 전체 실패 — 라이브 확인됨.)
# NUC LAN 서브넷 /24라 DHCP 임대 변경에 durable. 대역 자체가 바뀌면 갱신.
# ⚠️ 2026-08-17 정정 — 이 줄이 «OrbStack VM 서브넷»이라 적혀 있어 **같은 룰 안의 인라인 주석
#    («NUC LAN 서브넷»)과 자기모순**이었다. 값은 처음부터 맞았고 설명만 이전 국면을 가리켰다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-apiserver
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.117.0/24  # NUC LAN 서브넷(노드 InternalIP 192.168.117.15) — DNAT 후 apiserver
      ports:
        - { protocol: TCP, port: 6443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-gateway
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gateway }
      ports:
        - { protocol: TCP, port: 3000 }
---
# kubelet probe 소스(노드 cni0=10.42.0.1). pod CIDR 전체가 아니라 /32만(default-deny 무력화 함정 회피).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-kubelet-probes
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.42.0.1/32
      ports:
        - { protocol: TCP, port: 3000 }
---
# Glances 호스트 메트릭 위젯 — homepage가 서버사이드로 observability의 glances pod:61208 호출.
# Pass1#2: namespaceSelector + podSelector를 한 to 항목에 함께(AND) — observability 전체로 넓히지 않음.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-glances
  namespace: homepage
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observability }
          podSelector:
            matchLabels: { app.kubernetes.io/name: glances }
      ports:
        - { protocol: TCP, port: 61208 }
