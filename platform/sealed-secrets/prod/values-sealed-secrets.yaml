# 컨트롤러 이름을 kubeseal 기본값에 고정: 차트 기본 fullname은 `sealed-secrets`인데
# kubeseal은 `sealed-secrets-controller`를 찾는다 — 불일치 시 --fetch-cert가 실패한다.
fullnameOverride: sealed-secrets-controller
# 키 자동 회전 정지 — NUC 이전 기간 한정(2026-08).
# 차트 기본은 30일(charts/…/values.yaml:74-79, 미설정 시 플래그 자체가 생략됨)이고 라이브가 그대로
# 따르고 있음이 확인됐다: keybhx6q 2026-06-14T09:28:45Z, key4qn8h 2026-07-14T09:28:50Z — 정확히 30일.
# 다음 회전은 ~2026-08-13. 이전 중에 키셋이 움직이면 반출해 둔 sealing key 백업이 조용히 stale이
# 되고, 새 클러스터에서 회전 이후 봉인된 시크릿을 복호화하지 못한다(옛 키는 보존되므로 기존 seal은
# 무사하다 — 위험은 '회전 이후 새로 봉인된 것'에 한정된다).
# ⚠️ 비활성화 값은 반드시 따옴표 친 "0" — 차트가 `ne (…|toString) ""`로 분기한다.
# ⚠️ 이전 완료 후 이 줄을 지워 30일 회전으로 되돌릴 것. 지우면 차트 기본으로 복귀한다.
keyrenewperiod: "0"
# 메모리 원장(docs/memory-ledger.md)에 등록된 한도 — 변경 시 원장 행도 함께 갱신.
resources:
  requests: { cpu: 10m, memory: 32Mi }
  # right-size 2026-09-01: A′ peak 11.1Mi(14일, 파드-세대 붕괴) × 2.0x 마진 → req 하한 위 헤드룸을 남겨 48Mi(4.32x).
  # ⚠️ 옛 근거 "라이브 peak 52Mi(7일) 대비 1.86x"는 working_set 기준이라 PR #564로 무효화됐다.
  #    GOMEMLIMIT은 차트가 limits.memory에서 자동 파생한다(=48Mi).
  limits: { cpu: 200m, memory: 48Mi }
# 보안 감사 후속(NETPOL-4): 컨트롤러에 default-deny + 최소 allow 격리(번들 차트 netpol).
# ingress=service(8080)+metrics(8081) 포트만(kubeseal --fetch-cert + vmagent scrape), egress=apiserver만.
# ⚠️ kubeapiCidr/Port를 명시한다 — 미설정 시 차트가 Helm lookup으로 찾는데 kustomize 렌더(클러스터
#   접근 없음)에선 빈값이 되어 egress가 깨진다. ★apiserver는 kube-router가 ClusterIP를 노드
#   InternalIP:6443으로 DNAT하고 netpol egress는 DNAT '후' dest를 평가하므로 노드 서브넷:6443을 허용한다
#   (homepage F5 동형). NUC LAN /24라 DHCP 임대 변경에 durable. 대역 자체가 바뀌면 갱신.
networkPolicy:
  enabled: true
  egress:
    enabled: true
    kubeapiCidr: 192.168.117.0/24 # 노드 InternalIP 192.168.117.15 — DNAT 후 apiserver
    kubeapiPort: 6443
